<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自動おしながきジェネレーター (A3/A4 200dpi)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fabric.js v5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans select-none overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="bg-gradient-to-r from-rose-500 to-purple-600 p-2 rounded-lg shadow">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight">自動おしながきジェネレーター</h1>
        <p class="text-[11px] text-slate-400" id="paperSpecLabel">A3横 (3307 × 2339px / 200dpi)</p>
      </div>
    </div>

    <!-- 出力ボタン -->
    <div class="flex items-center gap-2">
      <button id="exportPng" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="image" class="w-4 h-4"></i>
        <span>PNG画像で保存</span>
      </button>
      <button id="exportPdf" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        <span>PDFで保存</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- 左側：入力フォームパネル -->
    <aside class="w-full md:w-[440px] lg:w-[480px] bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
        <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="sliders" class="w-4 h-4 text-rose-400"></i> デザイン・情報設定
        </h2>
        <button id="generateBtn" class="bg-rose-500 hover:bg-rose-400 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 再生成
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-5">
        
        <!-- レイアウト＆用紙サイズ選択 -->
        <div class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <span class="text-xs font-bold text-rose-400 block mb-1 flex items-center gap-1">
            <i data-lucide="layout" class="w-3.5 h-3.5"></i> ■ レイアウト・用紙設定
          </span>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">用紙向き</label>
              <select id="orientationSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
                <option value="LANDSCAPE">横向き (Landscape)</option>
                <option value="PORTRAIT">縦向き (Portrait)</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">用紙サイズ</label>
              <select id="paperSizeSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
                <option value="A3">A3 (200dpi)</option>
                <option value="A4">A4 (200dpi)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 背景デザイン設定 -->
        <div class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <span class="text-xs font-bold text-rose-400 block mb-1 flex items-center gap-1">
            <i data-lucide="palette" class="w-3.5 h-3.5"></i> ■ 背景デザイン設定
          </span>

          <div>
            <label class="block text-[11px] text-slate-400 mb-1">背景の種類</label>
            <select id="bgTypeSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
              <option value="pattern">パターン柄を選択</option>
              <option value="custom">背景画像をアップロード</option>
              <option value="color">単色カラー</option>
            </select>
          </div>

          <!-- パターン選定エリア -->
          <div id="patternControls" class="space-y-2.5">
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">パターン柄</label>
              <select id="patternStyleSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
                <option value="dots">可愛いドットパターン (水玉)</option>
                <option value="stripes">太めのストライプ (縦縞)</option>
                <option value="diagonal">太めの斜めストライプ</option>
                <option value="border">太めのボーダー (横縞)</option>
                <option value="tartan">タータンチェック</option>
              </select>
            </div>

            <div>
              <label class="block text-[11px] text-slate-400 mb-1">パターンの規定カラー</label>
              <div class="grid grid-cols-4 gap-1.5" id="presetColorPalette">
                <!-- カラーボタン動的生成 -->
              </div>
            </div>
          </div>

          <!-- カスタム背景画像アップロード -->
          <div id="customBgControls" class="hidden">
            <label class="block text-[11px] text-slate-400 mb-1">背景画像ファイル</label>
            <input type="file" id="customBgInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:bg-rose-500 file:text-white hover:file:bg-rose-400 cursor-pointer">
          </div>

          <!-- 単色背景カラー -->
          <div id="singleColorControls" class="hidden flex items-center gap-2">
            <label class="text-[11px] text-slate-400">背景色:</label>
            <input type="color" id="bgColorPicker" value="#f8fafc" class="w-10 h-8 bg-slate-800 border border-slate-700 rounded cursor-pointer p-0.5">
          </div>
        </div>

        <!-- 一括画像アップロード -->
        <div class="space-y-2.5 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <span class="text-xs font-bold text-rose-400 block mb-1 flex items-center gap-1">
            <i data-lucide="images" class="w-3.5 h-3.5"></i> ■ 頒布物画像 一括アップロード
          </span>
          <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-rose-500/50 hover:border-rose-400 rounded-xl cursor-pointer bg-slate-800/40 hover:bg-slate-800 transition p-2">
            <i data-lucide="upload-cloud" class="w-7 h-7 text-rose-400 mb-1"></i>
            <span class="text-xs text-slate-200 font-bold">画像をまとめて選択 (複数可)</span>
            <span class="text-[10px] text-slate-400">※順番通りに各頒布物枠へ割り当てられます</span>
            <input type="file" id="batchImageInput" accept="image/*" multiple class="hidden">
          </label>
        </div>

        <!-- イベント＆サークル基本情報 -->
        <div class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <span class="text-xs font-bold text-rose-400 block mb-1 flex items-center gap-1">
            <i data-lucide="info" class="w-3.5 h-3.5"></i> ■ イベント・サークル情報
          </span>
          
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">イベント日時</label>
            <input type="text" id="eventDate" value="2026年12月30日(水)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
          </div>

          <div>
            <label class="block text-[11px] text-slate-400 mb-1">イベント名</label>
            <input type="text" id="eventName" value="コミックマーケット109" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">サークル名</label>
              <input type="text" id="circleName" value="暁の稜線" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-1">スペース番号</label>
              <input type="text" id="spaceNo" value="東7ホール あ-01a" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
            </div>
          </div>
        </div>

        <!-- 頒布物リスト -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-rose-400 flex items-center gap-1">
              <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i> ■ 頒布物一覧
            </span>
            <button id="addItemBtn" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1 rounded-lg border border-slate-600 text-slate-200 flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 頒布物を追加
            </button>
          </div>

          <div id="itemsContainer" class="space-y-3">
            <!-- 動的追加項目エリア -->
          </div>
        </div>

      </div>
    </aside>

    <!-- 右側：リアルタイムプレビューパネル -->
    <main id="workspace" class="flex-1 bg-slate-950 flex flex-col items-center justify-center p-3 sm:p-5 overflow-hidden relative min-h-0">
      <div class="absolute top-3 left-3 z-10 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-full px-3 py-1 text-[11px] text-slate-300 flex items-center gap-2 shadow">
        <span id="zoomDisplay">表示: 100%</span>
        <span class="text-slate-600">|</span>
        <span id="dimensionDisplay" class="text-slate-400">A3横 (3307×2339px)</span>
      </div>

      <div id="canvasContainer" class="relative shadow-2xl border border-slate-700/50 bg-white flex items-center justify-center overflow-hidden">
        <canvas id="oshinagakiCanvas"></canvas>
      </div>
    </main>

  </div>

  <script>
    lucide.createIcons();

    // 規定カラーリスト（赤・ピンク・オレンジ・緑・青・紫・グレー）
    const PRESET_COLORS = [
      { name: '赤', hex: '#fca5a5', main: '#e11d48' },
      { name: 'ピンク', hex: '#f472b6', main: '#db2777' },
      { name: 'オレンジ', hex: '#fdba74', main: '#ea580c' },
      { name: '緑', hex: '#86efac', main: '#16a34a' },
      { name: '青', hex: '#93c5fd', main: '#2563eb' },
      { name: '紫', hex: '#d8b4fe', main: '#9333ea' },
      { name: 'グレー', hex: '#cbd5e1', main: '#475569' }
    ];

    let selectedPresetColor = PRESET_COLORS[0];

    // 用紙スペック
    const SPECS = {
      A3: { width: 3307, height: 2339 },
      A4: { width: 2339, height: 1654 }
    };

    let currentOrientation = 'LANDSCAPE'; // 'LANDSCAPE' or 'PORTRAIT'
    let currentPaperSize = 'A3';
    let CANVAS_WIDTH = SPECS.A3.width;
    let CANVAS_HEIGHT = SPECS.A3.height;

    let canvas;
    let customBgImageObj = null;

    // 初期頒布物データ
    let items = [
      {
        badge: '新 刊',
        title: '新刊サンプルタイトル',
        price: '¥ 1,000',
        desc: '文庫サイズ / 120P / 全年齢\n特製ノベルティステッカー付き',
        imageSrc: null
      },
      {
        badge: '既 刊',
        title: '既刊イラスト集',
        price: '¥ 500',
        desc: 'B5 / 24P / フルカラー\n過去イラストまとめ冊子',
        imageSrc: null
      }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      setupColorPalette();
      renderFormItems();
      setupEventListeners();
      updateCanvasDimensions();
    });

    function initCanvas() {
      canvas = new fabric.Canvas('oshinagakiCanvas', {
        width: CANVAS_WIDTH,
        height: CANVAS_HEIGHT,
        backgroundColor: '#ffffff',
        selection: false
      });
    }

    // パターン用プレセットカラーパレットの構築
    function setupColorPalette() {
      const container = document.getElementById('presetColorPalette');
      container.innerHTML = '';
      PRESET_COLORS.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `flex items-center gap-1 p-1 rounded border border-slate-700 text-[10px] text-slate-300 hover:bg-slate-700 ${idx === 0 ? 'ring-2 ring-rose-500 bg-slate-800' : 'bg-slate-900'}`;
        btn.innerHTML = `<span class="w-3 h-3 rounded-full shrink-0" style="background:${c.hex}"></span><span>${c.name}</span>`;
        btn.onclick = () => {
          document.querySelectorAll('#presetColorPalette button').forEach(b => b.classList.remove('ring-2', 'ring-rose-500', 'bg-slate-800'));
          btn.classList.add('ring-2', 'ring-rose-500', 'bg-slate-800');
          selectedPresetColor = c;
          generateOshinagaki();
        };
        container.appendChild(btn);
      });
    }

    function updateCanvasDimensions() {
      currentOrientation = document.getElementById('orientationSelect').value;
      currentPaperSize = document.getElementById('paperSizeSelect').value;

      const spec = SPECS[currentPaperSize];
      if (currentOrientation === 'LANDSCAPE') {
        CANVAS_WIDTH = spec.width;
        CANVAS_HEIGHT = spec.height;
      } else {
        CANVAS_WIDTH = spec.height;
        CANVAS_HEIGHT = spec.width;
      }

      canvas.setWidth(CANVAS_WIDTH);
      canvas.setHeight(CANVAS_HEIGHT);

      const label = `${currentPaperSize}${currentOrientation === 'LANDSCAPE' ? '横' : '縦'} (${CANVAS_WIDTH}×${CANVAS_HEIGHT}px / 200dpi)`;
      document.getElementById('paperSpecLabel').innerText = label;
      document.getElementById('dimensionDisplay').innerText = label;

      setupResponsiveScaler();
      generateOshinagaki();
    }

    function renderFormItems() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      items.forEach((item, idx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'bg-slate-900/80 border border-slate-700/80 p-3 rounded-xl space-y-2 relative group';
        itemEl.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-[11px] font-bold text-slate-400">頒布物 #${idx + 1}</span>
            ${items.length > 1 ? `<button onclick="removeItem(${idx})" class="text-rose-400 hover:text-rose-300 text-xs flex items-center gap-0.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 削除</button>` : ''}
          </div>
          
          <div class="grid grid-cols-3 gap-2">
            <div class="col-span-1">
              <input type="text" value="${item.badge}" onchange="updateItem(${idx}, 'badge', this.value)" placeholder="新刊/既刊" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-rose-400 font-bold">
            </div>
            <div class="col-span-2">
              <input type="text" value="${item.price}" onchange="updateItem(${idx}, 'price', this.value)" placeholder="価格 (例: ¥500)" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">
            </div>
          </div>

          <div>
            <input type="text" value="${item.title}" onchange="updateItem(${idx}, 'title', this.value)" placeholder="作品タイトル" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 font-bold">
          </div>

          <div>
            <textarea onchange="updateItem(${idx}, 'desc', this.value)" placeholder="説明文（サイズ、P数等）" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-300 h-14 resize-none">${item.desc}</textarea>
          </div>

          <div>
            <label class="block text-[10px] text-slate-400 mb-1">個別に画像を選択</label>
            <input type="file" accept="image/*" onchange="handleSingleImageUpload(${idx}, this)" class="w-full text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer">
          </div>
        `;
        container.appendChild(itemEl);
      });
      lucide.createIcons();
    }

    function addItem() {
      items.push({
        badge: '新 刊',
        title: `頒布物 #${items.length + 1}`,
        price: '¥ 500',
        desc: '説明テキストを入力してください',
        imageSrc: null
      });
      renderFormItems();
      generateOshinagaki();
    }

    function removeItem(idx) {
      items.splice(idx, 1);
      renderFormItems();
      generateOshinagaki();
    }

    function updateItem(idx, key, value) {
      items[idx][key] = value;
      generateOshinagaki();
    }

    function handleSingleImageUpload(idx, input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        items[idx].imageSrc = e.target.result;
        generateOshinagaki();
      };
      reader.readAsDataURL(file);
    }

    // 複数画像の一括アップロード
    function handleBatchImageUpload(files) {
      if (!files || files.length === 0) return;
      
      const fileArray = Array.from(files);
      let loadedCount = 0;

      fileArray.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          if (index < items.length) {
            items[index].imageSrc = e.target.result;
          } else {
            // 既存枠を超える場合は自動追加
            items.push({
              badge: '新 刊',
              title: `新刊アイテム ${index + 1}`,
              price: '¥ 500',
              desc: 'スペック等の説明',
              imageSrc: e.target.result
            });
          }
          loadedCount++;
          if (loadedCount === fileArray.length) {
            renderFormItems();
            generateOshinagaki();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    // 背景描画（パターン・アップロード画像・単色）
    function applyBackground() {
      const bgType = document.getElementById('bgTypeSelect').value;

      if (bgType === 'color') {
        const color = document.getElementById('bgColorPicker').value;
        canvas.setBackgroundImage(null);
        canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        return;
      }

      if (bgType === 'custom' && customBgImageObj) {
        canvas.setBackgroundImage(customBgImageObj, canvas.renderAll.bind(canvas), {
          scaleX: CANVAS_WIDTH / customBgImageObj.width,
          scaleY: CANVAS_HEIGHT / customBgImageObj.height
        });
        return;
      }

      if (bgType === 'pattern') {
        const patternStyle = document.getElementById('patternStyleSelect').value;
        const colorHex = selectedPresetColor.hex;

        const patternCanvas = document.createElement('canvas');
        const pctx = patternCanvas.getContext('2d');
        const size = 120;
        patternCanvas.width = size;
        patternCanvas.height = size;

        pctx.fillStyle = '#ffffff';
        pctx.fillRect(0, 0, size, size);

        pctx.fillStyle = colorHex;
        pctx.strokeStyle = colorHex;

        if (patternStyle === 'dots') {
          // 可愛いドットパターン (水玉)
          pctx.beginPath();
          pctx.arc(size / 4, size / 4, 18, 0, Math.PI * 2);
          pctx.arc(size * 3 / 4, size * 3 / 4, 18, 0, Math.PI * 2);
          pctx.fill();
        } else if (patternStyle === 'stripes') {
          // 太めのストライプ (縦縞)
          pctx.fillRect(0, 0, size / 2, size);
        } else if (patternStyle === 'diagonal') {
          // 太めの斜めストライプ
          pctx.lineWidth = 35;
          pctx.beginPath();
          pctx.moveTo(-size / 2, size);
          pctx.lineTo(size, -size / 2);
          pctx.stroke();

          pctx.beginPath();
          pctx.moveTo(0, size * 1.5);
          pctx.lineTo(size * 1.5, 0);
          pctx.stroke();
        } else if (patternStyle === 'border') {
          // 太めのボーダー (横縞)
          pctx.fillRect(0, 0, size, size / 2);
        } else if (patternStyle === 'tartan') {
          // タータンチェック
          pctx.globalAlpha = 0.5;
          pctx.fillRect(0, 0, size / 2, size);
          pctx.fillRect(0, 0, size, size / 2);
          pctx.globalAlpha = 1.0;
        }

        const pattern = new fabric.Pattern({
          source: patternCanvas,
          repeat: 'repeat'
        });

        canvas.setBackgroundImage(null);
        canvas.setBackgroundColor(pattern, canvas.renderAll.bind(canvas));
      }
    }

    // ★ おしながき全体自動レイアウト処理 ★
    function generateOshinagaki() {
      canvas.clear();
      applyBackground();

      const eventDate = document.getElementById('eventDate').value;
      const eventName = document.getElementById('eventName').value;
      const circleName = document.getElementById('circleName').value;
      const spaceNo = document.getElementById('spaceNo').value;

      const isLandscape = currentOrientation === 'LANDSCAPE';

      // 1. ヘッダー描画
      const headerHeight = isLandscape ? 360 : 420;
      const headerBg = new fabric.Rect({
        left: 0, top: 0, width: CANVAS_WIDTH, height: headerHeight, fill: '#0f172a'
      });
      canvas.add(headerBg);

      const headerAccent = new fabric.Rect({
        left: 0, top: headerHeight - 12, width: CANVAS_WIDTH, height: 12, fill: selectedPresetColor.main
      });
      canvas.add(headerAccent);

      // イベント名・日時
      const eventText = new fabric.Text(`${eventDate}  |  ${eventName}`, {
        left: 80, top: isLandscape ? 55 : 60, fontSize: isLandscape ? 48 : 46, fontFamily: 'Noto Sans JP', fill: '#cbd5e1'
      });
      canvas.add(eventText);

      // サークル名
      const circleText = new fabric.Text(circleName, {
        left: 80, top: isLandscape ? 130 : 135, fontSize: isLandscape ? 120 : 110, fontWeight: 'bold', fontFamily: 'Noto Sans JP', fill: '#ffffff'
      });
      canvas.add(circleText);

      // スペース番号バッジ
      if (spaceNo) {
        const badgeLeft = isLandscape ? CANVAS_WIDTH - 850 : 80;
        const badgeTop = isLandscape ? 120 : 270;
        const spaceBadge = new fabric.Textbox(` ${spaceNo} `, {
          left: badgeLeft, top: badgeTop, fontSize: isLandscape ? 85 : 75, fontWeight: 'bold', fontFamily: 'M PLUS Rounded 1c',
          fill: '#ffffff', backgroundColor: selectedPresetColor.main, padding: 20, rx: 15, ry: 15
        });
        canvas.add(spaceBadge);
      }

      // 2. 頒布物グリッド段組計算
      const count = items.length;
      let cols = 2;

      if (isLandscape) {
        if (count === 1) cols = 1;
        else if (count > 4) cols = 3;
      } else {
        // 縦向きレイアウト
        if (count <= 3) cols = 1;
        else cols = 2;
      }

      const rows = Math.ceil(count / cols);
      const startY = headerHeight + 50;
      const marginX = 70;
      const marginY = 40;

      const cardWidth = (CANVAS_WIDTH - (marginX * 2) - (40 * (cols - 1))) / cols;
      const cardHeight = (CANVAS_HEIGHT - startY - marginY - (40 * (rows - 1))) / rows;

      // 頒布物カードループ
      items.forEach((item, index) => {
        const r = Math.floor(index / cols);
        const c = index % cols;

        const posX = marginX + c * (cardWidth + 40);
        const posY = startY + r * (cardHeight + 40);

        // カード背景
        const cardBg = new fabric.Rect({
          left: posX, top: posY, width: cardWidth, height: cardHeight,
          fill: '#ffffff', stroke: '#cbd5e1', strokeWidth: 4, rx: 24, ry: 24
        });
        canvas.add(cardBg);

        const innerPadding = 25;
        const isSingleColPortrait = (!isLandscape && cols === 1);
        const imgContainerWidth = isSingleColPortrait ? cardWidth * 0.38 : cardWidth * 0.42;
        const imgContainerHeight = cardHeight - (innerPadding * 2);

        // 画像表示枠
        const imgBox = new fabric.Rect({
          left: posX + innerPadding, top: posY + innerPadding,
          width: imgContainerWidth, height: imgContainerHeight,
          fill: '#f1f5f9', rx: 12, ry: 12
        });
        canvas.add(imgBox);

        // 画像挿入
        if (item.imageSrc) {
          fabric.Image.fromURL(item.imageSrc, (img) => {
            const scaleX = imgContainerWidth / img.width;
            const scaleY = imgContainerHeight / img.height;
            const scale = Math.min(scaleX, scaleY);

            img.set({
              left: posX + innerPadding + (imgContainerWidth - img.width * scale) / 2,
              top: posY + innerPadding + (imgContainerHeight - img.height * scale) / 2,
              scaleX: scale, scaleY: scale
            });
            canvas.add(img);
            canvas.renderAll();
          });
        } else {
          const noImgText = new fabric.Text('NO IMAGE', {
            left: posX + innerPadding + (imgContainerWidth / 2) - 80,
            top: posY + innerPadding + (imgContainerHeight / 2) - 15,
            fontSize: 32, fontFamily: 'Noto Sans JP', fill: '#94a3b8'
          });
          canvas.add(noImgText);
        }

        // テキスト情報エリア（右側）
        const textX = posX + innerPadding + imgContainerWidth + 25;
        let currentY = posY + innerPadding + 10;

        // バッジ
        if (item.badge) {
          const badge = new fabric.Textbox(` ${item.badge} `, {
            left: textX, top: currentY, fontSize: isSingleColPortrait ? 48 : 40, fontWeight: 'bold', fontFamily: 'M PLUS Rounded 1c',
            fill: '#ffffff', backgroundColor: selectedPresetColor.main, padding: 10
          });
          canvas.add(badge);
          currentY += isSingleColPortrait ? 85 : 75;
        }

        // タイトル
        const titleFontSize = isSingleColPortrait ? 64 : 54;
        const title = new fabric.Textbox(item.title, {
          left: textX, top: currentY, fontSize: titleFontSize, fontWeight: 'bold', fontFamily: 'Noto Sans JP',
          fill: '#0f172a', width: cardWidth - imgContainerWidth - (innerPadding * 2) - 35
        });
        canvas.add(title);
        currentY += title.height + 15;

        // 価格
        const priceFontSize = isSingleColPortrait ? 80 : 68;
        const price = new fabric.Text(item.price, {
          left: textX, top: currentY, fontSize: priceFontSize, fontWeight: 'bold', fontFamily: 'M PLUS Rounded 1c', fill: selectedPresetColor.main
        });
        canvas.add(price);
        currentY += isSingleColPortrait ? 95 : 85;

        // 説明文
        if (item.desc) {
          const descFontSize = isSingleColPortrait ? 42 : 36;
          const desc = new fabric.Textbox(item.desc.replace(/\\n/g, '\n'), {
            left: textX, top: currentY, fontSize: descFontSize, fontFamily: 'Noto Sans JP', fill: '#475569',
            width: cardWidth - imgContainerWidth - (innerPadding * 2) - 35
          });
          canvas.add(desc);
        }
      });

      canvas.renderAll();
    }

    // 画面レスポンシブフィット調整
    function setupResponsiveScaler() {
      const workspace = document.getElementById('workspace');
      const canvasContainer = document.getElementById('canvasContainer');

      function fitCanvas() {
        const padding = 20;
        const availableWidth = Math.max(workspace.clientWidth - padding * 2, 100);
        const availableHeight = Math.max(workspace.clientHeight - padding * 2, 100);

        const scaleX = availableWidth / CANVAS_WIDTH;
        const scaleY = availableHeight / CANVAS_HEIGHT;
        const scale = Math.min(scaleX, scaleY);

        canvasContainer.style.width = `${CANVAS_WIDTH * scale}px`;
        canvasContainer.style.height = `${CANVAS_HEIGHT * scale}px`;

        canvas.setDimensions({ width: CANVAS_WIDTH * scale, height: CANVAS_HEIGHT * scale }, { cssOnly: true });
        canvas.setZoom(scale);
        canvas.calcOffset();

        document.getElementById('zoomDisplay').innerText = `表示: ${Math.round(scale * 100)}%`;
      }

      const observer = new ResizeObserver(fitCanvas);
      observer.observe(workspace);
      window.addEventListener('resize', fitCanvas);
      setTimeout(fitCanvas, 50);
    }

    function setupEventListeners() {
      document.getElementById('orientationSelect').addEventListener('change', updateCanvasDimensions);
      document.getElementById('paperSizeSelect').addEventListener('change', updateCanvasDimensions);

      document.getElementById('bgTypeSelect').addEventListener('change', (e) => {
        const val = e.target.value;
        document.getElementById('patternControls').classList.toggle('hidden', val !== 'pattern');
        document.getElementById('customBgControls').classList.toggle('hidden', val !== 'custom');
        document.getElementById('singleColorControls').classList.toggle('hidden', val !== 'color');
        generateOshinagaki();
      });

      document.getElementById('patternStyleSelect').addEventListener('change', generateOshinagaki);
      document.getElementById('bgColorPicker').addEventListener('input', generateOshinagaki);

      // 背景画像のアップロード
      document.getElementById('customBgInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          fabric.Image.fromURL(evt.target.result, (img) => {
            customBgImageObj = img;
            generateOshinagaki();
          });
        };
        reader.readAsDataURL(file);
      });

      // 一括画像アップロード
      document.getElementById('batchImageInput').addEventListener('change', (e) => {
        handleBatchImageUpload(e.target.files);
      });

      document.getElementById('addItemBtn').addEventListener('click', addItem);
      document.getElementById('generateBtn').addEventListener('click', generateOshinagaki);

      // PNG出力
      document.getElementById('exportPng').addEventListener('click', () => {
        const dataURL = canvas.toDataURL({ format: 'png', multiplier: 1.0 });
        const link = document.createElement('a');
        link.download = `oshinagaki_${currentPaperSize}_${currentOrientation}_${Date.now()}.png`;
        link.href = dataURL;
        link.click();
      });

      // PDF出力
      document.getElementById('exportPdf').addEventListener('click', () => {
        const dataURL = canvas.toDataURL({ format: 'png', multiplier: 1.0 });
        const { jsPDF } = window.jspdf;
        const isLandscape = currentOrientation === 'LANDSCAPE';
        const pdf = new jsPDF(isLandscape ? 'landscape' : 'portrait', 'mm', currentPaperSize.toLowerCase());
        
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();

        pdf.addImage(dataURL, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`oshinagaki_${currentPaperSize}_${currentOrientation}_${Date.now()}.pdf`);
      });
    }
  </script>
