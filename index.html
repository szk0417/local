<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同人おしながきジェネレーター</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Noto Sans JP", sans-serif;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      z-index: 20;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
      background: #1e293b;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(120deg, #f43f5e, #9333ea);
      color: white;
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
    }

    .brand p {
      overflow: hidden;
      margin: 2px 0 0;
      color: #94a3b8;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 6px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 7px;
      padding: 8px 10px;
      color: white;
      font-size: 11px;
      font-weight: 700;
    }

    .button-print { background: #475569; }
    .button-png { background: #059669; }
    .button-pdf { background: #e11d48; }

    #mainLayout {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    #settingsPanel {
      display: flex;
      flex: 0 0 410px;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
      border-right: 1px solid #334155;
      background: #1e293b;
    }

    .panel-heading {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }

    .panel-heading small {
      border: 1px solid #166534;
      border-radius: 999px;
      padding: 3px 7px;
      background: #052e16;
      color: #4ade80;
      font-size: 9px;
    }

    #settingsContent {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }

    .section {
      margin-bottom: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      background: rgba(15, 23, 42, .65);
    }

    .section h2 {
      margin: 0 0 10px;
      color: #fb7185;
      font-size: 12px;
    }

    .field {
      display: block;
      margin-bottom: 9px;
      color: #94a3b8;
      font-size: 10px;
    }

    .field:last-child { margin-bottom: 0; }

    .control {
      display: block;
      width: 100%;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
    }

    .control:disabled { opacity: .5; }

    .control-color {
      width: 48px;
      height: 31px;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px;
      background: #1e293b;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .palette button {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 10px;
    }

    .palette button.selected {
      outline: 2px solid #f43f5e;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      color: #94a3b8;
      font-size: 10px;
    }

    .check-row input[type="checkbox"] {
      accent-color: #f43f5e;
    }

    .upload-box {
      display: block;
      border: 2px dashed #9f1239;
      border-radius: 9px;
      padding: 13px;
      background: rgba(30, 41, 59, .5);
      color: #e2e8f0;
      text-align: center;
      cursor: pointer;
    }

    .upload-box span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .upload-box small {
      display: block;
      margin-top: 3px;
      color: #94a3b8;
      font-size: 9px;
    }

    .item-card {
      margin-bottom: 10px;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 10px;
      background: #0f172a;
    }

    .item-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
    }

    .item-card-head button {
      border: 0;
      border-radius: 5px;
      padding: 3px 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 10px;
    }

    .item-card-head button:disabled { opacity: .4; }

    .delete-item {
      margin-left: 4px;
      background: transparent !important;
      color: #fb7185 !important;
    }

    .add-item {
      width: 100%;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
    }

    #workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 44px 20px 20px;
      background: #020617;
    }

    #canvasContainer {
      position: relative;
      flex: none;
      overflow: hidden;
      border: 1px solid #475569;
      background: white;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .45);
      line-height: 0;
    }

    #canvasStage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }

    #gridOverlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, .2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .2) 1px, transparent 1px),
        linear-gradient(to right, rgba(15, 23, 42, .1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .1) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    }

    .hidden { display: none !important; }

    #zoomInfo {
      position: absolute;
      z-index: 12;
      top: 10px;
      left: 10px;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      background: rgba(30, 41, 59, .95);
      color: #cbd5e1;
      font-size: 10px;
    }

    #previewToolbar {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px;
      background: rgba(30, 41, 59, .96);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
      font-size: 10px;
    }

    #previewToolbar button {
      border: 0;
      border-radius: 5px;
      padding: 5px 7px;
      background: #475569;
      color: #e2e8f0;
      font-size: 10px;
    }

    #previewToolbarDrag {
      cursor: grab;
      touch-action: none;
    }

    #previewToolbarDrag:active { cursor: grabbing; }

    @media (max-width: 767px) {
      #mainLayout {
        display: block;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      #settingsPanel {
        width: 100%;
        max-height: none;
        overflow: visible;
        border-right: 0;
      }

      #settingsContent {
        overflow: visible;
      }

      #workspace {
        width: 100%;
        height: 75vh;
        min-height: 480px;
      }

      #previewToolbar {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }

    @media (max-width: 420px) {
      .topbar { padding-right: 6px; padding-left: 6px; }
      .button { gap: 3px; padding: 7px 6px; font-size: 10px; }
      #settingsContent { padding: 10px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="sparkles" width="18" height="18"></i></div>
      <div style="min-width:0">
        <h1>同人おしながきジェネレーター</h1>
        <p id="paperSpecLabel">A3横</p>
      </div>
    </div>

    <div class="top-actions">
      <button id="printPreviewBtn" class="button button-print" type="button">
        <i data-lucide="printer" width="14" height="14"></i>
        <span class="desktop-label">プレビュー</span><span class="mobile-label">印刷</span>
      </button>
      <button id="exportPng" class="button button-png" type="button">
        <i data-lucide="image" width="14" height="14"></i>
        <span class="desktop-label">PNG保存</span><span class="mobile-label">PNG</span>
      </button>
      <button id="exportPdf" class="button button-pdf" type="button">
        <i data-lucide="file-text" width="14" height="14"></i>
        <span class="desktop-label">PDF保存</span><span class="mobile-label">PDF</span>
      </button>
    </div>
  </header>

  <div id="mainLayout">
    <aside id="settingsPanel">
      <div class="panel-heading">
        <span>デザイン・情報設定</span>
        <small>リアルタイム反映</small>
      </div>

      <div id="settingsContent">
        <section class="section">
          <h2>レイアウト・用紙設定</h2>
          <div class="two-col">
            <label class="field">用紙向き
              <select id="orientationSelect" class="control">
                <option value="LANDSCAPE">横向き</option>
                <option value="PORTRAIT">縦向き</option>
              </select>
            </label>
            <label class="field">レイアウト
              <select id="paperSizeSelect" class="control">
                <option value="A2">A2 (200dpi)</option>
                <option value="A3" selected>A3 (200dpi)</option>
                <option value="A4">A4 (350dpi)</option>
                <option value="WEB_PORTRAIT">X用縦書き (960 × 1280px)</option>
                <option value="WEB_LANDSCAPE">X用横書き (1200 × 675px)</option>
                <option value="PICSQUARE">ピクスク用 (500 × 1,000px)</option>
                <option value="PICREA">ピクリエ用 (800 × 1,600px)</option>
              </select>
            </label>
          </div>
          <div id="layoutHelp" style="color:#64748b;font-size:9px"></div>
        </section>

        <section class="section">
          <h2>背景デザイン</h2>
          <label class="field">背景の種類
            <select id="bgTypeSelect" class="control">
              <option value="pattern">規定パターン</option>
              <option value="custom">背景画像</option>
              <option value="color">単色カラー</option>
            </select>
          </label>
          <div id="patternControls">
            <label class="field">パターン
              <select id="patternStyleSelect" class="control">
                <option value="dots">ドット</option>
                <option value="stripes">ストライプ</option>
                <option value="diagonal">斜めストライプ</option>
                <option value="border">ボーダー</option>
                <option value="check">チェック</option>
              </select>
            </label>
            <div class="field">規定カラー<div id="presetColorPalette" class="palette"></div></div>
          </div>
          <div id="customBgControls" class="hidden">
            <label class="field">背景画像を選択
              <input id="customBgInput" type="file" accept="image/*" class="control">
            </label>
          </div>
          <div id="singleColorControls" class="hidden">
            <label class="field">背景色
              <input id="bgColorPicker" type="color" value="#f8fafc" class="control-color">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>イベント・サークル情報</h2>
          <label class="field">イベント日時
            <input id="eventDate" type="text" value="2026年12月30日(水)" class="control">
          </label>
          <label class="field">イベント名
            <input id="eventName" type="text" value="コミックマーケット109" class="control">
          </label>
          <div class="two-col">
            <label class="field">サークル名
              <input id="circleName" type="text" value="暁の稜線" class="control">
            </label>
            <label class="field">スペース番号
              <input id="spaceNo" type="text" value="東7ホール あ-01a" class="control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>ヘッダー色</h2>
          <div class="two-col">
            <label class="field">背景色
              <input id="headerBgColor" type="color" value="#3b0a1e" class="control-color">
            </label>
            <label class="field">アクセント色
              <input id="headerAccentColor" type="color" value="#fb7185" class="control-color">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>イベント・サークル情報の表示設定</h2>
          <div class="two-col">
            <label class="field">イベント情報サイズ
              <input id="eventInfoFontSize" type="number" min="8" max="200" value="48" class="control">
            </label>
            <label class="field">イベント文字色
              <input id="eventInfoTextColor" type="color" value="#ffe4e6" class="control-color">
            </label>
          </div>
          <label class="check-row">
            イベント情報の背景色を表示
            <input id="eventInfoBgEnabled" type="checkbox">
            <input id="eventInfoBgColor" type="color" value="#334155" class="control-color">
          </label>

          <hr style="border-color:#334155;margin:10px 0">

          <div class="two-col">
            <label class="field">サークル名サイズ
              <input id="circleInfoFontSize" type="number" min="8" max="300" value="120" class="control">
            </label>
            <label class="field">サークル文字色
              <input id="circleInfoTextColor" type="color" value="#fff1f2" class="control-color">
            </label>
          </div>
          <label class="check-row">
            サークル名の背景色を表示
            <input id="circleInfoBgEnabled" type="checkbox">
            <input id="circleInfoBgColor" type="color" value="#334155" class="control-color">
          </label>

          <hr style="border-color:#334155;margin:10px 0">

          <div class="two-col">
            <label class="field">スペース番号サイズ
              <input id="spaceInfoFontSize" type="number" min="8" max="200" value="75" class="control">
            </label>
            <label class="field">スペース文字色
              <input id="spaceInfoTextColor" type="color" value="#ffffff" class="control-color">
            </label>
          </div>
          <label class="check-row">
            スペース番号の背景色を表示
            <input id="spaceInfoBgEnabled" type="checkbox" checked>
            <input id="spaceInfoBgColor" type="color" value="#e11d48" class="control-color">
          </label>
        </section>

        <section class="section">
          <h2>頒布物画像を一括アップロード</h2>
          <label class="upload-box">
            <i data-lucide="upload-cloud" width="22" height="22"></i>
            <span>複数画像を選択</span>
            <small>選択順に頒布物へ割り当て</small>
            <input id="batchImageInput" type="file" accept="image/*" multiple hidden>
          </label>
        </section>

        <section class="section">
          <h2>頒布物一覧</h2>
          <div id="itemsContainer"></div>
          <button id="addItemBtn" class="add-item" type="button">＋ 頒布物を追加</button>
        </section>
      </div>
    </aside>

    <main id="workspace">
      <div id="zoomInfo">
        <span id="zoomDisplay">表示 --%</span>
        <span style="color:#64748b"> | </span>
        <span id="dimensionDisplay"></span>
      </div>

      <div id="previewToolbar">
        <button id="previewToolbarDrag" type="button" aria-label="操作バーを移動" title="ドラッグして移動">↕</button>
        <button id="fitCanvasBtn" type="button">全体表示</button>
        <label>倍率 <input id="zoomSlider" type="range" min="1" max="200" value="100" style="width:70px;vertical-align:middle"></label>
        <label><input id="toggleGrid" type="checkbox"> 方眼</label>
      </div>

      <div id="canvasContainer">
        <div id="canvasStage">
          <canvas id="oshinagakiCanvas"></canvas>
          <div id="gridOverlay" class="grid-overlay hidden"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const PRESET_COLORS = [
      { name: "赤", hex: "#fca5a5", main: "#e11d48" },
      { name: "ピンク", hex: "#f472b6", main: "#db2777" },
      { name: "橙", hex: "#fdba74", main: "#ea580c" },
      { name: "緑", hex: "#86efac", main: "#16a34a" },
      { name: "青", hex: "#93c5fd", main: "#2563eb" },
      { name: "紫", hex: "#d8b4fe", main: "#9333ea" },
      { name: "灰", hex: "#cbd5e1", main: "#475569" }
    ];

    const CATEGORY_STYLES = {
      "新刊": { background: "#dc2626", text: "#ffffff" },
      "既刊": { background: "#2563eb", text: "#ffffff" },
      "無料配布": { background: "#16a34a", text: "#ffffff" },
      "Web展示": { background: "#0891b2", text: "#ffffff" }
    };

    const SPECS = {
      A2: { width: 4677, height: 3307 },
      A3: { width: 3307, height: 2339 },
      A4: { width: 2339, height: 1654 }
    };

    const PAPER_MM = {
      A2: { width: 420, height: 594 },
      A3: { width: 297, height: 420 },
      A4: { width: 210, height: 297 }
    };

    // 縦向き基準。A2/A3: 200dpi、A4: 350dpi。寸法は塗り足し込み。
    const PRINT_EXPORT_SPECS = {
      A2: {
        widthMm: 426, heightMm: 600,
        widthPx: 3354, heightPx: 4724,
        trimWidthMm: 420, trimHeightMm: 594
      },
      A3: {
        widthMm: 303, heightMm: 426,
        widthPx: 2386, heightPx: 3354,
        trimWidthMm: 297, trimHeightMm: 420
      },
      A4: {
        widthMm: 216, heightMm: 303,
        widthPx: 2976, heightPx: 4175,
        trimWidthMm: 210, trimHeightMm: 297
      }
    };

    const SOCIAL_PRESETS = {
      WEB_PORTRAIT: { width: 960, height: 1280, orientation: "PORTRAIT", label: "X用縦書き" },
      WEB_LANDSCAPE: { width: 1200, height: 675, orientation: "LANDSCAPE", label: "X用横書き" },
      PICSQUARE: { width: 500, height: 1000, orientation: "PORTRAIT", label: "ピクスク用" },
      PICREA: { width: 800, height: 1600, orientation: "PORTRAIT", label: "ピクリエ用" }
    };

    const SOCIAL_LAYOUTS = {
      WEB_PORTRAIT: {
        header: 250, marginX: 28, marginY: 22, gapX: 16, gapY: 16,
        padding: 12, eventFont: 20, circleFont: 38, spaceFont: 19,
        cardScale: .55, categoryBand: 46, ageBand: 28
      },
      WEB_LANDSCAPE: {
        header: 160, marginX: 28, marginY: 18, gapX: 16, gapY: 16,
        padding: 11, eventFont: 16, circleFont: 28, spaceFont: 15,
        cardScale: .48, categoryBand: 38, ageBand: 24
      },
      // 143pxは高さ1000pxの約1/7
      PICSQUARE: {
        header: 143, marginX: 16, marginY: 16, gapX: 12, gapY: 12,
        padding: 8, eventFont: 12, circleFont: 21, spaceFont: 12,
        cardScale: .35, categoryBand: 34, ageBand: 21
      },
      PICREA: {
        header: 270, marginX: 24, marginY: 22, gapX: 16, gapY: 16,
        padding: 12, eventFont: 18, circleFont: 34, spaceFont: 18,
        cardScale: .5, categoryBand: 44, ageBand: 28
      }
    };

    const BLEED_MM = 3;

    let selectedPresetColor = PRESET_COLORS[0];
    let currentPaperSize = "A3";
    let currentOrientation = "LANDSCAPE";
    let CANVAS_WIDTH = SPECS.A3.width;
    let CANVAS_HEIGHT = SPECS.A3.height;
    let canvas;
    let customBackgroundImage = null;
    let generationId = 0;
    let imageLoadPromises = [];
    let previewZoomMode = "fit";
    let resizeCanvasToFit = null;

    let items = [
      {
        category: "新刊",
        ageRating: "全年齢",
        title: "新刊サンプルタイトル",
        price: "¥ 1,000",
        desc: "文庫サイズ / 120P / 全年齢\n特製ノベルティステッカー付き",
        descriptionFontSize: 38,
        imageSrc: null,
        imageWidth: 0,
        imageHeight: 0,
        noImage: false
      },
      {
        category: "既刊",
        ageRating: "全年齢",
        title: "既刊イラスト集",
        price: "¥ 500",
        desc: "B5 / 24P / フルカラー\n過去イラストまとめ冊子",
        descriptionFontSize: 36,
        imageSrc: null,
        imageWidth: 0,
        imageHeight: 0,
        noImage: false
      }
    ];

    const schemes = {
      "赤": ["#3b0a1e", "#fb7185", "#ffe4e6", "#fff1f2", "#e11d48"],
      "ピンク": ["#3b1028", "#f472b6", "#fce7f3", "#fff1f7", "#db2777"],
      "橙": ["#3b1b0b", "#fb923c", "#ffedd5", "#fff7ed", "#ea580c"],
      "緑": ["#092e24", "#4ade80", "#dcfce7", "#f0fdf4", "#16a34a"],
      "青": ["#0b2340", "#60a5fa", "#dbeafe", "#eff6ff", "#2563eb"],
      "紫": ["#26103b", "#c084fc", "#f3e8ff", "#faf5ff", "#9333ea"],
      "灰": ["#1f2937", "#cbd5e1", "#e2e8f0", "#f8fafc", "#475569"]
    };

    document.addEventListener("DOMContentLoaded", init);

    function init() {
      canvas = new fabric.Canvas("oshinagakiCanvas", {
        width: CANVAS_WIDTH,
        height: CANVAS_HEIGHT,
        backgroundColor: "#ffffff",
        selection: false,
        enableRetinaScaling: true
      });

      setupPalette();
      renderItems();
      setupScaler();
      setupEvents();
      updateDimensions();
      lucide.createIcons();
    }

    function setupPalette() {
      const root = document.getElementById("presetColorPalette");
      root.innerHTML = "";

      PRESET_COLORS.forEach((color, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.innerHTML =
          `<span class="swatch" style="background:${color.hex}"></span>${color.name}`;
        if (index === 0) button.classList.add("selected");

        button.addEventListener("click", () => {
          selectedPresetColor = color;
          root.querySelectorAll("button").forEach((el) => el.classList.remove("selected"));
          button.classList.add("selected");

          const scheme = schemes[color.name];
          if (scheme) {
            document.getElementById("headerBgColor").value = scheme[0];
            document.getElementById("headerAccentColor").value = scheme[1];
            document.getElementById("eventInfoTextColor").value = scheme[2];
            document.getElementById("circleInfoTextColor").value = scheme[3];
            document.getElementById("spaceInfoBgColor").value = scheme[4];
          }

          generate();
        });

        root.appendChild(button);
      });
    }

    function updateDimensions() {
      currentPaperSize = document.getElementById("paperSizeSelect").value;

      const preset = SOCIAL_PRESETS[currentPaperSize];
      const orientationSelect = document.getElementById("orientationSelect");

      if (preset) {
        currentOrientation = preset.orientation;
        orientationSelect.value = preset.orientation;
        orientationSelect.disabled = true;
        CANVAS_WIDTH = preset.width;
        CANVAS_HEIGHT = preset.height;
      } else {
        orientationSelect.disabled = false;
        currentOrientation = orientationSelect.value;
        const spec = SPECS[currentPaperSize];

        if (currentOrientation === "LANDSCAPE") {
          CANVAS_WIDTH = spec.width;
          CANVAS_HEIGHT = spec.height;
        } else {
          CANVAS_WIDTH = spec.height;
          CANVAS_HEIGHT = spec.width;
        }
      }

      canvas.setDimensions({ width: CANVAS_WIDTH, height: CANVAS_HEIGHT });

      const stage = document.getElementById("canvasStage");
      stage.style.width = `${CANVAS_WIDTH}px`;
      stage.style.height = `${CANVAS_HEIGHT}px`;

      const label = preset
        ? `${preset.label} (${CANVAS_WIDTH} × ${CANVAS_HEIGHT}px)`
        : `${currentPaperSize}${currentOrientation === "LANDSCAPE" ? "横" : "縦"} (${CANVAS_WIDTH} × ${CANVAS_HEIGHT}px / ${currentPaperSize === "A4" ? 350 : 200}dpi)`;

      document.getElementById("paperSpecLabel").textContent = label;
      document.getElementById("dimensionDisplay").textContent = label;
      document.getElementById("layoutHelp").textContent = preset
        ? "SNS・オンラインイベント向けのレイアウトです。"
        : "印刷向け。塗り足し各3mmを含むサイズで出力します。";

      previewZoomMode = "fit";
      if (resizeCanvasToFit) resizeCanvasToFit();
      generate();
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function renderItems() {
      const container = document.getElementById("itemsContainer");
      container.innerHTML = "";

      items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-card-head">
            <span>頒布物 #${index + 1}</span>
            <div>
              <button type="button" data-move="${index}" data-dir="-1" ${index === 0 ? "disabled" : ""}>↑</button>
              <button type="button" data-move="${index}" data-dir="1" ${index === items.length - 1 ? "disabled" : ""}>↓</button>
              ${items.length > 1 ? `<button type="button" class="delete-item" data-remove="${index}">削除</button>` : ""}
            </div>
          </div>

          <div class="two-col">
            <label class="field">カテゴリ
              <select class="control" data-index="${index}" data-key="category">
                ${["新刊", "既刊", "無料配布", "Web展示"].map((category) =>
                  `<option value="${category}" ${item.category === category ? "selected" : ""}>${category}</option>`
                ).join("")}
              </select>
            </label>
            <label class="field">年齢区分
              <select class="control" data-index="${index}" data-key="ageRating">
                <option value="全年齢" ${item.ageRating === "全年齢" ? "selected" : ""}>全年齢</option>
                <option value="R18" ${item.ageRating === "R18" ? "selected" : ""}>R18</option>
              </select>
            </label>
          </div>

          <label class="field">タイトル
            <input class="control" type="text" data-index="${index}" data-key="title" value="${escapeHTML(item.title)}">
          </label>

          <label class="field">値段（無料配布・Web展示は空欄）
            <input class="control" type="text" data-index="${index}" data-key="price"
              value="${escapeHTML(item.price || "")}"
              ${["無料配布", "Web展示"].includes(item.category) ? "disabled" : ""}>
          </label>

          <label class="field">説明
            <textarea class="control" data-index="${index}" data-key="desc" rows="3">${escapeHTML(item.desc)}</textarea>
          </label>

          <label class="field">説明文フォントサイズ
            <input class="control" type="number" min="8" max="100" step="1"
              data-index="${index}" data-key="descriptionFontSize"
              value="${Number(item.descriptionFontSize) || 38}">
          </label>

          <label class="check-row" style="justify-content:flex-start">
            <input type="checkbox" data-noimage="${index}" ${item.noImage ? "checked" : ""}>
            画像なし（テキスト欄を広く表示）
          </label>

          <label class="field">個別画像
            <input class="control" type="file" accept="image/*" data-image="${index}" ${item.noImage ? "disabled" : ""}>
          </label>
        `;

        container.appendChild(card);
      });

      container.querySelectorAll("[data-index]").forEach((input) => {
        const update = () => {
          const index = Number(input.dataset.index);
          const key = input.dataset.key;
          if (!items[index]) return;

          if (key === "descriptionFontSize") {
            const size = Number.parseInt(input.value, 10);
            items[index][key] = Number.isFinite(size)
              ? Math.max(8, Math.min(100, size))
              : 38;
          } else {
            items[index][key] = input.value;
          }

          if (key === "category") {
            const price = container.querySelector(`[data-index="${index}"][data-key="price"]`);
            const noPrice = ["無料配布", "Web展示"].includes(input.value);
            if (price) {
              price.disabled = noPrice;
              if (noPrice) {
                price.value = "";
                items[index].price = "";
              }
            }
          }

          generate();
        };

        input.addEventListener("input", update);
        input.addEventListener("change", update);
      });

      container.querySelectorAll("[data-image]").forEach((input) => {
        input.addEventListener("change", () => {
          uploadItemImage(Number(input.dataset.image), input.files?.[0]);
        });
      });

      container.querySelectorAll("[data-noimage]").forEach((input) => {
        input.addEventListener("change", () => {
          const index = Number(input.dataset.noimage);
          if (!items[index]) return;
          items[index].noImage = input.checked;
          const fileInput = container.querySelector(`[data-image="${index}"]`);
          if (fileInput) {
            fileInput.disabled = input.checked;
            if (input.checked) fileInput.value = "";
          }
          generate();
        });
      });

      container.querySelectorAll("[data-move]").forEach((button) => {
        button.addEventListener("click", () => {
          const from = Number(button.dataset.move);
          const to = from + Number(button.dataset.dir);
          if (to < 0 || to >= items.length) return;
          [items[from], items[to]] = [items[to], items[from]];
          renderItems();
          generate();
        });
      });

      container.querySelectorAll("[data-remove]").forEach((button) => {
        button.addEventListener("click", () => {
          items.splice(Number(button.dataset.remove), 1);
          renderItems();
          generate();
        });
      });

      lucide.createIcons();
    }

    function addItem() {
      items.push({
        category: "新刊",
        ageRating: "全年齢",
        title: `頒布物 #${items.length + 1}`,
        price: "¥ 500",
        desc: "",
        descriptionFontSize: 38,
        imageSrc: null,
        imageWidth: 0,
        imageHeight: 0,
        noImage: false
      });
      renderItems();
      generate();
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像を読み込めませんでした。"));
        image.src = url;
      });
    }

    async function readImageFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        throw new Error("画像ファイルを選択してください。");
      }

      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`画像を読み込めませんでした: ${file.name}`));
        reader.readAsDataURL(file);
      });

      const image = await loadImage(dataUrl);
      return {
        src: dataUrl,
        width: image.naturalWidth,
        height: image.naturalHeight
      };
    }

    async function uploadItemImage(index, file) {
      if (!file || !items[index]) return;

      try {
        const image = await readImageFile(file);
        Object.assign(items[index], {
          imageSrc: image.src,
          imageWidth: image.width,
          imageHeight: image.height,
          noImage: false
        });
        renderItems();
        generate();
      } catch (error) {
        alert(error.message);
      }
    }

    async function uploadBatchImages(files) {
      const selected = Array.from(files || []);
      if (!selected.length) return;

      try {
        const loaded = await Promise.all(selected.map(readImageFile));

        loaded.forEach((image, index) => {
          const imageData = {
            imageSrc: image.src,
            imageWidth: image.width,
            imageHeight: image.height,
            noImage: false
          };

          if (index < items.length) {
            Object.assign(items[index], imageData);
          } else {
            items.push({
              category: "新刊",
              ageRating: "全年齢",
              title: `新刊アイテム ${index + 1}`,
              price: "¥ 500",
              desc: "",
              descriptionFontSize: 38,
              ...imageData
            });
          }
        });

        renderItems();
        generate();
      } catch (error) {
        alert(error.message);
      }
    }

    function makePattern(style, color) {
      const c = document.createElement("canvas");
      c.width = c.height = 240;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff8fb";
      ctx.fillRect(0, 0, 240, 240);

      if (style === "dots") {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(60, 60, 16, 0, Math.PI * 2);
        ctx.arc(180, 180, 16, 0, Math.PI * 2);
        ctx.fill();
      } else if (style === "stripes") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 120, 240);
      } else if (style === "diagonal") {
        ctx.save();
        ctx.translate(120, 120);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = color;
        for (let x = -360; x <= 360; x += 110) {
          ctx.fillRect(x, -360, 36, 720);
        }
        ctx.restore();
      } else if (style === "border") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 240, 120);
      } else if (style === "check") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 120, 120);
        ctx.fillRect(120, 120, 120, 120);
      }

      return c;
    }

    function applyBackground() {
      const type = document.getElementById("bgTypeSelect").value;
      canvas.setBackgroundImage(null);
      canvas.setBackgroundColor("#ffffff");

      if (type === "color") {
        canvas.setBackgroundColor(document.getElementById("bgColorPicker").value);
        return;
      }

      if (type === "custom" && customBackgroundImage) {
        canvas.setBackgroundImage(customBackgroundImage, null, {
          originX: "left",
          originY: "top",
          left: 0,
          top: 0,
          scaleX: CANVAS_WIDTH / customBackgroundImage.width,
          scaleY: CANVAS_HEIGHT / customBackgroundImage.height
        });
        return;
      }

      if (type === "pattern") {
        canvas.add(new fabric.Rect({
          left: 0,
          top: 0,
          width: CANVAS_WIDTH,
          height: CANVAS_HEIGHT,
          fill: new fabric.Pattern({
            source: makePattern(
              document.getElementById("patternStyleSelect").value,
              selectedPresetColor.hex
            ),
            repeat: "repeat"
          }),
          selectable: false,
          evented: false
        }));
      }
    }

    function getInfoStyle(prefix, defaultSize, defaultColor, maxSize) {
      const size = Number.parseInt(document.getElementById(`${prefix}FontSize`).value, 10);
      const enabled = document.getElementById(`${prefix}BgEnabled`).checked;

      return {
        fontSize: Number.isFinite(size) ? Math.min(Math.max(8, size), maxSize) : defaultSize,
        fill: document.getElementById(`${prefix}TextColor`).value || defaultColor,
        backgroundColor: enabled ? document.getElementById(`${prefix}BgColor`).value : ""
      };
    }

    function createFittedTextbox(text, width, maxHeight, maxFontSize, options = {}) {
      const content = String(text || "");
      const safeWidth = Math.max(1, width);
      const safeHeight = Math.max(1, maxHeight);
      const minFont = Math.max(1, options.minFontSize || 1);
      const maxFont = Math.max(minFont, maxFontSize);

      const create = (value, size) => new fabric.Textbox(value, {
        left: 0,
        top: 0,
        width: safeWidth,
        fontSize: size,
        fontFamily: options.fontFamily || "Noto Sans JP",
        fontWeight: options.fontWeight || "normal",
        fill: options.fill || "#0f172a",
        backgroundColor: options.backgroundColor || "",
        padding: options.padding || 0,
        splitByGrapheme: true,
        lineHeight: options.lineHeight || 1.05,
        selectable: false,
        evented: false
      });

      let low = minFont;
      let high = maxFont;
      let best = null;

      for (let i = 0; i < 22; i += 1) {
        const size = (low + high) / 2;
        const candidate = create(content, size);

        if (candidate.height <= safeHeight) {
          best = candidate;
          low = size;
        } else {
          high = size;
        }
      }

      if (best) return best;

      // 最小サイズでも収まらないときは、表示可能な文字数に省略
      const chars = Array.from(content);
      let left = 0;
      let right = chars.length;
      let shortened = create("", minFont);

      while (left <= right) {
        const middle = Math.floor((left + right) / 2);
        const value = middle < chars.length
          ? `${chars.slice(0, middle).join("")}…`
          : chars.join("");
        const candidate = create(value, minFont);

        if (candidate.height <= safeHeight) {
          shortened = candidate;
          left = middle + 1;
        } else {
          right = middle - 1;
        }
      }

      return shortened;
    }

    // 以前の呼び出し名との互換関数。情報欄の初期描画にも使う。
    function fittedTextbox(text, box, options = {}) {
      const textbox = createFittedTextbox(
        text,
        box.width,
        box.height,
        Number(options.fontSize) || 24,
        {
          minFontSize: Number(options.minimum) || 8,
          fontFamily: options.fontFamily || "Noto Sans JP",
          fontWeight: options.fontWeight || "normal",
          fill: options.fill || "#ffffff",
          backgroundColor: options.backgroundColor || "",
          padding: options.padding || 0,
          lineHeight: options.lineHeight || 1
        }
      );

      textbox.set({ left: box.left, top: box.top });
      return textbox;
    }

    function getCategoryStyle(category) {
      return CATEGORY_STYLES[category] || CATEGORY_STYLES["新刊"];
    }

    function createCardText(item, width, height, scale) {
      const category = getCategoryStyle(item.category);
      const parts = [];

      if (item.title) {
        parts.push({
          text: item.title,
          max: 78 * scale,
          min: Math.max(5, 8 * scale),
          ratio: .42,
          gap: 8 * scale,
          family: "Noto Sans JP",
          weight: "bold",
          fill: "#0f172a"
        });
      }

      if (!["無料配布", "Web展示"].includes(item.category) && item.price) {
        parts.push({
          text: item.price,
          max: 100 * scale,
          min: Math.max(5, 8 * scale),
          ratio: .28,
          gap: 7 * scale,
          family: "M PLUS Rounded 1c",
          weight: "bold",
          fill: category.background
        });
      }

      if (item.desc) {
        parts.push({
          text: item.desc,
          max: Math.max(8, Math.min(100, Number(item.descriptionFontSize) || 38)) * scale,
          min: Math.max(4, 7 * scale),
          ratio: .30,
          gap: 0,
          family: "Noto Sans JP",
          weight: "normal",
          fill: "#475569"
        });
      }

      if (!parts.length) return [];

      const ratioTotal = parts.reduce((sum, part) => sum + part.ratio, 0);
      return parts.map((part) => {
        const allocatedHeight = Math.max(1, height * part.ratio / ratioTotal - part.gap);
        return {
          object: createFittedTextbox(
            part.text,
            width,
            allocatedHeight,
            part.max,
            {
              minFontSize: part.min,
              fontFamily: part.family,
              fontWeight: part.weight,
              fill: part.fill,
              lineHeight: 1.05
            }
          ),
          gapAfter: part.gap
        };
      });
    }

    function drawHeader(social, headerHeight, landscape, eventStyle, circleStyle, spaceStyle, safeX, safeY) {
      const isPicsquare = currentPaperSize === "PICSQUARE";

      if (social) {
        const margin = social.marginX;
        const width = Math.max(1, CANVAS_WIDTH - margin * 2);
        const top = isPicsquare ? 5 : Math.max(6, Math.round(headerHeight * .04));
        const bottom = isPicsquare ? 5 : top;
        const usable = Math.max(1, headerHeight - top - bottom);
        const gap = isPicsquare ? 2 : Math.max(3, Math.round(usable * .025));

        // ピクスクの143pxヘッダー内に3項目を収める。
        const eventHeight = isPicsquare
          ? 29
          : Math.round(usable * .25);
        const circleHeight = isPicsquare
          ? 44
          : Math.round(usable * .34);
        const spaceHeight = Math.max(1, usable - eventHeight - circleHeight - gap * 2);

        let y = top;

        canvas.add(fittedTextbox(
          `${document.getElementById("eventDate").value} | ${document.getElementById("eventName").value}`,
          { left: margin, top: y, width, height: eventHeight },
          {
            fontSize: eventStyle.fontSize,
            minimum: 7,
            fontFamily: "Noto Sans JP",
            fill: eventStyle.fill,
            backgroundColor: eventStyle.backgroundColor,
            lineHeight: 1
          }
        ));

        y += eventHeight + gap;

        canvas.add(fittedTextbox(
          document.getElementById("circleName").value,
          { left: margin, top: y, width, height: circleHeight },
          {
            fontSize: circleStyle.fontSize,
            minimum: 8,
            fontFamily: "Noto Sans JP",
            fontWeight: "bold",
            fill: circleStyle.fill,
            backgroundColor: circleStyle.backgroundColor,
            lineHeight: 1
          }
        ));

        y += circleHeight + gap;

        const spaceNo = document.getElementById("spaceNo").value;
        if (spaceNo) {
          canvas.add(fittedTextbox(
            ` ${spaceNo} `,
            { left: margin, top: y, width, height: spaceHeight },
            {
              fontSize: spaceStyle.fontSize,
              minimum: 7,
              fontFamily: "M PLUS Rounded 1c",
              fontWeight: "bold",
              fill: spaceStyle.fill,
              backgroundColor: spaceStyle.backgroundColor,
              lineHeight: 1
            }
          ));
        }

        return;
      }

      /*
        印刷用はヘッダー情報を3行に分離。
        A2縦を含め、ヘッダーの高さ内に収まるよう各行の高さを比率で配分する。
      */
      const scale = Math.min(CANVAS_WIDTH / 3307, CANVAS_HEIGHT / 2339);
      const margin = Math.max(80, safeX + 8);
      const width = Math.max(1, CANVAS_WIDTH - margin * 2);
      const innerTop = Math.max(safeY, Math.round(headerHeight * .055));
      const innerBottom = Math.max(safeY, Math.round(headerHeight * .055));
      const available = Math.max(1, headerHeight - innerTop - innerBottom);
      const gap = Math.max(5, Math.round(available * .06));
      const rowSpace = Math.max(1, available - gap * 2);
      const eventHeight = rowSpace * .24;
      const circleHeight = rowSpace * .43;
      const spaceHeight = rowSpace - eventHeight - circleHeight;

      let y = innerTop;

      canvas.add(fittedTextbox(
        `${document.getElementById("eventDate").value} | ${document.getElementById("eventName").value}`,
        { left: margin, top: y, width, height: eventHeight },
        {
          fontSize: eventStyle.fontSize,
          minimum: 10 * scale,
          fontFamily: "Noto Sans JP",
          fill: eventStyle.fill,
          backgroundColor: eventStyle.backgroundColor,
          lineHeight: 1
        }
      ));

      y += eventHeight + gap;

      canvas.add(fittedTextbox(
        document.getElementById("circleName").value,
        { left: margin, top: y, width, height: circleHeight },
        {
          fontSize: circleStyle.fontSize,
          minimum: 12 * scale,
          fontFamily: "Noto Sans JP",
          fontWeight: "bold",
          fill: circleStyle.fill,
          backgroundColor: circleStyle.backgroundColor,
          lineHeight: 1
        }
      ));

      y += circleHeight + gap;

      const spaceNo = document.getElementById("spaceNo").value;
      if (spaceNo) {
        canvas.add(fittedTextbox(
          ` ${spaceNo} `,
          { left: margin, top: y, width, height: spaceHeight },
          {
            fontSize: spaceStyle.fontSize,
            minimum: 10 * scale,
            fontFamily: "M PLUS Rounded 1c",
            fontWeight: "bold",
            fill: spaceStyle.fill,
            backgroundColor: spaceStyle.backgroundColor,
            lineHeight: 1
          }
        ));
      }
    }

    function addFabricImage(item, box, generation, anchor) {
      if (!item.imageSrc || item.noImage) return Promise.resolve();

      return new Promise((resolve) => {
        fabric.Image.fromURL(item.imageSrc, (image) => {
          if (!image || generation !== generationId) {
            resolve();
            return;
          }

          const scale = Math.min(box.width / image.width, box.height / image.height);
          image.set({
            left: box.left + (box.width - image.width * scale) / 2,
            top: box.top + (box.height - image.height * scale) / 2,
            scaleX: scale,
            scaleY: scale,
            shadow: new fabric.Shadow({
              color: "rgba(15,23,42,.35)",
              blur: 18,
              offsetX: 0,
              offsetY: 7
            }),
            selectable: false,
            evented: false
          });

          const index = anchor ? canvas.getObjects().indexOf(anchor) : -1;
          if (index >= 0) canvas.insertAt(image, index, false);
          else canvas.add(image);

          canvas.requestRenderAll();
          resolve();
        });
      });
    }

    function generate() {
      if (!canvas) return;

      const generation = ++generationId;
      imageLoadPromises = [];
      canvas.clear();
      applyBackground();

      const social = SOCIAL_LAYOUTS[currentPaperSize] || null;
      const isSocial = Boolean(social);
      const landscape = currentOrientation === "LANDSCAPE";

      let safeX = 0;
      let safeY = 0;

      if (!isSocial) {
        const mm = PAPER_MM[currentPaperSize];
        const trimWidthMm = landscape ? mm.height : mm.width;
        const trimHeightMm = landscape ? mm.width : mm.height;
        safeX = Math.ceil(BLEED_MM * CANVAS_WIDTH / trimWidthMm);
        safeY = Math.ceil(BLEED_MM * CANVAS_HEIGHT / trimHeightMm);
      }

      const headerHeight = social
        ? social.header
        : (landscape ? 360 : 420);

      const headerBg = document.getElementById("headerBgColor").value || "#3b0a1e";
      const accent = document.getElementById("headerAccentColor").value || selectedPresetColor.main;

      canvas.add(new fabric.Rect({
        left: 0,
        top: 0,
        width: CANVAS_WIDTH,
        height: headerHeight,
        fill: headerBg,
        selectable: false,
        evented: false
      }));

      const accentHeight = social ? Math.max(3, Math.round(headerHeight * .025)) : 12;
      canvas.add(new fabric.Rect({
        left: 0,
        top: headerHeight - accentHeight,
        width: CANVAS_WIDTH,
        height: accentHeight,
        fill: accent,
        selectable: false,
        evented: false
      }));

      const eventDefault = social ? social.eventFont : (landscape ? 48 : 46);
      const circleDefault = social ? social.circleFont : (landscape ? 120 : 110);
      const spaceDefault = social ? social.spaceFont : (landscape ? 75 : 65);

      const eventStyle = getInfoStyle("eventInfo", eventDefault, "#ffe4e6", social ? social.eventFont : 200);
      const circleStyle = getInfoStyle("circleInfo", circleDefault, "#fff1f2", social ? social.circleFont : 300);
      const spaceStyle = getInfoStyle("spaceInfo", spaceDefault, "#ffffff", social ? social.spaceFont : 200);

      drawHeader(
        social,
        headerHeight,
        landscape,
        eventStyle,
        circleStyle,
        spaceStyle,
        safeX,
        safeY
      );

      let columns = 2;
      if (currentPaperSize === "WEB_LANDSCAPE") {
        columns = items.length <= 1 ? 1 : 2;
      } else if (isSocial) {
        columns = items.length <= 3 ? 1 : 2;
      } else if (landscape) {
        columns = items.length <= 1 ? 1 : (items.length > 4 ? 3 : 2);
      } else if (items.length <= 3) {
        columns = 1;
      }

      const marginX = social ? social.marginX : Math.max(70, safeX + 8);
      const marginY = social ? social.marginY : Math.max(40, safeY + 8);
      const gapX = social ? social.gapX : 40;
      const gapY = social ? social.gapY : 40;
      const padding = social ? social.padding : 25;
      const startY = headerHeight + (social ? 10 : 50);
      const rows = Math.ceil(items.length / columns);

      const cardWidth =
        (CANVAS_WIDTH - marginX * 2 - gapX * (columns - 1)) / columns;
      const cardHeight = Math.max(
        1,
        (CANVAS_HEIGHT - startY - marginY - gapY * (rows - 1)) / rows
      );

      items.forEach((item, index) => {
        const row = Math.floor(index / columns);
        const column = index % columns;
        const x = marginX + column * (cardWidth + gapX);
        const y = startY + row * (cardHeight + gapY);
        const radius = social ? 12 : 24;
        const hasImage = Boolean(item.imageSrc) && !item.noImage;

        canvas.add(new fabric.Rect({
          left: x,
          top: y,
          width: cardWidth,
          height: cardHeight,
          fill: "#ffffff",
          stroke: "transparent",
          strokeWidth: 0,
          rx: radius,
          ry: radius,
          selectable: false,
          evented: false
        }));

        const style = getCategoryStyle(item.category);
        const isR18 = item.ageRating === "R18";
        const categoryHeight = Math.min(
          social ? social.categoryBand : 100,
          cardHeight * .14
        );
        const ageHeight = Math.min(
          social ? social.ageBand : 64,
          cardHeight * .09
        );

        const categoryPath = [
          `M 0 ${radius}`,
          `Q 0 0 ${radius} 0`,
          `L ${cardWidth - radius} 0`,
          `Q ${cardWidth} 0 ${cardWidth} ${radius}`,
          `L ${cardWidth} ${categoryHeight}`,
          `L 0 ${categoryHeight}`,
          "Z"
        ].join(" ");

        canvas.add(new fabric.Path(categoryPath, {
          left: x,
          top: y,
          fill: style.background,
          selectable: false,
          evented: false
        }));

        const categoryLabel = createFittedTextbox(
          item.category || "新刊",
          cardWidth - padding * 2,
          categoryHeight - 4,
          categoryHeight * .72,
          {
            minFontSize: 1,
            fontFamily: "M PLUS Rounded 1c",
            fontWeight: "bold",
            fill: style.text,
            lineHeight: 1
          }
        );
        categoryLabel.set({ left: x + padding, top: y + 2 });
        canvas.add(categoryLabel);

        const ageTop = y + categoryHeight;
        canvas.add(new fabric.Rect({
          left: x,
          top: ageTop,
          width: cardWidth,
          height: ageHeight,
          fill: isR18 ? "#991b1b" : "#dcfce7",
          selectable: false,
          evented: false
        }));

        const ageLabel = createFittedTextbox(
          isR18 ? "R18" : "全年齢",
          cardWidth - padding * 2,
          ageHeight - 2,
          ageHeight * .72,
          {
            minFontSize: 1,
            fontFamily: "M PLUS Rounded 1c",
            fontWeight: "bold",
            fill: isR18 ? "#ffffff" : "#166534",
            lineHeight: 1
          }
        );
        ageLabel.set({ left: x + padding, top: ageTop + 1 });
        canvas.add(ageLabel);

        const bodyTop = y + categoryHeight + ageHeight + padding;
        const bodyHeight = Math.max(
          1,
          cardHeight - categoryHeight - ageHeight - padding * 2
        );

        let imageBox = null;
        let textX;
        let textWidth;

        if (hasImage) {
          const imageWidth = item.imageWidth || 1;
          const imageHeight = item.imageHeight || 1;
          const maxImageWidth = cardWidth * (landscape ? .38 : .36);
          const imageScale = Math.min(maxImageWidth / imageWidth, bodyHeight / imageHeight);
          const displayWidth = imageWidth * imageScale;
          const displayHeight = imageHeight * imageScale;
          const imageGap = social ? 10 : 25;

          imageBox = {
            left: x + padding,
            top: bodyTop + (bodyHeight - displayHeight) / 2,
            width: displayWidth,
            height: displayHeight
          };

          textX = imageBox.left + displayWidth + imageGap;
          textWidth = Math.max(1, x + cardWidth - padding - textX);
        } else {
          textX = x + padding;
          textWidth = Math.max(1, cardWidth - padding * 2);
        }

        const textEntries = createCardText(
          item,
          textWidth,
          bodyHeight,
          social ? social.cardScale : 1
        );

        let textY = bodyTop;
        let firstText = null;

        textEntries.forEach((entry, entryIndex) => {
          entry.object.set({ left: textX, top: textY });
          if (entryIndex === 0) firstText = entry.object;
          canvas.add(entry.object);
          textY += entry.object.getScaledHeight() + entry.gapAfter;
        });

        if (imageBox) {
          imageLoadPromises.push(addFabricImage(item, imageBox, generation, firstText));
        }

        canvas.add(new fabric.Rect({
          left: x,
          top: y,
          width: cardWidth,
          height: cardHeight,
          fill: "rgba(255,255,255,0)",
          stroke: "#cbd5e1",
          strokeWidth: social ? 2 : 4,
          rx: radius,
          ry: radius,
          selectable: false,
          evented: false
        }));
      });

      canvas.renderAll();
    }

    function fitCanvasToWorkspace() {
      const workspace = document.getElementById("workspace");
      const availableWidth = Math.max(1, workspace.clientWidth - 50);
      const availableHeight = Math.max(1, workspace.clientHeight - 75);
      applyPreviewScale(Math.min(
        availableWidth / CANVAS_WIDTH,
        availableHeight / CANVAS_HEIGHT
      ));
    }

    function applyPreviewScale(scale) {
      const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      const container = document.getElementById("canvasContainer");
      const stage = document.getElementById("canvasStage");

      stage.style.width = `${CANVAS_WIDTH}px`;
      stage.style.height = `${CANVAS_HEIGHT}px`;
      stage.style.transform = `scale(${safeScale})`;
      container.style.width = `${CANVAS_WIDTH * safeScale}px`;
      container.style.height = `${CANVAS_HEIGHT * safeScale}px`;

      canvas.calcOffset();
      canvas.requestRenderAll();

      document.getElementById("zoomDisplay").textContent =
        `表示 ${Math.round(safeScale * 100)}%`;
      document.getElementById("zoomSlider").value =
        String(Math.max(1, Math.min(200, Math.round(safeScale * 100))));
    }

    function setupScaler() {
      const workspace = document.getElementById("workspace");
      resizeCanvasToFit = () => {
        if (previewZoomMode === "fit") fitCanvasToWorkspace();
        else applyPreviewScale(Number(document.getElementById("zoomSlider").value) / 100);
      };

      if ("ResizeObserver" in window) {
        new ResizeObserver(() => {
          if (previewZoomMode === "fit") fitCanvasToWorkspace();
        }).observe(workspace);
      }

      window.addEventListener("resize", () => {
        if (previewZoomMode === "fit") fitCanvasToWorkspace();
      });
    }

    async function createBleedExport() {
      while (true) {
        const startGeneration = generationId;
        await Promise.all(imageLoadPromises.slice());
        if (startGeneration === generationId) break;
      }

      canvas.renderAll();

      const social = SOCIAL_PRESETS[currentPaperSize];
      if (social) {
        return {
          dataUrl: canvas.toDataURL({ format: "png", multiplier: 1 }),
          widthPx: social.width,
          heightPx: social.height,
          widthMm: social.width * 25.4 / 200,
          heightMm: social.height * 25.4 / 200,
          hasBleed: false
        };
      }

      const spec = PRINT_EXPORT_SPECS[currentPaperSize];
      if (!spec) throw new Error(`未対応の出力サイズです: ${currentPaperSize}`);

      const landscape = currentOrientation === "LANDSCAPE";
      const outputWidthPx = landscape ? spec.heightPx : spec.widthPx;
      const outputHeightPx = landscape ? spec.widthPx : spec.heightPx;
      const outputWidthMm = landscape ? spec.heightMm : spec.widthMm;
      const outputHeightMm = landscape ? spec.widthMm : spec.heightMm;
      const trimWidthMm = landscape ? spec.trimHeightMm : spec.trimWidthMm;
      const trimHeightMm = landscape ? spec.trimWidthMm : spec.trimHeightMm;

      // 出力寸法と仕上がり寸法のmm比から、仕上がりピクセル数を求める。
      const trimWidthPx = Math.round(trimWidthMm * outputWidthPx / outputWidthMm);
      const trimHeightPx = Math.round(trimHeightMm * outputHeightPx / outputHeightMm);
      const horizontalBleed = outputWidthPx - trimWidthPx;
      const verticalBleed = outputHeightPx - trimHeightPx;

      const left = Math.floor(horizontalBleed / 2);
      const right = horizontalBleed - left;
      const top = Math.floor(verticalBleed / 2);
      const bottom = verticalBleed - top;

      const sourceImage = await loadImage(
        canvas.toDataURL({ format: "png", multiplier: 1 })
      );

      const trimCanvas = document.createElement("canvas");
      trimCanvas.width = trimWidthPx;
      trimCanvas.height = trimHeightPx;

      const trimContext = trimCanvas.getContext("2d");
      if (!trimContext) throw new Error("仕上がり画像を作成できませんでした。");

      // デザイン全体を仕上がり寸法に合わせる
      trimContext.drawImage(
        sourceImage,
        0,
        0,
        sourceImage.naturalWidth,
        sourceImage.naturalHeight,
        0,
        0,
        trimWidthPx,
        trimHeightPx
      );

      const outputCanvas = document.createElement("canvas");
      outputCanvas.width = outputWidthPx;
      outputCanvas.height = outputHeightPx;

      const context = outputCanvas.getContext("2d");
      if (!context) throw new Error("塗り足し画像を作成できませんでした。");

      /*
        仕上がり端の絵柄を外側へ伸ばし、塗り足し域を白く残さない。
        各辺の端1ピクセルを塗り足し幅まで引き伸ばします。
      */
      if (top > 0) {
        context.drawImage(trimCanvas, 0, 0, trimWidthPx, 1, left, 0, trimWidthPx, top);
      }
      if (bottom > 0) {
        context.drawImage(
          trimCanvas, 0, trimHeightPx - 1, trimWidthPx, 1,
          left, top + trimHeightPx, trimWidthPx, bottom
        );
      }
      if (left > 0) {
        context.drawImage(trimCanvas, 0, 0, 1, trimHeightPx, 0, top, left, trimHeightPx);
      }
      if (right > 0) {
        context.drawImage(
          trimCanvas, trimWidthPx - 1, 0, 1, trimHeightPx,
          left + trimWidthPx, top, right, trimHeightPx
        );
      }

      // 角も端の絵柄を延長して埋める
      if (left && top) {
        context.drawImage(trimCanvas, 0, 0, 1, 1, 0, 0, left, top);
      }
      if (right && top) {
        context.drawImage(
          trimCanvas, trimWidthPx - 1, 0, 1, 1,
          left + trimWidthPx, 0, right, top
        );
      }
      if (left && bottom) {
        context.drawImage(
          trimCanvas, 0, trimHeightPx - 1, 1, 1,
          0, top + trimHeightPx, left, bottom
        );
      }
      if (right && bottom) {
        context.drawImage(
          trimCanvas, trimWidthPx - 1, trimHeightPx - 1, 1, 1,
          left + trimWidthPx, top + trimHeightPx, right, bottom
        );
      }

      // 仕上がり画像を塗り足しの中央に配置
      context.drawImage(trimCanvas, left, top);

      return {
        dataUrl: outputCanvas.toDataURL("image/png"),
        widthPx: outputWidthPx,
        heightPx: outputHeightPx,
        widthMm: outputWidthMm,
        heightMm: outputHeightMm,
        hasBleed: true
      };
    }

    function setupDraggableToolbar() {
      const toolbar = document.getElementById("previewToolbar");
      const handle = document.getElementById("previewToolbarDrag");
      const workspace = document.getElementById("workspace");
      let drag = null;

      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();

        const toolbarRect = toolbar.getBoundingClientRect();
        const workspaceRect = workspace.getBoundingClientRect();

        toolbar.style.left = `${toolbarRect.left - workspaceRect.left}px`;
        toolbar.style.top = `${toolbarRect.top - workspaceRect.top}px`;
        toolbar.style.right = "auto";
        toolbar.style.bottom = "auto";

        drag = {
          id: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          left: toolbarRect.left - workspaceRect.left,
          top: toolbarRect.top - workspaceRect.top
        };

        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;

        const rect = workspace.getBoundingClientRect();
        const left = Math.max(0, Math.min(
          rect.width - toolbar.offsetWidth,
          drag.left + event.clientX - drag.startX
        ));
        const top = Math.max(0, Math.min(
          rect.height - toolbar.offsetHeight,
          drag.top + event.clientY - drag.startY
        ));

        toolbar.style.left = `${left}px`;
        toolbar.style.top = `${top}px`;
      });

      const end = (event) => {
        if (drag && drag.id === event.pointerId) drag = null;
      };

      handle.addEventListener("pointerup", end);
      handle.addEventListener("pointercancel", end);
    }

    async function openPrintPreview() {
      const popup = window.open("", "_blank");
      if (!popup) {
        alert("プレビューを開けません。ポップアップを許可してください。");
        return;
      }

      try {
        const output = await createBleedExport();
        const title = output.hasBleed ? "塗り足し各3mm" : "Webサイズ";

        popup.document.open();
        popup.document.write(`<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>印刷プレビュー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:sans-serif}
body{background:#1e293b;color:#f8fafc}
.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#0f172a}
.toolbar button{border:0;border-radius:6px;padding:8px 12px;color:#fff;background:#334155;cursor:pointer}
.toolbar .print{background:#e11d48}
.preview{height:calc(100vh - 60px);overflow:auto;padding:24px}
.sheet{width:${output.widthPx}px;height:${output.heightPx}px;margin:0 auto;background:#fff;box-shadow:0 8px 30px #0006}
.sheet img{display:block;width:100%;height:100%}
body.fit .sheet{width:auto;height:auto;max-width:100%}
body.fit .sheet img{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
@page{size:${output.widthMm}mm ${output.heightMm}mm;margin:0}
@media print{
html,body{width:${output.widthMm}mm;height:${output.heightMm}mm;margin:0;padding:0;overflow:hidden;background:#fff}
.toolbar{display:none!important}
.preview{width:${output.widthMm}mm;height:${output.heightMm}mm;overflow:hidden;padding:0}
.sheet{width:${output.widthMm}mm!important;height:${output.heightMm}mm!important;margin:0!important;box-shadow:none}
.sheet img{width:${output.widthMm}mm!important;height:${output.heightMm}mm!important}
}
</style>
</head>
<body>
<div class="toolbar">
<strong>プレビュー（${title}）</strong>
<button id="actual">100%表示</button>
<button id="fit">画面に合わせる</button>
<button id="print" class="print">印刷</button>
<span>${output.widthPx} × ${output.heightPx}px</span>
</div>
<main class="preview"><div class="sheet"><img src="${output.dataUrl}" alt="出力プレビュー"></div></main>
<script>
document.getElementById("actual").onclick=()=>document.body.classList.remove("fit");
document.getElementById("fit").onclick=()=>document.body.classList.add("fit");
document.getElementById("print").onclick=()=>window.print();
<\/script>
</body>
</html>`);
        popup.document.close();
      } catch (error) {
        popup.close();
        alert(`プレビューを作成できませんでした: ${error.message}`);
      }
    }

    function setupEvents() {
      document.getElementById("paperSizeSelect")
        .addEventListener("change", updateDimensions);
      document.getElementById("orientationSelect")
        .addEventListener("change", updateDimensions);

      ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
        document.getElementById(id).addEventListener("input", generate);
      });

      [
        "headerBgColor", "headerAccentColor",
        "eventInfoFontSize", "eventInfoTextColor", "eventInfoBgEnabled", "eventInfoBgColor",
        "circleInfoFontSize", "circleInfoTextColor", "circleInfoBgEnabled", "circleInfoBgColor",
        "spaceInfoFontSize", "spaceInfoTextColor", "spaceInfoBgEnabled", "spaceInfoBgColor"
      ].forEach((id) => {
        const input = document.getElementById(id);
        input.addEventListener("input", generate);
        input.addEventListener("change", generate);
      });

      document.getElementById("bgTypeSelect").addEventListener("change", (event) => {
        const type = event.target.value;
        document.getElementById("patternControls").classList.toggle("hidden", type !== "pattern");
        document.getElementById("customBgControls").classList.toggle("hidden", type !== "custom");
        document.getElementById("singleColorControls").classList.toggle("hidden", type !== "color");
        generate();
      });

      document.getElementById("patternStyleSelect").addEventListener("change", generate);
      document.getElementById("bgColorPicker").addEventListener("input", generate);

      document.getElementById("customBgInput").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        try {
          const loaded = await readImageFile(file);
          customBackgroundImage = await new Promise((resolve, reject) => {
            fabric.Image.fromURL(loaded.src, (image) => {
              if (image) resolve(image);
              else reject(new Error("背景画像を開けませんでした。"));
            });
          });
          generate();
        } catch (error) {
          alert(error.message);
        }
      });

      document.getElementById("batchImageInput").addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        event.target.value = "";
        await uploadBatchImages(files);
      });

      document.getElementById("addItemBtn").addEventListener("click", addItem);

      document.getElementById("toggleGrid").addEventListener("change", (event) => {
        document.getElementById("gridOverlay").classList.toggle("hidden", !event.target.checked);
      });

      document.getElementById("fitCanvasBtn").addEventListener("click", () => {
        previewZoomMode = "fit";
        fitCanvasToWorkspace();
      });

      document.getElementById("zoomSlider").addEventListener("input", (event) => {
        previewZoomMode = "manual";
        applyPreviewScale(Number(event.target.value) / 100);
      });

      setupDraggableToolbar();

      document.getElementById("printPreviewBtn")
        .addEventListener("click", openPrintPreview);

      document.getElementById("exportPng").addEventListener("click", async () => {
        try {
          const output = await createBleedExport();
          const suffix = output.hasBleed ? "_bleed3mm" : "";
          const link = document.createElement("a");
          link.download =
            `oshinagaki_${currentPaperSize}_${currentOrientation}${suffix}_${output.widthPx}x${output.heightPx}.png`;
          link.href = output.dataUrl;
          link.click();
        } catch (error) {
          alert(`PNGを書き出せませんでした: ${error.message}`);
        }
      });

      document.getElementById("exportPdf").addEventListener("click", async () => {
        try {
          const output = await createBleedExport();
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: output.widthMm >= output.heightMm ? "landscape" : "portrait",
            unit: "mm",
            format: [output.widthMm, output.heightMm]
          });

          pdf.addImage(output.dataUrl, "PNG", 0, 0, output.widthMm, output.heightMm);

          const suffix = output.hasBleed ? "_bleed3mm" : "";
          pdf.save(`oshinagaki_${currentPaperSize}_${currentOrientation}${suffix}.pdf`);
        } catch (error) {
          alert(`PDFを書き出せませんでした: ${error.message}`);
        }
      });
    }

    function applyPreviewScale(scale) {
      const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      const container = document.getElementById("canvasContainer");
      const stage = document.getElementById("canvasStage");

      stage.style.width = `${CANVAS_WIDTH}px`;
      stage.style.height = `${CANVAS_HEIGHT}px`;
      stage.style.transform = `scale(${safeScale})`;
      container.style.width = `${CANVAS_WIDTH * safeScale}px`;
      container.style.height = `${CANVAS_HEIGHT * safeScale}px`;

      canvas.calcOffset();
      canvas.requestRenderAll();

      document.getElementById("zoomDisplay").textContent =
        `表示 ${Math.round(safeScale * 100)}%`;
      document.getElementById("zoomSlider").value =
        String(Math.max(1, Math.min(200, Math.round(safeScale * 100))));
    }
  </script>
</body>
