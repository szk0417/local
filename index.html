<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>おしながきメーカー</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#f3f4f6;
 font-family:sans-serif;
}

.toolbar{
 padding:12px;
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 background:#fff;
 border-bottom:1px solid #ddd;
 position:sticky;
 top:0;
 z-index:100;
}

button,
select,
label{
 padding:8px 12px;
 cursor:pointer;
}

label{
 border:1px solid #ddd;
 background:#fff;
}

input[type=file]{
 display:none;
}

.editor{
 padding:20px;
 display:flex;
 justify-content:center;
}

.canvas-wrapper{
 width:min(95vw,900px);
 background:white;
 box-shadow:0 0 10px rgba(0,0,0,.1);
}

canvas{
 width:100% !important;
 height:auto !important;
}

</style>
</head>
<body>

<div class="toolbar">

<button onclick="addText()">
テキスト追加
</button>

<label>
画像追加
<input
 type="file"
 accept="image/*"
 onchange="uploadImage(event)">
</label>

<label>
背景画像
<input
 type="file"
 accept="image/*"
 onchange="uploadBackground(event)">
</label>

<select id="fontSelect">

<option value="Noto Sans JP">
Noto Sans JP
</option>

<option value="Zen Maru Gothic">
Zen Maru Gothic
</option>

<option value="M PLUS Rounded 1c">
M PLUS Rounded
</option>

</select>

<button onclick="changeFont()">
フォント変更
</button>

<button onclick="alignLeft()">
左揃え
</button>

<button onclick="alignCenter()">
中央揃え
</button>

<button onclick="exportPNG()">
PNG
</button>

<button onclick="exportPDF()">
PDF
</button>

</div>

<div class="editor">

<div class="canvas-wrapper">

<canvas id="canvas"></canvas>

</div>

</div>

<script>

const A3_WIDTH = 3508;
const A3_HEIGHT = 4961;

const canvas = new fabric.Canvas(
 "canvas",
 {
   preserveObjectStacking:true,
   selection:true
 }
);

canvas.setWidth(A3_WIDTH);
canvas.setHeight(A3_HEIGHT);

function addText(){

 const text = new fabric.IText(
   "新刊タイトル",
   {
      left:300,
      top:300,
      fontSize:72,
      fontFamily:"Noto Sans JP",
      fill:"#000000"
   }
 );

 canvas.add(text);

 canvas.setActiveObject(text);

 canvas.renderAll();

}



function uploadImage(event){

 const file = event.target.files[0];

 if(!file) return;

 const reader = new FileReader();

 reader.onload = function(e){

   fabric.Image.fromURL(
     e.target.result,

     function(img){

       img.set({
         left:500,
         top:500
       });

       img.scaleToWidth(800);

       canvas.add(img);

       canvas.setActiveObject(img);

       canvas.renderAll();

     }

   );

 };

 reader.readAsDataURL(file);

}



function uploadBackground(event){

 const file = event.target.files[0];

 if(!file) return;

 const reader = new FileReader();

 reader.onload = function(e){

   fabric.Image.fromURL(
     e.target.result,

     function(img){

       const scaleX =
          canvas.width / img.width;

       const scaleY =
          canvas.height / img.height;

       canvas.setBackgroundImage(
         img,
         canvas.renderAll.bind(canvas),
         {
            scaleX,
            scaleY
         }
       );

     }

   );

 };

 reader.readAsDataURL(file);

}



function changeFont(){

 const font =
  document.getElementById(
   "fontSelect"
  ).value;

 const obj =
  canvas.getActiveObject();

 if(
   obj &&
   obj.type === "i-text"
 ){

    obj.set(
      "fontFamily",
      font
    );

    canvas.renderAll();

 }

}



function alignLeft(){

 const objs =
  canvas.getActiveObjects();

 if(objs.length===0)
   return;

 const left =
  Math.min(
    ...objs.map(
      o => o.left
    )
  );

 objs.forEach(obj=>{

   obj.set("left",left);

 });

 canvas.renderAll();

}



function alignCenter(){

 const objs =
  canvas.getActiveObjects();

 if(objs.length===0)
   return;

 objs.forEach(obj=>{

    obj.set(
      "left",
      (canvas.width/2)
      -
      obj.getScaledWidth()/2
    );

 });

 canvas.renderAll();

}



document.addEventListener(
 "keydown",
 e=>{

  if(
    e.key==="Delete" ||
    e.key==="Backspace"
  ){

    const active =
     canvas.getActiveObjects();

    active.forEach(obj=>{

       canvas.remove(obj);

    });

    canvas.discardActiveObject();

    canvas.renderAll();
  }

 }
);



function exportPNG(){

 const data =
  canvas.toDataURL({
      format:"png",
      multiplier:1
  });

 const link =
  document.createElement("a");

 link.href=data;

 link.download=
  "oshinagaki.png";

 link.click();

}



async function exportPDF(){

 const data =
  canvas.toDataURL({
     format:"png",
     multiplier:1
  });

 const pdf =
   new jspdf.jsPDF(
      "portrait",
      "mm",
      "a3"
   );

 pdf.addImage(
    data,
    "PNG",
    0,
    0,
    297,
    420
 );

 pdf.save(
   "oshinagaki.pdf"
 );

}

</script>

</body>
</html>
