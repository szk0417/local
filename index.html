<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同人おしながきジェネレーター</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .form-control {
      width: 100%;
      margin-top: .25rem;
      border: 1px solid #334155;
      border-radius: .5rem;
      background: #1e293b;
      padding: .4rem .55rem;
      color: #e2e8f0;
      font-size: .75rem;
    }

    #canvasContainer {
      position: relative;
      flex: none;
      overflow: hidden;
      line-height: 0;
    }

    #canvasStage {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
    }

    #oshinagakiCanvas {
      display: block;
    }

    #previewToolbar {
      top: 12px;
      right: 12px;
    }

    #previewToolbarDrag {
      touch-action: none;
      cursor: grab;
    }

    #previewToolbarDrag:active {
      cursor: grabbing;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, .24) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .24) 1px, transparent 1px),
        linear-gradient(to right, rgba(15, 23, 42, .12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .12) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    }

    /*
      スマートフォンでは設定パネルの後にプレビューを配置し、
      mainLayout全体を縦にスクロールさせる。
    */
    @media (max-width: 767px) {
      body {
        overflow: hidden;
      }

      #mainLayout {
        display: block;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      #settingsPanel {
        width: 100%;
        max-height: none;
        overflow: visible;
      }

      #settingsContent {
        flex: none;
        overflow: visible;
      }

      #workspace {
        width: 100%;
        height: 75vh;
        min-height: 480px;
      }

      #previewToolbar {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }
  </style>
</head>

<body class="h-full flex flex-col bg-slate-900 text-slate-100 font-sans">

  <header class="bg-slate-800 border-b border-slate-700 px-3 sm:px-4 py-3 flex items-center justify-between gap-2 shrink-0">
    <div class="flex items-center gap-2 min-w-0">
      <div class="bg-gradient-to-r from-rose-500 to-purple-600 p-2 rounded-lg shadow shrink-0">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-sm sm:text-base font-bold leading-tight">同人おしながきジェネレーター</h1>
        <p id="paperSpecLabel" class="text-[10px] sm:text-[11px] text-slate-400 truncate"></p>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button id="printPreviewBtn" type="button"
        class="bg-slate-600 hover:bg-slate-500 text-white text-xs font-bold px-2.5 sm:px-3 py-2 rounded-lg flex items-center gap-1.5">
        <i data-lucide="printer" class="w-4 h-4"></i>
        <span class="hidden sm:inline">印刷プレビュー</span>
        <span class="sm:hidden">印刷</span>
      </button>
      <button id="exportPng" type="button"
        class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 sm:px-3 py-2 rounded-lg flex items-center gap-1.5">
        <i data-lucide="image" class="w-4 h-4"></i>
        <span class="hidden sm:inline">PNG保存</span>
        <span class="sm:hidden">PNG</span>
      </button>
      <button id="exportPdf" type="button"
        class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-2.5 sm:px-3 py-2 rounded-lg flex items-center gap-1.5">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        <span class="hidden sm:inline">PDF保存</span>
        <span class="sm:hidden">PDF</span>
      </button>
    </div>
  </header>

  <div id="mainLayout" class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">

    <aside id="settingsPanel"
      class="w-full md:w-[400px] lg:w-[440px] bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 overflow-hidden max-h-[48vh] md:max-h-none">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/80 shrink-0">
        <h2 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="sliders" class="w-4 h-4 text-rose-400"></i>
          デザイン・情報設定
        </h2>
        <span class="text-[10px] text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded-full">
          リアルタイム反映
        </span>
      </div>

      <div id="settingsContent" class="flex-1 overflow-y-auto p-4 space-y-4">

        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">レイアウト・用紙設定</h3>

          <div class="grid grid-cols-2 gap-2">
            <label class="text-[11px] text-slate-400">
              用紙向き
              <select id="orientationSelect" class="form-control">
                <option value="LANDSCAPE">横向き</option>
                <option value="PORTRAIT">縦向き</option>
              </select>
            </label>
            <label class="text-[11px] text-slate-400">
              レイアウト
              <select id="paperSizeSelect" class="form-control">
                <option value="A2">A2 (200dpi)</option>
                <option value="A3" selected>A3 (200dpi)</option>
                <option value="A4">A4 (200dpi)</option>
                <option value="WEB_PORTRAIT">X用縦書き (960 × 1280px)</option>
                <option value="WEB_LANDSCAPE">X用横書き (1200 × 675px)</option>
                <option value="PICSQUARE">ピクスク用 (500 × 1,000px)</option>
                <option value="PICREA">ピクリエ用 (800 × 1,600px)</option>
              </select>
            </label>
          </div>
          <p id="layoutHelp" class="text-[10px] text-slate-500"></p>
        </section>

        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">背景デザイン</h3>

          <label class="block text-[11px] text-slate-400">
            背景の種類
            <select id="bgTypeSelect" class="form-control">
              <option value="pattern">規定パターン</option>
              <option value="custom">背景画像をアップロード</option>
              <option value="color">単色カラー</option>
            </select>
          </label>

          <div id="patternControls" class="space-y-3">
            <label class="block text-[11px] text-slate-400">
              パターン
              <select id="patternStyleSelect" class="form-control">
                <option value="dots">ドット</option>
                <option value="stripes">ストライプ</option>
                <option value="diagonal">斜めストライプ</option>
                <option value="border">ボーダー</option>
                <option value="check">チェック</option>
              </select>
            </label>
            <div>
              <span class="block text-[11px] text-slate-400 mb-1.5">規定カラー</span>
              <div id="presetColorPalette" class="grid grid-cols-4 gap-1.5"></div>
            </div>
          </div>

          <div id="customBgControls" class="hidden">
            <label class="block text-[11px] text-slate-400">
              背景画像
              <input id="customBgInput" type="file" accept="image/*"
                class="mt-1 w-full text-xs text-slate-400">
            </label>
          </div>

          <div id="singleColorControls" class="hidden">
            <label class="flex items-center justify-between text-[11px] text-slate-400">
              背景色
              <input id="bgColorPicker" type="color" value="#f8fafc"
                class="w-12 h-8 bg-slate-800 border border-slate-700 rounded p-1">
            </label>
          </div>
        </section>

        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">イベント・サークル情報</h3>
          <label class="block text-[11px] text-slate-400">
            イベント日時
            <input id="eventDate" type="text" value="2026年12月30日(水)" class="form-control">
          </label>
          <label class="block text-[11px] text-slate-400">
            イベント名
            <input id="eventName" type="text" value="コミックマーケット109" class="form-control">
          </label>
          <div class="grid grid-cols-2 gap-2">
            <label class="block text-[11px] text-slate-400">
              サークル名
              <input id="circleName" type="text" value="暁の稜線" class="form-control">
            </label>
            <label class="block text-[11px] text-slate-400">
              スペース番号
              <input id="spaceNo" type="text" value="東7ホール あ-01a" class="form-control">
            </label>
          </div>
        </section>

        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">ヘッダー色</h3>
          <div class="grid grid-cols-2 gap-2">
            <label class="text-[10px] text-slate-400">
              背景色
              <input id="headerBgColor" type="color" value="#3b0a1e"
                class="mt-1 h-9 w-full rounded border border-slate-700 bg-slate-800 p-1">
            </label>
            <label class="text-[10px] text-slate-400">
              アクセント色
              <input id="headerAccentColor" type="color" value="#fb7185"
                class="mt-1 h-9 w-full rounded border border-slate-700 bg-slate-800 p-1">
            </label>
          </div>
        </section>

        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">情報ボックスの文字・背景設定</h3>

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">日時・イベント名</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">文字サイズ
                <input id="eventInfoFontSize" type="number" min="8" max="200" value="48" class="form-control">
              </label>
              <label class="text-[10px] text-slate-400">文字色
                <input id="eventInfoTextColor" type="color" value="#ffe4e6" class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="eventInfoBgEnabled" type="checkbox" class="accent-rose-500">
                <input id="eventInfoBgColor" type="color" value="#334155" class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>

          <hr class="border-slate-700">

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">サークル名</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">文字サイズ
                <input id="circleInfoFontSize" type="number" min="8" max="300" value="120" class="form-control">
              </label>
              <label class="text-[10px] text-slate-400">文字色
                <input id="circleInfoTextColor" type="color" value="#fff1f2" class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="circleInfoBgEnabled" type="checkbox" class="accent-rose-500">
                <input id="circleInfoBgColor" type="color" value="#334155" class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>

          <hr class="border-slate-700">

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">スペース番号</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">文字サイズ
                <input id="spaceInfoFontSize" type="number" min="8" max="200" value="75" class="form-control">
              </label>
              <label class="text-[10px] text-slate-400">文字色
                <input id="spaceInfoTextColor" type="color" value="#ffffff" class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="spaceInfoBgEnabled" type="checkbox" checked class="accent-rose-500">
                <input id="spaceInfoBgColor" type="color" value="#e11d48" class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>
        </section>

        <section class="space-y-2.5 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">頒布物画像</h3>
          <label class="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-rose-500/50 hover:border-rose-400 rounded-xl cursor-pointer bg-slate-800/40 p-2">
            <i data-lucide="upload-cloud" class="w-6 h-6 text-rose-400 mb-1"></i>
            <span class="text-xs text-slate-200 font-bold">画像をまとめて選択（複数可）</span>
            <span class="text-[10px] text-slate-400">選択順に頒布物へ割り当て</span>
            <input type="file" id="batchImageInput" accept="image/*" multiple class="hidden">
          </label>

          <label class="block text-[11px] text-slate-400 mt-3">
            説明文のフォントサイズ
            <input id="descriptionFontSize" type="number" min="8" max="100" value="38" class="form-control">
          </label>
        </section>

        <section>
          <div class="flex justify-between items-center mb-2">
            <h3 class="text-xs font-bold text-rose-400">頒布物一覧</h3>
            <button id="addItemBtn" type="button" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-600 text-slate-200">
              頒布物を追加
            </button>
          </div>
          <div id="itemsContainer" class="space-y-3"></div>
        </section>
      </div>
    </aside>

    <main id="workspace" class="flex-1 min-w-0 bg-slate-950 flex items-center justify-center p-3 sm:p-5 overflow-hidden relative">
      <div class="absolute top-3 left-3 z-20 rounded-lg border border-slate-700 bg-slate-800/90 px-3 py-2 text-[11px] text-slate-300 shadow">
        <span id="zoomDisplay">表示: --%</span>
        <span class="mx-1 text-slate-600">|</span>
        <span id="dimensionDisplay" class="text-slate-400"></span>
      </div>

      <div id="previewToolbar" class="absolute z-20 flex flex-wrap items-center justify-end gap-2 rounded-lg border border-slate-700 bg-slate-800/95 px-3 py-2 shadow">
        <button id="previewToolbarDrag" type="button" aria-label="操作バーを移動" title="ドラッグして移動"
          class="rounded bg-slate-700 px-2 py-1 text-slate-200">
          <i data-lucide="move" class="h-4 w-4"></i>
        </button>
        <button id="fitCanvasBtn" type="button" class="rounded bg-slate-700 px-2 py-1 text-xs text-slate-200 hover:bg-slate-600">全体表示</button>
        <label class="flex items-center gap-1.5 text-xs text-slate-200">
          倍率
          <input id="zoomSlider" type="range" min="1" max="200" value="100" class="w-20 accent-rose-500">
        </label>
        <label class="flex items-center gap-1.5 text-xs text-slate-200">
          <input id="toggleGrid" type="checkbox" class="accent-rose-500">
          方眼
        </label>
      </div>

      <div id="canvasContainer" class="shadow-2xl border border-slate-700/50 bg-white">
        <div id="canvasStage">
          <canvas id="oshinagakiCanvas"></canvas>
          <div id="gridOverlay" class="grid-overlay hidden" aria-hidden="true"></div>
        </div>
      </div>
    </main>
  </div>

<script>
  const PRESET_COLORS = [
    { name: "赤", hex: "#fca5a5", main: "#e11d48" },
    { name: "ピンク", hex: "#f472b6", main: "#db2777" },
    { name: "オレンジ", hex: "#fdba74", main: "#ea580c" },
    { name: "緑", hex: "#86efac", main: "#16a34a" },
    { name: "青", hex: "#93c5fd", main: "#2563eb" },
    { name: "紫", hex: "#d8b4fe", main: "#9333ea" },
    { name: "グレー", hex: "#cbd5e1", main: "#475569" }
  ];

  const HEADER_SCHEMES = {
    "赤": { bg: "#3b0a1e", accent: "#fb7185", event: "#ffe4e6", circle: "#fff1f2", space: "#e11d48" },
    "ピンク": { bg: "#3b1028", accent: "#f472b6", event: "#fce7f3", circle: "#fff1f7", space: "#db2777" },
    "オレンジ": { bg: "#3b1b0b", accent: "#fb923c", event: "#ffedd5", circle: "#fff7ed", space: "#ea580c" },

    "紫": { bg: "#26103b", accent: "#c084fc", event: "#f3e8ff", circle: "#faf5ff", space: "#9333ea" },
    "グレー": { bg: "#1f2937", accent: "#cbd5e1", event: "#e2e8f0", circle: "#f8fafc", space: "#475569" }
  };

  const CATEGORY_STYLES = {
    "新刊": { text: "#fff", background: "#dc2626" },
    "既刊": { text: "#fff", background: "#2563eb" },
    "無料配布": { text: "#fff", background: "#16a34a" }
  };

  const SPECS = {
    A2: { width: 4677, height: 3307 },
    A3: { width: 3307, height: 2339 },
    A4: { width: 2339, height: 1654 },
    WEB_PORTRAIT: { width: 960, height: 1280 },
    WEB_LANDSCAPE: { width: 1200, height: 675 },
    PICSQUARE: { width: 500, height: 1000 },
    PICREA: { width: 800, height: 1600 }
  };

  const PAPER_MM = {
    A2: { width: 420, height: 594 },
    A3: { width: 297, height: 420 },
    A4: { width: 210, height: 297 },
    WEB_PORTRAIT: { width: 960 * 25.4 / 200, height: 1280 * 25.4 / 200 },
    WEB_LANDSCAPE: { width: 1200 * 25.4 / 200, height: 675 * 25.4 / 200 },
    PICSQUARE: { width: 500 * 25.4 / 200, height: 1000 * 25.4 / 200 },
    PICREA: { width: 800 * 25.4 / 200, height: 1600 * 25.4 / 200 }
  };

  const SOCIAL_PRESETS = {
    WEB_PORTRAIT: { width: 960, height: 1280, orientation: "PORTRAIT", label: "X用縦書き" },

    PICREA: { width: 800, height: 1600, orientation: "PORTRAIT", label: "ピクリエ用" }
  };

  const SOCIAL_LAYOUTS = {
    WEB_PORTRAIT: {
      header: 250, marginX: 28, marginY: 22, gapX: 16, gapY: 16,
      padding: 12, eventFont: 20, circleFont: 38, spaceFont: 19,
      cardScale: .55, categoryBand: 46, ageBand: 28
    },
    WEB_LANDSCAPE: {
      header: 160, marginX: 28, marginY: 18, gapX: 16, gapY: 16,
      padding: 11, eventFont: 16, circleFont: 28, spaceFont: 15,
      cardScale: .48, categoryBand: 38, ageBand: 24
    },
    PICSQUARE: {
      header: 205, marginX: 16, marginY: 16, gapX: 12, gapY: 12,
      padding: 8, eventFont: 14, circleFont: 23, spaceFont: 14,
      cardScale: .35, categoryBand: 34, ageBand: 21
    },
    PICREA: {
      header: 270, marginX: 24, marginY: 22, gapX: 16, gapY: 16,
      padding: 12, eventFont: 18, circleFont: 34, spaceFont: 18,
      cardScale: .5, categoryBand: 44, ageBand: 28
    }
  };

  const BLEED_MM = 3;

  let currentPaperSize = "A3";
  let currentOrientation = "LANDSCAPE";
  let CANVAS_WIDTH = SPECS.A3.width;
  let CANVAS_HEIGHT = SPECS.A3.height;
  let canvas;
  let customBackgroundImage = null;
  let selectedPresetColor = PRESET_COLORS[0];
  let generationId = 0;
  let imageLoadPromises = [];
  let previewZoomMode = "fit";
  let resizeCanvasToFit = null;

  let items = [
    {
      category: "新刊",
      ageRating: "全年齢",
      title: "新刊サンプルタイトル",
      price: "¥ 1,000",
      desc: "文庫サイズ / 120P / 全年齢\n特製ノベルティステッカー付き",
      imageSrc: null,
      imageWidth: 0,
      imageHeight: 0,
      noImage: false
    },
    {
      category: "既刊",
      ageRating: "全年齢",

      currentOrientation = social.orientation;

      CANVAS_HEIGHT = social.height;

      currentOrientation = orientationSelect.value;
      const spec = SPECS[currentPaperSize];

      if (currentOrientation === "LANDSCAPE") {
        CANVAS_WIDTH = spec.width;
        CANVAS_HEIGHT = spec.height;
      } else {
        CANVAS_WIDTH = spec.height;
        CANVAS_HEIGHT = spec.width;
      }

  function moveItem(index, direction) {
    const target = index + direction;
    if (target < 0 || target >= items.length) return;
    [items[index], items[target]] = [items[target], items[index]];
    renderFormItems();

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("画像を読み込めませんでした。"));
      image.src = url;
    });
  }

  function readImageFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onerror = () => reject(
        new Error(`画像ファイルを読み込めませんでした: ${file.name}`)
      );

      reader.onload = async () => {
        try {
          const image = await loadImage(reader.result);
          resolve({
            src: reader.result,
            width: image.naturalWidth,
            height: image.naturalHeight
          });
        } catch {
          reject(new Error(`画像ファイルを開けませんでした: ${file.name}`));
        }
      };

      reader.readAsDataURL(file);
    });
  }

  async function handleSingleImageUpload(index, input) {
    const file = input.files && input.files[0];
    if (!file || !items[index]) return;

    try {
      const image = await readImageFile(file);
      Object.assign(items[index], {
        imageSrc: image.src,
        imageWidth: image.width,
        imageHeight: image.height,
        noImage: false
      });

      renderFormItems();
      generateOshinagaki();
    } catch (error) {
      alert(error.message);
    }
  }

  async function handleBatchImageUpload(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;

    try {
      const images = await Promise.all(files.map(readImageFile));

      images.forEach((image, index) => {
        const imageFields = {
          imageSrc: image.src,
          imageWidth: image.width,
          imageHeight: image.height,
          noImage: false
        };

        if (index < items.length) {
          Object.assign(items[index], imageFields);
        } else {
          items.push({
            category: "新刊",
            ageRating: "全年齢",
            title: `新刊アイテム ${index + 1}`,
            price: "¥ 500",
            desc: "",
            ...imageFields
          });
        }
      });

      renderFormItems();
      generateOshinagaki();
    } catch (error) {
      alert(error.message);
    }
  }

  function createPatternCanvas(style, color) {
    const size = 240;
    const patternCanvas = document.createElement("canvas");
    const ctx = patternCanvas.getContext("2d");
    patternCanvas.width = size;
    patternCanvas.height = size;
    ctx.fillStyle = "#fff8fb";
    ctx.fillRect(0, 0, size, size);

    if (style === "dots") {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(size / 4, size / 4, 17, 0, Math.PI * 2);
      ctx.arc(size * 3 / 4, size * 3 / 4, 17, 0, Math.PI * 2);
      ctx.fill();
    } else if (style === "stripes") {
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, size / 2, size);
    } else if (style === "diagonal") {
      ctx.save();
      ctx.translate(size / 2, size / 2);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = color;
      const period = size / Math.sqrt(2);
      for (let x = -size * 2; x <= size * 2; x += period) {
        ctx.fillRect(x, -size * 2, period / 3, size * 4);
      }
      ctx.restore();
    } else if (style === "border") {
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, size, size / 2);
    } else if (style === "check") {
      const square = size / 2;
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, square, square);
      ctx.fillRect(square, square, square, square);
    }

    return patternCanvas;
  }

  function applyBackground() {
    const type = document.getElementById("bgTypeSelect").value;
    canvas.setBackgroundImage(null);
    canvas.setBackgroundColor("#ffffff");

    if (type === "color") {
      canvas.setBackgroundColor(document.getElementById("bgColorPicker").value);
      return null;
    }

    if (type === "custom" && customBackgroundImage) {
      canvas.setBackgroundImage(customBackgroundImage, null, {
        originX: "left",
        originY: "top",
        left: 0,
        top: 0,
        scaleX: CANVAS_WIDTH / customBackgroundImage.width,
        scaleY: CANVAS_HEIGHT / customBackgroundImage.height
      });
      return null;
    }

    if (type === "custom") return null;

    return new fabric.Pattern({
      source: createPatternCanvas(
        document.getElementById("patternStyleSelect").value,
        selectedPresetColor.hex
      ),
      repeat: "repeat"
    });
  }

  function getInfoStyle(prefix, defaultSize, defaultColor, maxSize) {
    const raw = Number.parseInt(
      document.getElementById(`${prefix}FontSize`).value,
      10
    );
    const useBackground =
      document.getElementById(`${prefix}BgEnabled`).checked;

    return {
      fontSize: Number.isFinite(raw)
        ? Math.max(8, Math.min(raw, maxSize))
        : defaultSize,
      fill: document.getElementById(`${prefix}TextColor`).value || defaultColor,
      backgroundColor: useBackground
        ? document.getElementById(`${prefix}BgColor`).value
        : ""
    };
  }

  function fittedTextbox(text, box, options) {
    const minimum = options.minimum || 8;
    let size = Math.max(minimum, options.fontSize);
    let result;

    while (size >= minimum) {
      result = new fabric.Textbox(text || "", {
        left: box.left,
        top: box.top,
        width: box.width,
        fontSize: size,
        fontFamily: options.fontFamily || "Noto Sans JP",
        fontWeight: options.fontWeight || "normal",
        fill: options.fill || "#000000",
        backgroundColor: options.backgroundColor || "",
        padding: options.padding || 0,
        splitByGrapheme: true,
        lineHeight: 1,
        selectable: false,
        evented: false
      });

      if (result.height <= box.height) return result;
      size -= 1;
    }

    return result;
  }

  function getCategoryStyle(category) {
    return CATEGORY_STYLES[category] || CATEGORY_STYLES["新刊"];
  }

  function createItemTextBlock(item, width, scale) {
    const categoryStyle = getCategoryStyle(item.category);
    const descriptionSize = Math.max(
      8,
      Math.min(
        100,
        Number.parseInt(document.getElementById("descriptionFontSize").value, 10) || 38
      )
    );
    const definitions = [{
      text: item.title || "",
      size: 78,
      family: "Noto Sans JP",
      weight: "bold",
      fill: "#0f172a",
      gap: 9
    }];

    if (item.category !== "無料配布" && item.price) {
      definitions.push({
        text: item.price,
        size: 100,
        family: "M PLUS Rounded 1c",
        weight: "bold",
        fill: categoryStyle.background,
        gap: 8
      });
    }

    if (item.desc) {
      definitions.push({
        text: item.desc,
        size: descriptionSize,
        family: "Noto Sans JP",
        weight: "normal",
        fill: "#475569",
        gap: 0
      });
    }

    const entries = definitions.map((definition) => {
      const object = new fabric.Textbox(definition.text, {
        left: 0,
        top: 0,
        width,
        fontSize: Math.max(1, definition.size * scale),
        fontFamily: definition.family,
        fontWeight: definition.weight,
        fill: definition.fill,
        splitByGrapheme: true,
        lineHeight: 1.05,
        selectable: false,
        evented: false
      });

      return {
        object,
        gapAfter: definition.gap * scale
      };
    });

    return {
      entries,
      totalHeight: entries.reduce(
        (sum, entry) => sum + entry.object.getScaledHeight() + entry.gapAfter,
        0
      )
    };
  }

  function fitItemTextBlock(item, width, availableHeight, initialScale) {
    let low = 0.001;
    let high = initialScale;
    let best = createItemTextBlock(item, width, low);

    for (let i = 0; i < 22; i += 1) {
      const mid = (low + high) / 2;
      const candidate = createItemTextBlock(item, width, mid);

      if (candidate.totalHeight <= availableHeight) {
        best = candidate;
        low = mid;
      } else {
        high = mid;
      }
    }

    return best;
  }

  function addImageToCanvas(item, imageBox, generation, textAnchor) {
    if (!item.imageSrc || item.noImage) return Promise.resolve();

    return new Promise((resolve) => {
      fabric.Image.fromURL(item.imageSrc, (image) => {
        if (!image || generation !== generationId) {
          resolve();
          return;
        }

        const scale = Math.min(
          imageBox.width / image.width,
          imageBox.height / image.height
        );

        image.set({
          left: imageBox.left + (imageBox.width - image.width * scale) / 2,
          top: imageBox.top + (imageBox.height - image.height * scale) / 2,
          scaleX: scale,
          scaleY: scale,
          shadow: new fabric.Shadow({
            color: "rgba(15, 23, 42, 0.35)",
            blur: 20,
            offsetX: 0,
            offsetY: 8
          }),
          selectable: false,
          evented: false
        });

        const anchorIndex = canvas.getObjects().indexOf(textAnchor);
        if (anchorIndex >= 0) {
          canvas.insertAt(image, anchorIndex, false);
        } else {
          canvas.add(image);
        }

        canvas.requestRenderAll();
        resolve();
      });
    });
  }

  function generateOshinagaki() {
    if (!canvas) return;

    const generation = ++generationId;
    imageLoadPromises = [];
    canvas.clear();

    const backgroundPattern = applyBackground();
    if (backgroundPattern) {
      canvas.add(new fabric.Rect({
        left: 0,
        top: 0,
        width: CANVAS_WIDTH,
        height: CANVAS_HEIGHT,
        fill: backgroundPattern,
        selectable: false,
        evented: false
      }));
    }

    const social = SOCIAL_LAYOUTS[currentPaperSize] || null;
    const isSocial = Boolean(social);
    const landscape = currentOrientation === "LANDSCAPE";
    const headerHeight = social
      ? social.header
      : (landscape ? 360 : 420);

    const headerColor = document.getElementById("headerBgColor").value || "#0f172a";
    const accentColor = document.getElementById("headerAccentColor").value || selectedPresetColor.main;

    canvas.add(new fabric.Rect({
      left: 0,
      top: 0,
      width: CANVAS_WIDTH,
      height: headerHeight,
      fill: headerColor,
      selectable: false,
      evented: false
    }));

    const accentHeight = isSocial ? Math.max(4, Math.round(headerHeight * .025)) : 12;
    canvas.add(new fabric.Rect({
      left: 0,
      top: headerHeight - accentHeight,
      width: CANVAS_WIDTH,
      height: accentHeight,
      fill: accentColor,
      selectable: false,
      evented: false
    }));

    const eventDefault = social ? social.eventFont : (landscape ? 48 : 46);
    const circleDefault = social ? social.circleFont : (landscape ? 120 : 110);
    const spaceDefault = social ? social.spaceFont : (landscape ? 75 : 65);

    const eventStyle = getInfoStyle(
      "eventInfo", eventDefault, "#ffe4e6",
      social ? social.eventFont : 200
    );
    const circleStyle = getInfoStyle(
      "circleInfo", circleDefault, "#fff1f2",
      social ? social.circleFont : 300
    );
    const spaceStyle = getInfoStyle(
      "spaceInfo", spaceDefault, "#ffffff",
      social ? social.spaceFont : 200
    );

    if (social) {
      drawSocialHeader(social, headerHeight, eventStyle, circleStyle, spaceStyle);
    } else {
      drawPrintHeader(landscape, headerHeight, eventStyle, circleStyle, spaceStyle);
    }

    let columns = 2;

    if (currentPaperSize === "WEB_LANDSCAPE") {
      columns = items.length <= 1 ? 1 : 2;
    } else if (isSocial) {
      columns = items.length <= 3 ? 1 : 2;
    } else if (landscape) {
      if (items.length <= 1) columns = 1;
      else if (items.length > 4) columns = 3;
    } else if (items.length <= 3) {
      columns = 1;
    }

    const marginX = social ? social.marginX : 70;
    const marginY = social ? social.marginY : 40;
    const gapX = social ? social.gapX : 40;
    const gapY = social ? social.gapY : 40;
    const padding = social ? social.padding : 25;
    const startY = headerHeight + (social ? 10 : 50);
    const rows = Math.ceil(items.length / columns);

    const slotWidth =
      (CANVAS_WIDTH - marginX * 2 - gapX * (columns - 1)) / columns;
    const slotHeight = rows > 0
      ? (CANVAS_HEIGHT - startY - marginY - gapY * (rows - 1)) / rows
      : 0;

    items.forEach((item, index) => {
      const row = Math.floor(index / columns);
      const column = index % columns;
      const x = marginX + column * (slotWidth + gapX);
      const y = startY + row * (slotHeight + gapY);
      const cardRadius = social ? 12 : 24;
      const hasImage = Boolean(item.imageSrc) && !item.noImage;

      canvas.add(new fabric.Rect({
        left: x,
        top: y,
        width: slotWidth,
        height: slotHeight,
        fill: "#ffffff",
        stroke: "transparent",
        strokeWidth: 0,
        rx: cardRadius,
        ry: cardRadius,
        selectable: false,
        evented: false
      }));

      const categoryStyle = getCategoryStyle(item.category);
      const isR18 = item.ageRating === "R18";
      const categoryHeight = Math.min(
        social ? social.categoryBand : 100,
        slotHeight * .14
      );
      const ageHeight = Math.min(
        social ? social.ageBand : 64,
        slotHeight * .09
      );
      const radius = Math.min(cardRadius, slotWidth / 2);

      const bandPath = [
        `M 0 ${radius}`,
        `Q 0 0 ${radius} 0`,
        `L ${slotWidth - radius} 0`,
        `Q ${slotWidth} 0 ${slotWidth} ${radius}`,
        `L ${slotWidth} ${categoryHeight}`,
        `L 0 ${categoryHeight}`,
        "Z"
      ].join(" ");

      canvas.add(new fabric.Path(bandPath, {
        left: x,
        top: y,
        fill: categoryStyle.background,
        selectable: false,
        evented: false
      }));

      canvas.add(new fabric.Textbox(item.category || "新刊", {
        left: x + padding,
        top: y + 2,
        width: slotWidth - padding * 2,
        height: Math.max(1, categoryHeight - 4),
        fontSize: Math.min(social ? 24 : 64, categoryHeight * .64),
        fontWeight: "bold",
        fontFamily: "M PLUS Rounded 1c",
        fill: categoryStyle.text,
        valign: "middle",
        splitByGrapheme: true,
        selectable: false,
        evented: false
      }));

      const ageTop = y + categoryHeight;
      canvas.add(new fabric.Rect({
        left: x,
        top: ageTop,
        width: slotWidth,
        height: ageHeight,
        fill: isR18 ? "#991b1b" : "#dcfce7",
        selectable: false,
        evented: false
      }));

      canvas.add(new fabric.Textbox(isR18 ? "R18" : "全年齢", {
        left: x + padding,
        top: ageTop + 1,
        width: slotWidth - padding * 2,
        height: Math.max(1, ageHeight - 2),
        fontSize: Math.min(social ? 15 : 34, ageHeight * .55),
        fontWeight: "bold",
        fontFamily: "M PLUS Rounded 1c",
        fill: isR18 ? "#ffffff" : "#166534",
        valign: "middle",
        selectable: false,
        evented: false
      }));

      const bodyTop = y + categoryHeight + ageHeight + padding;
      const bodyHeight = Math.max(
        1,
        slotHeight - categoryHeight - ageHeight - padding * 2
      );

      let imageBox = null;
      let textX;
      let textWidth;

      if (hasImage) {
        const sourceWidth = item.imageWidth || 1;
        const sourceHeight = item.imageHeight || 1;
        const maxImageWidth = slotWidth * (landscape ? .38 : .36);
        const imageScale = Math.min(
          maxImageWidth / sourceWidth,
          bodyHeight / sourceHeight
        );
        const displayWidth = sourceWidth * imageScale;
        const displayHeight = sourceHeight * imageScale;
        const imageGap = social ? 10 : 25;

        imageBox = {
          left: x + padding,
          top: bodyTop + (bodyHeight - displayHeight) / 2,
          width: displayWidth,
          height: displayHeight
        };

        textX = imageBox.left + displayWidth + imageGap;
        textWidth = Math.max(1, x + slotWidth - padding - textX);
      } else {
        textX = x + padding;
        textWidth = Math.max(1, slotWidth - padding * 2);
      }

      const textScale = social ? social.cardScale : 1;
      const textBlock = fitItemTextBlock(item, textWidth, bodyHeight, textScale);

      let textY = bodyTop;
      let firstText = null;

      textBlock.entries.forEach((entry, entryIndex) => {
        entry.object.set({ left: textX, top: textY });
        if (entryIndex === 0) firstText = entry.object;
        canvas.add(entry.object);
        textY += entry.object.getScaledHeight() + entry.gapAfter;
      });

      if (hasImage && imageBox) {
        imageLoadPromises.push(
          addImageToCanvas(item, imageBox, generation, firstText)
        );
      }

      // 枠線は最後に描き、帯やカード内容に隠れないようにする。
      canvas.add(new fabric.Rect({
        left: x,
        top: y,
        width: slotWidth,
        height: slotHeight,
        fill: "rgba(255,255,255,0)",
        stroke: "#cbd5e1",
        strokeWidth: social ? 2 : 4,
        rx: cardRadius,
        ry: cardRadius,
        selectable: false,
        evented: false
      }));
    });

    canvas.renderAll();
  }

  function applyPreviewScale(scale) {
    if (!canvas) return;

    const container = document.getElementById("canvasContainer");
    const stage = document.getElementById("canvasStage");
    const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;

    stage.style.width = `${CANVAS_WIDTH}px`;
    stage.style.height = `${CANVAS_HEIGHT}px`;
    stage.style.transform = `scale(${safeScale})`;
    container.style.width = `${CANVAS_WIDTH * safeScale}px`;
    container.style.height = `${CANVAS_HEIGHT * safeScale}px`;

    canvas.calcOffset();
    canvas.requestRenderAll();

    document.getElementById("zoomDisplay").textContent =
      `表示: ${Math.round(safeScale * 100)}%`;
    document.getElementById("zoomSlider").value =
      String(Math.max(1, Math.min(200, Math.round(safeScale * 100))));
  }

  function fitCanvasToWorkspace() {
    const workspace = document.getElementById("workspace");
    const availableWidth = Math.max(workspace.clientWidth - 56, 1);
    const availableHeight = Math.max(workspace.clientHeight - 56, 1);

    applyPreviewScale(Math.min(
      availableWidth / CANVAS_WIDTH,
      availableHeight / CANVAS_HEIGHT
    ));
  }

  function setupResponsiveScaler() {
    const workspace = document.getElementById("workspace");

    resizeCanvasToFit = () => {
      if (previewZoomMode === "fit") {
        fitCanvasToWorkspace();
      } else {
        applyPreviewScale(
          Number(document.getElementById("zoomSlider").value) / 100
        );
      }
    };

    if ("ResizeObserver" in window) {
      new ResizeObserver(() => {
        if (previewZoomMode === "fit") fitCanvasToWorkspace();
      }).observe(workspace);
    }

    window.addEventListener("resize", () => {
      if (previewZoomMode === "fit") fitCanvasToWorkspace();
    });

    requestAnimationFrame(fitCanvasToWorkspace);
  }

  async function createBleedExport() {
    while (true) {
      const currentGeneration = generationId;
      await Promise.all(imageLoadPromises.slice());
      if (currentGeneration === generationId) break;
    }

    canvas.renderAll();

    const social = SOCIAL_PRESETS[currentPaperSize];

    if (social) {
      return {
        dataUrl: canvas.toDataURL({ format: "png", multiplier: 1 }),
        widthPx: social.width,
        heightPx: social.height,
        widthMm: PAPER_MM[currentPaperSize].width,
        heightMm: PAPER_MM[currentPaperSize].height,
        hasBleed: false
      };
    }

    const source = await loadImage(
      canvas.toDataURL({ format: "png", multiplier: 1 })
    );
    const paper = PAPER_MM[currentPaperSize];
    const landscape = currentOrientation === "LANDSCAPE";
    const trimWidthMm = landscape ? paper.height : paper.width;
    const trimHeightMm = landscape ? paper.width : paper.height;
    const trimWidthPx = CANVAS_WIDTH;
    const trimHeightPx = CANVAS_HEIGHT;

    const outputWidthPx = Math.round(
      (trimWidthMm + BLEED_MM * 2) * 200 / 25.4
    );
    const outputHeightPx = Math.round(
      (trimHeightMm + BLEED_MM * 2) * 200 / 25.4
    );

    const horizontalBleed = outputWidthPx - trimWidthPx;
    const verticalBleed = outputHeightPx - trimHeightPx;
    const left = Math.floor(horizontalBleed / 2);
    const right = horizontalBleed - left;
    const top = Math.floor(verticalBleed / 2);
    const bottom = verticalBleed - top;

    const output = document.createElement("canvas");
    output.width = outputWidthPx;
    output.height = outputHeightPx;

    const context = output.getContext("2d");
    if (!context) throw new Error("塗り足し用キャンバスを作成できませんでした。");

    const x = left;
    const y = top;
    const sourceWidth = source.naturalWidth;
    const sourceHeight = source.naturalHeight;

    if (top) {
      context.drawImage(source, 0, 0, sourceWidth, 1, x, 0, trimWidthPx, top);
    }
    if (bottom) {
      context.drawImage(
        source, 0, sourceHeight - 1, sourceWidth, 1,
        x, y + trimHeightPx, trimWidthPx, bottom
      );
    }
    if (left) {
      context.drawImage(
        source, 0, 0, 1, sourceHeight,
        0, y, left, trimHeightPx
      );
    }
    if (right) {
      context.drawImage(
        source, sourceWidth - 1, 0, 1, sourceHeight,
        x + trimWidthPx, y, right, trimHeightPx
      );
    }

    if (left && top) {
      context.drawImage(source, 0, 0, 1, 1, 0, 0, left, top);
    }
    if (right && top) {
      context.drawImage(
        source, sourceWidth - 1, 0, 1, 1,
        x + trimWidthPx, 0, right, top
      );
    }
    if (left && bottom) {
      context.drawImage(
        source, 0, sourceHeight - 1, 1, 1,
        0, y + trimHeightPx, left, bottom
      );
    }
    if (right && bottom) {
      context.drawImage(
        source, sourceWidth - 1, sourceHeight - 1, 1, 1,
        x + trimWidthPx, y + trimHeightPx, right, bottom
      );
    }

    context.drawImage(
      source,
      0,
      0,
      sourceWidth,
      sourceHeight,
      x,
      y,
      trimWidthPx,
      trimHeightPx
    );

    return {
      dataUrl: output.toDataURL("image/png"),
      widthPx: outputWidthPx,
      heightPx: outputHeightPx,
      widthMm: trimWidthMm + BLEED_MM * 2,
      heightMm: trimHeightMm + BLEED_MM * 2,
      hasBleed: true
    };
  }

  async function openPrintPreview() {
    const popup = window.open("", "_blank");

    if (!popup) {
      alert("印刷プレビューを開けませんでした。ポップアップを許可してください。");
      return;
    }

    try {
      const output = await createBleedExport();
      const label = output.hasBleed ? "塗り足し各3mm" : "Webサイズ";
      const pageWidth = output.widthMm;
      const pageHeight = output.heightMm;

      popup.document.open();
      popup.document.write(`<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印刷プレビュー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:sans-serif}
body{background:#1e293b;color:#f8fafc}
.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#0f172a}
.toolbar button{border:0;border-radius:6px;padding:8px 12px;color:#fff;background:#334155;cursor:pointer}
.toolbar .print{background:#e11d48}
.preview{height:calc(100vh - 60px);overflow:auto;padding:24px}
.sheet{width:${output.widthPx}px;height:${output.heightPx}px;margin:0 auto;background:#fff;box-shadow:0 8px 30px #0006}
.sheet img{display:block;width:100%;height:100%}
body.fit .sheet{width:auto;height:auto;max-width:100%}
body.fit .sheet img{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
@page{size:${pageWidth}mm ${pageHeight}mm;margin:0}
@media print{
html,body{width:${pageWidth}mm;height:${pageHeight}mm;margin:0;padding:0;overflow:hidden;background:#fff}
.toolbar{display:none!important}
.preview{width:${pageWidth}mm;height:${pageHeight}mm;overflow:hidden;padding:0}
.sheet{width:${pageWidth}mm!important;height:${pageHeight}mm!important;margin:0!important;box-shadow:none}
.sheet img{width:${pageWidth}mm!important;height:${pageHeight}mm!important}
}
</style>
</head>
<body>
<div class="toolbar">
<strong>プレビュー（${label}）</strong>
<button id="actualSize" type="button">100%表示</button>
<button id="fit" type="button">画面に合わせる</button>
<button id="print" class="print" type="button">印刷</button>
<span>${output.widthPx} × ${output.heightPx}px</span>
</div>
<main class="preview"><div class="sheet"><img src="${output.dataUrl}" alt="出力プレビュー"></div></main>
<script>
document.getElementById("actualSize").onclick=()=>document.body.classList.remove("fit");
document.getElementById("fit").onclick=()=>document.body.classList.add("fit");
document.getElementById("print").onclick=()=>window.print();
<\/script>
</body>
</html>`);
      popup.document.close();
    } catch (error) {
      popup.close();
      alert(`プレビューを作成できませんでした: ${error.message}`);
    }
  }

  function setupDraggablePreviewToolbar() {
    const toolbar = document.getElementById("previewToolbar");
    const handle = document.getElementById("previewToolbarDrag");
    const workspace = document.getElementById("workspace");
    let drag = null;

    handle.addEventListener("pointerdown", (event) => {
      event.preventDefault();

      const toolbarRect = toolbar.getBoundingClientRect();
      const workspaceRect = workspace.getBoundingClientRect();

      toolbar.style.left = `${toolbarRect.left - workspaceRect.left}px`;
      toolbar.style.top = `${toolbarRect.top - workspaceRect.top}px`;
      toolbar.style.right = "auto";
      toolbar.style.bottom = "auto";

      drag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        left: toolbarRect.left - workspaceRect.left,
        top: toolbarRect.top - workspaceRect.top
      };

      handle.setPointerCapture(event.pointerId);
    });

    handle.addEventListener("pointermove", (event) => {
      if (!drag || drag.pointerId !== event.pointerId) return;

      const rect = workspace.getBoundingClientRect();
      const left = Math.max(
        0,
        Math.min(rect.width - toolbar.offsetWidth, drag.left + event.clientX - drag.startX)
      );
      const top = Math.max(
        0,
        Math.min(rect.height - toolbar.offsetHeight, drag.top + event.clientY - drag.startY)
      );

      toolbar.style.left = `${left}px`;
      toolbar.style.top = `${top}px`;
    });

    const endDrag = (event) => {
      if (drag && drag.pointerId === event.pointerId) drag = null;
    };

    handle.addEventListener("pointerup", endDrag);
    handle.addEventListener("pointercancel", endDrag);
  }

  function setupEventListeners() {
    ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
      document.getElementById(id).addEventListener("input", generateOshinagaki);
    });

    [
      "headerBgColor",
      "headerAccentColor",
      "eventInfoFontSize",
      "eventInfoTextColor",
      "eventInfoBgEnabled",
      "eventInfoBgColor",
      "circleInfoFontSize",
      "circleInfoTextColor",
      "circleInfoBgEnabled",
      "circleInfoBgColor",
      "spaceInfoFontSize",
      "spaceInfoTextColor",
      "spaceInfoBgEnabled",
      "spaceInfoBgColor",
      "descriptionFontSize"
    ].forEach((id) => {
      const input = document.getElementById(id);
      input.addEventListener("input", generateOshinagaki);
      input.addEventListener("change", generateOshinagaki);
    });

    document.getElementById("paperSizeSelect")
      .addEventListener("change", updateCanvasDimensions);
    document.getElementById("orientationSelect")
      .addEventListener("change", updateCanvasDimensions);

    document.getElementById("bgTypeSelect").addEventListener("change", (event) => {
      const type = event.target.value;
      document.getElementById("patternControls").classList.toggle("hidden", type !== "pattern");
      document.getElementById("customBgControls").classList.toggle("hidden", type !== "custom");
      document.getElementById("singleColorControls").classList.toggle("hidden", type !== "color");
      generateOshinagaki();
    });

    document.getElementById("patternStyleSelect")
      .addEventListener("change", generateOshinagaki);
    document.getElementById("bgColorPicker")
      .addEventListener("input", generateOshinagaki);

    document.getElementById("customBgInput").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      try {
        const imageData = await readImageFile(file);
        customBackgroundImage = await new Promise((resolve, reject) => {
          fabric.Image.fromURL(imageData.src, (image) => {
            if (image) resolve(image);
            else reject(new Error("背景画像を開けませんでした。"));
          });
        });
        generateOshinagaki();
      } catch (error) {
        alert(error.message);
      }
    });

    document.getElementById("batchImageInput").addEventListener("change", async (event) => {
      const files = Array.from(event.target.files || []);
      event.target.value = "";
      if (files.length) await handleBatchImageUpload(files);
    });

    document.getElementById("addItemBtn")
      .addEventListener("click", addItem);

    document.getElementById("toggleGrid").addEventListener("change", (event) => {
      document.getElementById("gridOverlay")
        .classList.toggle("hidden", !event.target.checked);
    });

    document.getElementById("fitCanvasBtn").addEventListener("click", () => {
      previewZoomMode = "fit";
      fitCanvasToWorkspace();
    });

    document.getElementById("zoomSlider").addEventListener("input", (event) => {
      previewZoomMode = "manual";
      applyPreviewScale(Number(event.target.value) / 100);
    });

    setupDraggablePreviewToolbar();

    document.getElementById("printPreviewBtn")
      .addEventListener("click", openPrintPreview);

    document.getElementById("exportPng").addEventListener("click", async () => {
      try {
        const output = await createBleedExport();
        const link = document.createElement("a");
        const bleedSuffix = output.hasBleed ? "_bleed3mm" : "";
        link.download =
          `oshinagaki_${currentPaperSize}_${currentOrientation}${bleedSuffix}_${output.widthPx}x${output.heightPx}.png`;
        link.href = output.dataUrl;
        link.click();
      } catch (error) {
        alert(`PNGを書き出せませんでした: ${error.message}`);
      }
    });

    document.getElementById("exportPdf").addEventListener("click", async () => {
      try {
        const output = await createBleedExport();
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: output.widthMm >= output.heightMm ? "landscape" : "portrait",
          unit: "mm",
          format: [output.widthMm, output.heightMm]
        });

        pdf.addImage(
          output.dataUrl,
          "PNG",
          0,
          0,
          output.widthMm,
          output.heightMm
        );

        const bleedSuffix = output.hasBleed ? "_bleed3mm" : "";
        pdf.save(
          `oshinagaki_${currentPaperSize}_${currentOrientation}${bleedSuffix}.pdf`
        );
      } catch (error) {
        alert(`PDFを書き出せませんでした: ${error.message}`);
      }
    });
  }
</script>
</body>
</html>
