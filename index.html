<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
同人おしながきエディタ
</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<link
href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Shippori+Mincho:wght@400;700&display=swap"
rel="stylesheet">

<style>

html,
body{
height:100%;
margin:0;
overflow:hidden;
background:#020617;
}

::-webkit-scrollbar{
width:6px;
height:6px;
}

::-webkit-scrollbar-thumb{
background:#334155;
}

.canvas-shadow{
box-shadow:
0 0 0 1px rgba(255,255,255,.1),
0 20px 40px rgba(0,0,0,.4);
}

</style>

</head>

<body
class="
h-screen
bg-slate-950
text-slate-100
">

<header
class="
h-16
border-b
border-slate-800
bg-slate-900
flex
items-center
justify-between
px-4
">

<div
class="
flex
items-center
gap-3
">

<div
class="
w-10
h-10
rounded-lg
bg-gradient-to-r
from-rose-500
to-purple-600
flex
items-center
justify-center
">

<i
data-lucide="layout-dashboard"
class="w-5 h-5">
</i>

</div>

<div>

<h1
class="
font-bold
leading-none
">
同人おしながきエディタ
</h1>

<p
id="paperLabel"
class="
text-xs
text-slate-400
">
A3横 200dpi
</p>

</div>

</div>

<div
class="
flex
items-center
gap-2
">

<button
id="undoBtn"
class="
px-3
py-2
rounded
bg-slate-700
text-xs
">
Undo
</button>

<button
id="redoBtn"
class="
px-3
py-2
rounded
bg-slate-700
text-xs
">
Redo
</button>

<button
id="saveBtn"
class="
px-3
py-2
rounded
bg-blue-600
text-xs
">
保存
</button>

<button
id="loadBtn"
class="
px-3
py-2
rounded
bg-indigo-600
text-xs
">
読込
</button>

<button
id="exportPNG"
class="
px-3
py-2
rounded
bg-emerald-600
text-xs
">
PNG
</button>

<button
id="exportPDF"
class="
px-3
py-2
rounded
bg-rose-600
text-xs
">
PDF
</button>

</div>

</header>

<div
class="
h-[calc(100vh-64px)]
flex
overflow-hidden
">

<!-- 左ツールバー -->

<aside
class="
w-[300px]
border-r
border-slate-800
bg-slate-900
overflow-y-auto
p-4
space-y-4
">

<div
class="
bg-slate-800
rounded-xl
p-4
space-y-2
">

<h3
class="
font-bold
text-rose-400
text-sm
">

キャンバス

</h3>

<select
id="orientationSelect"
class="
w-full
bg-slate-700
p-2
rounded
text-sm
">

<option value="LANDSCAPE">
A3横
</option>

<option value="PORTRAIT">
A3縦
</option>

</select>

<input
type="color"
id="canvasColor"
value="#ffffff"
class="w-full h-10">

<input
type="file"
id="backgroundInput"
accept="image/*"
class="
w-full
text-xs
">

<button
id="clearBackgroundBtn"
class="
w-full
bg-slate-700
rounded
py-2
text-sm
">
背景クリア
</button>

</div>

<div
class="
bg-slate-800
rounded-xl
p-4
space-y-2
">

<h3
class="
font-bold
text-rose-400
text-sm
">

オブジェクト追加

</h3>

<button
id="addTextBtn"
class="
w-full
bg-slate-700
rounded
py-2
">
テキスト追加
</button>

<button
id="addCoverBtn"
class="
w-full
bg-slate-700
rounded
py-2
">
表紙テンプレ
</button>

<input
type="file"
id="imageUpload"
multiple
accept="image/*"
class="
w-full
text-xs
">

</div>

<div
class="
bg-slate-800
rounded-xl
p-4
">

<h3
class="
font-bold
text-rose-400
text-sm
mb-2
">

レイヤー

</h3>

<div
id="layerPanel"
class="
space-y-1
text-xs
">
</div>

</div>

</aside>

<!-- 中央キャンバス -->

<main
id="workspace"
class="
flex-1
bg-slate-950
flex
items-center
justify-center
relative
overflow-hidden
">

<div
class="
absolute
top-4
left-4
z-20
bg-slate-900/80
rounded-full
px-3
py-1
text-xs
">

<span id="zoomDisplay">
100%
</span>

</div>

<div
id="canvasContainer"
class="
canvas-shadow
bg-white
overflow-hidden
">

<canvas
id="editorCanvas">
</canvas>

</div>

</main>

<!-- 右プロパティ -->

<aside
class="
w-[320px]
border-l
border-slate-800
bg-slate-900
overflow-y-auto
p-4
">

<div
id="propertyPanel"
class="
space-y-3
opacity-50
pointer-events-none
">

<h3
class="
text-rose-400
font-bold
text-sm
">

オブジェクト設定

</h3>

<select
id="fontFamily"
class="
w-full
bg-slate-700
p-2
rounded
">

<option>
Noto Sans JP
</option>

<option>
M PLUS Rounded 1c
</option>

<option>
Shippori Mincho
</option>

</select>

<input
type="number"
id="fontSize"
value="60"
class="
w-full
bg-slate-700
rounded
p-2
">

<input
type="color"
id="fontColor"
value="#000000"
class="
w-full
h-10
">

<button
id="boldBtn"
class="
w-full
bg-slate-700
rounded
py-2
">
太字
</button>

<button
id="deleteBtn"
class="
w-full
bg-rose-600
rounded
py-2
">
削除
</button>

</div>

</aside>

</div>

<script>

lucide.createIcons();

const A3 = {
width:3307,
height:2339
};

let canvas;
let bgImage=null;

const history=[];
let historyIndex=-1;
let CANVAS_WIDTH = A3.width;
let CANVAS_HEIGHT = A3.height;

window.addEventListener(
"DOMContentLoaded",
()=>{

initCanvas();

setupResponsiveCanvas();

setupHistory();

setupLayerPanel();

}
);

function initCanvas(){

canvas =
new fabric.Canvas(
"editorCanvas",
{
width:CANVAS_WIDTH,
height:CANVAS_HEIGHT,
backgroundColor:"#ffffff",
preserveObjectStacking:true,
enableRetinaScaling:true,
selection:true
}
);

canvas.on(
"selection:created",
updatePropertyPanel
);

canvas.on(
"selection:updated",
updatePropertyPanel
);

canvas.on(
"selection:cleared",
resetPropertyPanel
);

canvas.on(
"object:added",
()=>{
saveHistory();
refreshLayers();
}
);

canvas.on(
"object:removed",
()=>{
saveHistory();
refreshLayers();
}
);

canvas.on(
"object:modified",
()=>{
saveHistory();
refreshLayers();
}
);

}

function setupResponsiveCanvas(){

const workspace =
document.getElementById(
"workspace"
);

const canvasContainer =
document.getElementById(
"canvasContainer"
);

function resizeCanvas(){

const padding = 40;

const availableWidth =
workspace.clientWidth -
padding;

const availableHeight =
workspace.clientHeight -
padding;

const scale =
Math.min(
availableWidth/CANVAS_WIDTH,
availableHeight/CANVAS_HEIGHT
);

canvasContainer.style.width =
`${CANVAS_WIDTH*scale}px`;

canvasContainer.style.height =
`${CANVAS_HEIGHT*scale}px`;

canvas.setDimensions(
{
width:CANVAS_WIDTH*scale,
height:CANVAS_HEIGHT*scale
},
{
cssOnly:true
}
);

canvas.setViewportTransform([
scale,0,0,scale,0,0
]);

canvas.requestRenderAll();

document
.getElementById(
"zoomDisplay"
)
.innerText =
`${Math.round(scale*100)}%`;

}

window.addEventListener(
"resize",
resizeCanvas
);

setTimeout(
resizeCanvas,
100
);

}

function setupLayerPanel(){

refreshLayers();

}

function refreshLayers(){

const panel =
document.getElementById(
"layerPanel"
);

panel.innerHTML="";

canvas
.getObjects()
.slice()
.reverse()
.forEach((obj,index)=>{

const div =
document.createElement("button");

div.className =
"w-full text-left px-2 py-1 rounded bg-slate-700 hover:bg-slate-600";

const type =
obj.type || "object";

div.textContent =
`${index+1}. ${type}`;

div.onclick=()=>{

canvas.setActiveObject(obj);

canvas.requestRenderAll();

updatePropertyPanel();

};

panel.appendChild(div);

});

}
function saveHistory(){

const json =
JSON.stringify(canvas);

if(
historyIndex>=0 &&
history[historyIndex]===json
){
return;
}

history.splice(
historyIndex+1
);

history.push(json);

historyIndex =
history.length-1;

}

function setupHistory(){

document
.getElementById(
"undoBtn"
)
.addEventListener(
"click",
undo
);

document
.getElementById(
"redoBtn"
)
.addEventListener(
"click",
redo
);

}

function undo(){

if(historyIndex<=0)
return;

historyIndex--;

canvas.loadFromJSON(
history[historyIndex],
()=>{
canvas.renderAll();
refreshLayers();
}
);

}

function redo(){

if(
historyIndex>=
history.length-1
)
return;

historyIndex++;

canvas.loadFromJSON(
history[historyIndex],
()=>{
canvas.renderAll();
refreshLayers();
}
);

}

document
.getElementById(
"orientationSelect"
)
.addEventListener(
"change",
(e)=>{

const value = e.target.value;

if(value==="LANDSCAPE"){

CANVAS_WIDTH =
A3.width;

CANVAS_HEIGHT =
A3.height;

document
.getElementById(
"paperLabel"
)
.innerText =
"A3横 200dpi";

}else{

CANVAS_WIDTH =
A3.height;

CANVAS_HEIGHT =
A3.width;

document
.getElementById(
"paperLabel"
)
.innerText =
"A3縦 200dpi";

}

canvas.setWidth(
CANVAS_WIDTH
);

canvas.setHeight(
CANVAS_HEIGHT
);

setupResponsiveCanvas();

canvas.renderAll();

}
);
document
.getElementById(
"addTextBtn"
)
.addEventListener(
"click",
()=>{

const text =
new fabric.Textbox(
"新刊タイトル",
{
left:300,
top:300,
width:800,
fontSize:72,
fill:"#000000",
fontFamily:
"Noto Sans JP"
}
);

canvas.add(text);

canvas.setActiveObject(text);

canvas.requestRenderAll();

}
);

document
.getElementById(
"addCoverBtn"
)
.addEventListener(
"click",
()=>{

const rect =
new fabric.Rect({
width:600,
height:850,
fill:"#ffffff",
stroke:"#cbd5e1",
strokeWidth:4,
rx:20,
ry:20
});

const label =
new fabric.Text(
"表紙画像",
{
fontSize:64,
fill:"#94a3b8",
originX:"center",
originY:"center"
}
);

const group =
new fabric.Group(
[rect,label],
{
left:300,
top:400
}
);

canvas.add(group);

}
);

document
.getElementById(
"imageUpload"
)
.addEventListener(
"change",
(e)=>{

const files =
Array.from(
e.target.files
);

files.forEach(
(file,index)=>{

const reader =
new FileReader();

reader.onload=
(ev)=>{

fabric.Image.fromURL(
ev.target.result,
(img)=>{

const scale=
Math.min(
700/img.width,
900/img.height,
1
);

img.set({
left:150+
(index*40),
top:300+
(index*40),
scaleX:scale,
scaleY:scale
});

canvas.add(img);

canvas.renderAll();

}
);

};

reader.readAsDataURL(
file
);

});

}
);
document
.getElementById(
"backgroundInput"
)
.addEventListener(
"change",
(e)=>{

const file =
e.target.files[0];

if(!file)return;

const reader =
new FileReader();

reader.onload=
(ev)=>{

fabric.Image.fromURL(
ev.target.result,
(img)=>{

bgImage = img;

canvas
.setBackgroundImage(
img,
canvas.renderAll.bind(canvas),
{
scaleX:
CANVAS_WIDTH /
img.width,

scaleY:
CANVAS_HEIGHT /
img.height
}
);

}
);

};

reader.readAsDataURL(
file
);

}
);

document
.getElementById(
"clearBackgroundBtn"
)
.addEventListener(
"click",
()=>{

bgImage=null;

canvas.setBackgroundImage(
null,
canvas.renderAll.bind(canvas)
);

}
);

document
.getElementById(
"canvasColor"
)
.addEventListener(
"input",
(e)=>{

canvas.setBackgroundColor(
e.target.value,
canvas.renderAll.bind(canvas)
);

}
);
function updatePropertyPanel(){

const obj =
canvas.getActiveObject();

if(!obj)return;

const panel =
document.getElementById(
"propertyPanel"
);

panel.classList.remove(
"opacity-50",
"pointer-events-none"
);

if(
obj.type==="textbox"||
obj.type==="text"
){

document
.getElementById(
"fontFamily"
)
.value =
obj.fontFamily ||
"Noto Sans JP";

document
.getElementById(
"fontSize"
)
.value =
obj.fontSize || 60;

document
.getElementById(
"fontColor"
)
.value =
obj.fill || "#000000";

}

}

function resetPropertyPanel(){

document
.getElementById(
"propertyPanel"
)
.classList.add(
"opacity-50",
"pointer-events-none"
);

}

document
.getElementById(
"fontFamily"
)
.addEventListener(
"change",
(e)=>{

const obj =
canvas.getActiveObject();

if(!obj)return;

obj.set(
"fontFamily",
e.target.value
);

canvas.renderAll();

}
);

document
.getElementById(
"fontSize"
)
.addEventListener(
"input",
(e)=>{

const obj =
canvas.getActiveObject();

if(!obj)return;

obj.set(
"fontSize",
parseInt(e.target.value)
);

canvas.renderAll();

}
);

document
.getElementById(
"fontColor"
)
.addEventListener(
"input",
(e)=>{

const obj =
canvas.getActiveObject();

if(!obj)return;

obj.set(
"fill",
e.target.value
);

canvas.renderAll();

}
);

document
.getElementById(
"deleteBtn"
)
.addEventListener(
"click",
()=>{

const objs =
canvas.getActiveObjects();

objs.forEach(
o=>canvas.remove(o)
);

canvas.discardActiveObject();

canvas.renderAll();

}
);

document
.getElementById(
"exportPNG"
)
.addEventListener(
"click",
()=>{

const data =
canvas.toDataURL({
format:"png",
multiplier:2
});

const a =
document.createElement("a");

a.href=data;

a.download=
"oshinagaki.png";

a.click();

}
);

document
.getElementById(
"exportPDF"
)
.addEventListener(
"click",
()=>{

const data =
canvas.toDataURL({
format:"png",
multiplier:2
});

const {jsPDF} =
window.jspdf;

const pdf =
new jsPDF(
CANVAS_WIDTH>
CANVAS_HEIGHT
?"landscape"
:"portrait",
"mm",
"a3"
);

pdf.addImage(
data,
"PNG",
0,
0,
pdf.internal
.pageSize
.getWidth(),
pdf.internal
.pageSize
.getHeight()
);

pdf.save(
"oshinagaki.pdf"
);

}
);

document
.getElementById(
"saveBtn"
)
.addEventListener(
"click",
()=>{

localStorage.setItem(
"oshinagaki-project",
JSON.stringify(canvas)
);

alert(
"保存しました"
);

}
);

document
.getElementById(
"loadBtn"
)
.addEventListener(
"click",
()=>{

const data =
localStorage.getItem(
"oshinagaki-project"
);

if(!data)return;

canvas.loadFromJSON(
data,
()=>{
canvas.renderAll();
refreshLayers();
}
);

}
);

</script>

</body>
</html>
