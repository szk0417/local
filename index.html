<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同人おしながきジェネレーター</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Noto Sans JP", sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
      background: #1e293b;
    }

    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(120deg, #f43f5e, #9333ea);
      color: white;
      font-size: 19px;
    }
    .brand h1 { margin: 0; font-size: 14px; line-height: 1.3; }
    .brand p {
      overflow: hidden;
      margin: 2px 0 0;
      color: #94a3b8;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions { display: flex; flex: 0 0 auto; gap: 6px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 0;
      border-radius: 7px;
      padding: 8px 10px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    .button-print { background: #475569; }
    .button-png { background: #059669; }
    .button-pdf { background: #e11d48; }

    #mainLayout { display: flex; flex: 1 1 auto; min-height: 0; overflow: hidden; }

    #settingsPanel {
      display: flex;
      flex: 0 0 410px;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
      border-right: 1px solid #334155;
      background: #1e293b;
    }

    .panel-heading {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }

    .panel-heading small {
      border: 1px solid #166534;
      border-radius: 999px;
      padding: 3px 7px;
      background: #052e16;
      color: #4ade80;
      font-size: 9px;
    }

    #settingsContent { flex: 1 1 auto; overflow: auto; padding: 14px; }
    .section {
      margin-bottom: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      background: rgba(15, 23, 42, .65);
    }
    .section h2 { margin: 0 0 10px; color: #fb7185; font-size: 12px; }
    .field { display: block; margin-bottom: 9px; color: #94a3b8; font-size: 10px; }
    .field:last-child { margin-bottom: 0; }

    .control {
      display: block;
      width: 100%;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
    }
    .control:disabled { opacity: .5; }

    .color-control {
      width: 48px;
      height: 31px;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px;
      background: #1e293b;
    }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .palette button {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 9px;
    }
    .palette button.selected { outline: 2px solid #f43f5e; }
    .swatch { width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%; }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      color: #94a3b8;
      font-size: 10px;
    }
    .check-row input[type="checkbox"] { accent-color: #f43f5e; }

    .upload-box {
      display: block;
      border: 2px dashed #9f1239;
      border-radius: 9px;
      padding: 13px;
      background: rgba(30, 41, 59, .5);
      color: #e2e8f0;
      text-align: center;
      cursor: pointer;
    }
    .upload-box span { display: block; margin-top: 4px; font-size: 11px; font-weight: 700; }
    .upload-box small { display: block; margin-top: 3px; color: #94a3b8; font-size: 9px; }

    .item-card {
      margin-bottom: 10px;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 10px;
      background: #0f172a;
    }
    .item-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
    }
    .item-card-head button {
      border: 0;
      border-radius: 5px;
      padding: 3px 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 10px;
    }
    .item-card-head button:disabled { opacity: .4; }
    .delete-item { margin-left: 4px; background: transparent !important; color: #fb7185 !important; }
    .add-item {
      width: 100%;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
    }

    #workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 48px 20px 20px;
      background: #020617;
    }

    #canvasContainer {
      position: relative;
      flex: none;
      overflow: hidden;
      border: 1px solid #475569;
      background: white;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .45);
      line-height: 0;
    }

    #canvasStage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }

    #oshinagakiCanvas { display: block; }

    .guide {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      border: 1px dashed rgba(15, 23, 42, .8);
    }

    #trimGuide { outline: 1px solid rgba(255,255,255,.75); }
    #safeGuide { border-color: rgba(225, 29, 72, .95); }
    .hidden { display: none !important; }

    #zoomInfo {
      position: absolute;
      z-index: 12;
      top: 10px;
      left: 10px;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      background: rgba(30, 41, 59, .95);
      color: #cbd5e1;
      font-size: 10px;
    }

    #previewToolbar {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px;
      background: rgba(30, 41, 59, .96);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
      font-size: 10px;
    }

    #previewToolbar button {
      border: 0;
      border-radius: 5px;
      padding: 5px 7px;
      background: #475569;
      color: #e2e8f0;
      font-size: 10px;
    }

    #previewToolbarDrag { cursor: grab; touch-action: none; }
    #previewToolbarDrag:active { cursor: grabbing; }

    @media (max-width: 767px) {
      #mainLayout {
        display: block;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #settingsPanel {
        width: 100%;
        max-height: none;
        overflow: visible;
        border-right: 0;
      }
      #settingsContent { overflow: visible; }
      #workspace { width: 100%; height: 75vh; min-height: 480px; }
      #previewToolbar {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }

    @media (max-width: 420px) {
      .topbar { padding-right: 6px; padding-left: 6px; }
      .button { gap: 3px; padding: 7px 6px; font-size: 10px; }
      #settingsContent { padding: 10px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">✦</div>
      <div style="min-width:0">
        <h1>同人おしながきジェネレーター</h1>
        <p id="paperSpecLabel">A3横</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="printPreviewBtn" class="button button-print" type="button">プレビュー</button>
      <button id="exportPng" class="button button-png" type="button">PNG保存</button>
      <button id="exportPdf" class="button button-pdf" type="button">PDF保存</button>
    </div>
  </header>

  <div id="mainLayout">
    <aside id="settingsPanel">
      <div class="panel-heading">
        <span>デザイン・情報設定</span>
        <small>リアルタイム反映</small>
      </div>

      <div id="settingsContent">
        <section class="section">
          <h2>レイアウト・用紙設定</h2>
          <div class="two-col">
            <label class="field">用紙向き
              <select id="orientationSelect" class="control">
                <option value="LANDSCAPE">横向き</option>
                <option value="PORTRAIT">縦向き</option>
              </select>
            </label>
            <label class="field">レイアウト
              <select id="paperSizeSelect" class="control">
                <option value="A2">A2 (200dpi)</option>
                <option value="A3" selected>A3 (200dpi)</option>
                <option value="A4">A4 (350dpi)</option>
                <option value="WEB_PORTRAIT">X用縦書き (960 × 1280px)</option>
                <option value="WEB_LANDSCAPE">X用横書き (1200 × 675px)</option>
                <option value="PICSQUARE">ピクスク用 (500 × 1,000px)</option>
                <option value="PICREA">ピクリエ用 (800 × 1,600px)</option>
              </select>
            </label>
          </div>
          <div id="layoutHelp" style="color:#64748b;font-size:9px"></div>
        </section>

        <section class="section">
          <h2>背景デザイン・推奨配色</h2>
          <label class="field">背景の種類
            <select id="bgTypeSelect" class="control">
              <option value="pattern">規定パターン</option>
              <option value="custom">背景画像</option>
              <option value="color">単色カラー</option>
            </select>
          </label>
          <div class="field">
            CMYK向け推奨配色
            <div id="presetColorPalette" class="palette"></div>
            <small style="display:block;margin-top:5px;color:#64748b">
              色はCMYK配色の画面表示用近似です。印刷結果は印刷条件により変わります。
            </small>
          </div>
          <div id="patternControls">
            <label class="field">パターン
              <select id="patternStyleSelect" class="control">
                <option value="dots">ドット</option>
                <option value="stripes">ストライプ</option>
                <option value="diagonal">斜めストライプ</option>
                <option value="border">ボーダー</option>
                <option value="check">チェック</option>
              </select>
            </label>
          </div>
          <div id="customBgControls" class="hidden">
            <label class="field">背景画像を選択
              <input id="customBgInput" type="file" accept="image/*" class="control">
            </label>
          </div>
          <div id="singleColorControls" class="hidden">
            <label class="field">背景色
              <input id="bgColorPicker" type="color" value="#fff1f1" class="color-control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>イベント・サークル情報</h2>
          <label class="field">イベント日時
            <input id="eventDate" type="text" value="2026年12月30日(水)" class="control">
          </label>
          <label class="field">イベント名
            <input id="eventName" type="text" value="コミックマーケット109" class="control">
          </label>
          <div class="two-col">
            <label class="field">サークル名
              <input id="circleName" type="text" value="暁の稜線" class="control">
            </label>
            <label class="field">スペース番号
              <input id="spaceNo" type="text" value="東7ホール あ-01a" class="control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>ヘッダー文字設定</h2>
          <div class="two-col">
            <label class="field">イベント情報サイズ
              <input id="eventInfoFontSize" type="number" min="8" max="300" value="60" class="control">
            </label>
            <label class="field">イベント文字色
              <input id="eventInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            イベント情報の背景色
            <input id="eventInfoBgEnabled" type="checkbox">
            <input id="eventInfoBgColor" type="color" value="#ffffff" class="color-control">
          </label>
          <hr style="border-color:#334155;margin:10px 0">
          <div class="two-col">
            <label class="field">サークル名サイズ
              <input id="circleInfoFontSize" type="number" min="8" max="400" value="150" class="control">
            </label>
            <label class="field">サークル文字色
              <input id="circleInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            サークル名の背景色
            <input id="circleInfoBgEnabled" type="checkbox">
            <input id="circleInfoBgColor" type="color" value="#ffffff" class="color-control">
          </label>
          <hr style="border-color:#334155;margin:10px 0">
          <div class="two-col">
            <label class="field">スペース番号サイズ
              <input id="spaceInfoFontSize" type="number" min="8" max="300" value="90" class="control">
            </label>
            <label class="field">スペース文字色
              <input id="spaceInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            スペース番号の背景色
            <input id="spaceInfoBgEnabled" type="checkbox" checked>
            <input id="spaceInfoBgColor" type="color" value="#c41230" class="color-control">
          </label>
        </section>

        <section class="section">
          <h2>頒布物画像を一括アップロード</h2>
          <label class="upload-box">
            ☁
            <span>複数画像を選択</span>
            <small>選択順に頒布物へ割り当て</small>
            <input id="batchImageInput" type="file" accept="image/*" multiple hidden>
          </label>
        </section>

        <section class="section">
          <h2>頒布物一覧</h2>
          <div id="itemsContainer"></div>
          <button id="addItemBtn" class="add-item" type="button">＋ 頒布物を追加</button>
        </section>
      </div>
    </aside>

    <main id="workspace">
      <div id="zoomInfo">
        <span id="zoomDisplay">表示 --%</span>
        <span style="color:#64748b"> | </span>
        <span id="dimensionDisplay"></span>
      </div>

      <div id="previewToolbar">
        <button id="previewToolbarDrag" type="button" aria-label="操作バーを移動" title="ドラッグして移動">↕</button>
        <button id="fitCanvasBtn" type="button">全体表示</button>
        <label>倍率
          <input id="zoomSlider" type="range" min="1" max="200" value="100" style="width:70px;vertical-align:middle">
        </label>
        <label><input id="toggleGrid" type="checkbox"> 方眼</label>
      </div>

      <div id="canvasContainer">
        <div id="canvasStage">
          <canvas id="oshinagakiCanvas"></canvas>
          <div id="trimGuide" class="guide hidden"></div>
          <div id="safeGuide" class="guide hidden"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const PALETTES = [
      { name:"赤", hex:"#ed1c24", background:"#fff1f1", header:"#b5121b", accent:"#ed1c24", space:"#c41230", cmyk:"0,100,100,0" },
      { name:"桃", hex:"#e84a8a", background:"#fff0f5", header:"#8f1648", accent:"#d81b60", space:"#ad1457", cmyk:"0,75,25,0" },
      { name:"橙", hex:"#f7941d", background:"#fff5e8", header:"#a84300", accent:"#e87500", space:"#b84d00", cmyk:"0,50,100,0" },
      { name:"緑", hex:"#39b54a", background:"#eef8ef", header:"#155c25", accent:"#278c39", space:"#1d6b30", cmyk:"70,0,100,0" },
      { name:"青", hex:"#0072bc", background:"#edf5fb", header:"#0b3d70", accent:"#0068a8", space:"#075a96", cmyk:"100,60,0,0" },
      { name:"紫", hex:"#92278f", background:"#f7eff7", header:"#4e1452", accent:"#84217e", space:"#70206c", cmyk:"50,100,0,0" },
      { name:"灰", hex:"#666666", background:"#f1f1f1", header:"#333333", accent:"#595959", space:"#4a4a4a", cmyk:"0,0,0,60" }
    ];

    const CATEGORY_STYLES = {
      "新刊": { background:"#c62828", text:"#ffffff" },
      "既刊": { background:"#1565c0", text:"#ffffff" },
      "無料配布": { background:"#2e7d32", text:"#ffffff" },
      "Web展示": { background:"#00695c", text:"#ffffff" }
    };

    const PRINT_SPECS = {
      A2: { widthMm:426, heightMm:600, widthPx:3354, heightPx:4724, trimWidthMm:420, trimHeightMm:594 },
      A3: { widthMm:303, heightMm:426, widthPx:2386, heightPx:3354, trimWidthMm:297, trimHeightMm:420 },
      A4: { widthMm:216, heightMm:303, widthPx:2976, heightPx:4175, trimWidthMm:210, trimHeightMm:297 }
    };

    const SOCIAL_PRESETS = {
      WEB_PORTRAIT: { width:960, height:1280, orientation:"PORTRAIT", label:"X用縦書き" },
      WEB_LANDSCAPE: { width:1200, height:675, orientation:"LANDSCAPE", label:"X用横書き" },
      PICSQUARE: { width:500, height:1000, orientation:"PORTRAIT", label:"ピクスク用" },
      PICREA: { width:800, height:1600, orientation:"PORTRAIT", label:"ピクリエ用" }
    };

    const SOCIAL_LAYOUTS = {
      WEB_PORTRAIT: { header:250, marginX:28, marginY:22, gapX:16, gapY:16, padding:12, eventFont:18, circleFont:32, spaceFont:16, cardScale:.55, categoryBand:46, ageBand:28 },
      WEB_LANDSCAPE: { header:160, marginX:28, marginY:18, gapX:16, gapY:16, padding:11, eventFont:14, circleFont:24, spaceFont:13, cardScale:.48, categoryBand:38, ageBand:24 },
      PICSQUARE: { header:143, marginX:16, marginY:16, gapX:12, gapY:12, padding:8, eventFont:10, circleFont:18, spaceFont:10, cardScale:.35, categoryBand:34, ageBand:21 },
      PICREA: { header:270, marginX:24, marginY:22, gapX:16, gapY:16, padding:12, eventFont:15, circleFont:28, spaceFont:15, cardScale:.50, categoryBand:44, ageBand:28 }
    };

    const BLEED_MM = 3;

    let selectedPalette = PALETTES[0];
    let paper = "A3";
    let orientation = "LANDSCAPE";
    let outputWidth = PRINT_SPECS.A3.widthPx;
    let outputHeight = PRINT_SPECS.A3.heightPx;
    let trimWidth = 0;
    let trimHeight = 0;
    let bleedLeft = 0;
    let bleedTop = 0;
    let safeX = 0;
    let safeY = 0;
    let canvas;
    let customBackground = null;
    let previewMode = "fit";
    let renderToken = 0;
    let imagePromises = [];

    let items = [
      {
        category:"新刊", ageRating:"全年齢",
        title:"新刊サンプルタイトル", price:"¥ 1,000",
        desc:"文庫サイズ / 120P / 全年齢\n特製ノベルティステッカー付き",
        descriptionFontSize:38, image:null, imageWidth:0, imageHeight:0, noImage:false
      },
      {
        category:"既刊", ageRating:"全年齢",
        title:"既刊イラスト集", price:"¥ 500",
        desc:"B5 / 24P / フルカラー\n過去イラストまとめ冊子",
        descriptionFontSize:36, image:null, imageWidth:0, imageHeight:0, noImage:false
      }
    ];

    document.addEventListener("DOMContentLoaded", init);

    function init() {
      canvas = document.getElementById("oshinagakiCanvas");
      buildPalette();
      renderItems();
      bindEvents();
      updateLayout();
    }

    function buildPalette() {
      const root = document.getElementById("presetColorPalette");
      root.innerHTML = "";

      PALETTES.forEach((preset, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.title = `CMYK ${preset.cmyk}`;
        button.innerHTML = `<span class="swatch" style="background:${preset.hex}"></span>${preset.name}`;
        if (index === 0) button.classList.add("selected");

        button.addEventListener("click", () => {
          selectedPalette = preset;
          root.querySelectorAll("button").forEach((el) => el.classList.remove("selected"));
          button.classList.add("selected");

          document.getElementById("bgTypeSelect").value = "color";
          document.getElementById("patternControls").classList.add("hidden");
          document.getElementById("customBgControls").classList.add("hidden");
          document.getElementById("singleColorControls").classList.remove("hidden");
          document.getElementById("bgColorPicker").value = preset.background;
          document.getElementById("headerBgColor").value = preset.header;
          document.getElementById("headerAccentColor").value = preset.accent;
          document.getElementById("eventInfoTextColor").value = "#ffffff";
          document.getElementById("circleInfoTextColor").value = "#ffffff";
          document.getElementById("spaceInfoTextColor").value = "#ffffff";
          document.getElementById("spaceInfoBgColor").value = preset.space;
          renderCanvas();
        });

        root.appendChild(button);
      });
    }

    function updateLayout() {
      paper = document.getElementById("paperSizeSelect").value;
      const orientationSelect = document.getElementById("orientationSelect");
      const social = SOCIAL_PRESETS[paper];

      if (social) {
        orientation = social.orientation;
        orientationSelect.value = orientation;
        orientationSelect.disabled = true;
        outputWidth = social.width;
        outputHeight = social.height;
        trimWidth = outputWidth;
        trimHeight = outputHeight;
        bleedLeft = bleedTop = safeX = safeY = 0;
      } else {
        orientationSelect.disabled = false;
        orientation = orientationSelect.value;

        const spec = PRINT_SPECS[paper];
        const landscape = orientation === "LANDSCAPE";
        outputWidth = landscape ? spec.heightPx : spec.widthPx;
        outputHeight = landscape ? spec.widthPx : spec.heightPx;

        const outWmm = landscape ? spec.heightMm : spec.widthMm;
        const outHmm = landscape ? spec.widthMm : spec.heightMm;
        const trimWmm = landscape ? spec.trimHeightMm : spec.trimWidthMm;
        const trimHmm = landscape ? spec.trimWidthMm : spec.trimHeightMm;

        trimWidth = Math.round(trimWmm * outputWidth / outWmm);
        trimHeight = Math.round(trimHmm * outputHeight / outHmm);
        bleedLeft = Math.floor((outputWidth - trimWidth) / 2);
        bleedTop = Math.floor((outputHeight - trimHeight) / 2);
        safeX = Math.ceil(BLEED_MM * trimWidth / trimWmm);
        safeY = Math.ceil(BLEED_MM * trimHeight / trimHmm);
      }

      canvas.width = outputWidth;
      canvas.height = outputHeight;

      document.getElementById("canvasStage").style.width = `${outputWidth}px`;
      document.getElementById("canvasStage").style.height = `${outputHeight}px`;

      const socialInfo = SOCIAL_LAYOUTS[paper];
      applyHeaderDefaults(socialInfo);
      updateGuides();

      const label = social
        ? `${social.label} (${outputWidth} × ${outputHeight}px)`
        : `${paper}${orientation === "LANDSCAPE" ? "横" : "縦"} 塗り足し込み ${outputWidth} × ${outputHeight}px`;

      document.getElementById("paperSpecLabel").textContent = label;
      document.getElementById("dimensionDisplay").textContent = label;
      document.getElementById("layoutHelp").textContent = social
        ? "SNS向けサイズ。印刷用の塗り足しガイドはありません。"
        : "プレビュー全体が塗り足し込み。白線＝仕上がり範囲、赤点線＝安全マージンです。";

      previewMode = "fit";
      fitPreview();
      renderCanvas();
    }

    function applyHeaderDefaults(social) {
      let size;

      if (social) {
        size = {
          event: social.eventFont,
          circle: social.circleFont,
          space: social.spaceFont
        };
      } else {
        const scale = Math.max(.9, Math.min(1.25, Math.sqrt((trimWidth * trimHeight) / (3307 * 2339))));
        size = {
          event: Math.round(60 * scale),
          circle: Math.round(150 * scale),
          space: Math.round(90 * scale)
        };
      }

      document.getElementById("eventInfoFontSize").value = size.event;
      document.getElementById("circleInfoFontSize").value = size.circle;
      document.getElementById("spaceInfoFontSize").value = size.space;
    }

    function updateGuides() {
      const trimGuide = document.getElementById("trimGuide");
      const safeGuide = document.getElementById("safeGuide");
      const print = Boolean(PRINT_SPECS[paper]);

      trimGuide.classList.toggle("hidden", !print);
      safeGuide.classList.toggle("hidden", !print);
      if (!print) return;

      trimGuide.style.left = `${bleedLeft}px`;
      trimGuide.style.top = `${bleedTop}px`;
      trimGuide.style.width = `${trimWidth}px`;
      trimGuide.style.height = `${trimHeight}px`;

      safeGuide.style.left = `${bleedLeft + safeX}px`;
      safeGuide.style.top = `${bleedTop + safeY}px`;
      safeGuide.style.width = `${Math.max(1, trimWidth - safeX * 2)}px`;
      safeGuide.style.height = `${Math.max(1, trimHeight - safeY * 2)}px`;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function renderItems() {
      const root = document.getElementById("itemsContainer");
      root.innerHTML = "";

      items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-card-head">
            <span>頒布物 #${index + 1}</span>
            <div>
              <button type="button" data-move="${index}" data-dir="-1" ${index === 0 ? "disabled" : ""}>↑</button>
              <button type="button" data-move="${index}" data-dir="1" ${index === items.length - 1 ? "disabled" : ""}>↓</button>
              ${items.length > 1 ? `<button type="button" class="delete-item" data-remove="${index}">削除</button>` : ""}
            </div>
          </div>
          <div class="two-col">
            <label class="field">カテゴリ
              <select class="control" data-index="${index}" data-key="category">
                ${["新刊", "既刊", "無料配布", "Web展示"].map((v) =>
                  `<option value="${v}" ${item.category === v ? "selected" : ""}>${v}</option>`
                ).join("")}
              </select>
            </label>
            <label class="field">年齢区分
              <select class="control" data-index="${index}" data-key="ageRating">
                <option value="全年齢" ${item.ageRating === "全年齢" ? "selected" : ""}>全年齢</option>
                <option value="R18" ${item.ageRating === "R18" ? "selected" : ""}>R18</option>
              </select>
            </label>
          </div>
          <label class="field">タイトル
            <input class="control" type="text" data-index="${index}" data-key="title" value="${escapeHTML(item.title)}">
          </label>
          <label class="field">値段（無料配布・Web展示は空欄）
            <input class="control" type="text" data-index="${index}" data-key="price"
              value="${escapeHTML(item.price || "")}" ${["無料配布","Web展示"].includes(item.category) ? "disabled" : ""}>
          </label>
          <label class="field">説明
            <textarea class="control" data-index="${index}" data-key="desc" rows="3">${escapeHTML(item.desc)}</textarea>
          </label>
          <label class="field">説明文フォントサイズ
            <input class="control" type="number" min="8" max="100" step="1"
              data-index="${index}" data-key="descriptionFontSize" value="${item.descriptionFontSize || 38}">
          </label>
          <label class="check-row" style="justify-content:flex-start">
            <input type="checkbox" data-noimage="${index}" ${item.noImage ? "checked" : ""}>
            画像なし（テキスト欄を広く表示）
          </label>
          <label class="field">個別画像
            <input class="control" type="file" accept="image/*" data-image="${index}" ${item.noImage ? "disabled" : ""}>
          </label>
        `;
        root.appendChild(card);
      });

      root.querySelectorAll("[data-index]").forEach((input) => {
        const update = () => {
          const index = Number(input.dataset.index);
          const key = input.dataset.key;
          if (!items[index]) return;

          if (key === "descriptionFontSize") {
            const n = Number.parseInt(input.value, 10);
            items[index][key] = Number.isFinite(n) ? Math.min(100, Math.max(8, n)) : 38;
          } else {
            items[index][key] = input.value;
          }

          if (key === "category") {
            const price = root.querySelector(`[data-index="${index}"][data-key="price"]`);
            const free = ["無料配布", "Web展示"].includes(input.value);
            if (price) {
              price.disabled = free;
              if (free) {
                price.value = "";
                items[index].price = "";
              }
            }
          }
          renderCanvas();
        };
        input.addEventListener("input", update);
        input.addEventListener("change", update);
      });

      root.querySelectorAll("[data-image]").forEach((input) => {
        input.addEventListener("change", () => loadItemImage(Number(input.dataset.image), input.files?.[0]));
      });

      root.querySelectorAll("[data-noimage]").forEach((input) => {
        input.addEventListener("change", () => {
          const index = Number(input.dataset.noimage);
          if (!items[index]) return;
          items[index].noImage = input.checked;
          const fileInput = root.querySelector(`[data-image="${index}"]`);
          if (fileInput) {
            fileInput.disabled = input.checked;
            if (input.checked) fileInput.value = "";
          }
          renderCanvas();
        });
      });

      root.querySelectorAll("[data-move]").forEach((button) => {
        button.addEventListener("click", () => {
          const from = Number(button.dataset.move);
          const to = from + Number(button.dataset.dir);
          if (to < 0 || to >= items.length) return;
          [items[from], items[to]] = [items[to], items[from]];
          renderItems();
          renderCanvas();
        });
      });

      root.querySelectorAll("[data-remove]").forEach((button) => {
        button.addEventListener("click", () => {
          items.splice(Number(button.dataset.remove), 1);
          renderItems();
          renderCanvas();
        });
      });
    }

    function addItem() {
      items.push({
        category: "新刊",
        ageRating: "全年齢",
        title: `頒布物 #${items.length + 1}`,
        price: "¥ 500",
        desc: "",
        descriptionFontSize: 38,
        image: null,
        imageWidth: 0,
        imageHeight: 0,
        noImage: false
      });
      renderItems();
      renderCanvas();
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像の読み込みに失敗しました。"));
        image.src = src;
      });
    }

    async function readImageFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        throw new Error("画像ファイルを選択してください。");
      }
      const src = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`画像を読み込めませんでした: ${file.name}`));
        reader.readAsDataURL(file);
      });
      const image = await loadImage(src);
      return { src, image, width: image.naturalWidth, height: image.naturalHeight };
    }

    async function loadItemImage(index, file) {
      if (!file || !items[index]) return;
      try {
        const loaded = await readImageFile(file);
        Object.assign(items[index], {
          image: loaded.image,
          imageSrc: loaded.src,
          imageWidth: loaded.width,
          imageHeight: loaded.height,
          noImage: false
        });
        renderItems();
        renderCanvas();
      } catch (error) {
        alert(error.message);
      }
    }

    async function uploadBatch(files) {
      const selected = Array.from(files || []);
      if (!selected.length) return;

      try {
        const loaded = await Promise.all(selected.map(readImageFile));
        loaded.forEach((entry, index) => {
          const fields = {
            image: entry.image,
            imageSrc: entry.src,
            imageWidth: entry.width,
            imageHeight: entry.height,
            noImage: false
          };
          if (index < items.length) {
            Object.assign(items[index], fields);
          } else {
            items.push({
              category: "新刊",
              ageRating: "全年齢",
              title: `新刊アイテム ${index + 1}`,
              price: "¥ 500",
              desc: "",
              descriptionFontSize: 38,
              ...fields
            });
          }
        });
        renderItems();
        renderCanvas();
      } catch (error) {
        alert(error.message);
      }
    }

    function makePattern(style, color) {
      const tile = document.createElement("canvas");
      tile.width = tile.height = 240;
      const ctx = tile.getContext("2d");
      ctx.fillStyle = "#fff8fb";
      ctx.fillRect(0, 0, 240, 240);

      if (style === "dots") {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(60, 60, 16, 0, Math.PI * 2);
        ctx.arc(180, 180, 16, 0, Math.PI * 2);
        ctx.fill();
      } else if (style === "stripes") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 120, 240);
      } else if (style === "diagonal") {
        ctx.save();
        ctx.translate(120, 120);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = color;
        for (let x = -360; x <= 360; x += 110) ctx.fillRect(x, -360, 36, 720);
        ctx.restore();
      } else if (style === "border") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 240, 120);
      } else if (style === "check") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 120, 120);
        ctx.fillRect(120, 120, 120, 120);
      }
      return tile;
    }

    function getBackgroundImage() {
      const type = document.getElementById("bgTypeSelect").value;
      if (type === "custom") return customBackground;
      return null;
    }

    function drawBackground(ctx) {
      const type = document.getElementById("bgTypeSelect").value;

      if (type === "color") {
        ctx.fillStyle = document.getElementById("bgColorPicker").value;
        ctx.fillRect(0, 0, outputWidth, outputHeight);
        return;
      }

      if (type === "custom" && customBackground) {
        // 背景画像は塗り足し込みキャンバス全体を覆う。
        ctx.drawImage(customBackground, 0, 0, outputWidth, outputHeight);
        return;
      }

      if (type === "pattern") {
        ctx.fillStyle = "#fff8fb";
        ctx.fillRect(0, 0, outputWidth, outputHeight);
        const pattern = ctx.createPattern(
          makePattern(
            document.getElementById("patternStyleSelect").value,
            selectedPalette.hex
          ),
          "repeat"
        );
        if (pattern) {
          ctx.fillStyle = pattern;
          ctx.fillRect(0, 0, outputWidth, outputHeight);
        }
        return;
      }

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, outputWidth, outputHeight);
    }

    function colorValue(id, fallback) {
      return document.getElementById(id)?.value || fallback;
    }

    function getHeaderStyle(prefix, defaultSize, defaultColor) {
      const size = Number.parseInt(document.getElementById(`${prefix}FontSize`).value, 10);
      const hasBg = document.getElementById(`${prefix}BgEnabled`).checked;
      return {
        size: Number.isFinite(size) ? size : defaultSize,
        color: colorValue(`${prefix}TextColor`, defaultColor),
        bg: hasBg ? colorValue(`${prefix}BgColor`, "") : ""
      };
    }

    function roundRect(ctx, x, y, w, h, radius, fill, stroke, lineWidth = 1) {
      const r = Math.min(radius, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }
    }

    function wrapLines(ctx, text, maxWidth) {
      const lines = [];
      String(text || "").split("\n").forEach((paragraph) => {
        let line = "";
        for (const char of Array.from(paragraph)) {
          const next = line + char;
          if (line && ctx.measureText(next).width > maxWidth) {
            lines.push(line);
            line = char;
          } else {
            line = next;
          }
        }
        lines.push(line);
      });
      return lines.length ? lines : [""];
    }

    function fitText(ctx, text, box, options = {}) {
      const family = options.family || '"Noto Sans JP", sans-serif';
      const weight = options.weight || "normal";
      const maxFont = Math.max(1, options.maxFont || 24);
      const minFont = Math.max(1, options.minFont || 1);
      const lineHeightRatio = options.lineHeight || 1.15;
      let chosen = minFont;
      let lines = [];

      for (let fontSize = maxFont; fontSize >= minFont; fontSize -= Math.max(.5, maxFont / 80)) {
        ctx.font = `${weight} ${fontSize}px ${family}`;
        const testLines = wrapLines(ctx, text, Math.max(1, box.width));
        const lineHeight = fontSize * lineHeightRatio;

        if (testLines.length * lineHeight <= box.height) {
          chosen = fontSize;
          lines = testLines;
          break;
        }
      }

      if (!lines.length) {
        ctx.font = `${weight} ${minFont}px ${family}`;
        lines = wrapLines(ctx, text, Math.max(1, box.width));
        const maxLines = Math.max(1, Math.floor(box.height / (minFont * lineHeightRatio)));
        if (lines.length > maxLines) {
          lines = lines.slice(0, maxLines);
          const last = Array.from(lines[maxLines - 1] || "");
          while (last.length && ctx.measureText(`${last.join("")}…`).width > box.width) last.pop();
          lines[maxLines - 1] = `${last.join("")}…`;
        }
      }

      const lineHeight = chosen * lineHeightRatio;
      const totalHeight = lines.length * lineHeight;
      let y = box.y + Math.max(0, (box.height - totalHeight) / 2);

      if (options.background) {
        ctx.fillStyle = options.background;
        ctx.fillRect(box.x, box.y, box.width, box.height);
      }

      ctx.font = `${weight} ${chosen}px ${family}`;
      ctx.fillStyle = options.color || "#111827";
      ctx.textBaseline = "top";
      ctx.textAlign = options.align || "left";

      const x = options.align === "center"
        ? box.x + box.width / 2
        : options.align === "right"
          ? box.x + box.width
          : box.x;

      lines.forEach((line) => {
        ctx.fillText(line, x, y, box.width);
        y += lineHeight;
      });
    }

    function drawHeader(ctx, social, headerHeight) {
      const eventStyle = getHeaderStyle(
        "eventInfo",
        social ? social.eventFont : 60,
        "#ffffff"
      );
      const circleStyle = getHeaderStyle(
        "circleInfo",
        social ? social.circleFont : 150,
        "#ffffff"
      );
      const spaceStyle = getHeaderStyle(
        "spaceInfo",
        social ? social.spaceFont : 90,
        "#ffffff"
      );

      const startX = social ? social.marginX : safeX + 8;
      const width = Math.max(1, trimWidth - startX * 2);

      if (social) {
        const top = currentPaperSize === "PICSQUARE" ? 5 : Math.max(6, headerHeight * .04);
        const gap = currentPaperSize === "PICSQUARE" ? 2 : Math.max(3, headerHeight * .018);
        const usable = headerHeight - top * 2;
        const eventH = currentPaperSize === "PICSQUARE" ? 29 : usable * .25;
        const circleH = currentPaperSize === "PICSQUARE" ? 44 : usable * .34;
        const spaceH = Math.max(1, usable - eventH - circleH - gap * 2);
        let y = top;

        fitText(ctx,
          `${document.getElementById("eventDate").value} | ${document.getElementById("eventName").value}`,
          { x: startX, y, width, height: eventH },
          { maxFont: eventStyle.size, minFont: 7, color: eventStyle.color, background: eventStyle.bg }
        );

        y += eventH + gap;
        fitText(ctx, document.getElementById("circleName").value,
          { x: startX, y, width, height: circleH },
          { maxFont: circleStyle.size, minFont: 8, weight: "700", color: circleStyle.color, background: circleStyle.bg }
        );

        y += circleH + gap;
        const space = document.getElementById("spaceNo").value;
        if (space) {
          fitText(ctx, ` ${space} `,
            { x: startX, y, width, height: spaceH },
            { maxFont: spaceStyle.size, minFont: 7, weight: "700", family: '"M PLUS Rounded 1c", sans-serif', color: spaceStyle.color, background: spaceStyle.bg, align: "center" }
          );
        }
        return;
      }

      const scale = Math.min(trimWidth / 3307, trimHeight / 2339);
      const top = Math.max(safeY, headerHeight * .055);
      const bottom = Math.max(safeY, 10 * scale);
      const available = Math.max(1, headerHeight - top - bottom);
      const gap = Math.max(5 * scale, available * .055);
      const rowHeight = Math.max(1, available - gap * 2);
      const eventH = rowHeight * .24;
      const circleH = rowHeight * .43;
      const spaceH = rowHeight - eventH - circleH;
      let y = top;

      fitText(ctx,
        `${document.getElementById("eventDate").value} | ${document.getElementById("eventName").value}`,
        { x: startX, y, width, height: eventH },
        { maxFont: eventStyle.size, minFont: 10 * scale, color: eventStyle.color, background: eventStyle.bg }
      );

      y += eventH + gap;
      fitText(ctx, document.getElementById("circleName").value,
        { x: startX, y, width, height: circleH },
        { maxFont: circleStyle.size, minFont: 12 * scale, weight: "700", color: circleStyle.color, background: circleStyle.bg }
      );

      y += circleH + gap;
      const space = document.getElementById("spaceNo").value;
      if (space) {
        fitText(ctx, ` ${space} `,
          { x: startX, y, width, height: spaceH },
          { maxFont: spaceStyle.size, minFont: 10 * scale, weight: "700", family: '"M PLUS Rounded 1c", sans-serif', color: spaceStyle.color, background: spaceStyle.bg, align: "center" }
        );
      }
    }

    function drawBandLabel(ctx, text, box, maxFont, color, weight = "700") {
      fitText(ctx, text, box, {
        maxFont,
        minFont: 1,
        weight,
        family: '"M PLUS Rounded 1c", sans-serif',
        color,
        align: "center",
        lineHeight: 1
      });
    }

    function drawCard(ctx, item, x, y, width, height, config, landscape) {
      const pad = config.padding;
      const radius = config.radius;
      roundRect(ctx, x, y, width, height, radius, "#ffffff", "#cbd5e1", Math.max(1, config.scale * 3));

      const style = CATEGORY_STYLES[item.category] || CATEGORY_STYLES["新刊"];
      const categoryH = Math.min(config.categoryBand, height * .16, Math.max(18, width * .09));
      const ageH = Math.min(config.ageBand, height * .11, Math.max(15, width * .055));

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.clip();

      ctx.fillStyle = style.background;
      ctx.fillRect(x, y, width, categoryH);
      drawBandLabel(ctx, item.category, {
        x: x + pad, y: y + 1, width: width - pad * 2, height: categoryH - 2
      }, Math.min(categoryH * .78, width * .2), style.text);

      const ageY = y + categoryH;
      ctx.fillStyle = item.ageRating === "R18" ? "#991b1b" : "#dcfce7";
      ctx.fillRect(x, ageY, width, ageH);
      drawBandLabel(ctx, item.ageRating === "R18" ? "R18" : "全年齢", {
        x: x + pad, y: ageY + 1, width: width - pad * 2, height: ageH - 2
      }, Math.min(ageH * .75, width * .16), item.ageRating === "R18" ? "#ffffff" : "#166534");

      const bodyY = ageY + ageH + pad;
      const bodyH = Math.max(1, height - categoryH - ageH - pad * 2);
      let textX = x + pad;
      let textW = width - pad * 2;
      let imageBox = null;

      if (item.image && !item.noImage) {
        const maxImageW = width * (landscape ? .38 : .36);
        const scale = Math.min(maxImageW / item.image.width, bodyH / item.image.height);
        const drawW = item.image.width * scale;
        const drawH = item.image.height * scale;
        imageBox = {
          x: x + pad,
          y: bodyY + (bodyH - drawH) / 2,
          width: drawW,
          height: drawH
        };
        textX = imageBox.x + drawW + (config.social ? 10 : 24);
        textW = Math.max(1, x + width - pad - textX);
      }

      const content = [];
      if (item.title) {
        content.push({
          text: item.title,
          ratio: .42,
          max: 78 * config.textScale,
          min: Math.max(5, 8 * config.textScale),
          family: '"Noto Sans JP", sans-serif',
          weight: "700",
          color: "#0f172a"
        });
      }

      if (!["無料配布", "Web展示"].includes(item.category) && item.price) {
        content.push({
          text: item.price,
          ratio: .28,
          max: 100 * config.textScale,
          min: Math.max(5, 8 * config.textScale),
          family: '"M PLUS Rounded 1c", sans-serif',
          weight: "700",
          color: style.background
        });
      }

      if (item.desc) {
        content.push({
          text: item.desc,
          ratio: .30,
          max: Math.max(8, Math.min(100, Number(item.descriptionFontSize) || 38)) * config.textScale,
          min: Math.max(4, 7 * config.textScale),
          family: '"Noto Sans JP", sans-serif',
          weight: "400",
          color: "#475569"
        });
      }

      const ratios = content.reduce((sum, part) => sum + part.ratio, 0);
      let cursorY = bodyY;

      content.forEach((part) => {
        const partH = Math.max(1, bodyH * part.ratio / Math.max(.01, ratios));
        fitText(ctx, part.text, { x: textX, y: cursorY, width: textW, height: partH }, {
          maxFont: part.max,
          minFont: part.min,
          family: part.family,
          weight: part.weight,
          color: part.color
        });
        cursorY += partH;
      });

      if (imageBox && item.image) {
        try {
          ctx.drawImage(item.image, imageBox.x, imageBox.y, imageBox.width, imageBox.height);
        } catch (error) {
          console.warn("頒布物画像の描画に失敗しました", error);
        }
      }

      ctx.restore();
      roundRect(ctx, x, y, width, height, radius, null, "#cbd5e1", Math.max(1, config.scale * 3));
    }

    function renderCanvas() {
      if (!canvas) return;

      const token = ++renderToken;
      const ctx = canvas.getContext("2d", { alpha: false });
      if (!ctx) return;

      ctx.clearRect(0, 0, outputWidth, outputHeight);
      drawBackground(ctx);

      const social = SOCIAL_LAYOUTS[paper] || null;
      const landscape = orientation === "LANDSCAPE";
      const headerH = social
        ? social.header
        : Math.round(trimHeight * (landscape ? .17 : .15));

      const headerColor = document.getElementById("headerBgColor").value || "#3b0a1e";
      const accentColor = document.getElementById("headerAccentColor").value || selectedPalette.accent;

      // ヘッダー背景色は上端の塗り足しにも続ける。
      ctx.fillStyle = headerColor;
      ctx.fillRect(0, 0, outputWidth, Math.min(outputHeight, bleedTop + headerH));

      const accentH = social ? Math.max(3, headerH * .025) : 12 * (trimWidth / 3307);
      ctx.fillStyle = accentColor;
      ctx.fillRect(bleedLeft, bleedTop + headerH - accentH, trimWidth, accentH);

      drawHeader(
        ctx,
        social,
        headerH,
        document.getElementById("eventInfoFontSize").value,
        document.getElementById("circleInfoFontSize").value,
        document.getElementById("spaceInfoFontSize").value
      );

      let columns = 2;
      if (paper === "WEB_LANDSCAPE") columns = items.length <= 1 ? 1 : 2;
      else if (social) columns = items.length <= 3 ? 1 : 2;
      else if (landscape) columns = items.length <= 1 ? 1 : (items.length > 4 ? 3 : 2);
      else if (items.length <= 3) columns = 1;

      const marginX = social ? social.marginX : safeX;
      const marginY = social ? social.marginY : safeY;
      const gapX = social ? social.gapX : 40 * (trimWidth / 3307);
      const gapY = social ? social.gapY : 40 * (trimWidth / 3307);
      const padding = social ? social.padding : 25 * (trimWidth / 3307);
      const startY = headerH + (social ? 10 : Math.max(24 * (trimWidth / 3307), safeY));
      const rows = Math.max(1, Math.ceil(items.length / columns));
      const cardW = Math.max(1, (trimWidth - marginX * 2 - gapX * (columns - 1)) / columns);
      const cardH = Math.max(1, (trimHeight - startY - marginY - gapY * (rows - 1)) / rows);
      const textScale = social ? social.cardScale : trimWidth / 3307;

      const config = {
        social: Boolean(social),
        padding,
        radius: social ? 12 : 24 * (trimWidth / 3307),
        categoryBand: social ? social.categoryBand : cardH * .14,
        ageBand: social ? social.ageBand : cardH * .09,
        scale: trimWidth / 3307,
        textScale
      };

      items.forEach((item, index) => {
        if (token !== renderToken) return;
        const row = Math.floor(index / columns);
        const column = index % columns;
        const x = bleedLeft + marginX + column * (cardW + gapX);
        const y = bleedTop + startY + row * (cardH + gapY);
        drawCard(ctx, item, x, y, cardW, cardH, config, landscape);
      });
    }

    function applyPreviewScale(scale) {
      const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      const container = document.getElementById("canvasContainer");
      const stage = document.getElementById("canvasStage");

      stage.style.width = `${outputWidth}px`;
      stage.style.height = `${outputHeight}px`;
      stage.style.transform = `scale(${safeScale})`;
      container.style.width = `${outputWidth * safeScale}px`;
      container.style.height = `${outputHeight * safeScale}px`;

      document.getElementById("zoomDisplay").textContent = `表示 ${Math.round(safeScale * 100)}%`;
      document.getElementById("zoomSlider").value =
        String(Math.max(1, Math.min(200, Math.round(safeScale * 100))));
    }

    function fitPreview() {
      const workspace = document.getElementById("workspace");
      const availableWidth = Math.max(1, workspace.clientWidth - 50);
      const availableHeight = Math.max(1, workspace.clientHeight - 75);
      applyPreviewScale(Math.min(availableWidth / outputWidth, availableHeight / outputHeight));
    }

    function setupScaler() {
      const workspace = document.getElementById("workspace");
      if ("ResizeObserver" in window) {
        new ResizeObserver(() => {
          if (previewMode === "fit") fitPreview();
        }).observe(workspace);
      }
      window.addEventListener("resize", () => {
        if (previewMode === "fit") fitPreview();
      });
    }

    function waitForFonts() {
      if (document.fonts && document.fonts.ready) {
        return document.fonts.ready.catch(() => {});
      }
      return Promise.resolve();
    }

    async function exportData() {
      await waitForFonts();
      renderCanvas();
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

      const social = SOCIAL_PRESETS[paper];
      if (social) {
        return {
          dataUrl: canvas.toDataURL("image/png"),
          widthPx: outputWidth,
          heightPx: outputHeight,
          widthMm: outputWidth * 25.4 / 200,
          heightMm: outputHeight * 25.4 / 200,
          hasBleed: false
        };
      }

      const spec = PRINT_SPECS[paper];
      const landscape = orientation === "LANDSCAPE";
      return {
        dataUrl: canvas.toDataURL("image/png"),
        widthPx: outputWidth,
        heightPx: outputHeight,
        widthMm: landscape ? spec.heightMm : spec.widthMm,
        heightMm: landscape ? spec.widthMm : spec.heightMm,
        hasBleed: true
      };
    }

    function setupToolbarDrag() {
      const toolbar = document.getElementById("previewToolbar");
      const handle = document.getElementById("previewToolbarDrag");
      const workspace = document.getElementById("workspace");
      let drag = null;

      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const t = toolbar.getBoundingClientRect();
        const w = workspace.getBoundingClientRect();

        toolbar.style.left = `${t.left - w.left}px`;
        toolbar.style.top = `${t.top - w.top}px`;
        toolbar.style.right = "auto";
        toolbar.style.bottom = "auto";

        drag = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          left: t.left - w.left,
          top: t.top - w.top
        };
        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        const rect = workspace.getBoundingClientRect();
        toolbar.style.left = `${Math.max(0, Math.min(rect.width - toolbar.offsetWidth, drag.left + event.clientX - drag.x))}px`;
        toolbar.style.top = `${Math.max(0, Math.min(rect.height - toolbar.offsetHeight, drag.top + event.clientY - drag.y))}px`;
      });

      const end = (event) => {
        if (drag && drag.id === event.pointerId) drag = null;
      };
      handle.addEventListener("pointerup", end);
      handle.addEventListener("pointercancel", end);
    }

    async function openPreview() {
      const popup = window.open("", "_blank");
      if (!popup) {
        alert("プレビューを開けません。ポップアップを許可してください。");
        return;
      }

      try {
        const data = await exportData();
        popup.document.open();
        popup.document.write(`<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出力プレビュー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:sans-serif}
body{background:#1e293b;color:#f8fafc}
.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#0f172a}
.toolbar button{border:0;border-radius:6px;padding:8px 12px;color:#fff;background:#334155;cursor:pointer}
.toolbar .print{background:#e11d48}
.preview{height:calc(100vh - 60px);overflow:auto;padding:24px}
.sheet{width:${data.widthPx}px;height:${data.heightPx}px;margin:0 auto;background:#fff;box-shadow:0 8px 30px #0006}
.sheet img{display:block;width:100%;height:100%}
body.fit .sheet{width:auto;height:auto;max-width:100%}
body.fit .sheet img{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
@page{size:${data.widthMm}mm ${data.heightMm}mm;margin:0}
@media print{
html,body{width:${data.widthMm}mm;height:${data.heightMm}mm;margin:0;padding:0;overflow:hidden;background:#fff}
.toolbar{display:none!important}
.preview{width:${data.widthMm}mm;height:${data.heightMm}mm;overflow:hidden;padding:0}
.sheet{width:${data.widthMm}mm!important;height:${data.heightMm}mm!important;margin:0!important;box-shadow:none}
.sheet img{width:${data.widthMm}mm!important;height:${data.heightMm}mm!important}
}
</style>
</head>
<body>
<div class="toolbar">
<strong>${data.hasBleed ? "塗り足し込み" : "Webサイズ"} プレビュー</strong>
<button id="actual">100%表示</button>
<button id="fit">画面に合わせる</button>
<button id="print" class="print">印刷</button>
<span>${data.widthPx} × ${data.heightPx}px</span>
</div>
<main class="preview"><div class="sheet"><img src="${data.dataUrl}" alt="出力プレビュー"></div></main>
<script>
document.getElementById("actual").onclick=()=>document.body.classList.remove("fit");
document.getElementById("fit").onclick=()=>document.body.classList.add("fit");
document.getElementById("print").onclick=()=>window.print();
<\/script>
</body>
</html>`);
        popup.document.close();
      } catch (error) {
        popup.close();
        alert(`プレビューを作成できませんでした: ${error.message}`);
      }
    }

    function bindEvents() {
      document.getElementById("paperSizeSelect").addEventListener("change", updateLayout);
      document.getElementById("orientationSelect").addEventListener("change", updateLayout);

      ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
        document.getElementById(id).addEventListener("input", renderCanvas);
      });

      [
        "headerBgColor", "headerAccentColor",
        "eventInfoFontSize", "eventInfoTextColor", "eventInfoBgEnabled", "eventInfoBgColor",
        "circleInfoFontSize", "circleInfoTextColor", "circleInfoBgEnabled", "circleInfoBgColor",
        "spaceInfoFontSize", "spaceInfoTextColor", "spaceInfoBgEnabled", "spaceInfoBgColor"
      ].forEach((id) => {
        const input = document.getElementById(id);
        input.addEventListener("input", renderCanvas);
        input.addEventListener("change", renderCanvas);
      });

      document.getElementById("bgTypeSelect").addEventListener("change", (event) => {
        const type = event.target.value;
        document.getElementById("patternControls").classList.toggle("hidden", type !== "pattern");
        document.getElementById("customBgControls").classList.toggle("hidden", type !== "custom");
        document.getElementById("singleColorControls").classList.toggle("hidden", type !== "color");
        renderCanvas();
      });

      document.getElementById("patternStyleSelect").addEventListener("change", renderCanvas);
      document.getElementById("bgColorPicker").addEventListener("input", renderCanvas);

      document.getElementById("customBgInput").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const loaded = await readImageFile(file);
          customBackground = loaded.image;
          renderCanvas();
        } catch (error) {
          alert(error.message);
        }
      });

      document.getElementById("batchImageInput").addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        event.target.value = "";
        await uploadBatch(files);
      });

      document.getElementById("addItemBtn").addEventListener("click", addItem);

      document.getElementById("fitCanvasBtn").addEventListener("click", () => {
        previewMode = "fit";
        fitPreview();
      });

      document.getElementById("zoomSlider").addEventListener("input", (event) => {
        previewMode = "manual";
        applyPreviewScale(Number(event.target.value) / 100);
      });

      document.getElementById("toggleGrid").addEventListener("change", (event) => {
        document.getElementById("canvasStage").style.backgroundImage = event.target.checked
          ? "linear-gradient(to right,rgba(15,23,42,.16) 1px,transparent 1px),linear-gradient(to bottom,rgba(15,23,42,.16) 1px,transparent 1px)"
          : "none";
        document.getElementById("canvasStage").style.backgroundSize = "20px 20px";
      });

      setupToolbarDrag();
      document.getElementById("printPreviewBtn").addEventListener("click", openPreview);

      document.getElementById("exportPng").addEventListener("click", async () => {
        try {
          const data = await exportData();
          const link = document.createElement("a");
          link.download = `oshinagaki_${paper}_${orientation}_${data.widthPx}x${data.heightPx}.png`;
          link.href = data.dataUrl;
          link.click();
        } catch (error) {
          alert(`PNGを書き出せませんでした: ${error.message}`);
        }
      });

      document.getElementById("exportPdf").addEventListener("click", async () => {
        try {
          const data = await exportData();
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: data.widthMm >= data.heightMm ? "landscape" : "portrait",
            unit: "mm",
            format: [data.widthMm, data.heightMm]
          });
          pdf.addImage(data.dataUrl, "PNG", 0, 0, data.widthMm, data.heightMm);
          pdf.save(`oshinagaki_${paper}_${orientation}.pdf`);
        } catch (error) {
          alert(`PDFを書き出せませんでした: ${error.message}`);
        }
      });
    }
  </script>
</body>
</html>
