<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同人おしながきジェネレーター</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Noto Sans JP", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
      background: #1e293b;
    }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(120deg, #f43f5e, #9333ea);
      color: #fff;
      font-size: 19px;
    }
    .brand h1 { margin: 0; font-size: 14px; line-height: 1.3; }
    .brand p {
      overflow: hidden;
      margin: 2px 0 0;
      color: #94a3b8;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .top-actions { display: flex; flex: 0 0 auto; gap: 6px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 0;
      border-radius: 7px;
      padding: 8px 10px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    .button-print { background: #475569; }
    .button-png { background: #059669; }
    .button-pdf { background: #e11d48; }

    #mainLayout { display: flex; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    #settingsPanel {
      display: flex;
      flex: 0 0 410px;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
      border-right: 1px solid #334155;
      background: #1e293b;
    }
    .panel-heading {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }
    .panel-heading small {
      border: 1px solid #166534;
      border-radius: 999px;
      padding: 3px 7px;
      background: #052e16;
      color: #4ade80;
      font-size: 9px;
    }
    #settingsContent { flex: 1 1 auto; overflow: auto; padding: 14px; }
    .section {
      margin-bottom: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      background: rgba(15, 23, 42, .65);
    }
    .section h2 { margin: 0 0 10px; color: #fb7185; font-size: 12px; }
    .field { display: block; margin-bottom: 9px; color: #94a3b8; font-size: 10px; }
    .field:last-child { margin-bottom: 0; }
    .control {
      display: block;
      width: 100%;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
    }
    .control:disabled { opacity: .5; }
    .color-control {
      width: 48px;
      height: 31px;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px;
      background: #1e293b;
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .palette button {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 9px;
    }
    .palette button.selected { outline: 2px solid #f43f5e; }
    .swatch { width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%; }
    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      color: #94a3b8;
      font-size: 10px;
    }
    .check-row input[type="checkbox"] { accent-color: #f43f5e; }
    .upload-box {
      display: block;
      border: 2px dashed #9f1239;
      border-radius: 9px;
      padding: 13px;
      background: rgba(30, 41, 59, .5);
      color: #e2e8f0;
      text-align: center;
      cursor: pointer;
    }
    .upload-box span { display: block; margin-top: 4px; font-size: 11px; font-weight: 700; }
    .upload-box small { display: block; margin-top: 3px; color: #94a3b8; font-size: 9px; }
    .item-card {
      margin-bottom: 10px;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 10px;
      background: #0f172a;
    }
    .item-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
    }
    .item-card-head button {
      border: 0;
      border-radius: 5px;
      padding: 3px 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 10px;
    }
    .item-card-head button:disabled { opacity: .4; }
    .delete-item { margin-left: 4px; background: transparent !important; color: #fb7185 !important; }
    .add-item {
      width: 100%;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
    }

    #workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 48px 20px 20px;
      background: #020617;
    }
    #canvasContainer {
      position: relative;
      flex: none;
      overflow: hidden;
      border: 1px solid #475569;
      background: #fff;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .45);
      line-height: 0;
    }
    #canvasStage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }
    #gridOverlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(15,23,42,.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15,23,42,.2) 1px, transparent 1px),
        linear-gradient(to right, rgba(15,23,42,.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15,23,42,.1) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    }
    .guide {
      position: absolute;
      z-index: 11;
      pointer-events: none;
      border: 1px dashed rgba(15, 23, 42, .65);
    }
    #trimGuide { outline: 1px solid rgba(255,255,255,.55); }
    #safeGuide { border-color: rgba(225, 29, 72, .9); }
    .hidden { display: none !important; }

    #zoomInfo {
      position: absolute;
      z-index: 12;
      top: 10px;
      left: 10px;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      background: rgba(30, 41, 59, .95);
      color: #cbd5e1;
      font-size: 10px;
    }
    #previewToolbar {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px;
      background: rgba(30, 41, 59, .96);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
      font-size: 10px;
    }
    #previewToolbar button {
      border: 0;
      border-radius: 5px;
      padding: 5px 7px;
      background: #475569;
      color: #e2e8f0;
      font-size: 10px;
    }
    #previewToolbarDrag { cursor: grab; touch-action: none; }
    #previewToolbarDrag:active { cursor: grabbing; }

    @media (max-width: 767px) {
      #mainLayout {
        display: block;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #settingsPanel {
        width: 100%;
        max-height: none;
        overflow: visible;
        border-right: 0;
      }
      #settingsContent { overflow: visible; }
      #workspace { width: 100%; height: 75vh; min-height: 480px; }
      #previewToolbar {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }
    @media (max-width: 420px) {
      .topbar { padding-right: 6px; padding-left: 6px; }
      .button { gap: 3px; padding: 7px 6px; font-size: 10px; }
      #settingsContent { padding: 10px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">✦</div>
      <div style="min-width:0">
        <h1>同人おしながきジェネレーター</h1>
        <p id="paperSpecLabel">A3横</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="printPreviewBtn" class="button button-print" type="button">プレビュー</button>
      <button id="exportPng" class="button button-png" type="button">PNG保存</button>
      <button id="exportPdf" class="button button-pdf" type="button">PDF保存</button>
    </div>
  </header>

  <div id="mainLayout">
    <aside id="settingsPanel">
      <div class="panel-heading">
        <span>デザイン・情報設定</span>
        <small>リアルタイム反映</small>
      </div>

      <div id="settingsContent">
        <section class="section">
          <h2>レイアウト・用紙設定</h2>
          <div class="two-col">
            <label class="field">用紙向き
              <select id="orientationSelect" class="control">
                <option value="LANDSCAPE">横向き</option>
                <option value="PORTRAIT">縦向き</option>
              </select>
            </label>
            <label class="field">レイアウト
              <select id="paperSizeSelect" class="control">
                <option value="A2">A2 (200dpi)</option>
                <option value="A3" selected>A3 (200dpi)</option>
                <option value="A4">A4 (350dpi)</option>
                <option value="WEB_PORTRAIT">X用縦書き (960 × 1280px)</option>
                <option value="WEB_LANDSCAPE">X用横書き (1200 × 675px)</option>
                <option value="PICSQUARE">ピクスク用 (500 × 1,000px)</option>
                <option value="PICREA">ピクリエ用 (800 × 1,600px)</option>
              </select>
            </label>
          </div>
          <div id="layoutHelp" style="color:#64748b;font-size:9px"></div>
        </section>

        <section class="section">
          <h2>背景デザイン・推奨配色</h2>
          <label class="field">背景の種類
            <select id="bgTypeSelect" class="control">
              <option value="pattern">規定パターン</option>
              <option value="custom">背景画像</option>
              <option value="color">単色カラー</option>
            </select>
          </label>

          <div class="field">
            CMYK向け推奨配色
            <div id="presetColorPalette" class="palette"></div>
            <small style="display:block;margin-top:5px;color:#64748b">
              選択すると無地背景とヘッダーに配色を適用します。表示色はCMYK値のRGB近似です。
            </small>
          </div>

          <div id="patternControls">
            <label class="field">パターン
              <select id="patternStyleSelect" class="control">
                <option value="dots">ドット</option>
                <option value="stripes">ストライプ</option>
                <option value="diagonal">斜めストライプ</option>
                <option value="border">ボーダー</option>
                <option value="check">チェック</option>
              </select>
            </label>
          </div>

          <div id="customBgControls" class="hidden">
            <label class="field">背景画像を選択
              <input id="customBgInput" type="file" accept="image/*" class="control">
            </label>
          </div>

          <div id="singleColorControls" class="hidden">
            <label class="field">背景色
              <input id="bgColorPicker" type="color" value="#ffebee" class="color-control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>イベント・サークル情報</h2>
          <label class="field">イベント日時
            <input id="eventDate" type="text" value="2026年12月30日(水)" class="control">
          </label>
          <label class="field">イベント名
            <input id="eventName" type="text" value="コミックマーケット109" class="control">
          </label>
          <div class="two-col">
            <label class="field">サークル名
              <input id="circleName" type="text" value="暁の稜線" class="control">
            </label>
            <label class="field">スペース番号
              <input id="spaceNo" type="text" value="東7ホール あ-01a" class="control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>ヘッダー文字設定</h2>
          <div class="two-col">
            <label class="field">イベント情報サイズ
              <input id="eventInfoFontSize" type="number" min="8" max="300" value="60" class="control">
            </label>
            <label class="field">イベント文字色
              <input id="eventInfoTextColor" type="color" value="#b71c1c" class="color-control">
            </label>
          </div>
          <label class="check-row">
            イベント情報の背景色
            <input id="eventInfoBgEnabled" type="checkbox">
            <input id="eventInfoBgColor" type="color" value="#ffffff" class="color-control">
          </label>
          <hr style="border-color:#334155;margin:10px 0">
          <div class="two-col">
            <label class="field">サークル名サイズ
              <input id="circleInfoFontSize" type="number" min="8" max="400" value="150" class="control">
            </label>
            <label class="field">サークル文字色
              <input id="circleInfoTextColor" type="color" value="#880e4f" class="color-control">
            </label>
          </div>
          <label class="check-row">
            サークル名の背景色
            <input id="circleInfoBgEnabled" type="checkbox">
            <input id="circleInfoBgColor" type="color" value="#ffffff" class="color-control">
          </label>
          <hr style="border-color:#334155;margin:10px 0">
          <div class="two-col">
            <label class="field">スペース番号サイズ
              <input id="spaceInfoFontSize" type="number" min="8" max="300" value="90" class="control">
            </label>
            <label class="field">スペース文字色
              <input id="spaceInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            スペース番号の背景色
            <input id="spaceInfoBgEnabled" type="checkbox" checked>
            <input id="spaceInfoBgColor" type="color" value="#c2185b" class="color-control">
          </label>
        </section>

        <section class="section">
          <h2>頒布物画像を一括アップロード</h2>
          <label class="upload-box">
            ☁
            <span>複数画像を選択</span>
            <small>選択順に頒布物へ割り当て</small>
            <input id="batchImageInput" type="file" accept="image/*" multiple hidden>
          </label>
        </section>

        <section class="section">
          <h2>頒布物一覧</h2>
          <div id="itemsContainer"></div>
          <button id="addItemBtn" class="add-item" type="button">＋ 頒布物を追加</button>
        </section>
      </div>
    </aside>

    <main id="workspace">
      <div id="zoomInfo">
        <span id="zoomDisplay">表示 --%</span>
        <span style="color:#64748b"> | </span>
        <span id="dimensionDisplay"></span>
      </div>

      <div id="previewToolbar">
        <button id="previewToolbarDrag" type="button" aria-label="操作バーを移動" title="ドラッグして移動">↕</button>
        <button id="fitCanvasBtn" type="button">全体表示</button>
        <label>倍率 <input id="zoomSlider" type="range" min="1" max="200" value="100" style="width:70px;vertical-align:middle"></label>
        <label><input id="toggleGrid" type="checkbox"> 方眼</label>
      </div>

      <div id="canvasContainer">
        <div id="canvasStage">
          <canvas id="oshinagakiCanvas"></canvas>
          <div id="gridOverlay" class="hidden"></div>
          <div id="trimGuide" class="guide hidden"></div>
          <div id="safeGuide" class="guide hidden"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    /*
      推奨色は印刷で使われるCMYKの組み合わせを基準にしたRGB近似。
      例: C0 M100 Y100 K0 は赤系。実際の色は印刷条件で変わります。
    */
    const PRESET_COLORS = [
      { name: "赤", hex: "#ed1c24", background: "#fff1f1", header: "#b5121b", accent: "#ed1c24", eventText: "#9b1118", circleText: "#7a102c", space: "#c41230", cmyk: "0,100,100,0" },
      { name: "桃", hex: "#e84a8a", background: "#fff0f5", header: "#8f1648", accent: "#d81b60", eventText: "#8f1648", circleText: "#65123d", space: "#ad1457", cmyk: "0,75,25,0" },
      { name: "橙", hex: "#f7941d", background: "#fff5e8", header: "#a84300", accent: "#e87500", eventText: "#8c3900", circleText: "#653300", space: "#b84d00", cmyk: "0,50,100,0" },
      { name: "緑", hex: "#39b54a", background: "#eef8ef", header: "#155c25", accent: "#278c39", eventText: "#155c25", circleText: "#104b35", space: "#1d6b30", cmyk: "70,0,100,0" },
      { name: "青", hex: "#0072bc", background: "#edf5fb", header: "#0b3d70", accent: "#0068a8", eventText: "#0b3d70", circleText: "#073b5c", space: "#075a96", cmyk: "100,60,0,0" },
      { name: "紫", hex: "#92278f", background: "#f7eff7", header: "#4e1452", accent: "#84217e", eventText: "#4e1452", circleText: "#351044", space: "#70206c", cmyk: "50,100,0,0" },
      { name: "灰", hex: "#666666", background: "#f1f1f1", header: "#333333", accent: "#595959", eventText: "#333333", circleText: "#222222", space: "#4a4a4a", cmyk: "0,0,0,60" }
    ];

    const CATEGORY_STYLES = {
      "新刊": { background: "#c62828", text: "#ffffff" },
      "既刊": { background: "#1565c0", text: "#ffffff" },
      "無料配布": { background: "#2e7d32", text: "#ffffff" },
      "Web展示": { background: "#00695c", text: "#ffffff" }
    };

    const SPECS = {
      A2: { width: 4677, height: 3307 },
      A3: { width: 3307, height: 2339 },
      A4: { width: 2339, height: 1654 }
    };

    const PAPER_MM = {
      A2: { width: 420, height: 594 },
      A3: { width: 297, height: 420 },
      A4: { width: 210, height: 297 }
    };

    // 縦向き基準。mmとpixelはいずれも塗り足し込み。
    const PRINT_EXPORT_SPECS = {
      A2: { widthMm: 426, heightMm: 600, widthPx: 3354, heightPx: 4724, trimWidthMm: 420, trimHeightMm: 594 },
      A3: { widthMm: 303, heightMm: 426, widthPx: 2386, heightPx: 3354, trimWidthMm: 297, trimHeightMm: 420 },
      A4: { widthMm: 216, heightMm: 303, widthPx: 2976, heightPx: 4175, trimWidthMm: 210, trimHeightMm: 297 }
    };

    const SOCIAL_PRESETS = {
      WEB_PORTRAIT: { width: 960, height: 1280, orientation: "PORTRAIT", label: "X用縦書き" },
      WEB_LANDSCAPE: { width: 1200, height: 675, orientation: "LANDSCAPE", label: "X用横書き" },
      PICSQUARE: { width: 500, height: 1000, orientation: "PORTRAIT", label: "ピクスク用" },
      PICREA: { width: 800, height: 1600, orientation: "PORTRAIT", label: "ピクリエ用" }
    };

    const SOCIAL_LAYOUTS = {
      WEB_PORTRAIT: { header: 250, marginX: 28, marginY: 22, gapX: 16, gapY: 16, padding: 12, eventFont: 18, circleFont: 32, spaceFont: 16, cardScale: .55, categoryBand: 46, ageBand: 28 },
      WEB_LANDSCAPE: { header: 160, marginX: 28, marginY: 18, gapX: 16, gapY: 16, padding: 11, eventFont: 14, circleFont: 24, spaceFont: 13, cardScale: .48, categoryBand: 38, ageBand: 24 },
      PICSQUARE: { header: 143, marginX: 16, marginY: 16, gapX: 12, gapY: 12, padding: 8, eventFont: 10, circleFont: 18, spaceFont: 10, cardScale: .35, categoryBand: 34, ageBand: 21 },
      PICREA: { header: 270, marginX: 24, marginY: 22, gapX: 16, gapY: 16, padding: 12, eventFont: 15, circleFont: 28, spaceFont: 15, cardScale: .50, categoryBand: 44, ageBand: 28 }
    };

    const BLEED_MM = 3;

    let selectedPresetColor = PRESET_COLORS[0];
    let currentPaperSize = "A3";
    let currentOrientation = "LANDSCAPE";

    // Canvasは印刷時も塗り足し込みの実出力サイズ。
    let CANVAS_WIDTH = SPECS.A3.width;
    let CANVAS_HEIGHT = SPECS.A3.height;

    // DESIGN_* は仕上がり範囲。印刷時の全オブジェクト配置はbleed offsetを加える。
    let DESIGN_WIDTH = CANVAS_WIDTH;
    let DESIGN_HEIGHT = CANVAS_HEIGHT;
    let BLEED_LEFT = 0;
    let BLEED_TOP = 0;
    let BLEED_RIGHT = 0;
    let BLEED_BOTTOM = 0;
    let SAFE_X = 0;
    let SAFE_Y = 0;

    let canvas;
    let customBackgroundImage = null;
    let generationId = 0;
    let imageLoadPromises = [];
    let previewZoomMode = "fit";
    let resizeCanvasToFit = null;

    let items = [
      {
        category: "新刊",
        ageRating: "全年齢",

    function setupPalette() {
      const root = document.getElementById("presetColorPalette");
      root.innerHTML = "";

      PRESET_COLORS.forEach((preset, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.title = `CMYK ${preset.cmyk}`;
        button.innerHTML =
          `<span class="swatch" style="background:${preset.hex}"></span><span>${preset.name}</span>`;
        if (index === 0) button.classList.add("selected");

        button.addEventListener("click", () => {
          selectedPresetColor = preset;
          root.querySelectorAll("button").forEach((el) => el.classList.remove("selected"));
          button.classList.add("selected");

          // 推奨色は無地背景とヘッダーにまとめて反映。
          document.getElementById("bgTypeSelect").value = "color";
          document.getElementById("patternControls").classList.add("hidden");
          document.getElementById("customBgControls").classList.add("hidden");
          document.getElementById("singleColorControls").classList.remove("hidden");
          document.getElementById("bgColorPicker").value = preset.background;
          document.getElementById("headerBgColor").value = preset.header;
          document.getElementById("headerAccentColor").value = preset.accent;
          document.getElementById("eventInfoTextColor").value = "#ffffff";
          document.getElementById("circleInfoTextColor").value = "#ffffff";
          document.getElementById("spaceInfoTextColor").value = "#ffffff";
          document.getElementById("spaceInfoBgColor").value = preset.space;
          generate();
        });

        root.appendChild(button);
      });
    }

    function applyHeaderFontDefaults() {
      const social = SOCIAL_LAYOUTS[currentPaperSize];
      let defaults;

      if (social) {
        defaults = {
          event: social.eventFont,
          circle: social.circleFont,
          space: social.spaceFont
        };
      } else {
        const areaScale = Math.sqrt((DESIGN_WIDTH * DESIGN_HEIGHT) / (3307 * 2339));
        const printScale = Math.max(.9, Math.min(1.25, areaScale));
        defaults = {
          event: Math.round(60 * printScale),
          circle: Math.round(150 * printScale),
          space: Math.round(90 * printScale)
        };
      }

      document.getElementById("eventInfoFontSize").value = defaults.event;
      document.getElementById("circleInfoFontSize").value = defaults.circle;
      document.getElementById("spaceInfoFontSize").value = defaults.space;
    }

    function updateGuidePositions() {
      const trimGuide = document.getElementById("trimGuide");
      const safeGuide = document.getElementById("safeGuide");
      const print = Boolean(PRINT_EXPORT_SPECS[currentPaperSize]);

      trimGuide.classList.toggle("hidden", !print);
      safeGuide.classList.toggle("hidden", !print);

      if (!print) return;

      trimGuide.style.left = `${BLEED_LEFT}px`;
      trimGuide.style.top = `${BLEED_TOP}px`;
      trimGuide.style.width = `${DESIGN_WIDTH}px`;
      trimGuide.style.height = `${DESIGN_HEIGHT}px`;

      safeGuide.style.left = `${BLEED_LEFT + SAFE_X}px`;
      safeGuide.style.top = `${BLEED_TOP + SAFE_Y}px`;
      safeGuide.style.width = `${Math.max(1, DESIGN_WIDTH - SAFE_X * 2)}px`;
      safeGuide.style.height = `${Math.max(1, DESIGN_HEIGHT - SAFE_Y * 2)}px`;
    }

    function updateDimensions() {
      currentPaperSize = document.getElementById("paperSizeSelect").value;
      const orientationSelect = document.getElementById("orientationSelect");
      const social = SOCIAL_PRESETS[currentPaperSize];

      BLEED_LEFT = BLEED_TOP = BLEED_RIGHT = BLEED_BOTTOM = 0;
      SAFE_X = SAFE_Y = 0;

      if (social) {
        currentOrientation = social.orientation;
        orientationSelect.value = social.orientation;
        orientationSelect.disabled = true;

        CANVAS_WIDTH = DESIGN_WIDTH = social.width;
        CANVAS_HEIGHT = DESIGN_HEIGHT = social.height;
      } else {
        orientationSelect.disabled = false;
        currentOrientation = orientationSelect.value;

        const spec = PRINT_EXPORT_SPECS[currentPaperSize];
        const landscape = currentOrientation === "LANDSCAPE";
        CANVAS_WIDTH = landscape ? spec.heightPx : spec.widthPx;
        CANVAS_HEIGHT = landscape ? spec.widthPx : spec.heightPx;

        const outputWidthMm = landscape ? spec.heightMm : spec.widthMm;
        const outputHeightMm = landscape ? spec.widthMm : spec.heightMm;
        const trimWidthMm = landscape ? spec.trimHeightMm : spec.trimWidthMm;
        const trimHeightMm = landscape ? spec.trimWidthMm : spec.trimHeightMm;

        DESIGN_WIDTH = Math.round(trimWidthMm * CANVAS_WIDTH / outputWidthMm);
        DESIGN_HEIGHT = Math.round(trimHeightMm * CANVAS_HEIGHT / outputHeightMm);

        BLEED_LEFT = Math.floor((CANVAS_WIDTH - DESIGN_WIDTH) / 2);
        BLEED_RIGHT = CANVAS_WIDTH - DESIGN_WIDTH - BLEED_LEFT;
        BLEED_TOP = Math.floor((CANVAS_HEIGHT - DESIGN_HEIGHT) / 2);
        BLEED_BOTTOM = CANVAS_HEIGHT - DESIGN_HEIGHT - BLEED_TOP;

        // 文字・カードの安全マージンは仕上がり端から最低3mm。
        SAFE_X = Math.ceil(BLEED_MM * DESIGN_WIDTH / trimWidthMm);
        SAFE_Y = Math.ceil(BLEED_MM * DESIGN_HEIGHT / trimHeightMm);
      }

      canvas.setDimensions({ width: CANVAS_WIDTH, height: CANVAS_HEIGHT });

      const stage = document.getElementById("canvasStage");
      stage.style.width = `${CANVAS_WIDTH}px`;
      stage.style.height = `${CANVAS_HEIGHT}px`;

      applyHeaderFontDefaults();
      updateGuidePositions();

      const label = social
        ? `${social.label} (${CANVAS_WIDTH} × ${CANVAS_HEIGHT}px)`
        : `${currentPaperSize}${currentOrientation === "LANDSCAPE" ? "横" : "縦"} 塗り足し込み ${CANVAS_WIDTH} × ${CANVAS_HEIGHT}px`;

      document.getElementById("paperSpecLabel").textContent = label;
      document.getElementById("dimensionDisplay").textContent = label;
      document.getElementById("layoutHelp").textContent = social
        ? "SNS向けサイズ。印刷用の塗り足し・安全ガイドはありません。"
        : "プレビューは塗り足し込み。白線＝仕上がり、赤点線＝文字・カードの安全範囲です。";

      previewZoomMode = "fit";
      if (resizeCanvasToFit) resizeCanvasToFit();
      generate();
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

            <input class="control" type="text" data-index="${index}" data-key="price"

        container.appendChild(card);
      });

      container.querySelectorAll("[data-index]").forEach((input) => {
        const update = () => {
          const index = Number(input.dataset.index);
          const key = input.dataset.key;
          if (!items[index]) return;

          if (key === "descriptionFontSize") {
            const size = Number.parseInt(input.value, 10);
            items[index][key] = Number.isFinite(size) ? Math.max(8, Math.min(100, size)) : 38;
          } else {
            items[index][key] = input.value;
          }

          if (key === "category") {
            const price = container.querySelector(`[data-index="${index}"][data-key="price"]`);
            const noPrice = ["無料配布", "Web展示"].includes(input.value);
            if (price) {
              price.disabled = noPrice;
              if (noPrice) {
                price.value = "";

        input.addEventListener("input", update);

          generate();

      items.push({

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像を読み込めませんでした。"));
        image.src = url;
      });
    }

    async function readImageFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        throw new Error("画像ファイルを選択してください。");
      }

      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`画像を読み込めませんでした: ${file.name}`));
        reader.readAsDataURL(file);
      });

      const image = await loadImage(dataUrl);
      return { src: dataUrl, width: image.naturalWidth, height: image.naturalHeight };
    }

    async function uploadItemImage(index, file) {
      if (!file || !items[index]) return;
      try {
        const image = await readImageFile(file);
        Object.assign(items[index], {
          imageSrc: image.src,
          imageWidth: image.width,
          imageHeight: image.height,
          noImage: false
        });
        renderItems();
        generate();
      } catch (error) {
        alert(error.message);
      }
    }

    async function uploadBatchImages(files) {
      const selected = Array.from(files || []);
      if (!selected.length) return;

      try {
        const loaded = await Promise.all(selected.map(readImageFile));
        loaded.forEach((image, index) => {
          const data = {
            imageSrc: image.src,
            imageWidth: image.width,
            imageHeight: image.height,
            noImage: false
          };
          if (index < items.length) {
            Object.assign(items[index], data);
          } else {
            items.push({
              category: "新刊",
              ageRating: "全年齢",
              title: `新刊アイテム ${index + 1}`,
              price: "¥ 500",
              desc: "",
              descriptionFontSize: 38,
              ...data
            });
          }
        });
        renderItems();
        generate();
      } catch (error) {
        alert(error.message);
      }
    }

    function makePattern(style, color) {
      const pattern = document.createElement("canvas");
      pattern.width = pattern.height = 240;
      const ctx = pattern.getContext("2d");
      ctx.fillStyle = "#fff8fb";
      ctx.fillRect(0, 0, 240, 240);

      if (style === "dots") {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(60, 60, 16, 0, Math.PI * 2);
        ctx.arc(180, 180, 16, 0, Math.PI * 2);
        ctx.fill();
      } else if (style === "stripes") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 120, 240);
      } else if (style === "diagonal") {
        ctx.save();
        ctx.translate(120, 120);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = color;
        for (let x = -360; x <= 360; x += 110) ctx.fillRect(x, -360, 36, 720);
        ctx.restore();
      } else if (style === "border") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 240, 120);
      } else if (style === "check") {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 120, 120);
        ctx.fillRect(120, 120, 120, 120);
      }

      return pattern;
    }

    function addFullBleedBackground() {
      const type = document.getElementById("bgTypeSelect").value;

      // CSS canvas背景色はviewport transformに影響されず出力全体を塗る。
      if (type === "color") {
        canvas.setBackgroundImage(null);
        canvas.setBackgroundColor(document.getElementById("bgColorPicker").value);
        return;
      }

      canvas.setBackgroundColor("#ffffff");
      canvas.setBackgroundImage(null);

      if (type === "pattern") {
        const pattern = new fabric.Pattern({
          source: makePattern(
            document.getElementById("patternStyleSelect").value,
            selectedPresetColor.hex
          ),
          repeat: "repeat"
        });

        // 背景パターンはviewport transformに依存しないよう全出力寸法の画像にする。
        const bg = document.createElement("canvas");
        bg.width = CANVAS_WIDTH;
        bg.height = CANVAS_HEIGHT;
        const ctx = bg.getContext("2d");
        const fill = ctx.createPattern(
          makePattern(
            document.getElementById("patternStyleSelect").value,
            selectedPresetColor.hex
          ),
          "repeat"
        );
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        }
        canvas.setBackgroundImage(new fabric.Image(bg), canvas.renderAll.bind(canvas), {
          originX: "left",
          originY: "top",
          left: 0,
          top: 0
        });
        return;
      }

      if (type === "custom" && customBackgroundImage) {
        const element = customBackgroundImage.getElement();
        const bg = document.createElement("canvas");
        bg.width = CANVAS_WIDTH;
        bg.height = CANVAS_HEIGHT;
        const ctx = bg.getContext("2d");

        // 背景画像は出力全体まで広げ、塗り足し部分に空白を作らない。
        ctx.drawImage(element, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        canvas.setBackgroundImage(new fabric.Image(bg), canvas.renderAll.bind(canvas), {
          originX: "left",
          originY: "top",
          left: 0,
          top: 0
        });
      }
    }

    function getInfoStyle(prefix, defaultSize, defaultColor, maxSize) {
      const size = Number.parseInt(document.getElementById(`${prefix}FontSize`).value, 10);
      const enabled = document.getElementById(`${prefix}BgEnabled`).checked;

      return {
        fontSize: Number.isFinite(size) ? Math.min(Math.max(8, size), maxSize) : defaultSize,
        fill: document.getElementById(`${prefix}TextColor`).value || defaultColor,
        backgroundColor: enabled ? document.getElementById(`${prefix}BgColor`).value : ""
      };
    }

    function addDesignObject(object) {
      // レイアウト座標は仕上がり範囲基準。出力canvasではbleed分移動する。
      object.set({
        left: (object.left || 0) + BLEED_LEFT,
        top: (object.top || 0) + BLEED_TOP
      });
      canvas.add(object);
      return object;
    }

    function addHeaderBackground(headerHeight, color) {
      /*
        ヘッダー背景は上端の塗り足しまで延長。
        左右の塗り足しにも背景色が続く。
      */
      canvas.add(new fabric.Rect({
        left: 0,
        top: 0,
        width: CANVAS_WIDTH,
        height: Math.min(CANVAS_HEIGHT, BLEED_TOP + headerHeight),
        fill: color,
        selectable: false,
        evented: false
      }));
    }

    function createFittedTextbox(text, width, maxHeight, maxFontSize, options = {}) {
      const content = String(text || "");
      const safeWidth = Math.max(1, width);
      const safeHeight = Math.max(1, maxHeight);
      const minFont = Math.max(1, options.minFontSize || 1);
      const maxFont = Math.max(minFont, maxFontSize);

      const create = (value, size) => new fabric.Textbox(value, {
        left: 0,
        top: 0,
        width: safeWidth,
        fontSize: size,
        fontFamily: options.fontFamily || "Noto Sans JP",
        fontWeight: options.fontWeight || "normal",
        fill: options.fill || "#0f172a",
        backgroundColor: options.backgroundColor || "",
        padding: options.padding || 0,
        splitByGrapheme: true,
        lineHeight: options.lineHeight || 1.05,
        selectable: false,
        evented: false
      });

      let low = minFont;
      let high = maxFont;
      let best = null;

      for (let i = 0; i < 22; i += 1) {
        const size = (low + high) / 2;
        const candidate = create(content, size);
        if (candidate.height <= safeHeight) {
          best = candidate;
          low = size;
        } else {
          high = size;
        }
      }

      if (best) return best;

      const chars = Array.from(content);
      let left = 0;
      let right = chars.length;
      let shortened = create("", minFont);

      while (left <= right) {
        const middle = Math.floor((left + right) / 2);
        const value = middle < chars.length
          ? `${chars.slice(0, middle).join("")}…`
          : chars.join("");
        const candidate = create(value, minFont);

        if (candidate.height <= safeHeight) {
          shortened = candidate;
          left = middle + 1;
        } else {
          right = middle - 1;
        }
      }
      return shortened;
    }

    function fittedTextbox(text, box, options = {}) {
      const object = createFittedTextbox(
        text,
        box.width,
        box.height,
        Number(options.fontSize) || 24,
        {
          minFontSize: Number(options.minimum) || 8,
          fontFamily: options.fontFamily || "Noto Sans JP",
          fontWeight: options.fontWeight || "normal",
          fill: options.fill || "#ffffff",
          backgroundColor: options.backgroundColor || "",
          padding: options.padding || 0,
          lineHeight: options.lineHeight || 1
        }
      );
      object.set({ left: box.left, top: box.top });
      return object;
    }

    function getCategoryStyle(category) {
      return CATEGORY_STYLES[category] || CATEGORY_STYLES["新刊"];
    }

    function createCardText(item, width, height, scale) {
      const categoryStyle = getCategoryStyle(item.category);
      const parts = [];

      if (item.title) {
        parts.push({
          text: item.title, max: 78 * scale, min: Math.max(5, 8 * scale),
          ratio: .42, gap: 8 * scale, family: "Noto Sans JP",
          weight: "bold", fill: "#0f172a"
        });
      }

      if (!["無料配布", "Web展示"].includes(item.category) && item.price) {
        parts.push({
          text: item.price, max: 100 * scale, min: Math.max(5, 8 * scale),
          ratio: .28, gap: 7 * scale, family: "M PLUS Rounded 1c",
          weight: "bold", fill: categoryStyle.background
        });
      }

      if (item.desc) {
        parts.push({
          text: item.desc,
          max: Math.max(8, Math.min(100, Number(item.descriptionFontSize) || 38)) * scale,
          min: Math.max(4, 7 * scale), ratio: .30, gap: 0,
          family: "Noto Sans JP", weight: "normal", fill: "#475569"
        });
      }

      if (!parts.length) return [];
      const ratioSum = parts.reduce((sum, part) => sum + part.ratio, 0);

      return parts.map((part) => {
        const allocatedHeight = Math.max(1, height * part.ratio / ratioSum - part.gap);
        return {
          object: createFittedTextbox(part.text, width, allocatedHeight, part.max, {
            minFontSize: part.min,
            fontFamily: part.family,
            fontWeight: part.weight,
            fill: part.fill,
            lineHeight: 1.05
          }),
          gapAfter: part.gap
        };
      });
    }

    function drawHeader(social, headerHeight, landscape, eventStyle, circleStyle, spaceStyle) {
      if (social) {
        const margin = social.marginX;
        const width = Math.max(1, DESIGN_WIDTH - margin * 2);
        const isPicsquare = currentPaperSize === "PICSQUARE";
        const top = isPicsquare ? 5 : Math.max(6, Math.round(headerHeight * .04));
        const usable = Math.max(1, headerHeight - top * 2);
        const gap = isPicsquare ? 2 : Math.max(3, Math.round(usable * .025));
        const eventHeight = isPicsquare ? 29 : Math.round(usable * .25);
        const circleHeight = isPicsquare ? 44 : Math.round(usable * .34);
        const spaceHeight = Math.max(1, usable - eventHeight - circleHeight - gap * 2);

        let y = top;
        addDesignObject(fittedTextbox(
          `${document.getElementById("eventDate").value} | ${document.getElementById("eventName").value}`,
          { left: margin, top: y, width, height: eventHeight },
          {
            fontSize: eventStyle.fontSize, minimum: 7, fontFamily: "Noto Sans JP",
            fill: eventStyle.fill, backgroundColor: eventStyle.backgroundColor, lineHeight: 1
          }
        ));

        y += eventHeight + gap;
        addDesignObject(fittedTextbox(
          document.getElementById("circleName").value,
          { left: margin, top: y, width, height: circleHeight },
          {
            fontSize: circleStyle.fontSize, minimum: 8, fontFamily: "Noto Sans JP",
            fontWeight: "bold", fill: circleStyle.fill,
            backgroundColor: circleStyle.backgroundColor, lineHeight: 1
          }
        ));

        y += circleHeight + gap;
        const spaceNo = document.getElementById("spaceNo").value;
        if (spaceNo) {
          addDesignObject(fittedTextbox(
            ` ${spaceNo} `,
            { left: margin, top: y, width, height: spaceHeight },
            {
              fontSize: spaceStyle.fontSize, minimum: 7,
              fontFamily: "M PLUS Rounded 1c", fontWeight: "bold",
              fill: spaceStyle.fill, backgroundColor: spaceStyle.backgroundColor,
              lineHeight: 1
            }
          ));
        }
        return;
      }

      const scale = Math.min(DESIGN_WIDTH / 3307, DESIGN_HEIGHT / 2339);
      const margin = Math.max(80, SAFE_X + 8);
      const width = Math.max(1, DESIGN_WIDTH - margin * 2);
      const innerTop = Math.max(SAFE_Y, Math.round(headerHeight * .055));
      const available = Math.max(1, headerHeight - innerTop - Math.max(SAFE_Y, 10));
      const gap = Math.max(5, Math.round(available * .055));
      const rowSpace = Math.max(1, available - gap * 2);
      const eventHeight = rowSpace * .24;
      const circleHeight = rowSpace * .43;
      const spaceHeight = rowSpace - eventHeight - circleHeight;
      let y = innerTop;

      addDesignObject(fittedTextbox(
        `${document.getElementById("eventDate").value} | ${document.getElementById("eventName").value}`,
        { left: margin, top: y, width, height: eventHeight },
        {
          fontSize: eventStyle.fontSize, minimum: 10 * scale,
          fontFamily: "Noto Sans JP", fill: eventStyle.fill,
          backgroundColor: eventStyle.backgroundColor, lineHeight: 1
        }
      ));

      y += eventHeight + gap;
      addDesignObject(fittedTextbox(
        document.getElementById("circleName").value,
        { left: margin, top: y, width, height: circleHeight },
        {
          fontSize: circleStyle.fontSize, minimum: 12 * scale,
          fontFamily: "Noto Sans JP", fontWeight: "bold",
          fill: circleStyle.fill, backgroundColor: circleStyle.backgroundColor,
          lineHeight: 1
        }
      ));

      y += circleHeight + gap;
      const spaceNo = document.getElementById("spaceNo").value;
      if (spaceNo) {
        addDesignObject(fittedTextbox(
          ` ${spaceNo} `,
          { left: margin, top: y, width, height: spaceHeight },
          {
            fontSize: spaceStyle.fontSize, minimum: 10 * scale,
            fontFamily: "M PLUS Rounded 1c", fontWeight: "bold",
            fill: spaceStyle.fill, backgroundColor: spaceStyle.backgroundColor,
            lineHeight: 1
          }
        ));
      }
    }

    function addFabricImage(item, box, generation, anchor) {
      if (!item.imageSrc || item.noImage) return Promise.resolve();

      return new Promise((resolve) => {
        fabric.Image.fromURL(item.imageSrc, (image) => {
          if (!image || generation !== generationId) {
            resolve();
            return;
          }

          const scale = Math.min(box.width / image.width, box.height / image.height);
          image.set({
            left: box.left + (box.width - image.width * scale) / 2,
            top: box.top + (box.height - image.height * scale) / 2,
            scaleX: scale,
            scaleY: scale,
            shadow: new fabric.Shadow({
              color: "rgba(15,23,42,.35)", blur: 18, offsetX: 0, offsetY: 7
            }),
            selectable: false,
            evented: false
          });

          const index = anchor ? canvas.getObjects().indexOf(anchor) : -1;
          if (index >= 0) {
            image.set({
              left: image.left + BLEED_LEFT,
              top: image.top + BLEED_TOP
            });
            canvas.insertAt(image, index, false);
          } else {
            addDesignObject(image);
          }

          canvas.requestRenderAll();
          resolve();
        });
      });
    }

    function generate() {
      if (!canvas) return;

      const generation = ++generationId;
      imageLoadPromises = [];
      canvas.clear();
      addFullBleedBackground();

      const social = SOCIAL_LAYOUTS[currentPaperSize] || null;
      const isSocial = Boolean(social);
      const landscape = currentOrientation === "LANDSCAPE";
      const headerHeight = social
        ? social.header
        : Math.round(DESIGN_HEIGHT * (landscape ? .17 : .15));

      const headerColor = document.getElementById("headerBgColor").value || "#3b0a1e";
      const accentColor = document.getElementById("headerAccentColor").value || selectedPresetColor.accent;

      addHeaderBackground(headerHeight, headerColor);

      // ヘッダーのアクセント帯は仕上がり範囲内に配置する。
      addDesignObject(new fabric.Rect({
        left: 0,
        top: headerHeight - (social ? Math.max(3, Math.round(headerHeight * .025)) : 12),
        width: DESIGN_WIDTH,
        height: social ? Math.max(3, Math.round(headerHeight * .025)) : 12,
        fill: accentColor,
        selectable: false,
        evented: false
      }));

      const eventStyle = getInfoStyle(
        "eventInfo", social ? social.eventFont : 60, "#ffffff",
        social ? social.eventFont : 300
      );
      const circleStyle = getInfoStyle(
        "circleInfo", social ? social.circleFont : 150, "#ffffff",
        social ? social.circleFont : 400
      );
      const spaceStyle = getInfoStyle(
        "spaceInfo", social ? social.spaceFont : 90, "#ffffff",
        social ? social.spaceFont : 300
      );

      drawHeader(social, headerHeight, landscape, eventStyle, circleStyle, spaceStyle);

      let columns = 2;
      if (currentPaperSize === "WEB_LANDSCAPE") {
        columns = items.length <= 1 ? 1 : 2;
      } else if (isSocial) {
        columns = items.length <= 3 ? 1 : 2;
      } else if (landscape) {
        columns = items.length <= 1 ? 1 : (items.length > 4 ? 3 : 2);
      } else if (items.length <= 3) {
        columns = 1;
      }

      // 文字・カードの外周は、印刷時に仕上がり端から3mm以上離す。
      const marginX = social ? social.marginX : SAFE_X;
      const marginY = social ? social.marginY : SAFE_Y;
      const gapX = social ? social.gapX : 40;
      const gapY = social ? social.gapY : 40;
      const padding = social ? social.padding : 25;
      const startY = headerHeight + (social ? 10 : Math.max(24, SAFE_Y));
      const rows = Math.ceil(items.length / columns);

      const cardWidth = Math.max(
        1,
        (DESIGN_WIDTH - marginX * 2 - gapX * (columns - 1)) / columns
      );
      const cardHeight = Math.max(
        1,
        (DESIGN_HEIGHT - startY - marginY - gapY * (rows - 1)) / Math.max(1, rows)
      );

      items.forEach((item, index) => {
        const row = Math.floor(index / columns);
        const column = index % columns;
        const x = marginX + column * (cardWidth + gapX);
        const y = startY + row * (cardHeight + gapY);
        const radius = social ? 12 : 24;
        const hasImage = Boolean(item.imageSrc) && !item.noImage;

        addDesignObject(new fabric.Rect({
          left: x, top: y, width: cardWidth, height: cardHeight,
          fill: "#ffffff", stroke: "transparent", strokeWidth: 0,
          rx: radius, ry: radius, selectable: false, evented: false
        }));

        const style = getCategoryStyle(item.category);
        const isR18 = item.ageRating === "R18";

        // 帯の高さもレイアウトごとにカード高さ・幅から決める。
        const categoryHeight = Math.min(
          social ? social.categoryBand : cardHeight * .14,
          cardHeight * .16,
          Math.max(24, cardWidth * (social ? .11 : .075))
        );
        const ageHeight = Math.min(
          social ? social.ageBand : cardHeight * .09,
          cardHeight * .11,
          Math.max(18, cardWidth * (social ? .07 : .05))
        );

        const categoryPath = [
          `M 0 ${radius}`,
          `Q 0 0 ${radius} 0`,
          `L ${cardWidth - radius} 0`,
          `Q ${cardWidth} 0 ${cardWidth} ${radius}`,
          `L ${cardWidth} ${categoryHeight}`,
          `L 0 ${categoryHeight}`,
          "Z"
        ].join(" ");

        addDesignObject(new fabric.Path(categoryPath, {
          left: x, top: y, fill: style.background,
          selectable: false, evented: false
        }));

        // カテゴリ帯の文字は、帯の縦横に収まる最大サイズにする。
        const categoryLabel = createFittedTextbox(
          item.category || "新刊",
          Math.max(1, cardWidth - padding * 2),
          Math.max(1, categoryHeight - 4),
          Math.min(categoryHeight * .78, cardWidth * .22),
          {
            minFontSize: 1,
            fontFamily: "M PLUS Rounded 1c",
            fontWeight: "bold",
            fill: style.text,
            lineHeight: 1
          }
        );
        categoryLabel.set({ left: x + padding, top: y + 2 });
        addDesignObject(categoryLabel);

        const ageTop = y + categoryHeight;
        addDesignObject(new fabric.Rect({
          left: x, top: ageTop, width: cardWidth, height: ageHeight,
          fill: isR18 ? "#991b1b" : "#dcfce7",
          selectable: false, evented: false
        }));

        const ageLabel = createFittedTextbox(
          isR18 ? "R18" : "全年齢",
          Math.max(1, cardWidth - padding * 2),
          Math.max(1, ageHeight - 2),
          Math.min(ageHeight * .75, cardWidth * .18),
          {
            minFontSize: 1,
            fontFamily: "M PLUS Rounded 1c",
            fontWeight: "bold",
            fill: isR18 ? "#ffffff" : "#166534",
            lineHeight: 1
          }
        );
        ageLabel.set({ left: x + padding, top: ageTop + 1 });
        addDesignObject(ageLabel);

        const bodyTop = y + categoryHeight + ageHeight + padding;
        const bodyHeight = Math.max(
          1,
          cardHeight - categoryHeight - ageHeight - padding * 2
        );

        let imageBox = null;
        let textX;
        let textWidth;

        if (hasImage) {
          const imageWidth = item.imageWidth || 1;
          const imageHeight = item.imageHeight || 1;
          const maxImageWidth = cardWidth * (landscape ? .38 : .36);
          const imageScale = Math.min(maxImageWidth / imageWidth, bodyHeight / imageHeight);
          const displayWidth = imageWidth * imageScale;
          const displayHeight = imageHeight * imageScale;
          const imageGap = social ? 10 : 25;

          imageBox = {
            left: x + padding,
            top: bodyTop + (bodyHeight - displayHeight) / 2,
            width: displayWidth,
            height: displayHeight
          };
          textX = imageBox.left + displayWidth + imageGap;
          textWidth = Math.max(1, x + cardWidth - padding - textX);
        } else {
          textX = x + padding;
          textWidth = Math.max(1, cardWidth - padding * 2);
        }

        const textEntries = createCardText(
          item,
          textWidth,
          bodyHeight,
          social ? social.cardScale : 1
        );

        let textY = bodyTop;
        let firstText = null;

        textEntries.forEach((entry, entryIndex) => {
          entry.object.set({ left: textX, top: textY });
          if (entryIndex === 0) firstText = entry.object;
          addDesignObject(entry.object);
          textY += entry.object.getScaledHeight() + entry.gapAfter;
        });

        if (imageBox) {
          imageLoadPromises.push(addFabricImage(item, imageBox, generation, firstText));
        }

        addDesignObject(new fabric.Rect({
          left: x, top: y, width: cardWidth, height: cardHeight,
          fill: "rgba(255,255,255,0)", stroke: "#cbd5e1",
          strokeWidth: social ? 2 : 4, rx: radius, ry: radius,
          selectable: false, evented: false
        }));
      });

      canvas.renderAll();
    }

    function applyPreviewScale(scale) {
      const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      const container = document.getElementById("canvasContainer");
      const stage = document.getElementById("canvasStage");

      stage.style.width = `${CANVAS_WIDTH}px`;
      stage.style.height = `${CANVAS_HEIGHT}px`;
      stage.style.transform = `scale(${safeScale})`;
      container.style.width = `${CANVAS_WIDTH * safeScale}px`;
      container.style.height = `${CANVAS_HEIGHT * safeScale}px`;

      canvas.calcOffset();
      canvas.requestRenderAll();

      document.getElementById("zoomDisplay").textContent = `表示 ${Math.round(safeScale * 100)}%`;
      document.getElementById("zoomSlider").value =
        String(Math.max(1, Math.min(200, Math.round(safeScale * 100))));
    }

    function fitCanvasToWorkspace() {
      const workspace = document.getElementById("workspace");
      const availableWidth = Math.max(1, workspace.clientWidth - 50);
      const availableHeight = Math.max(1, workspace.clientHeight - 75);
      applyPreviewScale(Math.min(
        availableWidth / CANVAS_WIDTH,
        availableHeight / CANVAS_HEIGHT
      ));
    }

    function setupScaler() {
      const workspace = document.getElementById("workspace");

      resizeCanvasToFit = () => {
        if (previewZoomMode === "fit") fitCanvasToWorkspace();
        else applyPreviewScale(Number(document.getElementById("zoomSlider").value) / 100);
      };

      if ("ResizeObserver" in window) {
        new ResizeObserver(() => {
          if (previewZoomMode === "fit") fitCanvasToWorkspace();
        }).observe(workspace);
      }

      window.addEventListener("resize", () => {
        if (previewZoomMode === "fit") fitCanvasToWorkspace();
      });
    }

    async function createBleedExport() {
      while (true) {
        const generation = generationId;
        await Promise.all(imageLoadPromises.slice());
        if (generation === generationId) break;
      }

      canvas.renderAll();

      const social = SOCIAL_PRESETS[currentPaperSize];
      const isPrint = Boolean(PRINT_EXPORT_SPECS[currentPaperSize]);

      if (social) {
        return {
          dataUrl: canvas.toDataURL({ format: "png", multiplier: 1 }),
          widthPx: social.width,
          heightPx: social.height,
          widthMm: social.width * 25.4 / 200,
          heightMm: social.height * 25.4 / 200,
          hasBleed: false
        };
      }

      const spec = PRINT_EXPORT_SPECS[currentPaperSize];
      if (!isPrint || !spec) throw new Error("出力サイズが未定義です。");

      const landscape = currentOrientation === "LANDSCAPE";
      return {
        dataUrl: canvas.toDataURL({ format: "png", multiplier: 1 }),
        widthPx: CANVAS_WIDTH,
        heightPx: CANVAS_HEIGHT,
        widthMm: landscape ? spec.heightMm : spec.widthMm,
        heightMm: landscape ? spec.widthMm : spec.heightMm,
        hasBleed: true
      };
    }

    function setupDraggableToolbar() {
      const toolbar = document.getElementById("previewToolbar");
      const handle = document.getElementById("previewToolbarDrag");
      const workspace = document.getElementById("workspace");
      let drag = null;

      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const t = toolbar.getBoundingClientRect();
        const w = workspace.getBoundingClientRect();

        toolbar.style.left = `${t.left - w.left}px`;
        toolbar.style.top = `${t.top - w.top}px`;
        toolbar.style.right = "auto";
        toolbar.style.bottom = "auto";

        drag = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          left: t.left - w.left,
          top: t.top - w.top
        };
        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        const r = workspace.getBoundingClientRect();
        toolbar.style.left = `${Math.max(0, Math.min(r.width - toolbar.offsetWidth, drag.left + event.clientX - drag.x))}px`;
        toolbar.style.top = `${Math.max(0, Math.min(r.height - toolbar.offsetHeight, drag.top + event.clientY - drag.y))}px`;
      });

      const finish = (event) => {
        if (drag && drag.id === event.pointerId) drag = null;
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    }

    async function openPrintPreview() {
      const popup = window.open("", "_blank");
      if (!popup) {
        alert("プレビューを開けません。ポップアップを許可してください。");
        return;
      }

      try {
        const output = await createBleedExport();
        const label = output.hasBleed ? "塗り足し込み" : "Webサイズ";
        popup.document.open();
        popup.document.write(`<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出力プレビュー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:sans-serif}
body{background:#1e293b;color:#f8fafc}
.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#0f172a}
.toolbar button{border:0;border-radius:6px;padding:8px 12px;color:#fff;background:#334155;cursor:pointer}
.toolbar .print{background:#e11d48}
.preview{height:calc(100vh - 60px);overflow:auto;padding:24px}
.sheet{width:${output.widthPx}px;height:${output.heightPx}px;margin:0 auto;background:#fff;box-shadow:0 8px 30px #0006}
.sheet img{display:block;width:100%;height:100%}
body.fit .sheet{width:auto;height:auto;max-width:100%}
body.fit .sheet img{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
@page{size:${output.widthMm}mm ${output.heightMm}mm;margin:0}
@media print{
html,body{width:${output.widthMm}mm;height:${output.heightMm}mm;margin:0;padding:0;overflow:hidden;background:#fff}
.toolbar{display:none!important}
.preview{width:${output.widthMm}mm;height:${output.heightMm}mm;overflow:hidden;padding:0}
.sheet{width:${output.widthMm}mm!important;height:${output.heightMm}mm!important;margin:0!important;box-shadow:none}
.sheet img{width:${output.widthMm}mm!important;height:${output.heightMm}mm!important}
}
</style>
</head>
<body>
<div class="toolbar">
<strong>プレビュー（${label}）</strong>
<button id="actual">100%表示</button>
<button id="fit">画面に合わせる</button>
<button id="print" class="print">印刷</button>
<span>${output.widthPx} × ${output.heightPx}px</span>
</div>
<main class="preview"><div class="sheet"><img src="${output.dataUrl}" alt="出力プレビュー"></div></main>
<script>
document.getElementById("actual").onclick=()=>document.body.classList.remove("fit");
document.getElementById("fit").onclick=()=>document.body.classList.add("fit");
document.getElementById("print").onclick=()=>window.print();
<\/script>
</body>
</html>`);
        popup.document.close();
      } catch (error) {
        popup.close();
        alert(`プレビューを作成できませんでした: ${error.message}`);
      }
    }

    function setupEvents() {
      document.getElementById("paperSizeSelect").addEventListener("change", updateDimensions);
      document.getElementById("orientationSelect").addEventListener("change", updateDimensions);

      ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
        document.getElementById(id).addEventListener("input", generate);
      });

      [
        "headerBgColor", "headerAccentColor",
        "eventInfoFontSize", "eventInfoTextColor", "eventInfoBgEnabled", "eventInfoBgColor",
        "circleInfoFontSize", "circleInfoTextColor", "circleInfoBgEnabled", "circleInfoBgColor",
        "spaceInfoFontSize", "spaceInfoTextColor", "spaceInfoBgEnabled", "spaceInfoBgColor"
      ].forEach((id) => {
        const input = document.getElementById(id);
        input.addEventListener("input", generate);
        input.addEventListener("change", generate);
      });

      document.getElementById("bgTypeSelect").addEventListener("change", (event) => {
        const type = event.target.value;
        document.getElementById("patternControls").classList.toggle("hidden", type !== "pattern");
        document.getElementById("customBgControls").classList.toggle("hidden", type !== "custom");
        document.getElementById("singleColorControls").classList.toggle("hidden", type !== "color");
        generate();
      });

      document.getElementById("patternStyleSelect").addEventListener("change", generate);
      document.getElementById("bgColorPicker").addEventListener("input", generate);

      document.getElementById("customBgInput").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const loaded = await readImageFile(file);
          customBackgroundImage = await new Promise((resolve, reject) => {
            fabric.Image.fromURL(loaded.src, (image) => {
              if (image) resolve(image);
              else reject(new Error("背景画像を開けませんでした。"));
            });
          });
          generate();
        } catch (error) {
          alert(error.message);
        }
      });

      document.getElementById("batchImageInput").addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        event.target.value = "";
        await uploadBatchImages(files);
      });

      document.getElementById("addItemBtn").addEventListener("click", addItem);

      document.getElementById("toggleGrid").addEventListener("change", (event) => {
        document.getElementById("gridOverlay").classList.toggle("hidden", !event.target.checked);
      });

      document.getElementById("fitCanvasBtn").addEventListener("click", () => {
        previewZoomMode = "fit";
        fitCanvasToWorkspace();
      });

      document.getElementById("zoomSlider").addEventListener("input", (event) => {
        previewZoomMode = "manual";
        applyPreviewScale(Number(event.target.value) / 100);
      });

      setupDraggableToolbar();
      document.getElementById("printPreviewBtn").addEventListener("click", openPrintPreview);

      document.getElementById("exportPng").addEventListener("click", async () => {
        try {
          const output = await createBleedExport();
          const suffix = output.hasBleed ? "_bleed3mm" : "";
          const link = document.createElement("a");
          link.download = `oshinagaki_${currentPaperSize}_${currentOrientation}${suffix}_${output.widthPx}x${output.heightPx}.png`;
          link.href = output.dataUrl;
          link.click();
        } catch (error) {
          alert(`PNGを書き出せませんでした: ${error.message}`);
        }
      });

      document.getElementById("exportPdf").addEventListener("click", async () => {
        try {
          const output = await createBleedExport();
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: output.widthMm >= output.heightMm ? "landscape" : "portrait",
            unit: "mm",
            format: [output.widthMm, output.heightMm]
          });
          pdf.addImage(output.dataUrl, "PNG", 0, 0, output.widthMm, output.heightMm);
          const suffix = output.hasBleed ? "_bleed3mm" : "";
          pdf.save(`oshinagaki_${currentPaperSize}_${currentOrientation}${suffix}.pdf`);
        } catch (error) {
          alert(`PDFを書き出せませんでした: ${error.message}`);
        }
      });
    }
  </script>
</body>
</html>
