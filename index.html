<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同人おしながきジェネレーター</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    #canvasContainer {
      flex: none;
      line-height: 0;
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    #oshinagakiCanvas {
      display: block;
    }

    /* 編集プレビュー専用の方眼。PNG/PDFには含まれません。 */
    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, .24) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .24) 1px, transparent 1px),
        linear-gradient(to right, rgba(15, 23, 42, .12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .12) 1px, transparent 1px);
      background-size:
        100px 100px,
        100px 100px,
        20px 20px,
        20px 20px;
    }
  </style>
</head>

<body class="h-full flex flex-col bg-slate-900 text-slate-100 font-sans overflow-hidden">

  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between gap-3 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="bg-gradient-to-r from-rose-500 to-purple-600 p-2 rounded-lg shadow shrink-0">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-sm sm:text-base font-bold leading-tight">同人おしながきジェネレーター</h1>
        <p id="paperSpecLabel" class="text-[10px] sm:text-[11px] text-slate-400 truncate">
          A3横 (3307 × 2339px / 200dpi)
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <button id="exportPng" type="button" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 sm:px-4 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="image" class="w-4 h-4"></i>
        <span class="hidden sm:inline">PNG画像で保存</span>
        <span class="sm:hidden">PNG</span>
      </button>
      <button id="exportPdf" type="button" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 sm:px-4 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        <span class="hidden sm:inline">PDFで保存</span>
        <span class="sm:hidden">PDF</span>
      </button>
    </div>
  </header>

  <div class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">

    <!-- 左：デザイン・情報入力 -->
    <aside class="w-full md:w-[400px] lg:w-[440px] bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 overflow-hidden max-h-[48vh] md:max-h-none">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/80 shrink-0">
        <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="sliders" class="w-4 h-4 text-rose-400"></i>
          デザイン・情報設定
        </h2>
        <span class="text-[10px] text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded-full">
          リアルタイム反映
        </span>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-4">

        <!-- 用紙・向き -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400 flex items-center gap-1">
            <i data-lucide="layout" class="w-3.5 h-3.5"></i>
            レイアウト・用紙設定
          </h3>
          <div class="grid grid-cols-2 gap-2">
            <label class="text-[11px] text-slate-400">
              用紙向き
              <select id="orientationSelect" class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200">
                <option value="LANDSCAPE">横向き</option>
                <option value="PORTRAIT">縦向き</option>
              </select>
            </label>
            <label class="text-[11px] text-slate-400">
              用紙サイズ
              <select id="paperSizeSelect" class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200">
                <option value="A3">A3 (200dpi)</option>
                <option value="A4">A4 (200dpi)</option>
              </select>
            </label>
          </div>
        </section>

        <!-- 背景 -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400 flex items-center gap-1">
            <i data-lucide="palette" class="w-3.5 h-3.5"></i>
            背景デザイン
          </h3>

          <label class="block text-[11px] text-slate-400">
            背景の種類
            <select id="bgTypeSelect" class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200">
              <option value="pattern">規定パターン</option>
              <option value="custom">背景画像をアップロード</option>
              <option value="color">単色カラー</option>
            </select>
          </label>

          <div id="patternControls" class="space-y-3">
            <label class="block text-[11px] text-slate-400">
              パターン
              <select id="patternStyleSelect" class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200">
                <option value="dots">ドット</option>
                <option value="stripes">ストライプ</option>
                <option value="diagonal">斜めストライプ</option>
                <option value="border">ボーダー</option>
                <option value="check">チェック</option>
              </select>
            </label>

            <div>
              <span class="block text-[11px] text-slate-400 mb-1.5">規定カラー</span>
              <div id="presetColorPalette" class="grid grid-cols-4 gap-1.5"></div>
            </div>
          </div>

          <div id="customBgControls" class="hidden">
            <label class="block text-[11px] text-slate-400">
              背景画像ファイル
              <input id="customBgInput" type="file" accept="image/*"
                class="mt-1 w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:bg-rose-500 file:text-white hover:file:bg-rose-400 cursor-pointer">
            </label>
          </div>

          <div id="singleColorControls" class="hidden">
            <label class="flex items-center justify-between text-[11px] text-slate-400">
              背景色
              <input id="bgColorPicker" type="color" value="#f8fafc"
                class="w-12 h-8 bg-slate-800 border border-slate-700 rounded cursor-pointer p-0.5">
            </label>
          </div>
        </section>

        <!-- ヘッダー情報 -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400 flex items-center gap-1">
            <i data-lucide="info" class="w-3.5 h-3.5"></i>
            イベント・サークル情報
          </h3>

          <label class="block text-[11px] text-slate-400">
            イベント日時
            <input id="eventDate" type="text" value="2026年12月30日(水)"
              class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
          </label>

          <label class="block text-[11px] text-slate-400">
            イベント名
            <input id="eventName" type="text" value="コミックマーケット109"
              class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
          </label>

          <div class="grid grid-cols-2 gap-2">
            <label class="block text-[11px] text-slate-400">
              サークル名
              <input id="circleName" type="text" value="暁の稜線"
                class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
            </label>
            <label class="block text-[11px] text-slate-400">
              スペース番号
              <input id="spaceNo" type="text" value="東7ホール あ-01a"
                class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
            </label>
          </div>
        </section>

        <!-- ヘッダー配色 -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">ヘッダー背景・アクセント</h3>

          <div class="grid grid-cols-2 gap-2">
            <label class="text-[10px] text-slate-400">
              ヘッダー背景色
              <input id="headerBgColor" type="color" value="#3b0a1e"
                class="mt-1 h-9 w-full rounded border border-slate-700 bg-slate-800 p-1">
            </label>
            <label class="text-[10px] text-slate-400">
              アクセント色
              <input id="headerAccentColor" type="color" value="#fb7185"
                class="mt-1 h-9 w-full rounded border border-slate-700 bg-slate-800 p-1">
            </label>
          </div>
          <p class="text-[10px] text-slate-500">
            規定カラーを選ぶとおすすめ配色が適用されます。各色は個別に変更できます。
          </p>
        </section>

        <!-- 情報ボックスの文字・背景設定 -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">
            情報ボックスの文字・背景設定
          </h3>

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">日時・イベント名</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">
                文字サイズ
                <input id="eventInfoFontSize" type="number" min="12" max="200" value="48"
                  class="mt-1 w-full rounded border border-slate-700 bg-slate-800 px-2 py-1.5 text-xs text-slate-200">
              </label>
              <label class="text-[10px] text-slate-400">
                文字色
                <input id="eventInfoTextColor" type="color" value="#ffe4e6"
                  class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="eventInfoBgEnabled" type="checkbox" class="accent-rose-500">
                <input id="eventInfoBgColor" type="color" value="#334155"
                  class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>

          <hr class="border-slate-700">

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">サークル名</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">
                文字サイズ
                <input id="circleInfoFontSize" type="number" min="12" max="300" value="120"
                  class="mt-1 w-full rounded border border-slate-700 bg-slate-800 px-2 py-1.5 text-xs text-slate-200">
              </label>
              <label class="text-[10px] text-slate-400">
                文字色
                <input id="circleInfoTextColor" type="color" value="#fff1f2"
                  class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="circleInfoBgEnabled" type="checkbox" class="accent-rose-500">
                <input id="circleInfoBgColor" type="color" value="#334155"
                  class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>

          <hr class="border-slate-700">

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">スペース番号</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">
                文字サイズ
                <input id="spaceInfoFontSize" type="number" min="12" max="200" value="75"
                  class="mt-1 w-full rounded border border-slate-700 bg-slate-800 px-2 py-1.5 text-xs text-slate-200">
              </label>
              <label class="text-[10px] text-slate-400">
                文字色
                <input id="spaceInfoTextColor" type="color" value="#ffffff"
                  class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="spaceInfoBgEnabled" type="checkbox" checked class="accent-rose-500">
                <input id="spaceInfoBgColor" type="color" value="#e11d48"
                  class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>
        </section>

        <!-- 頒布物画像一括アップロード -->
        <section class="space-y-2.5 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400 flex items-center gap-1">
            <i data-lucide="images" class="w-3.5 h-3.5"></i>
            頒布物画像 一括アップロード
          </h3>
          <label class="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-rose-500/50 hover:border-rose-400 rounded-xl cursor-pointer bg-slate-800/40 hover:bg-slate-800 transition p-2">
            <i data-lucide="upload-cloud" class="w-6 h-6 text-rose-400 mb-1"></i>
            <span class="text-xs text-slate-200 font-bold">画像をまとめて選択（複数可）</span>
            <span class="text-[10px] text-slate-400">選択順に頒布物へ割り当て</span>
            <input type="file" id="batchImageInput" accept="image/*" multiple class="hidden">
          </label>
        </section>

        <!-- 頒布物一覧 -->
        <section>
          <div class="flex justify-between items-center mb-2">
            <h3 class="text-xs font-bold text-rose-400 flex items-center gap-1">
              <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
              頒布物一覧
            </h3>
            <button id="addItemBtn" type="button" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-600 text-slate-200 flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              頒布物を追加
            </button>
          </div>
          <div id="itemsContainer" class="space-y-3"></div>
        </section>
      </div>
    </aside>

    <!-- 右：プレビュー -->
    <main id="workspace" class="flex-1 min-w-0 bg-slate-950 flex items-center justify-center p-3 sm:p-5 overflow-hidden relative">
      <div class="absolute top-3 left-3 z-20 rounded-lg border border-slate-700 bg-slate-800/90 px-3 py-2 text-[11px] text-slate-300 shadow">
        <span id="zoomDisplay">表示: --%</span>
        <span class="mx-1 text-slate-600">|</span>
        <span id="dimensionDisplay" class="text-slate-400">A3横</span>
      </div>

      <div class="absolute top-3 right-3 z-20 flex flex-wrap items-center justify-end gap-2 rounded-lg border border-slate-700 bg-slate-800/90 px-3 py-2 shadow">
        <button id="fitCanvasBtn" type="button"
          class="rounded bg-slate-700 px-2 py-1 text-xs text-slate-200 hover:bg-slate-600">
          全体表示
        </button>

        <label class="flex items-center gap-1.5 text-xs text-slate-200">
          倍率
          <input id="zoomSlider" type="range" min="1" max="200" value="100"
            class="w-24 accent-rose-500">
        </label>

        <label class="flex items-center gap-1.5 text-xs text-slate-200">
          <input id="toggleGrid" type="checkbox" class="accent-rose-500">
          方眼
        </label>
      </div>

      <div id="canvasContainer" class="relative shadow-2xl border border-slate-700/50 bg-white overflow-hidden">
        <canvas id="oshinagakiCanvas"></canvas>
        <div id="gridOverlay" class="grid-overlay hidden" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const PRESET_COLORS = [
      { name: "赤", hex: "#fca5a5", main: "#e11d48" },
      { name: "ピンク", hex: "#f472b6", main: "#db2777" },
      { name: "オレンジ", hex: "#fdba74", main: "#ea580c" },
      { name: "緑", hex: "#86efac", main: "#16a34a" },
      { name: "青", hex: "#93c5fd", main: "#2563eb" },
      { name: "紫", hex: "#d8b4fe", main: "#9333ea" },
      { name: "グレー", hex: "#cbd5e1", main: "#475569" }
    ];

    const HEADER_COLOR_SCHEMES = {
      "赤": {
        headerBg: "#3b0a1e",
        accent: "#fb7185",
        eventText: "#ffe4e6",
        circleText: "#fff1f2",
        spaceText: "#ffffff",
        spaceBg: "#e11d48"
      },
      "ピンク": {
        headerBg: "#3b1028",
        accent: "#f472b6",
        eventText: "#fce7f3",
        circleText: "#fff1f7",
        spaceText: "#ffffff",
        spaceBg: "#db2777"
      },
      "オレンジ": {
        headerBg: "#3b1b0b",
        accent: "#fb923c",
        eventText: "#ffedd5",
        circleText: "#fff7ed",
        spaceText: "#ffffff",
        spaceBg: "#ea580c"
      },
      "緑": {
        headerBg: "#092e24",
        accent: "#4ade80",
        eventText: "#dcfce7",
        circleText: "#f0fdf4",
        spaceText: "#ffffff",
        spaceBg: "#16a34a"
      },
      "青": {
        headerBg: "#0b2340",
        accent: "#60a5fa",
        eventText: "#dbeafe",
        circleText: "#eff6ff",
        spaceText: "#ffffff",
        spaceBg: "#2563eb"
      },
      "紫": {
        headerBg: "#26103b",
        accent: "#c084fc",
        eventText: "#f3e8ff",
        circleText: "#faf5ff",
        spaceText: "#ffffff",
        spaceBg: "#9333ea"
      },
      "グレー": {
        headerBg: "#1f2937",
        accent: "#cbd5e1",
        eventText: "#e2e8f0",
        circleText: "#f8fafc",
        spaceText: "#ffffff",
        spaceBg: "#475569"
      }
    };

    const CATEGORY_STYLES = {
      "新刊": {
        text: "#ffffff",
        background: "#dc2626",
        border: "#991b1b"
      },
      "既刊": {
        text: "#ffffff",
        background: "#2563eb",
        border: "#1e40af"
      },
      "無料配布": {
        text: "#ffffff",
        background: "#16a34a",
        border: "#166534"
      }
    };

    const SPECS = {
      A3: { width: 3307, height: 2339 },
      A4: { width: 2339, height: 1654 }
    };

    let selectedPresetColor = PRESET_COLORS[0];
    let currentOrientation = "LANDSCAPE";
    let currentPaperSize = "A3";
    let CANVAS_WIDTH = SPECS.A3.width;
    let CANVAS_HEIGHT = SPECS.A3.height;
    let canvas;
    let customBgImageObj = null;
    let generationId = 0;
    let resizeCanvasToFit = null;
    let previewZoomMode = "fit";

    let items = [
      {
        category: "新刊",
        ageRating: "全年齢",
        title: "新刊サンプルタイトル",
        price: "¥ 1,000",
        desc: "文庫サイズ / 120P / 全年齢\n特製ノベルティステッカー付き",
        imageSrc: null
      },
      {
        category: "既刊",
        ageRating: "全年齢",
        title: "既刊イラスト集",
        price: "¥ 500",
        desc: "B5 / 24P / フルカラー\n過去イラストまとめ冊子",
        imageSrc: null
      }
    ];

    window.addEventListener("DOMContentLoaded", () => {
      initCanvas();
      setupColorPalette();
      applyHeaderColorScheme(selectedPresetColor.name);
      renderFormItems();
      setupEventListeners();
      setupResponsiveScaler();
      updateCanvasDimensions();
    });

    function initCanvas() {
      canvas = new fabric.Canvas("oshinagakiCanvas", {
        width: CANVAS_WIDTH,
        height: CANVAS_HEIGHT,
        backgroundColor: "#ffffff",
        selection: false,
        enableRetinaScaling: true
      });

      if (canvas.wrapperEl) {
        canvas.wrapperEl.style.transformOrigin = "top left";
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function applyHeaderColorScheme(colorName) {
      const scheme = HEADER_COLOR_SCHEMES[colorName];
      if (!scheme) return;

      document.getElementById("headerBgColor").value = scheme.headerBg;
      document.getElementById("headerAccentColor").value = scheme.accent;
      document.getElementById("eventInfoTextColor").value = scheme.eventText;
      document.getElementById("circleInfoTextColor").value = scheme.circleText;
      document.getElementById("spaceInfoTextColor").value = scheme.spaceText;
      document.getElementById("spaceInfoBgColor").value = scheme.spaceBg;
    }

    function setupColorPalette() {
      const container = document.getElementById("presetColorPalette");
      container.innerHTML = "";

      PRESET_COLORS.forEach((color, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          "flex items-center gap-1 p-1.5 rounded border text-[10px] text-slate-300 hover:bg-slate-700";

        if (index === 0) {
          button.classList.add(
            "ring-2",
            "ring-rose-500",
            "border-slate-500",
            "bg-slate-800"
          );
        } else {
          button.classList.add("border-slate-700", "bg-slate-900");
        }

        button.innerHTML =
          `<span class="w-3 h-3 rounded-full shrink-0" style="background:${color.hex}"></span>` +
          `<span>${color.name}</span>`;

        button.addEventListener("click", () => {
          selectedPresetColor = color;
          applyHeaderColorScheme(color.name);

          container.querySelectorAll("button").forEach((paletteButton) => {
            paletteButton.classList.remove(
              "ring-2",
              "ring-rose-500",
              "border-slate-500",
              "bg-slate-800"
            );
            paletteButton.classList.add("border-slate-700", "bg-slate-900");
          });

          button.classList.add(
            "ring-2",
            "ring-rose-500",
            "border-slate-500",
            "bg-slate-800"
          );
          button.classList.remove("border-slate-700", "bg-slate-900");

          generateOshinagaki();
        });

        container.appendChild(button);
      });
    }

    function updateCanvasDimensions() {
      currentOrientation =
        document.getElementById("orientationSelect").value;
      currentPaperSize =
        document.getElementById("paperSizeSelect").value;

      const spec = SPECS[currentPaperSize];

      if (currentOrientation === "LANDSCAPE") {
        CANVAS_WIDTH = spec.width;
        CANVAS_HEIGHT = spec.height;
      } else {
        CANVAS_WIDTH = spec.height;
        CANVAS_HEIGHT = spec.width;
      }

      canvas.setDimensions({
        width: CANVAS_WIDTH,
        height: CANVAS_HEIGHT
      });

      const orientationLabel =
        currentOrientation === "LANDSCAPE" ? "横" : "縦";
      const paperLabel =
        `${currentPaperSize}${orientationLabel} (${CANVAS_WIDTH} × ${CANVAS_HEIGHT}px / 200dpi)`;

      document.getElementById("paperSpecLabel").textContent = paperLabel;
      document.getElementById("dimensionDisplay").textContent =
        `${currentPaperSize}${orientationLabel} (${CANVAS_WIDTH}×${CANVAS_HEIGHT}px)`;

      previewZoomMode = "fit";

      if (resizeCanvasToFit) {
        resizeCanvasToFit();
      }

      generateOshinagaki();
    }

                ${index === 0 ? "disabled" : ""}

              <button type="button" data-move-item="${index}" data-direction="1"

          <label class="block text-[10px] text-slate-400">

          <label class="block text-[10px] text-slate-400">
            値段（無料配布は空欄）
            <input type="text" data-item-index="${index}" data-item-key="price"
              value="${escapeHtml(item.price || "")}"
              placeholder="例: ¥1,000"
              ${item.category === "無料配布" ? "disabled" : ""}
              class="mt-1 w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 disabled:opacity-50">

          <label class="block text-[10px] text-slate-400">

            <textarea data-item-index="${index}" data-item-key="desc"

              class="mt-1 w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-300 h-14 resize-y">${escapeHtml(item.desc)}</textarea>

          <label class="block text-[10px] text-slate-400">
            個別に画像を選択
            <input type="file" accept="image/*" data-item-image="${index}"
              class="mt-1 w-full text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer">

        container.appendChild(itemEl);

      lucide.createIcons();

      container.querySelectorAll("[data-item-index]").forEach((input) => {
        const updateItemField = () => {
          const index = Number(input.dataset.itemIndex);
          const key = input.dataset.itemKey;

          if (!items[index]) return;
          items[index][key] = input.value;

          if (key === "category") {
            const priceInput = container.querySelector(
              `[data-item-index="${index}"][data-item-key="price"]`
            );

            if (input.value === "無料配布") {
              items[index].price = "";
              if (priceInput) {
                priceInput.value = "";
                priceInput.disabled = true;
              }
            } else if (priceInput) {
              priceInput.disabled = false;
            }
          }

          generateOshinagaki();
        };

        input.addEventListener("input", updateItemField);
        input.addEventListener("change", updateItemField);
      });

      container.querySelectorAll("[data-remove-item]").forEach((button) => {
        button.addEventListener("click", () => {
          removeItem(Number(button.dataset.removeItem));
        });
      });

      container.querySelectorAll("[data-move-item]").forEach((button) => {
        button.addEventListener("click", () => {
          moveItem(
            Number(button.dataset.moveItem),
            Number(button.dataset.direction)
          );
        });
      });

      container.querySelectorAll("[data-item-image]").forEach((input) => {
        input.addEventListener("change", () => {
          handleSingleImageUpload(Number(input.dataset.itemImage), input);
        });
      });

    function addItem() {
      items.push({
        category: "新刊",
        ageRating: "全年齢",
        title: `頒布物 #${items.length + 1}`,
        price: "¥ 500",
        desc: "",
        imageSrc: null
      });

      renderFormItems();
      generateOshinagaki();
    }

    function removeItem(index) {
      items.splice(index, 1);
      renderFormItems();
      generateOshinagaki();
    }

    function moveItem(index, direction) {
      const nextIndex = index + direction;

      if (nextIndex < 0 || nextIndex >= items.length) {
        return;
      }

      [items[index], items[nextIndex]] = [items[nextIndex], items[index]];
      renderFormItems();
      generateOshinagaki();
    }

    function handleSingleImageUpload(index, input) {
      const file = input.files && input.files[0];
      if (!file || !items[index]) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        items[index].imageSrc = event.target.result;
        generateOshinagaki();
      };
      reader.readAsDataURL(file);
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(
          new Error(`画像を読み込めませんでした: ${file.name}`)
        );
        reader.readAsDataURL(file);
      });
    }

    /*
      選択された画像を選択順に頒布物へ割り当てます。
      頒布物数を超えた分は新しい頒布物フォームを追加します。
    */
    async function handleBatchImageUpload(fileList) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;

      try {
        const imageSources = await Promise.all(files.map(readFileAsDataURL));

        imageSources.forEach((imageSrc, index) => {
          if (index < items.length) {
            items[index].imageSrc = imageSrc;
          } else {
            items.push({
              category: "新刊",
              ageRating: "全年齢",
              title: `新刊アイテム ${index + 1}`,
              price: "¥ 500",
              desc: "",
              imageSrc
            });
          }
        });

        renderFormItems();
        generateOshinagaki();
      } catch (error) {
        alert(error.message);
      }
    }

    function createPatternCanvas(patternStyle, colorHex) {
      const size = 240;
      const patternCanvas = document.createElement("canvas");
      const context = patternCanvas.getContext("2d");

      patternCanvas.width = size;
      patternCanvas.height = size;
      context.fillStyle = "#fff8fb";
      context.fillRect(0, 0, size, size);

      if (patternStyle === "dots") {
        context.fillStyle = colorHex;
        context.beginPath();
        context.arc(size / 4, size / 4, 17, 0, Math.PI * 2);
        context.arc(size * 3 / 4, size * 3 / 4, 17, 0, Math.PI * 2);
        context.fill();
      } else if (patternStyle === "stripes") {
        context.fillStyle = colorHex;
        context.fillRect(0, 0, size / 2, size);
      } else if (patternStyle === "diagonal") {
        /*
          回転後のストライプ周期をタイルサイズと整合させ、
          タイル境界で斜線が途切れにくいように描画します。
        */
        const period = size / Math.sqrt(2);
        const stripeWidth = period / 3;

        context.save();
        context.translate(size / 2, size / 2);
        context.rotate(Math.PI / 4);
        context.fillStyle = colorHex;

        for (let x = -size * 2; x <= size * 2; x += period) {
          context.fillRect(x, -size * 2, stripeWidth, size * 4);
        }

        context.restore();
      } else if (patternStyle === "border") {
        context.fillStyle = colorHex;
        context.fillRect(0, 0, size, size / 2);
      } else if (patternStyle === "check") {
        /*
          2×2の市松模様。タイルの上下左右が繰り返し可能な柄です。
        */
        const square = size / 2;
        context.fillStyle = colorHex;
        context.fillRect(0, 0, square, square);
        context.fillRect(square, square, square, square);
      }

      return patternCanvas;
    }

    function applyBackground() {
      const backgroundType = document.getElementById("bgTypeSelect").value;

      canvas.setBackgroundImage(null);
      canvas.setBackgroundColor("#ffffff");

      if (backgroundType === "color") {
        canvas.setBackgroundColor(
          document.getElementById("bgColorPicker").value
        );
        return null;
      }

      if (backgroundType === "custom" && customBgImageObj) {
        canvas.setBackgroundImage(customBgImageObj, null, {
          originX: "left",
          originY: "top",
          left: 0,
          top: 0,
          scaleX: CANVAS_WIDTH / customBgImageObj.width,
          scaleY: CANVAS_HEIGHT / customBgImageObj.height
        });
        return null;
      }

      if (backgroundType === "custom") {
        return null;
      }

      const patternCanvas = createPatternCanvas(
        document.getElementById("patternStyleSelect").value,
        selectedPresetColor.hex
      );

      return new fabric.Pattern({
        source: patternCanvas,
        repeat: "repeat"
      });
    }

    function getInfoBoxStyle(prefix, defaultSize, defaultTextColor, maxSize) {
      const rawSize = Number.parseInt(
        document.getElementById(`${prefix}FontSize`).value,
        10
      );
      const backgroundEnabled =
        document.getElementById(`${prefix}BgEnabled`).checked;

      return {
        fontSize: Number.isFinite(rawSize)
          ? Math.max(12, Math.min(rawSize, maxSize))
          : defaultSize,
        fill:
          document.getElementById(`${prefix}TextColor`).value ||
          defaultTextColor,
        backgroundColor: backgroundEnabled
          ? document.getElementById(`${prefix}BgColor`).value
          : ""
      };
    }

    function getCategoryStyle(category) {
      return CATEGORY_STYLES[category] || CATEGORY_STYLES["新刊"];
    }

    /*
      フォント倍率に応じた頒布物テキストを作り、
      Fabric.jsで測定できるオブジェクトとして返します。
    */
    function createItemTextBlock(item, textWidth, fontScale) {
      const categoryStyle = getCategoryStyle(item.category);
      const isR18 = item.ageRating === "R18";
      const entries = [];

      function scaledSize(baseSize) {
        return Math.max(1, baseSize * fontScale);
      }

      entries.push({
        kind: "category",
        text: ` ${item.category || "新刊"} `,
        fontSize: scaledSize(64),
        fontFamily: "M PLUS Rounded 1c",
        fontWeight: "bold",
        fill: categoryStyle.text,
        backgroundColor: categoryStyle.background,
        stroke: categoryStyle.border,
        strokeWidth: 1,
        padding: Math.max(1, 10 * fontScale),
        gapAfter: Math.max(1, 7 * fontScale)
      });

      entries.push({
        kind: "age",
        text: ` ${isR18 ? "R18" : "全年齢"} `,
        fontSize: scaledSize(34),
        fontFamily: "M PLUS Rounded 1c",
        fontWeight: "bold",
        fill: isR18 ? "#ffffff" : "#166534",
        backgroundColor: isR18 ? "#991b1b" : "#dcfce7",
        stroke: isR18 ? "#7f1d1d" : "#86efac",
        strokeWidth: 1,
        padding: Math.max(1, 7 * fontScale),
        gapAfter: Math.max(1, 8 * fontScale)
      });

      entries.push({
        kind: "title",
        text: item.title || "",
        fontSize: scaledSize(78),
        fontFamily: "Noto Sans JP",
        fontWeight: "bold",
        fill: "#0f172a",
        padding: 0,
        gapAfter: Math.max(1, 9 * fontScale)
      });

      if (item.category !== "無料配布" && item.price) {
        entries.push({
          kind: "price",
          text: item.price,
          fontSize: scaledSize(100),
          fontFamily: "M PLUS Rounded 1c",
          fontWeight: "bold",
          fill: categoryStyle.background,
          padding: 0,
          gapAfter: Math.max(1, 8 * fontScale)
        });
      }

      if (item.desc) {
        entries.push({
          kind: "description",
          text: item.desc,
          fontSize: scaledSize(38),
          fontFamily: "Noto Sans JP",
          fontWeight: "normal",
          fill: "#475569",
          padding: 0,
          gapAfter: 0
        });
      }

      const objects = entries.map((entry) => {
        const object = new fabric.Textbox(entry.text, {
          left: 0,
          top: 0,
          width: textWidth,
          fontSize: entry.fontSize,
          fontFamily: entry.fontFamily,
          fontWeight: entry.fontWeight,
          fill: entry.fill,
          backgroundColor: entry.backgroundColor || "",
          stroke: entry.stroke,
          strokeWidth: entry.strokeWidth || 0,
          padding: entry.padding,
          splitByGrapheme: true,
          lineHeight: 1.05,
          selectable: false,
          evented: false
        });

        return {
          kind: entry.kind,
          object,
          gapAfter: entry.gapAfter
        };
      });

      const totalHeight = objects.reduce((height, entry) => {
        return height + entry.object.getScaledHeight() + entry.gapAfter;
      }, 0);

      return { entries: objects, totalHeight };
    }

    /*
      テキストの折り返し後の高さを計算し、
      カード内に収まる最大のフォントサイズを二分探索します。
    */
    function fitItemTextBlock(item, textWidth, availableHeight) {
      let low = 0.001;
      let high = 1;
      let best = createItemTextBlock(item, textWidth, low);

      for (let iteration = 0; iteration < 24; iteration += 1) {
        const middle = (low + high) / 2;
        const candidate = createItemTextBlock(item, textWidth, middle);

        if (candidate.totalHeight <= availableHeight) {
          best = candidate;
          low = middle;
        } else {
          high = middle;
        }
      }

      return best;
    }

    function addImageToCanvas(item, imageBox, thisGeneration) {
      if (!item.imageSrc) return;

      fabric.Image.fromURL(item.imageSrc, (image) => {
        if (!image || thisGeneration !== generationId) return;

        const scale = Math.min(
          imageBox.width / image.width,
          imageBox.height / image.height
        );

        image.set({
          left: imageBox.left + (imageBox.width - image.width * scale) / 2,
          top: imageBox.top + (imageBox.height - image.height * scale) / 2,
          scaleX: scale,
          scaleY: scale,
          selectable: false,
          evented: false
        });

        canvas.add(image);
        canvas.renderAll();
      });
    }

    function generateOshinagaki() {
      if (!canvas) return;

      const thisGeneration = ++generationId;
      canvas.clear();

      const patternFill = applyBackground();

      /* パターンを最背面のオブジェクトとして描画 */
      if (patternFill) {
        canvas.add(new fabric.Rect({
          left: 0,
          top: 0,
          width: CANVAS_WIDTH,
          height: CANVAS_HEIGHT,
          fill: patternFill,
          selectable: false,
          evented: false,
          excludeFromExport: false
        }));
      }

      const eventDate = document.getElementById("eventDate").value;
      const eventName = document.getElementById("eventName").value;
      const circleName = document.getElementById("circleName").value;
      const spaceNo = document.getElementById("spaceNo").value;
      const isLandscape = currentOrientation === "LANDSCAPE";

      const headerColor =
        document.getElementById("headerBgColor").value || "#0f172a";
      const accentColor =
        document.getElementById("headerAccentColor").value ||
        selectedPresetColor.main;

      const eventInfoStyle = getInfoBoxStyle(
        "eventInfo",
        isLandscape ? 48 : 46,
        "#cbd5e1",
        200
      );
      const circleInfoStyle = getInfoBoxStyle(
        "circleInfo",
        isLandscape ? 120 : 110,
        "#ffffff",
        300
      );
      const spaceInfoStyle = getInfoBoxStyle(
        "spaceInfo",
        isLandscape ? 75 : 65,
        "#ffffff",
        200
      );

      const headerHeight = isLandscape ? 360 : 420;

      canvas.add(new fabric.Rect({
        left: 0,
        top: 0,
        width: CANVAS_WIDTH,
        height: headerHeight,
        fill: headerColor,
        selectable: false,
        evented: false
      }));

      canvas.add(new fabric.Rect({
        left: 0,
        top: headerHeight - 12,
        width: CANVAS_WIDTH,
        height: 12,
        fill: accentColor,
        selectable: false,
        evented: false
      }));

      canvas.add(new fabric.Textbox(`${eventDate}  |  ${eventName}`, {
        left: 80,
        top: isLandscape ? 55 : 60,
        width: CANVAS_WIDTH - 160,
        fontSize: eventInfoStyle.fontSize,
        fontFamily: "Noto Sans JP",
        fill: eventInfoStyle.fill,
        backgroundColor: eventInfoStyle.backgroundColor,
        selectable: false,
        evented: false
      }));

      canvas.add(new fabric.Textbox(circleName, {
        left: 80,
        top: isLandscape ? 130 : 135,
        width: isLandscape ? CANVAS_WIDTH - 1000 : CANVAS_WIDTH - 160,
        fontSize: circleInfoStyle.fontSize,
        fontWeight: "bold",
        fontFamily: "Noto Sans JP",
        fill: circleInfoStyle.fill,
        backgroundColor: circleInfoStyle.backgroundColor,
        selectable: false,
        evented: false
      }));

      if (spaceNo) {
        canvas.add(new fabric.Textbox(` ${spaceNo} `, {
          left: isLandscape ? CANVAS_WIDTH - 850 : 80,
          top: isLandscape ? 120 : 270,
          width: isLandscape ? 760 : CANVAS_WIDTH - 160,
          fontSize: spaceInfoStyle.fontSize,
          fontWeight: "bold",
          fontFamily: "M PLUS Rounded 1c",
          fill: spaceInfoStyle.fill,
          backgroundColor: spaceInfoStyle.backgroundColor,
          padding: 18,
          selectable: false,
          evented: false
        }));
      }

      // 頒布物カードの段組
      const itemCount = items.length;
      let columns = 2;

      if (isLandscape) {
        if (itemCount <= 1) columns = 1;
        else if (itemCount > 4) columns = 3;
      } else if (itemCount <= 3) {
        columns = 1;
      }

      const rows = Math.ceil(itemCount / columns);
      const startY = headerHeight + 50;
      const marginX = 70;
      const marginY = 40;
      const gapX = 40;
      const gapY = 40;

      const slotWidth =
        (CANVAS_WIDTH - marginX * 2 - gapX * (columns - 1)) / columns;
      const slotHeight = rows > 0
        ? (CANVAS_HEIGHT - startY - marginY - gapY * (rows - 1)) / rows
        : 0;

      items.forEach((item, index) => {
        const row = Math.floor(index / columns);
        const column = index % columns;
        const posX = marginX + column * (slotWidth + gapX);
        const posY = startY + row * (slotHeight + gapY);
        const padding = 25;

        canvas.add(new fabric.Rect({
          left: posX,
          top: posY,
          width: slotWidth,
          height: slotHeight,
          fill: "#ffffff",
          stroke: "#cbd5e1",
          strokeWidth: 4,
          rx: 24,
          ry: 24,
          selectable: false,
          evented: false
        }));

        const imageWidth = slotWidth * (isLandscape ? 0.38 : 0.36);
        const imageHeight = Math.max(1, slotHeight - padding * 2);
        const imageLeft = posX + padding;
        const imageTop = posY + padding;

        canvas.add(new fabric.Rect({
          left: imageLeft,
          top: imageTop,
          width: imageWidth,
          height: imageHeight,
          fill: "#f1f5f9",
          rx: 12,
          ry: 12,
          selectable: false,
          evented: false
        }));

        if (item.imageSrc) {
          addImageToCanvas(item, {
            left: imageLeft,
            top: imageTop,
            width: imageWidth,
            height: imageHeight
          }, thisGeneration);
        } else {
          canvas.add(new fabric.Text("NO IMAGE", {
            left: imageLeft + imageWidth / 2,
            top: imageTop + imageHeight / 2,
            originX: "center",
            originY: "center",
            fontSize: 32,
            fontFamily: "Noto Sans JP",
            fill: "#94a3b8",
            selectable: false,
            evented: false
          }));
        }

        const textX = imageLeft + imageWidth + 25;
        const textWidth = Math.max(
          1,
          posX + slotWidth - padding - textX
        );
        const textTop = posY + padding;
        const textHeight = Math.max(1, slotHeight - padding * 2);

        const fittedBlock = fitItemTextBlock(
          item,
          textWidth,
          textHeight
        );

        let currentY = textTop;

        fittedBlock.entries.forEach((entry) => {
          entry.object.set({
            left: textX,
            top: currentY
          });

          canvas.add(entry.object);
          currentY += entry.object.getScaledHeight() + entry.gapAfter;
        });
      });

      canvas.renderAll();
    }

    function applyPreviewScale(scale) {
      const canvasContainer = document.getElementById("canvasContainer");
      const fabricWrapper = canvas.wrapperEl;

      if (!fabricWrapper || !canvasContainer) return;

      fabricWrapper.style.transformOrigin = "top left";
      fabricWrapper.style.transform = `scale(${scale})`;

      canvasContainer.style.width = `${CANVAS_WIDTH * scale}px`;
      canvasContainer.style.height = `${CANVAS_HEIGHT * scale}px`;

      canvas.requestRenderAll();
      canvas.calcOffset();

      document.getElementById("zoomDisplay").textContent =
        `表示: ${Math.round(scale * 100)}%`;

      const slider = document.getElementById("zoomSlider");
      if (slider) {
        slider.value = String(
          Math.max(1, Math.min(200, Math.round(scale * 100)))
        );
      }
    }

    function fitCanvasToWorkspace() {
      const workspace = document.getElementById("workspace");
      const padding = 40;

      const availableWidth = Math.max(workspace.clientWidth - padding, 1);
      const availableHeight = Math.max(workspace.clientHeight - padding, 1);

      const scale = Math.min(
        availableWidth / CANVAS_WIDTH,
        availableHeight / CANVAS_HEIGHT
      );

      applyPreviewScale(scale);
    }

    function setupResponsiveScaler() {
      const workspace = document.getElementById("workspace");

      resizeCanvasToFit = () => {
        if (previewZoomMode === "fit") {
          fitCanvasToWorkspace();
        } else {
          const sliderValue = Number(
            document.getElementById("zoomSlider").value
          );
          applyPreviewScale(sliderValue / 100);
        }
      };

      if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(() => {
          if (previewZoomMode === "fit") {
            fitCanvasToWorkspace();
          }
        });
        observer.observe(workspace);
      }

      window.addEventListener("resize", () => {
        if (previewZoomMode === "fit") {
          fitCanvasToWorkspace();
        }
      });

      requestAnimationFrame(fitCanvasToWorkspace);
    }

    function setupEventListeners() {
      ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
        document.getElementById(id)
          .addEventListener("input", generateOshinagaki);
      });

      [
        "headerBgColor",
        "headerAccentColor",
        "eventInfoFontSize",
        "eventInfoTextColor",
        "eventInfoBgEnabled",
        "eventInfoBgColor",
        "circleInfoFontSize",
        "circleInfoTextColor",
        "circleInfoBgEnabled",
        "circleInfoBgColor",
        "spaceInfoFontSize",
        "spaceInfoTextColor",
        "spaceInfoBgEnabled",
        "spaceInfoBgColor"
      ].forEach((id) => {
        const input = document.getElementById(id);
        input.addEventListener("input", generateOshinagaki);
        input.addEventListener("change", generateOshinagaki);
      });

      document.getElementById("orientationSelect")
        .addEventListener("change", updateCanvasDimensions);

      document.getElementById("paperSizeSelect")
        .addEventListener("change", updateCanvasDimensions);

      document.getElementById("bgTypeSelect").addEventListener("change", (event) => {
        const type = event.target.value;

        document.getElementById("patternControls")
          .classList.toggle("hidden", type !== "pattern");
        document.getElementById("customBgControls")
          .classList.toggle("hidden", type !== "custom");
        document.getElementById("singleColorControls")
          .classList.toggle("hidden", type !== "color");

        generateOshinagaki();
      });

      document.getElementById("patternStyleSelect")
        .addEventListener("change", generateOshinagaki);

      document.getElementById("bgColorPicker")
        .addEventListener("input", generateOshinagaki);

      document.getElementById("customBgInput").addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (loadEvent) => {
          fabric.Image.fromURL(loadEvent.target.result, (image) => {
            if (!image) return;
            customBgImageObj = image;
            generateOshinagaki();
          });
        };
        reader.readAsDataURL(file);
      });

      document.getElementById("batchImageInput").addEventListener("change", (event) => {
        handleBatchImageUpload(event.target.files);
        event.target.value = "";
      });

      document.getElementById("addItemBtn")
        .addEventListener("click", addItem);

      document.getElementById("toggleGrid").addEventListener("change", (event) => {
        document.getElementById("gridOverlay")
          .classList.toggle("hidden", !event.target.checked);
      });

      document.getElementById("fitCanvasBtn").addEventListener("click", () => {
        previewZoomMode = "fit";
        fitCanvasToWorkspace();
      });

      document.getElementById("zoomSlider").addEventListener("input", (event) => {
        previewZoomMode = "manual";
        applyPreviewScale(Number(event.target.value) / 100);
      });

      document.getElementById("exportPng").addEventListener("click", () => {
        const dataURL = canvas.toDataURL({
          format: "png",
          multiplier: 1
        });

        const link = document.createElement("a");
        link.download =
          `oshinagaki_${currentPaperSize}_${currentOrientation}.png`;
        link.href = dataURL;
        link.click();
      });

      document.getElementById("exportPdf").addEventListener("click", () => {
        const dataURL = canvas.toDataURL({
          format: "png",
          multiplier: 1
        });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF(
          currentOrientation === "LANDSCAPE" ? "landscape" : "portrait",
          "mm",
          currentPaperSize.toLowerCase()
        );

        const width = pdf.internal.pageSize.getWidth();
        const height = pdf.internal.pageSize.getHeight();

        pdf.addImage(dataURL, "PNG", 0, 0, width, height);
        pdf.save(
          `oshinagaki_${currentPaperSize}_${currentOrientation}.pdf`
        );
      });
    }
  </script>
</body>
</html>
