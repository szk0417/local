<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高度同人おしながき作成エディタ (A3 200dpi)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fabric.js v5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- フリーフォント読み込み (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;700;900&family=Shippori+Mincho:wght@600;800&family=Dela+Gothic+One&family=Kaisei+Decol:wght@700&family=Yuji+Syuku&display=swap" rel="stylesheet">

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    /* Google Font を Fabric.js 側で正しく取得・反映させるためのクラス設定 */
    .font-noto { font-family: 'Noto Sans JP', sans-serif; }
    .font-mplus { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .font-shippori { font-family: 'Shippori Mincho', serif; }
    .font-dela { font-family: 'Dela Gothic One', cursive; }
    .font-kaisei { font-family: 'Kaisei Decol', serif; }
    .font-yuji { font-family: 'Yuji Syuku', serif; }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans select-none overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-2.5 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="bg-gradient-to-r from-rose-500 to-purple-600 p-2 rounded-lg shadow">
        <i data-lucide="layout-dashboard" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight">自由編集型 同人おしながきエディタ</h1>
        <p class="text-[11px] text-slate-400" id="paperSpecLabel">A3サイズ 200dpi (3307 × 2339px / 白無地キャンバス)</p>
      </div>
    </div>

    <!-- 出力・操作ボタン -->
    <div class="flex items-center gap-2">
      <button id="exportPng" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3.5 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="image" class="w-4 h-4"></i>
        <span>PNG出力</span>
      </button>
      <button id="exportPdf" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        <span>A3 PDF出力</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- 左側：オブジェクト操作パネル -->
    <aside class="w-full md:w-[380px] lg:w-[420px] bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 overflow-hidden">
      
      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <!-- 1. 用紙・キャンバス基本設定 -->
        <div class="space-y-2.5 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
          <span class="text-xs font-bold text-rose-400 flex items-center gap-1">
            <i data-lucide="settings" class="w-3.5 h-3.5"></i> ■ キャンバス・用紙設定
          </span>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-slate-400 mb-1">用紙向き</label>
              <select id="orientationSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
                <option value="LANDSCAPE">横向き (A3横)</option>
                <option value="PORTRAIT">縦向き (A3縦)</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] text-slate-400 mb-1">キャンバス色</label>
              <input type="color" id="canvasBgPicker" value="#ffffff" class="w-full h-8 bg-slate-800 border border-slate-700 rounded-lg cursor-pointer p-0.5">
            </div>
          </div>

          <div>
            <label class="block text-[10px] text-slate-400 mb-1">背景画像を選択・アップロード</label>
            <div class="flex gap-2">
              <input type="file" id="bgImageInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[11px] file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer">
              <button id="clearBgBtn" class="bg-slate-700 hover:bg-slate-600 text-[11px] px-2 rounded shrink-0 border border-slate-600 text-slate-300">背景クリア</button>
            </div>
          </div>
        </div>

        <!-- 2. オブジェクト追加エリア -->
        <div class="space-y-2.5 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
          <span class="text-xs font-bold text-rose-400 flex items-center gap-1">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> ■ オブジェクト追加
          </span>
          
          <div class="grid grid-cols-2 gap-2">
            <button id="addTextBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2 px-3 rounded-lg border border-slate-600 flex items-center justify-center gap-1.5 font-bold transition">
              <i data-lucide="type" class="w-4 h-4 text-rose-400"></i> テキスト追加
            </button>
            <label class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2 px-3 rounded-lg border border-slate-600 flex items-center justify-center gap-1.5 font-bold cursor-pointer transition">
              <i data-lucide="image-plus" class="w-4 h-4 text-emerald-400"></i> 画像追加
              <input type="file" id="imageAddInput" accept="image/*" multiple class="hidden">
            </label>
          </div>
        </div>

        <!-- 3. 選択中オブジェクトのプロパティ設定 -->
        <div id="propertyPanel" class="space-y-3 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 opacity-50 pointer-events-none transition-all">
          <div class="flex justify-between items-center border-b border-slate-700/80 pb-2">
            <span class="text-xs font-bold text-rose-400 flex items-center gap-1">
              <i data-lucide="sliders" class="w-3.5 h-3.5"></i> ■ 選択オブジェクト設定
            </span>
            <button id="deleteObjectBtn" class="bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 border border-rose-500/50 text-[11px] px-2 py-0.5 rounded flex items-center gap-1">
              <i data-lucide="trash-2" class="w-3 h-3"></i> 削除
            </button>
          </div>

          <!-- テキスト専用プロパティ -->
          <div id="textControls" class="space-y-2.5">
            <div>
              <label class="block text-[10px] text-slate-400 mb-1">フリーフォント選択</label>
              <select id="fontFamilySelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-rose-500">
                <option value="Noto Sans JP">Noto Sans JP (標準ゴシック)</option>
                <option value="M PLUS Rounded 1c">M PLUS Rounded (丸ゴシック)</option>
                <option value="Shippori Mincho">しっぽり明朝 (明朝体)</option>
                <option value="Dela Gothic One">Dela Gothic One (極太ポップ)</option>
                <option value="Kaisei Decol">Kaisei Decol (可愛い明朝)</option>
                <option value="Yuji Syuku">祐司 宿 (毛筆・和風)</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">文字サイズ</label>
                <input type="number" id="fontSizeInput" min="10" max="300" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-200">
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">文字色</label>
                <input type="color" id="textColorPicker" class="w-full h-7 bg-slate-800 border border-slate-700 rounded cursor-pointer p-0.5">
              </div>
            </div>

            <div class="flex gap-2">
              <button id="toggleBoldBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-1 rounded text-slate-300 font-bold">太字</button>
              <button id="toggleItalicBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-1 rounded text-slate-300 italic">斜体</button>
            </div>
          </div>

          <!-- 重ね順調整 -->
          <div class="pt-1 border-t border-slate-800 grid grid-cols-2 gap-2">
            <button id="bringForwardBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] py-1 rounded text-slate-300 flex items-center justify-center gap-1">
              <i data-lucide="arrow-up" class="w-3 h-3"></i> 前面へ移動
            </button>
            <button id="sendBackwardsBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] py-1 rounded text-slate-300 flex items-center justify-center gap-1">
              <i data-lucide="arrow-down" class="w-3 h-3"></i> 背面へ移動
            </button>
          </div>
        </div>

        <!-- 4. 整列配置ツール -->
        <div class="space-y-2.5 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
          <span class="text-xs font-bold text-rose-400 flex items-center gap-1">
            <i data-lucide="align-center" class="w-3.5 h-3.5"></i> ■ 整列配置ツール
          </span>
          <p class="text-[10px] text-slate-400">キャンバス全体または複数選択した要素を揃えます</p>
          
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="alignObjects('left')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] py-1.5 rounded flex items-center justify-center gap-1" title="左揃え">
              <i data-lucide="align-start-vertical" class="w-3.5 h-3.5"></i> 左揃え
            </button>
            <button onclick="alignObjects('center')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] py-1.5 rounded flex items-center justify-center gap-1" title="左右中央揃え">
              <i data-lucide="align-center-vertical" class="w-3.5 h-3.5"></i> 左右中央
            </button>
            <button onclick="alignObjects('right')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] py-1.5 rounded flex items-center justify-center gap-1" title="右揃え">
              <i data-lucide="align-end-vertical" class="w-3.5 h-3.5"></i> 右揃え
            </button>
            <button onclick="alignObjects('top')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] py-1.5 rounded flex items-center justify-center gap-1" title="上揃え">
              <i data-lucide="align-start-horizontal" class="w-3.5 h-3.5"></i> 上揃え
            </button>
            <button onclick="alignObjects('middle')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] py-1.5 rounded flex items-center justify-center gap-1" title="上下中央揃え">
              <i data-lucide="align-center-horizontal" class="w-3.5 h-3.5"></i> 上下中央
            </button>
            <button onclick="alignObjects('bottom')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] py-1.5 rounded flex items-center justify-center gap-1" title="下揃え">
              <i data-lucide="align-end-horizontal" class="w-3.5 h-3.5"></i> 下揃え
            </button>
          </div>
        </div>

      </div>
    </aside>

    <!-- 右側：リアルタイムエディタ・キャンバスワークスペース -->
    <main id="workspace" class="flex-1 bg-slate-950 flex flex-col items-center justify-center p-3 sm:p-5 overflow-hidden relative min-h-0 select-none">
      <div class="absolute top-3 left-3 z-10 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-full px-3 py-1 text-[11px] text-slate-300 flex items-center gap-2 shadow">
        <span id="zoomDisplay">表示: 100%</span>
        <span class="text-slate-600">|</span>
        <span id="dimensionDisplay" class="text-slate-400">A3横 (3307×2339px)</span>
      </div>

      <div id="canvasContainer" class="relative shadow-2xl border border-slate-700/50 bg-white flex items-center justify-center overflow-hidden">
        <canvas id="oshinagakiCanvas"></canvas>
      </div>
    </main>

  </div>

  <script>
    lucide.createIcons();

    // 用紙解像度定義 (A3 200dpi)
    const A3_SPECS = {
      width: 3307,
      height: 2339
    };

    let currentOrientation = 'LANDSCAPE'; // LANDSCAPE or PORTRAIT
    let CANVAS_WIDTH = A3_SPECS.width;
    let CANVAS_HEIGHT = A3_SPECS.height;

    let canvas;
    let bgImageObj = null;

    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      setupResponsiveScaler();
      setupEventListeners();
      addDefaultElements();
    });

    // Fabric.js キャンバスの初期化
    function initCanvas() {
      canvas = new fabric.Canvas('oshinagakiCanvas', {
        width: CANVAS_WIDTH,
        height: CANVAS_HEIGHT,
        backgroundColor: '#ffffff',
        preserveObjectStacking: true // 選択時も重ね順を保持
      });

      // オブジェクト選択イベント設定
      canvas.on('selection:created', updatePropertyPanel);
      canvas.on('selection:updated', updatePropertyPanel);
      canvas.on('selection:cleared', resetPropertyPanel);
      canvas.on('object:modified', () => canvas.renderAll());
    }

    // デフォルトのサンプル要素を追加
    function addDefaultElements() {
      // ヘッダー背景（濃紺）
      const headerBox = new fabric.Rect({
        left: 0, top: 0, width: CANVAS_WIDTH, height: 380,
        fill: '#0f172a', selectable: true
      });

      // サークル名テキスト
      const circleText = new fabric.Textbox('サークル名テキスト', {
        left: 80, top: 120, fontSize: 130, fontWeight: 'bold',
        fontFamily: 'Noto Sans JP', fill: '#ffffff', width: 1800
      });

      // スペース番号バッジ
      const spaceBadge = new fabric.Textbox(' 東7 あ-01a ', {
        left: CANVAS_WIDTH - 850, top: 110, fontSize: 85, fontWeight: 'bold',
        fontFamily: 'M PLUS Rounded 1c', fill: '#ffffff', backgroundColor: '#e11d48',
        padding: 20, rx: 15, ry: 15
      });

      // サンプル新刊カード枠
      const cardBg = new fabric.Rect({
        left: 80, top: 480, width: 1500, height: 800,
        fill: '#ffffff', stroke: '#cbd5e1', strokeWidth: 4, rx: 24, ry: 24
      });

      const cardTitle = new fabric.Textbox('新刊サンプルタイトル', {
        left: 650, top: 580, fontSize: 60, fontWeight: 'bold',
        fontFamily: 'Noto Sans JP', fill: '#0f172a', width: 850
      });

      const cardPrice = new fabric.Text('¥ 1,000', {
        left: 650, top: 700, fontSize: 80, fontWeight: 'bold',
        fontFamily: 'M PLUS Rounded 1c', fill: '#e11d48'
      });

      canvas.add(headerBox, circleText, spaceBadge, cardBg, cardTitle, cardPrice);
      canvas.renderAll();
    }

    // ★ オブジェクト追加処理 ★

    // テキスト追加
    document.getElementById('addTextBtn').addEventListener('click', () => {
      const text = new fabric.Textbox('新規テキスト', {
        left: CANVAS_WIDTH / 2 - 200,
        top: CANVAS_HEIGHT / 2 - 50,
        fontSize: 60,
        fontFamily: 'Noto Sans JP',
        fill: '#0f172a',
        width: 600
      });
      canvas.add(text);
      canvas.setActiveObject(text);
      canvas.renderAll();
    });

    // 画像追加（適切な縦横比にリサイズして読み込み）
    document.getElementById('imageAddInput').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          fabric.Image.fromURL(evt.target.result, (img) => {
            // 長辺が600px程度に収まるようにデフォルトスケール計算
            const maxDim = 600;
            const scale = Math.min(maxDim / img.width, maxDim / img.height);

            img.set({
              left: 100 + (index * 40),
              top: 500 + (index * 40),
              scaleX: scale,
              scaleY: scale,
              cornerSize: 24,
              transparentCorners: false
            });
            canvas.add(img);
            canvas.setActiveObject(img);
            canvas.renderAll();
          });
        };
        reader.readAsDataURL(file);
      });
      e.target.value = ''; // リセット
    });

    // 背景画像設定
    document.getElementById('bgImageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        fabric.Image.fromURL(evt.target.result, (img) => {
          bgImageObj = img;
          updateBackground();
        });
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('clearBgBtn').addEventListener('click', () => {
      bgImageObj = null;
      document.getElementById('bgImageInput').value = '';
      canvas.setBackgroundImage(null, canvas.renderAll.bind(canvas));
    });

    function updateBackground() {
      if (bgImageObj) {
        canvas.setBackgroundImage(bgImageObj, canvas.renderAll.bind(canvas), {
          scaleX: CANVAS_WIDTH / bgImageObj.width,
          scaleY: CANVAS_HEIGHT / bgImageObj.height
        });
      } else {
        const color = document.getElementById('canvasBgPicker').value;
        canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
      }
    }

    document.getElementById('canvasBgPicker').addEventListener('input', updateBackground);

    // ★ 選択オブジェクトのプロパティ同期＆リアルタイム編集 ★
    function updatePropertyPanel() {
      const activeObj = canvas.getActiveObject();
      const panel = document.getElementById('propertyPanel');

      if (!activeObj) {
        resetPropertyPanel();
        return;
      }

      panel.classList.remove('opacity-50', 'pointer-events-none');

      const textControls = document.getElementById('textControls');
      if (activeObj.type === 'textbox' || activeObj.type === 'text') {
        textControls.classList.remove('hidden');
        document.getElementById('fontFamilySelect').value = activeObj.fontFamily || 'Noto Sans JP';
        document.getElementById('fontSizeInput').value = Math.round(activeObj.fontSize || 40);
        document.getElementById('textColorPicker').value = activeObj.fill || '#000000';
      } else {
        textControls.classList.add('hidden');
      }
    }

    function resetPropertyPanel() {
      const panel = document.getElementById('propertyPanel');
      panel.classList.add('opacity-50', 'pointer-events-none');
    }

    // リアルタイム反映プロパティイベント
    document.getElementById('fontFamilySelect').addEventListener('change', (e) => {
      const activeObj = canvas.getActiveObject();
      if (activeObj && (activeObj.type === 'textbox' || activeObj.type === 'text')) {
        activeObj.set('fontFamily', e.target.value);
        canvas.renderAll();
      }
    });

    document.getElementById('fontSizeInput').addEventListener('input', (e) => {
      const activeObj = canvas.getActiveObject();
      if (activeObj && (activeObj.type === 'textbox' || activeObj.type === 'text')) {
        activeObj.set('fontSize', parseInt(e.target.value, 10) || 20);
        canvas.renderAll();
      }
    });

    document.getElementById('textColorPicker').addEventListener('input', (e) => {
      const activeObj = canvas.getActiveObject();
      if (activeObj) {
        activeObj.set('fill', e.target.value);
        canvas.renderAll();
      }
    });

    document.getElementById('toggleBoldBtn').addEventListener('click', () => {
      const activeObj = canvas.getActiveObject();
      if (activeObj && (activeObj.type === 'textbox' || activeObj.type === 'text')) {
        const isBold = activeObj.fontWeight === 'bold';
        activeObj.set('fontWeight', isBold ? 'normal' : 'bold');
        canvas.renderAll();
      }
    });

    document.getElementById('toggleItalicBtn').addEventListener('click', () => {
      const activeObj = canvas.getActiveObject();
      if (activeObj && (activeObj.type === 'textbox' || activeObj.type === 'text')) {
        const isItalic = activeObj.fontStyle === 'italic';
        activeObj.set('fontStyle', isItalic ? 'normal' : 'italic');
        canvas.renderAll();
      }
    });

    // 重ね順＆削除
    document.getElementById('deleteObjectBtn').addEventListener('click', () => {
      const activeObjects = canvas.getActiveObjects();
      if (activeObjects.length > 0) {
        activeObjects.forEach(obj => canvas.remove(obj));
        canvas.discardActiveObject();
        canvas.renderAll();
      }
    });

    document.getElementById('bringForwardBtn').addEventListener('click', () => {
      const activeObj = canvas.getActiveObject();
      if (activeObj) {
        canvas.bringForward(activeObj);
        canvas.renderAll();
      }
    });

    document.getElementById('sendBackwardsBtn').addEventListener('click', () => {
      const activeObj = canvas.getActiveObject();
      if (activeObj) {
        canvas.sendBackwards(activeObj);
        canvas.renderAll();
      }
    });

    // ★ 整列配置機能 ★
    function alignObjects(action) {
      const activeObj = canvas.getActiveObject();
      if (!activeObj) return;

      if (activeObj.type === 'activeSelection') {
        // 複数選択されたオブジェクト間での整列
        const groupBound = activeObj.getBoundingRect();
        activeObj.forEachObject((obj) => {
          const itemBound = obj.getBoundingRect();
          switch (action) {
            case 'left':
              obj.set('left', -activeObj.width / 2 + obj.width * obj.scaleX / 2);
              break;
            case 'center':
              obj.set('left', 0);
              break;
            case 'right':
              obj.set('left', activeObj.width / 2 - obj.width * obj.scaleX / 2);
              break;
            case 'top':
              obj.set('top', -activeObj.height / 2 + obj.height * obj.scaleY / 2);
              break;
            case 'middle':
              obj.set('top', 0);
              break;
            case 'bottom':
              obj.set('top', activeObj.height / 2 - obj.height * obj.scaleY / 2);
              break;
          }
        });
      } else {
        // 単一オブジェクトのキャンバス全体での整列
        const bound = activeObj.getBoundingRect();
        switch (action) {
          case 'left':
            activeObj.set('left', 0);
            break;
          case 'center':
            activeObj.set('left', (CANVAS_WIDTH - bound.width) / 2);
            break;
          case 'right':
            activeObj.set('left', CANVAS_WIDTH - bound.width);
            break;
          case 'top':
            activeObj.set('top', 0);
            break;
          case 'middle':
            activeObj.set('top', (CANVAS_HEIGHT - bound.height) / 2);
            break;
          case 'bottom':
            activeObj.set('top', CANVAS_HEIGHT - bound.height);
            break;
        }
      }
      canvas.renderAll();
    }

    // ★ 用紙縦横切替 ★
    function updateDimensions() {
      currentOrientation = document.getElementById('orientationSelect').value;

      if (currentOrientation === 'LANDSCAPE') {
        CANVAS_WIDTH = A3_SPECS.width;
        CANVAS_HEIGHT = A3_SPECS.height;
      } else {
        CANVAS_WIDTH = A3_SPECS.height;
        CANVAS_HEIGHT = A3_SPECS.width;
      }

      canvas.setWidth(CANVAS_WIDTH);
      canvas.setHeight(CANVAS_HEIGHT);

      const label = `A3${currentOrientation === 'LANDSCAPE' ? '横' : '縦'} (${CANVAS_WIDTH}×${CANVAS_HEIGHT}px / 200dpi)`;
      document.getElementById('paperSpecLabel').innerText = label;
      document.getElementById('dimensionDisplay').innerText = label;

      updateBackground();
      setupResponsiveScaler();
    }

    // ★ 画面表示のレスポンシブフィット調整 ★
    function setupResponsiveScaler() {
      const workspace = document.getElementById('workspace');
      const canvasContainer = document.getElementById('canvasContainer');

      function fitCanvas() {
        const padding = 20;
        const availableWidth = Math.max(workspace.clientWidth - padding * 2, 100);
        const availableHeight = Math.max(workspace.clientHeight - padding * 2, 100);

        const scaleX = availableWidth / CANVAS_WIDTH;
        const scaleY = availableHeight / CANVAS_HEIGHT;
        const scale = Math.min(scaleX, scaleY);

        canvasContainer.style.width = `${CANVAS_WIDTH * scale}px`;
        canvasContainer.style.height = `${CANVAS_HEIGHT * scale}px`;

        canvas.setDimensions({ width: CANVAS_WIDTH * scale, height: CANVAS_HEIGHT * scale }, { cssOnly: true });
        canvas.setZoom(scale);
        canvas.calcOffset();

        document.getElementById('zoomDisplay').innerText = `表示: ${Math.round(scale * 100)}%`;
      }

      const observer = new ResizeObserver(fitCanvas);
      observer.observe(workspace);
      window.addEventListener('resize', fitCanvas);
      setTimeout(fitCanvas, 50);
    }

    function setupEventListeners() {
      document.getElementById('orientationSelect').addEventListener('change', updateDimensions);

      // キーボードショートカット（Deleteキーで削除）
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          const activeTag = document.activeElement.tagName.toLowerCase();
          if (activeTag !== 'input' && activeTag !== 'textarea') {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length > 0) {
              activeObjects.forEach(obj => canvas.remove(obj));
              canvas.discardActiveObject();
              canvas.renderAll();
            }
          }
        }
      });

      // PNG出力 (A3 200dpi 原寸出力)
      document.getElementById('exportPng').addEventListener('click', () => {
        canvas.discardActiveObject();
        canvas.renderAll();
        const dataURL = canvas.toDataURL({ format: 'png', multiplier: 1.0 });
        const link = document.createElement('a');
        link.download = `oshinagaki_A3_${Date.now()}.png`;
        link.href = dataURL;
        link.click();
      });

      // PDF出力 (A3原寸 200dpi PDF出力)
      document.getElementById('exportPdf').addEventListener('click', () => {
        canvas.discardActiveObject();
        canvas.renderAll();
        const dataURL = canvas.toDataURL({ format: 'png', multiplier: 1.0 });
        const { jsPDF } = window.jspdf;
        const isLandscape = currentOrientation === 'LANDSCAPE';
        
        const pdf = new jsPDF(isLandscape ? 'landscape' : 'portrait', 'mm', 'a3');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();

        pdf.addImage(dataURL, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`oshinagaki_A3_${Date.now()}.pdf`);
      });
    }
  </script>
</body>
