<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同人おしながきジェネレーター</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
      background: #1e293b;
    }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(120deg, #f43f5e, #9333ea);
      color: #fff;
      font-size: 19px;
    }
    .brand h1 { margin: 0; font-size: 14px; line-height: 1.3; }
    .brand p {
      overflow: hidden;
      margin: 2px 0 0;
      color: #94a3b8;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .actions { display: flex; flex: 0 0 auto; gap: 6px; }
    .button {
      border: 0;
      border-radius: 7px;
      padding: 8px 10px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    .button-print { background: #475569; }
    .button-png { background: #059669; }

    #mainLayout { display: flex; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    #settingsPanel {
      display: flex;
      flex: 0 0 390px;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
      border-right: 1px solid #334155;
      background: #1e293b;
    }
    .panel-heading {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }
    .panel-heading small { color: #4ade80; font-size: 9px; }
    #settingsContent { flex: 1 1 auto; overflow: auto; padding: 14px; }

    .section {
      margin-bottom: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      background: rgba(15, 23, 42, .65);
    }
    .section h2 { margin: 0 0 10px; color: #fb7185; font-size: 12px; }
    .field { display: block; margin-bottom: 9px; color: #94a3b8; font-size: 10px; }
    .field:last-child { margin-bottom: 0; }

    .control {
      display: block;
      width: 100%;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
    }
    .control:disabled { opacity: .5; }
    .color-control {
      width: 48px;
      height: 31px;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px;
      background: #1e293b;
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .palette { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .palette button {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 9px;
    }
    .palette button.selected { outline: 2px solid #f43f5e; }
    .swatch {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      color: #94a3b8;
      font-size: 10px;
    }
    .check-row input[type="checkbox"] { accent-color: #f43f5e; }

    .upload-box {
      display: block;
      border: 2px dashed #9f1239;
      border-radius: 9px;
      padding: 13px;
      background: rgba(30, 41, 59, .5);
      color: #e2e8f0;
      text-align: center;
      cursor: pointer;
    }
    .upload-box span { display: block; margin-top: 4px; font-size: 11px; font-weight: 700; }
    .upload-box small { display: block; margin-top: 3px; color: #94a3b8; font-size: 9px; }

    .item-card {
      margin-bottom: 10px;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 10px;
      background: #0f172a;
    }
    .item-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
    }
    .item-card-head button {
      border: 0;
      border-radius: 5px;
      padding: 3px 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 10px;
    }
    .item-card-head button:disabled { opacity: .4; }
    .delete-item { margin-left: 4px; color: #fb7185 !important; }
    .add-item {
      width: 100%;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
    }

    #workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 48px 20px 20px;
      background: #020617;
    }
    #canvasContainer {
      position: relative;
      flex: none;
      overflow: hidden;
      border: 1px solid #475569;
      background: #fff;
      box-shadow: 0 15px 40px rgba(0,0,0,.45);
      line-height: 0;
    }
    #canvasStage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }
    #previewCanvas { display: block; }

    .guide {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      border: 1px dashed rgba(15,23,42,.85);
    }
    #trimGuide { outline: 1px solid rgba(255,255,255,.85); }
    #safeGuide { border-color: rgba(225,29,72,.95); }
    .hidden { display: none !important; }

    #zoomInfo {
      position: absolute;
      z-index: 12;
      top: 10px;
      left: 10px;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      background: rgba(30,41,59,.95);
      color: #cbd5e1;
      font-size: 10px;
    }
    #previewToolbar {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px;
      background: rgba(30,41,59,.96);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      font-size: 10px;
    }
    #previewToolbar button {
      border: 0;
      border-radius: 5px;
      padding: 5px 7px;
      background: #475569;
      color: #e2e8f0;
      font-size: 10px;
    }
    #previewToolbarDrag { cursor: grab; touch-action: none; }

    @media (max-width: 767px) {
      #mainLayout { display: block; overflow: auto; }
      #settingsPanel { width: 100%; max-height: none; overflow: visible; border: 0; }
      #settingsContent { overflow: visible; }
      #workspace { width: 100%; height: 75vh; min-height: 480px; }
      #previewToolbar {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">✦</div>
      <div>
        <h1>同人おしながきジェネレーター</h1>
        <p id="paperSpecLabel">A3縦・赤色・無地</p>
      </div>
    </div>
    <div class="actions">
      <button id="printPreviewBtn" class="button button-print" type="button">プレビュー・PDF</button>
      <button id="exportPng" class="button button-png" type="button">PNG保存</button>
    </div>
  </header>

  <div id="mainLayout">
    <aside id="settingsPanel">
      <div class="panel-heading">
        <span>デザイン・情報設定</span>
        <small>リアルタイム反映</small>
      </div>

      <div id="settingsContent">
        <section class="section">
          <h2>レイアウト・用紙設定</h2>
          <div class="two-col">
            <label class="field">用紙向き
              <select id="orientationSelect" name="orientation" class="control">
                <option value="PORTRAIT" selected>縦向き</option>
                <option value="LANDSCAPE">横向き</option>
              </select>
            </label>
            <label class="field">レイアウト
              <select id="paperSizeSelect" name="paperSize" class="control">
                <option value="A3" selected>A3 (200dpi)</option>
                <option value="A4">A4 (350dpi)</option>
                <option value="WEB_PORTRAIT">X用縦書き (960 × 1280px)</option>
                <option value="WEB_LANDSCAPE">X用横書き (1200 × 675px)</option>
                <option value="PICSQUARE">ピクスク用 (500 × 1,000px)</option>
                <option value="PICREA">ピクリエ用 (800 × 1,600px)</option>
              </select>
            </label>
          </div>
          <div id="layoutHelp" style="color:#64748b;font-size:9px"></div>
        </section>

        <section class="section">
          <h2>背景デザイン・規定カラー</h2>
          <label class="field">背景の種類
            <select id="bgTypeSelect" name="backgroundType" class="control">
              <option value="pattern" selected>パターン・無地</option>
              <option value="custom">背景画像</option>
              <option value="color">単色カラー</option>
            </select>
          </label>
          <div class="field">
            規定カラー
            <div id="presetColorPalette" class="palette"></div>
            <small style="display:block;margin-top:5px;color:#64748b">
              初期状態は赤の規定カラーと無地です。
            </small>
          </div>
          <div id="patternControls">
            <label class="field">パターン
              <select id="patternStyleSelect" name="patternStyle" class="control">
                <option value="solid" selected>無地</option>
                <option value="dots">ドット</option>
                <option value="stripes">ストライプ</option>
                <option value="diagonal">斜めストライプ</option>
                <option value="border">ボーダー</option>
                <option value="check">チェック</option>
              </select>
            </label>
          </div>
          <div id="customBgControls" class="hidden">
            <label class="field">背景画像
              <input id="customBgInput" name="customBackground" type="file" accept="image/*" class="control">
            </label>
          </div>
          <div id="singleColorControls" class="hidden">
            <label class="field">背景色
              <input id="bgColorPicker" name="backgroundColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>イベント・サークル情報</h2>
          <label class="field">イベント日時
            <input id="eventDate" name="eventDate" type="text" value="2026年12月30日(水)" class="control">
          </label>
          <label class="field">イベント名
            <input id="eventName" name="eventName" type="text" value="コミックマーケット109" class="control">
          </label>
          <div class="two-col">
            <label class="field">サークル名
              <input id="circleName" name="circleName" type="text" value="暁の稜線" class="control">
            </label>
            <label class="field">スペース番号
              <input id="spaceNo" name="spaceNo" type="text" value="東7ホール あ-01a" class="control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>ヘッダー配色</h2>
          <div class="two-col">
            <label class="field">背景色
              <input id="headerBgColor" name="headerBackgroundColor" type="color" value="#333333" class="color-control">
            </label>
            <label class="field">アクセント色
              <input id="headerAccentColor" name="headerAccentColor" type="color" value="#FF4B00" class="color-control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>ヘッダー文字設定</h2>
          <div class="two-col">
            <label class="field">イベント名サイズ
              <input id="eventInfoFontSize" name="eventInfoFontSize" type="number" min="8" max="300" value="60" class="control">
            </label>
            <label class="field">イベント文字色
              <input id="eventInfoTextColor" name="eventInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            イベント情報の背景色
            <input id="eventInfoBgEnabled" name="eventInfoBgEnabled" type="checkbox">
            <input id="eventInfoBgColor" name="eventInfoBgColor" type="color" value="#333333" class="color-control">
          </label>

          <hr style="border-color:#334155;margin:10px 0">

          <div class="two-col">
            <label class="field">スペース番号サイズ
              <input id="spaceInfoFontSize" name="spaceInfoFontSize" type="number" min="8" max="300" value="120" class="control">
            </label>
            <label class="field">スペース文字色
              <input id="spaceInfoTextColor" name="spaceInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            スペース番号の背景色
            <input id="spaceInfoBgEnabled" name="spaceInfoBgEnabled" type="checkbox">
            <input id="spaceInfoBgColor" name="spaceInfoBgColor" type="color" value="#FF4B00" class="color-control">
          </label>

          <hr style="border-color:#334155;margin:10px 0">

          <div class="two-col">
            <label class="field">サークル名サイズ
              <input id="circleInfoFontSize" name="circleInfoFontSize" type="number" min="8" max="400" value="120" class="control">
            </label>
            <label class="field">サークル文字色
              <input id="circleInfoTextColor" name="circleInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            サークル名の背景色
            <input id="circleInfoBgEnabled" name="circleInfoBgEnabled" type="checkbox">
            <input id="circleInfoBgColor" name="circleInfoBgColor" type="color" value="#333333" class="color-control">
          </label>
        </section>

        <section class="section">
          <h2>頒布物画像を一括アップロード</h2>
          <label class="upload-box">
            ☁
            <span>複数画像を選択</span>
            <small>未設定の頒布物から順番に割り当て</small>
            <input id="batchImageInput" name="batchImages" type="file" accept="image/*" multiple hidden>
          </label>
        </section>

        <section class="section">
          <h2>頒布物一覧</h2>
          <div id="itemsContainer"></div>
          <button id="addItemBtn" class="add-item" type="button">＋ 頒布物を追加</button>
        </section>
      </div>
    </aside>

    <main id="workspace">
      <div id="zoomInfo">
        <span id="zoomDisplay">表示 --%</span>
        <span> | </span>
        <span id="dimensionDisplay"></span>
      </div>
      <div id="previewToolbar">
        <button id="previewToolbarDrag" type="button" aria-label="操作バーを移動">↕</button>
        <button id="fitCanvasBtn" type="button">全体表示</button>
        <label>倍率
          <input id="zoomSlider" name="previewZoom" type="range" min="1" max="200" value="100" style="width:70px">
        </label>
      </div>
      <div id="canvasContainer">
        <div id="canvasStage">
          <canvas id="previewCanvas"></canvas>
          <div id="trimGuide" class="guide hidden"></div>
          <div id="safeGuide" class="guide hidden"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    "use strict";

    const PALETTES = [
      { name:"赤", hex:"#FF4B00", background:"#FFFFFF", header:"#333333", accent:"#FF4B00", space:"#FF4B00" },
      { name:"オレンジ", hex:"#FFA500", background:"#FFFFCC", header:"#333333", accent:"#FFA500", space:"#FFA500" },
      { name:"黄", hex:"#FFF100", background:"#FFFFCC", header:"#333333", accent:"#FFF100", space:"#FFF100" },
      { name:"緑", hex:"#00AF55", background:"#CCFFCC", header:"#333333", accent:"#00AF55", space:"#00AF55" },
      { name:"青", hex:"#005AFF", background:"#CCEEFF", header:"#333333", accent:"#005AFF", space:"#005AFF" },
      { name:"紫", hex:"#AA00FF", background:"#F3E5F5", header:"#333333", accent:"#AA00FF", space:"#AA00FF" },
      { name:"ピンク", hex:"#F20070", background:"#FFC0CB", header:"#333333", accent:"#F20070", space:"#F20070" },
      { name:"茶色", hex:"#995A00", background:"#F5DEB3", header:"#333333", accent:"#995A00", space:"#995A00" },
      { name:"空色", hex:"#00DCFF", background:"#CCEEFF", header:"#333333", accent:"#00DCFF", space:"#00DCFF" }
    ];

    const CATEGORY_STYLES = {
      "新刊": { background:"#FF4B00", text:"#ffffff" },
      "既刊": { background:"#005AFF", text:"#ffffff" },
      "無料配布": { background:"#00AF55", text:"#ffffff" },
      "Web展示": { background:"#00DCFF", text:"#ffffff" }
    };

    const PRINT_SPECS = {
      A3: { widthMm:303, heightMm:426, widthPx:2386, heightPx:3354, trimWidthMm:297, trimHeightMm:420 },
      A4: { widthMm:216, heightMm:303, widthPx:2976, heightPx:4175, trimWidthMm:210, trimHeightMm:297 }
    };

    const SOCIAL_PRESETS = {
      WEB_PORTRAIT: { width:960, height:1280, orientation:"PORTRAIT", label:"X用縦書き" },
      WEB_LANDSCAPE: { width:1200, height:675, orientation:"LANDSCAPE", label:"X用横書き" },
      PICSQUARE: { width:500, height:1000, orientation:"PORTRAIT", label:"ピクスク用" },
      PICREA: { width:800, height:1600, orientation:"PORTRAIT", label:"ピクリエ用" }
    };

    const SOCIAL_LAYOUTS = {
      WEB_PORTRAIT: { header:250, marginX:28, marginY:22, gapX:16, gapY:16, padding:12, cardScale:.55, categoryBand:46, ageBand:28 },
      WEB_LANDSCAPE: { header:160, marginX:28, marginY:18, gapX:16, gapY:16, padding:11, cardScale:.48, categoryBand:38, ageBand:24 },
      PICSQUARE: { header:143, marginX:16, marginY:16, gapX:12, gapY:12, padding:8, cardScale:.35, categoryBand:34, ageBand:21 },
      PICREA: { header:270, marginX:24, marginY:22, gapX:16, gapY:16, padding:12, cardScale:.50, categoryBand:44, ageBand:28 }
    };

    const HEADER_FONT_SIZES = {
      A3: { event:60, space:120, circle:120 },
      A4: { event:60, space:120, circle:120 },
      WEB_PORTRAIT: { event:30, space:50, circle:50 },
      WEB_LANDSCAPE: { event:30, space:50, circle:50 },
      PICSQUARE: { event:20, space:30, circle:30 },
      PICREA: { event:30, space:50, circle:50 }
    };

    const BLEED_MM = 3;
    const canvas = document.getElementById("previewCanvas");

    let selectedPalette = PALETTES[0];
    let paper = "A3";
    let orientation = "PORTRAIT";
    let outputWidth = 0;
    let outputHeight = 0;
    let trimWidth = 0;
    let trimHeight = 0;
    let bleedLeft = 0;
    let bleedTop = 0;
    let safeX = 0;
    let safeY = 0;
    let customBackground = null;
    let previewMode = "fit";
    let renderToken = 0;
    let nextItemNumber = 3;

    function makeDefaultItem(number) {
      return {
        category:"新刊",
        ageRating:"全年齢",
        title:`頒布物${number}`,
        price:"500円",
        desc:"サンプルテキスト",
        descriptionFontSize:38,
        image:null,
        imageWidth:0,
        imageHeight:0,
        noImage:false
      };
    }

    const items = [makeDefaultItem(1), makeDefaultItem(2)];

    function getEl(id) {
      const element = document.getElementById(id);
      if (!element) throw new Error(`必要なHTML要素がありません: #${id}`);
      return element;
    }

    function initialize() {
      try {
        buildPalette();
        renderItems();
        bindEvents();
        updateLayout();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(renderCanvas).catch(() => {});
        }
      } catch (error) {
        console.error("初期化エラー:", error);
        const label = document.getElementById("paperSpecLabel");
        if (label) label.textContent = `初期化エラー: ${error.message}`;
      }
    }

    function buildPalette() {
      const root = getEl("presetColorPalette");
      root.innerHTML = "";

      PALETTES.forEach((preset) => {
        const button = document.createElement("button");
        button.type = "button";
        button.title = `${preset.name}（CUDO推奨配色セット）`;
        button.innerHTML = `<span class="swatch" style="background:${preset.hex}"></span><span>${preset.name}</span>`;
        button.classList.toggle("selected", preset.name === selectedPalette.name);

        button.addEventListener("click", () => {
          selectedPalette = preset;
          root.querySelectorAll("button").forEach((el) => el.classList.remove("selected"));
          button.classList.add("selected");

          if (getEl("bgTypeSelect").value === "color") {
            getEl("bgColorPicker").value = preset.background;
          }
          getEl("headerBgColor").value = preset.header;
          getEl("headerAccentColor").value = preset.accent;
          getEl("spaceInfoBgColor").value = preset.space;
          renderCanvas();
        });

        root.appendChild(button);
      });
    }

    function updateLayout() {
      paper = getEl("paperSizeSelect").value;
      const orientationSelect = getEl("orientationSelect");
      const socialPreset = SOCIAL_PRESETS[paper];

      bleedLeft = 0;
      bleedTop = 0;
      safeX = 0;
      safeY = 0;

      if (socialPreset) {
        orientation = socialPreset.orientation;
        orientationSelect.value = orientation;
        orientationSelect.disabled = true;
        outputWidth = trimWidth = socialPreset.width;
        outputHeight = trimHeight = socialPreset.height;
      } else {
        orientationSelect.disabled = false;
        orientation = orientationSelect.value;

        const spec = PRINT_SPECS[paper];
        const landscape = orientation === "LANDSCAPE";
        outputWidth = landscape ? spec.heightPx : spec.widthPx;
        outputHeight = landscape ? spec.widthPx : spec.heightPx;

        const outWmm = landscape ? spec.heightMm : spec.widthMm;
        const outHmm = landscape ? spec.widthMm : spec.heightMm;
        const trimWmm = landscape ? spec.trimHeightMm : spec.trimWidthMm;
        const trimHmm = landscape ? spec.trimWidthMm : spec.trimHeightMm;

        trimWidth = Math.round(trimWmm * outputWidth / outWmm);
        trimHeight = Math.round(trimHmm * outputHeight / outHmm);
        bleedLeft = Math.floor((outputWidth - trimWidth) / 2);
        bleedTop = Math.floor((outputHeight - trimHeight) / 2);
        safeX = Math.ceil(BLEED_MM * trimWidth / trimWmm);
        safeY = Math.ceil(BLEED_MM * trimHeight / trimHmm);
      }

      canvas.width = outputWidth;
      canvas.height = outputHeight;
      getEl("canvasStage").style.width = `${outputWidth}px`;
      getEl("canvasStage").style.height = `${outputHeight}px`;

      const sizes = HEADER_FONT_SIZES[paper];
      getEl("eventInfoFontSize").value = sizes.event;
      getEl("spaceInfoFontSize").value = sizes.space;
      getEl("circleInfoFontSize").value = sizes.circle;

      updateGuides();

      const label = socialPreset
        ? `${socialPreset.label} (${outputWidth} × ${outputHeight}px)`
        : `${paper}${orientation === "LANDSCAPE" ? "横" : "縦"} 塗り足し込み ${outputWidth} × ${outputHeight}px`;

      getEl("paperSpecLabel").textContent = label;
      getEl("dimensionDisplay").textContent = label;
      getEl("layoutHelp").textContent =
        "ヘッダー文字は指定サイズを上限に、領域に合わせて自動調整します。";

      previewMode = "fit";
      fitPreview();
      renderCanvas();
    }

    function updateGuides() {
      const trimGuide = getEl("trimGuide");
      const safeGuide = getEl("safeGuide");
      const isPrint = Boolean(PRINT_SPECS[paper]);

      trimGuide.classList.toggle("hidden", !isPrint);
      safeGuide.classList.toggle("hidden", !isPrint);
      if (!isPrint) return;

      trimGuide.style.left = `${bleedLeft}px`;
      trimGuide.style.top = `${bleedTop}px`;
      trimGuide.style.width = `${trimWidth}px`;
      trimGuide.style.height = `${trimHeight}px`;

      safeGuide.style.left = `${bleedLeft + safeX}px`;
      safeGuide.style.top = `${bleedTop + safeY}px`;
      safeGuide.style.width = `${Math.max(1, trimWidth - safeX * 2)}px`;
      safeGuide.style.height = `${Math.max(1, trimHeight - safeY * 2)}px`;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      })[char]);
    }

    function renderItems() {
      const root = getEl("itemsContainer");
      root.innerHTML = "";

      items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-card-head">
            <span>頒布物 #${index + 1}</span>
            <div>
              <button type="button" data-move="${index}" data-dir="-1" ${index === 0 ? "disabled" : ""}>↑</button>
              <button type="button" data-move="${index}" data-dir="1" ${index === items.length - 1 ? "disabled" : ""}>↓</button>
              ${items.length > 1 ? `<button type="button" class="delete-item" data-remove="${index}">削除</button>` : ""}
            </div>
          </div>
          <div class="two-col">
            <label class="field">カテゴリ
              <select id="item-${index}-category" name="item-${index}-category" class="control" data-index="${index}" data-key="category">
                ${["新刊","既刊","無料配布","Web展示"].map((value) =>
                  `<option value="${value}" ${item.category === value ? "selected" : ""}>${value}</option>`
                ).join("")}
              </select>
            </label>
            <label class="field">年齢区分
              <select id="item-${index}-ageRating" name="item-${index}-ageRating" class="control" data-index="${index}" data-key="ageRating">
                <option value="全年齢" ${item.ageRating === "全年齢" ? "selected" : ""}>全年齢</option>
                <option value="R18" ${item.ageRating === "R18" ? "selected" : ""}>R18</option>
              </select>
            </label>
          </div>
          <label class="field">タイトル
            <input id="item-${index}-title" name="item-${index}-title" class="control" type="text" data-index="${index}" data-key="title" value="${escapeHTML(item.title)}">
          </label>
          <label class="field">価格（無料配布・Web展示は空欄）
            <input id="item-${index}-price" name="item-${index}-price" class="control" type="text" data-index="${index}" data-key="price"
              value="${escapeHTML(item.price)}" ${["無料配布","Web展示"].includes(item.category) ? "disabled" : ""}>
          </label>
          <label class="field">説明
            <textarea id="item-${index}-desc" name="item-${index}-desc" class="control" data-index="${index}" data-key="desc" rows="3">${escapeHTML(item.desc)}</textarea>
          </label>
          <label class="field">説明文フォントサイズ
            <input id="item-${index}-descriptionFontSize" name="item-${index}-descriptionFontSize" class="control" type="number" min="8" max="100" data-index="${index}" data-key="descriptionFontSize" value="${item.descriptionFontSize}">
          </label>
          <label class="check-row" style="justify-content:flex-start">
            <input id="item-${index}-noImage" name="item-${index}-noImage" type="checkbox" data-noimage="${index}" ${item.noImage ? "checked" : ""}>
            画像なし（テキスト欄を広く表示）
          </label>
          <label class="field">個別画像
            <input id="item-${index}-image" name="item-${index}-image" class="control" type="file" accept="image/*" data-image="${index}" ${item.noImage ? "disabled" : ""}>
          </label>
        `;
        root.appendChild(card);
      });

      root.querySelectorAll("[data-index]").forEach((input) => {
        const update = () => {
          const index = Number(input.dataset.index);
          const key = input.dataset.key;
          if (!items[index]) return;

          if (key === "descriptionFontSize") {
            const size = Number.parseInt(input.value, 10);
            items[index][key] = Number.isFinite(size) ? Math.min(100, Math.max(8, size)) : 38;
          } else {
            items[index][key] = input.value;
          }

          if (key === "category") {
            const price = root.querySelector(`[data-index="${index}"][data-key="price"]`);
            const noPrice = ["無料配布","Web展示"].includes(input.value);
            if (price) {
              price.disabled = noPrice;
              if (noPrice) {
                price.value = "";
                items[index].price = "";
              }
            }
          }
          renderCanvas();
        };
        input.addEventListener("input", update);
        input.addEventListener("change", update);
      });

      root.querySelectorAll("[data-image]").forEach((input) => {
        input.addEventListener("change", () => {
          loadItemImage(Number(input.dataset.image), input.files && input.files[0]);
        });
      });

      root.querySelectorAll("[data-noimage]").forEach((input) => {
        input.addEventListener("change", () => {
          const index = Number(input.dataset.noimage);
          if (!items[index]) return;
          items[index].noImage = input.checked;
          const fileInput = root.querySelector(`[data-image="${index}"]`);
          if (fileInput) {
            fileInput.disabled = input.checked;
            if (input.checked) fileInput.value = "";
          }
          renderCanvas();
        });
      });

      root.querySelectorAll("[data-move]").forEach((button) => {
        button.addEventListener("click", () => {
          const from = Number(button.dataset.move);
          const to = from + Number(button.dataset.dir);
          if (to < 0 || to >= items.length) return;
          [items[from], items[to]] = [items[to], items[from]];
          renderItems();
          renderCanvas();
        });
      });

      root.querySelectorAll("[data-remove]").forEach((button) => {
        button.addEventListener("click", () => {
          items.splice(Number(button.dataset.remove), 1);
          renderItems();
          renderCanvas();
        });
      });
    }

    function addItem() {
      items.push(makeDefaultItem(nextItemNumber++));
      renderItems();
      renderCanvas();
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像の読み込みに失敗しました。"));
        image.src = src;
      });
    }

    async function readImageFile(file) {
      if (!file || !file.type || !file.type.startsWith("image/")) {
        throw new Error("画像ファイルを選択してください。");
      }
      const src = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`画像を読み込めませんでした: ${file.name}`));
        reader.readAsDataURL(file);
      });
      const image = await loadImage(src);
      return { src, image, width:image.naturalWidth, height:image.naturalHeight };
    }

    async function loadItemImage(index, file) {
      if (!file || !items[index]) return;
      try {
        const loaded = await readImageFile(file);
        Object.assign(items[index], {
          image:loaded.image,
          imageSrc:loaded.src,
          imageWidth:loaded.width,
          imageHeight:loaded.height,
          noImage:false
        });
        renderItems();
        renderCanvas();
      } catch (error) {
        alert(error.message);
      }
    }

    async function uploadBatch(files) {
      if (!files.length) return;
      try {
        const loaded = await Promise.all(Array.from(files).map(readImageFile));
        loaded.forEach((entry) => {
          let target = items.find((item) => !item.image);
          if (!target) {
            target = makeDefaultItem(nextItemNumber++);
            items.push(target);
          }
          Object.assign(target, {
            image:entry.image,
            imageSrc:entry.src,
            imageWidth:entry.width,
            imageHeight:entry.height,
            noImage:false
          });
        });
        renderItems();
        renderCanvas();
      } catch (error) {
        alert(error.message);
      }
    }

    function makePattern(style, foreground, background) {
      const tile = document.createElement("canvas");
      tile.width = tile.height = 240;
      const pctx = tile.getContext("2d");
      pctx.fillStyle = background;
      pctx.fillRect(0, 0, 240, 240);

      if (style === "solid") return tile;

      if (style === "dots") {
        pctx.fillStyle = foreground;
        pctx.beginPath();
        pctx.arc(60, 60, 16, 0, Math.PI * 2);
        pctx.arc(180, 180, 16, 0, Math.PI * 2);
        pctx.fill();
      } else if (style === "stripes") {
        pctx.fillStyle = foreground;
        pctx.fillRect(0, 0, 120, 240);
      } else if (style === "diagonal") {
        pctx.save();
        pctx.translate(120, 120);
        pctx.rotate(Math.PI / 4);
        pctx.fillStyle = foreground;
        for (let x = -360; x <= 360; x += 110) pctx.fillRect(x, -360, 36, 720);
        pctx.restore();
      } else if (style === "border") {
        pctx.fillStyle = foreground;
        pctx.fillRect(0, 0, 240, 24);
        pctx.fillRect(0, 216, 240, 24);
        pctx.fillRect(0, 0, 24, 240);
        pctx.fillRect(216, 0, 24, 240);
      } else if (style === "check") {
        pctx.fillStyle = foreground;
        pctx.fillRect(0, 0, 120, 120);
        pctx.fillRect(120, 120, 120, 120);
      }
      return tile;
    }

    function drawBackground(context) {
      const type = getEl("bgTypeSelect").value;

      if (type === "color") {
        context.fillStyle = getEl("bgColorPicker").value;
        context.fillRect(0, 0, outputWidth, outputHeight);
        return;
      }
      if (type === "custom" && customBackground) {
        context.drawImage(customBackground, 0, 0, outputWidth, outputHeight);
        return;
      }
      if (type === "pattern") {
        const style = getEl("patternStyleSelect").value;
        const base = selectedPalette.background;
        context.fillStyle = base;
        context.fillRect(0, 0, outputWidth, outputHeight);
        if (style !== "solid") {
          const pattern = context.createPattern(makePattern(style, selectedPalette.hex, base), "repeat");
          if (pattern) {
            context.fillStyle = pattern;
            context.fillRect(0, 0, outputWidth, outputHeight);
          }
        }
        return;
      }
      context.fillStyle = "#fff";
      context.fillRect(0, 0, outputWidth, outputHeight);
    }

    function getHeaderStyle(prefix, defaultSize, defaultColor) {
      const sizeEl = document.getElementById(`${prefix}FontSize`);
      const colorEl = document.getElementById(`${prefix}TextColor`);
      const enabledEl = document.getElementById(`${prefix}BgEnabled`);
      const bgColorEl = document.getElementById(`${prefix}BgColor`);
      const size = Number.parseInt(sizeEl ? sizeEl.value : "", 10);
      return {
        size:Number.isFinite(size) ? size : defaultSize,
        color:(colorEl && colorEl.value) || defaultColor,
        background:enabledEl && enabledEl.checked && bgColorEl ? bgColorEl.value : ""
      };
    }

    function wrapLines(context, text, maxWidth) {
      const lines = [];
      String(text || "").split("\n").forEach((paragraph) => {
        let line = "";
        for (const char of Array.from(paragraph)) {
          const candidate = line + char;
          if (line && context.measureText(candidate).width > maxWidth) {
            lines.push(line);
            line = char;
          } else {
            line = candidate;
          }
        }
        lines.push(line);
      });
      return lines.length ? lines : [""];
    }

    function fitText(context, text, box, options = {}) {
      const family = options.family || "sans-serif";
      const weight = options.weight || "400";
      const maxFont = Math.max(1, Number(options.maxFont) || 20);
      const minFont = Math.max(1, Number(options.minFont) || 1);
      const lineRatio = options.lineHeight || 1.12;
      const width = Math.max(1, box.width);
      const height = Math.max(1, box.height);

      let low = minFont;
      let high = maxFont;
      let chosen = minFont;
      let lines = null;

      for (let i = 0; i < 18; i++) {
        const size = (low + high) / 2;
        context.font = `${weight} ${size}px ${family}`;
        const candidate = wrapLines(context, text, width);
        if (candidate.length * size * lineRatio <= height) {
          chosen = size;
          lines = candidate;
          low = size;
        } else {
          high = size;
        }
      }

      if (!lines) {
        context.font = `${weight} ${minFont}px ${family}`;
        lines = wrapLines(context, text, width);
      }

      const lineHeight = chosen * lineRatio;
      let y = box.y + Math.max(0, (height - lines.length * lineHeight) / 2);

      context.save();
      context.beginPath();
      context.rect(box.x, box.y, width, height);
      context.clip();

      if (options.background) {
        context.fillStyle = options.background;
        context.fillRect(box.x, box.y, width, height);
      }

      context.font = `${weight} ${chosen}px ${family}`;
      context.fillStyle = options.color || "#111";
      context.textAlign = options.align || "left";
      context.textBaseline = "top";

      const x = options.align === "center" ? box.x + width / 2 : box.x;
      lines.forEach((line) => {
        context.fillText(line, x, y, width);
        y += lineHeight;
      });
      context.restore();
    }

    /*
     * A3/A4は縦横どちらでも以下の2段構成:
     * 1段目: イベント名と日時を1行
     * 2段目: スペース番号とサークル名を横幅半分ずつで左揃え
     *
     * X横向きも同じ構成。その他のSNS縦向きは3段表示。
     */
    function drawHeader(context, social, headerHeight, eventStyle, spaceStyle, circleStyle) {
      const margin = social ? social.marginX : safeX + 8;
      const x = bleedLeft + margin;
      const width = Math.max(1, trimWidth - margin * 2);
      const eventName = getEl("eventName").value.trim();
      const eventDate = getEl("eventDate").value.trim();
      const eventText = [eventName, eventDate].filter(Boolean).join(" | ");
      const spaceText = getEl("spaceNo").value.trim();
      const circleText = getEl("circleName").value.trim();

      const isPrintLayout = Boolean(PRINT_SPECS[paper]);
      const useTwoRowHeader = isPrintLayout || orientation === "LANDSCAPE";

      if (useTwoRowHeader) {
        const compact = paper === "PICSQUARE";
        const topInset = social
          ? (compact ? 4 : Math.max(6, headerHeight * 0.045))
          : Math.max(safeY, headerHeight * 0.12);
        const bottomInset = social
          ? (compact ? 4 : Math.max(6, headerHeight * 0.045))
          : Math.max(safeY, headerHeight * 0.08);
        const usableHeight = Math.max(2, headerHeight - topInset - bottomInset);
        const rowGap = Math.max(social ? 2 : 4, usableHeight * 0.08);
        const firstRowHeight = (usableHeight - rowGap) * 0.48;
        const secondRowHeight = usableHeight - rowGap - firstRowHeight;
        const firstRowY = bleedTop + topInset;
        const secondRowY = firstRowY + firstRowHeight + rowGap;

        fitSingleLine(context, eventText, {
          x,
          y:firstRowY,
          width,
          height:firstRowHeight
        }, {
          maxFont:eventStyle.size,
          minFont:social ? 5 : 8,
          weight:"700",
          family:'"Noto Sans JP", sans-serif',
          color:eventStyle.color,
          background:eventStyle.background
        });

        const columnGap = Math.max(social ? 8 : 14, width * 0.035);
        const columnWidth = Math.max(1, (width - columnGap) / 2);

        fitSingleLine(context, spaceText, {
          x,
          y:secondRowY,
          width:columnWidth,
          height:secondRowHeight
        }, {
          maxFont:spaceStyle.size,
          minFont:social ? 5 : 8,
          weight:"700",
          family:'"M PLUS Rounded 1c", sans-serif',
          color:spaceStyle.color,
          background:spaceStyle.background
        });

        fitSingleLine(context, circleText, {
          x:x + columnWidth + columnGap,
          y:secondRowY,
          width:columnWidth,
          height:secondRowHeight
        }, {
          maxFont:circleStyle.size,
          minFont:social ? 5 : 8,
          weight:"700",
          family:'"Noto Sans JP", sans-serif',
          color:circleStyle.color,
          background:circleStyle.background
        });
        return;
      }

      // SNS縦向き: イベント → スペース → サークルの3段配置。
      const top = Math.max(4, headerHeight * 0.035);
      const available = Math.max(1, headerHeight - top * 2);
      const gap = Math.max(2, available * 0.025);
      const rowHeight = Math.max(1, (available - gap * 2) / 3);
      let y = bleedTop + top;

      fitText(context, eventText,
        { x, y, width, height:rowHeight },
        {
          maxFont:eventStyle.size,
          minFont:6,
          weight:"700",
          color:eventStyle.color,
          background:eventStyle.background
        });

      y += rowHeight + gap;
      fitText(context, spaceText,
        { x, y, width, height:rowHeight },
        {
          maxFont:spaceStyle.size,
          minFont:6,
          weight:"700",
          family:'"M PLUS Rounded 1c", sans-serif',
          color:spaceStyle.color,
          background:spaceStyle.background,
          align:"left",
          lineHeight:1
        });

      y += rowHeight + gap;
      fitText(context, circleText,
        { x, y, width, height:rowHeight },
        {
          maxFont:circleStyle.size,
          minFont:6,
          weight:"700",
          color:circleStyle.color,
          align:"left",
          lineHeight:1
        });
    }

    // 自動縮小して、文字列を必ず1行で枠内に表示する。
    function fitSingleLine(context, text, box, options = {}) {
      if (!text) return;

      const family = options.family || "sans-serif";
      const weight = options.weight || "400";
      const maxFont = Math.max(1, Number(options.maxFont) || 20);
      const minFont = Math.max(1, Math.min(maxFont, Number(options.minFont) || 1));
      const width = Math.max(1, box.width);
      const height = Math.max(1, box.height);
      const verticalRatio = options.verticalRatio || 1.15;

      let low = minFont;
      let high = maxFont;
      let chosen = minFont;

      for (let i = 0; i < 20; i++) {
        const size = (low + high) / 2;
        context.font = `${weight} ${size}px ${family}`;
        const fits = context.measureText(text).width <= width &&
          size * verticalRatio <= height;

        if (fits) {
          chosen = size;
          low = size;
        } else {
          high = size;
        }
      }

      context.save();
      context.beginPath();
      context.rect(box.x, box.y, width, height);
      context.clip();

      if (options.background) {
        context.fillStyle = options.background;
        context.fillRect(box.x, box.y, width, height);
      }

      context.font = `${weight} ${chosen}px ${family}`;
      context.fillStyle = options.color || "#111111";
      context.textAlign = "left";
      context.textBaseline = "middle";
      context.fillText(text, box.x, box.y + height / 2, width);
      context.restore();
    }

    function roundRect(context, x, y, width, height, radius, fill, stroke, lineWidth = 1) {
      const r = Math.max(0, Math.min(radius, width / 2, height / 2));
      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + width - r, y);
      context.quadraticCurveTo(x + width, y, x + width, y + r);
      context.lineTo(x + width, y + height - r);
      context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      context.lineTo(x + r, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();

      if (fill) {
        context.fillStyle = fill;
        context.fill();
      }
      if (stroke) {
        context.strokeStyle = stroke;
        context.lineWidth = lineWidth;
        context.stroke();
      }
    }

    function drawCard(context, item, x, y, width, height, config, landscape) {
      const padding = config.padding;
      roundRect(context, x, y, width, height, config.radius, "#fff", "#cbd5e1", config.borderWidth);

      context.save();
      context.beginPath();
      context.rect(x, y, width, height);
      context.clip();

      const style = CATEGORY_STYLES[item.category] || CATEGORY_STYLES["新刊"];
      const categoryHeight = Math.min(config.categoryBand, height * .16, Math.max(18, width * .09));
      const ageHeight = Math.min(config.ageBand, height * .11, Math.max(15, width * .055));

      context.fillStyle = style.background;
      context.fillRect(x, y, width, categoryHeight);
      fitText(context, item.category,
        { x:x + padding, y:y + 1, width:width - padding * 2, height:categoryHeight - 2 },
        {
          maxFont:Math.min(categoryHeight * .78, width * .2),
          minFont:1,
          weight:"700",
          color:style.text,
          align:"center",
          lineHeight:1
        });

      const ageY = y + categoryHeight;
      const isR18 = item.ageRating === "R18";
      context.fillStyle = isR18 ? "#991b1b" : "#e5f2e5";
      context.fillRect(x, ageY, width, ageHeight);
      fitText(context, isR18 ? "R18" : "全年齢",
        { x:x + padding, y:ageY + 1, width:width - padding * 2, height:ageHeight - 2 },
        {
          maxFont:Math.min(ageHeight * .75, width * .16),
          minFont:1,
          weight:"700",
          color:isR18 ? "#fff" : "#174b26",
          align:"center",
          lineHeight:1
        });

      const bodyY = ageY + ageHeight + padding;
      const bodyHeight = Math.max(1, height - categoryHeight - ageHeight - padding * 2);
      let textX = x + padding;
      let textWidth = Math.max(1, width - padding * 2);
      let imageBox = null;

      if (item.image && !item.noImage) {
        const imageScale = Math.min(
          width * (landscape ? .38 : .36) / Math.max(1, item.imageWidth),
          bodyHeight / Math.max(1, item.imageHeight)
        );
        const imageWidth = item.imageWidth * imageScale;
        const imageHeight = item.imageHeight * imageScale;
        imageBox = {
          x:x + padding,
          y:bodyY + (bodyHeight - imageHeight) / 2,
          width:imageWidth,
          height:imageHeight
        };
        textX = imageBox.x + imageWidth + padding;
        textWidth = Math.max(1, x + width - padding - textX);
      }

      const parts = [];
      if (item.title) {
        parts.push({
          text:item.title, ratio:.42, max:78 * config.textScale,
          color:"#0f172a", weight:"700"
        });
      }
      if (!["無料配布","Web展示"].includes(item.category) && item.price) {
        parts.push({
          text:item.price, ratio:.28, max:100 * config.textScale,
          color:style.background, weight:"700"
        });
      }
      if (item.desc) {
        parts.push({
          text:item.desc,
          ratio:.30,
          max:Math.max(8, Math.min(100, Number(item.descriptionFontSize) || 38)) * config.textScale,
          color:"#475569",
          weight:"400"
        });
      }

      const ratioSum = parts.reduce((sum, part) => sum + part.ratio, 0);
      let cursorY = bodyY;

      parts.forEach((part) => {
        const partHeight = Math.max(1, bodyHeight * part.ratio / Math.max(.01, ratioSum));
        fitText(context, part.text,
          { x:textX, y:cursorY, width:textWidth, height:partHeight },
          {
            maxFont:part.max,
            minFont:Math.max(4, 7 * config.textScale),
            color:part.color,
            weight:part.weight
          });
        cursorY += partHeight;
      });

      if (imageBox && item.image) {
        context.drawImage(item.image, imageBox.x, imageBox.y, imageBox.width, imageBox.height);
      }

      context.restore();
      roundRect(context, x, y, width, height, config.radius, null, "#cbd5e1", config.borderWidth);
    }

    function renderCanvas() {
      try {
        if (!outputWidth || !outputHeight) return;

        const token = ++renderToken;
        const context = canvas.getContext("2d", { alpha:false });
        if (!context) throw new Error("Canvas 2D contextを取得できません。");

        context.setTransform(1, 0, 0, 1, 0, 0);
        context.clearRect(0, 0, outputWidth, outputHeight);
        drawBackground(context);

        const social = SOCIAL_LAYOUTS[paper] || null;
        const landscape = orientation === "LANDSCAPE";
        const headerHeight = social
          ? social.header
          : Math.round(trimHeight * (landscape ? .17 : .15));

        context.fillStyle = getEl("headerBgColor").value || "#333333";
        context.fillRect(0, 0, outputWidth, Math.min(outputHeight, bleedTop + headerHeight));

        const accentHeight = social
          ? Math.max(3, headerHeight * .025)
          : Math.max(8, 12 * trimWidth / 3307);
        context.fillStyle = getEl("headerAccentColor").value || selectedPalette.accent;
        context.fillRect(bleedLeft, bleedTop + headerHeight - accentHeight, trimWidth, accentHeight);

        const sizes = HEADER_FONT_SIZES[paper];
        drawHeader(
          context,
          social,
          headerHeight,
          getHeaderStyle("eventInfo", sizes.event, "#ffffff"),
          getHeaderStyle("spaceInfo", sizes.space, "#ffffff"),
          getHeaderStyle("circleInfo", sizes.circle, "#ffffff")
        );

        let columns = 2;
        if (paper === "WEB_LANDSCAPE") columns = items.length <= 1 ? 1 : 2;
        else if (social) columns = items.length <= 3 ? 1 : 2;
        else if (landscape) columns = items.length <= 1 ? 1 : (items.length > 4 ? 3 : 2);
        else if (items.length <= 3) columns = 1;

        const scale = trimWidth / 3307;
        const marginX = social ? social.marginX : safeX;
        const marginY = social ? social.marginY : safeY;
        const gapX = social ? social.gapX : Math.round(40 * scale);
        const gapY = social ? social.gapY : Math.round(40 * scale);
        const padding = social ? social.padding : Math.round(25 * scale);
        const startY = headerHeight + (social ? 10 : Math.max(24 * scale, safeY));
        const rows = Math.max(1, Math.ceil(items.length / columns));
        const cardWidth = Math.max(
          1,
          (trimWidth - marginX * 2 - gapX * (columns - 1)) / columns
        );
        const cardHeight = Math.max(
          1,
          (trimHeight - startY - marginY - gapY * (rows - 1)) / rows
        );

        const config = {
          social:Boolean(social),
          padding,
          radius:social ? 12 : Math.max(12, 24 * scale),
          categoryBand:social ? social.categoryBand : cardHeight * .14,
          ageBand:social ? social.ageBand : cardHeight * .09,
          borderWidth:social ? 2 : Math.max(2, 4 * scale),
          textScale:social ? social.cardScale : scale
        };

        items.forEach((item, index) => {
          if (token !== renderToken) return;
          const row = Math.floor(index / columns);
          const column = index % columns;
          const x = bleedLeft + marginX + column * (cardWidth + gapX);
          const y = bleedTop + startY + row * (cardHeight + gapY);
          drawCard(context, item, x, y, cardWidth, cardHeight, config, landscape);
        });
      } catch (error) {
        console.error("プレビュー描画エラー:", error);
      }
    }

    function applyScale(scale) {
      const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      const stage = getEl("canvasStage");
      const container = getEl("canvasContainer");
      stage.style.width = `${outputWidth}px`;
      stage.style.height = `${outputHeight}px`;
      stage.style.transform = `scale(${safeScale})`;
      container.style.width = `${outputWidth * safeScale}px`;
      container.style.height = `${outputHeight * safeScale}px`;
      getEl("zoomDisplay").textContent = `表示 ${Math.round(safeScale * 100)}%`;
      getEl("zoomSlider").value = String(Math.max(1, Math.min(200, Math.round(safeScale * 100))));
    }

    function fitPreview() {
      const workspace = getEl("workspace");
      const availableWidth = Math.max(1, workspace.clientWidth - 50);
      const availableHeight = Math.max(1, workspace.clientHeight - 75);
      applyScale(Math.min(availableWidth / outputWidth, availableHeight / outputHeight));
    }

    function setupResize() {
      const workspace = getEl("workspace");
      if ("ResizeObserver" in window) {
        new ResizeObserver(() => {
          if (previewMode === "fit") fitPreview();
        }).observe(workspace);
      }
      window.addEventListener("resize", () => {
        if (previewMode === "fit") fitPreview();
      });
    }

    function setupToolbarDrag() {
      const toolbar = getEl("previewToolbar");
      const handle = getEl("previewToolbarDrag");
      const workspace = getEl("workspace");
      let drag = null;

      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const toolbarRect = toolbar.getBoundingClientRect();
        const workspaceRect = workspace.getBoundingClientRect();

        toolbar.style.left = `${toolbarRect.left - workspaceRect.left}px`;
        toolbar.style.top = `${toolbarRect.top - workspaceRect.top}px`;
        toolbar.style.right = "auto";
        toolbar.style.bottom = "auto";

        drag = {
          id:event.pointerId,
          x:event.clientX,
          y:event.clientY,
          left:toolbarRect.left - workspaceRect.left,
          top:toolbarRect.top - workspaceRect.top
        };
        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        const rect = workspace.getBoundingClientRect();
        toolbar.style.left = `${Math.max(0, Math.min(
          rect.width - toolbar.offsetWidth,
          drag.left + event.clientX - drag.x
        ))}px`;
        toolbar.style.top = `${Math.max(0, Math.min(
          rect.height - toolbar.offsetHeight,
          drag.top + event.clientY - drag.y
        ))}px`;
      });

      const finish = (event) => {
        if (drag && drag.id === event.pointerId) drag = null;
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    }

    function openPrintPreview() {
      const isSocial = Boolean(SOCIAL_PRESETS[paper]);
      const spec = PRINT_SPECS[paper];
      const widthMm = isSocial
        ? outputWidth * 25.4 / 200
        : orientation === "LANDSCAPE" ? spec.heightMm : spec.widthMm;
      const heightMm = isSocial
        ? outputHeight * 25.4 / 200
        : orientation === "LANDSCAPE" ? spec.widthMm : spec.heightMm;

      const popup = window.open("", "_blank");
      if (!popup) {
        alert("ポップアップを許可してください。");
        return;
      }

      const doc = popup.document;
      doc.title = "印刷プレビュー";

      const meta = doc.createElement("meta");
      meta.setAttribute("charset", "UTF-8");
      doc.head.appendChild(meta);

      const style = doc.createElement("style");
      style.textContent = `
        @page { size:${widthMm}mm ${heightMm}mm; margin:0; }
        html,body { margin:0; padding:0; }
        img { display:block; width:${widthMm}mm; height:${heightMm}mm; }
        @media screen {
          body { min-height:100vh; display:grid; place-items:center; padding:24px; background:#1e293b; }
          img { width:min(90vw,${widthMm}mm); height:auto; }
        }
      `;
      doc.head.appendChild(style);

      const image = doc.createElement("img");
      image.alt = "印刷用プレビュー";
      image.src = canvas.toDataURL("image/png");
      doc.body.appendChild(image);
      image.addEventListener("load", () => {
        popup.focus();
        popup.print();
      }, { once:true });
    }

    function bindEvents() {
      getEl("paperSizeSelect").addEventListener("change", updateLayout);
      getEl("orientationSelect").addEventListener("change", updateLayout);

      ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
        const element = document.getElementById(id);
        if (element) element.addEventListener("input", renderCanvas);
      });

      [
        "headerBgColor", "headerAccentColor",
        "eventInfoFontSize", "eventInfoTextColor",
        "eventInfoBgEnabled", "eventInfoBgColor",
        "spaceInfoFontSize", "spaceInfoTextColor",
        "spaceInfoBgEnabled", "spaceInfoBgColor",
        "circleInfoFontSize", "circleInfoTextColor",
        "circleInfoBgEnabled", "circleInfoBgColor"
      ].forEach((id) => {
        const element = document.getElementById(id);
        if (!element) {
          console.warn(`設定欄 #${id} がないため、イベント登録を省略しました。`);
          return;
        }
        element.addEventListener("input", renderCanvas);
        element.addEventListener("change", renderCanvas);
      });

      getEl("bgTypeSelect").addEventListener("change", (event) => {
        const type = event.target.value;
        getEl("patternControls").classList.toggle("hidden", type !== "pattern");
        getEl("customBgControls").classList.toggle("hidden", type !== "custom");
        getEl("singleColorControls").classList.toggle("hidden", type !== "color");
        renderCanvas();
      });

      getEl("patternStyleSelect").addEventListener("change", renderCanvas);
      getEl("bgColorPicker").addEventListener("input", renderCanvas);

      getEl("customBgInput").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
          const loaded = await readImageFile(file);
          customBackground = loaded.image;
          renderCanvas();
        } catch (error) {
          alert(error.message);
        }
      });

      getEl("batchImageInput").addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        event.target.value = "";
        if (files.length) await uploadBatch(files);
      });

      getEl("addItemBtn").addEventListener("click", addItem);

      getEl("fitCanvasBtn").addEventListener("click", () => {
        previewMode = "fit";
        fitPreview();
      });

      getEl("zoomSlider").addEventListener("input", (event) => {
        previewMode = "manual";
        applyScale(Number(event.target.value) / 100);
      });

      getEl("printPreviewBtn").addEventListener("click", openPrintPreview);

      getEl("exportPng").addEventListener("click", () => {
        renderCanvas();
        const link = document.createElement("a");
        link.download = `oshinagaki_${paper}_${orientation}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });

      setupResize();
      setupToolbarDrag();
    }

    initialize();
  </script>
</body>
</html>
