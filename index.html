<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同人おしながきジェネレーター</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .form-control {
      width: 100%;
      margin-top: .25rem;
      border: 1px solid #334155;
      border-radius: .5rem;
      background: #1e293b;
      padding: .4rem .55rem;
      color: #e2e8f0;
      font-size: .75rem;
    }

    #canvasContainer {
      position: relative;
      flex: none;
      overflow: hidden;
      line-height: 0;
    }

    #canvasStage {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
    }

    #oshinagakiCanvas {
      display: block;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, .24) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .24) 1px, transparent 1px),
        linear-gradient(to right, rgba(15, 23, 42, .12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .12) 1px, transparent 1px);
      background-size:
        100px 100px,
        100px 100px,
        20px 20px,
        20px 20px;
    }

    #previewToolbar {
      top: 12px;
      right: 12px;
    }

    #previewToolbarDrag {
      touch-action: none;
      cursor: grab;
    }

    #previewToolbarDrag:active {
      cursor: grabbing;
    }

    @media (max-width: 767px) {
      #previewToolbar {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }
  </style>
</head>

<body class="h-full flex flex-col bg-slate-900 text-slate-100 font-sans overflow-hidden">

  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between gap-3 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="bg-gradient-to-r from-rose-500 to-purple-600 p-2 rounded-lg shadow shrink-0">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-sm sm:text-base font-bold leading-tight">同人おしながきジェネレーター</h1>
        <p id="paperSpecLabel" class="text-[10px] sm:text-[11px] text-slate-400 truncate"></p>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <button id="printPreviewBtn" type="button"
        class="bg-slate-600 hover:bg-slate-500 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="printer" class="w-4 h-4"></i>
        <span class="hidden sm:inline">印刷プレビュー</span>
        <span class="sm:hidden">印刷</span>
      </button>

      <button id="exportPng" type="button"
        class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 sm:px-4 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="image" class="w-4 h-4"></i>
        <span class="hidden sm:inline">PNG画像で保存</span>
        <span class="sm:hidden">PNG</span>
      </button>

      <button id="exportPdf" type="button"
        class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 sm:px-4 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        <span class="hidden sm:inline">PDFで保存</span>
        <span class="sm:hidden">PDF</span>
      </button>
    </div>
  </header>

  <div class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">

    <aside class="w-full md:w-[400px] lg:w-[440px] bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 overflow-hidden max-h-[48vh] md:max-h-none">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/80 shrink-0">
        <h2 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="sliders" class="w-4 h-4 text-rose-400"></i>
          デザイン・情報設定
        </h2>
        <span class="text-[10px] text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded-full">
          リアルタイム反映
        </span>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-4">

        <!-- 用紙・レイアウト -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">レイアウト・用紙設定</h3>

          <div class="grid grid-cols-2 gap-2">
            <label class="text-[11px] text-slate-400">
              用紙向き
              <select id="orientationSelect" class="form-control">
                <option value="LANDSCAPE">横向き</option>
                <option value="PORTRAIT">縦向き</option>
              </select>
            </label>

            <label class="text-[11px] text-slate-400">
              レイアウト
              <select id="paperSizeSelect" class="form-control">
                <option value="A2">A2 (200dpi)</option>
                <option value="A3" selected>A3 (200dpi)</option>
                <option value="A4">A4 (200dpi)</option>
                <option value="WEB_PORTRAIT">X用縦書き (960 × 1280px)</option>
                <option value="WEB_LANDSCAPE">X用横書き (1200 × 675px)</option>
                <option value="PICSQUARE">ピクスク用 (500 × 1,000px)</option>
                <option value="PICREA">ピクリエ用 (800 × 1,600px)</option>
              </select>
            </label>
          </div>

          <p id="layoutHelp" class="text-[10px] text-slate-500"></p>
        </section>

        <!-- 背景 -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">背景デザイン</h3>

          <label class="block text-[11px] text-slate-400">
            背景の種類
            <select id="bgTypeSelect" class="form-control">
              <option value="pattern">規定パターン</option>
              <option value="custom">背景画像をアップロード</option>
              <option value="color">単色カラー</option>
            </select>
          </label>

          <div id="patternControls" class="space-y-3">
            <label class="block text-[11px] text-slate-400">
              パターン
              <select id="patternStyleSelect" class="form-control">
                <option value="dots">ドット</option>
                <option value="stripes">ストライプ</option>
                <option value="diagonal">斜めストライプ</option>
                <option value="border">ボーダー</option>
                <option value="check">チェック</option>
              </select>
            </label>

            <div>
              <span class="block text-[11px] text-slate-400 mb-1.5">規定カラー</span>
              <div id="presetColorPalette" class="grid grid-cols-4 gap-1.5"></div>
            </div>
          </div>

          <div id="customBgControls" class="hidden">
            <label class="block text-[11px] text-slate-400">
              背景画像
              <input id="customBgInput" type="file" accept="image/*"
                class="mt-1 w-full text-xs text-slate-400">
            </label>
          </div>

          <div id="singleColorControls" class="hidden">
            <label class="flex items-center justify-between text-[11px] text-slate-400">
              背景色
              <input id="bgColorPicker" type="color" value="#f8fafc"
                class="w-12 h-8 bg-slate-800 border border-slate-700 rounded p-1">
            </label>
          </div>
        </section>

        <!-- イベント情報 -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">イベント・サークル情報</h3>

          <label class="block text-[11px] text-slate-400">
            イベント日時
            <input id="eventDate" type="text" value="2026年12月30日(水)" class="form-control">
          </label>

          <label class="block text-[11px] text-slate-400">
            イベント名
            <input id="eventName" type="text" value="コミックマーケット109" class="form-control">
          </label>

          <div class="grid grid-cols-2 gap-2">
            <label class="block text-[11px] text-slate-400">
              サークル名
              <input id="circleName" type="text" value="暁の稜線" class="form-control">
            </label>
            <label class="block text-[11px] text-slate-400">
              スペース番号
              <input id="spaceNo" type="text" value="東7ホール あ-01a" class="form-control">
            </label>
          </div>
        </section>

        <!-- ヘッダー色 -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">ヘッダー背景・アクセント</h3>

          <div class="grid grid-cols-2 gap-2">
            <label class="text-[10px] text-slate-400">
              ヘッダー背景色
              <input id="headerBgColor" type="color" value="#3b0a1e"
                class="mt-1 h-9 w-full rounded border border-slate-700 bg-slate-800 p-1">
            </label>
            <label class="text-[10px] text-slate-400">
              アクセント色
              <input id="headerAccentColor" type="color" value="#fb7185"
                class="mt-1 h-9 w-full rounded border border-slate-700 bg-slate-800 p-1">
            </label>
          </div>
        </section>

        <!-- 情報ボックスの文字設定 -->
        <section class="space-y-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">情報ボックスの文字・背景設定</h3>

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">日時・イベント名</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">文字サイズ
                <input id="eventInfoFontSize" type="number" min="12" max="200" value="48" class="form-control">
              </label>
              <label class="text-[10px] text-slate-400">文字色
                <input id="eventInfoTextColor" type="color" value="#ffe4e6" class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="eventInfoBgEnabled" type="checkbox" class="accent-rose-500">
                <input id="eventInfoBgColor" type="color" value="#334155" class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>

          <hr class="border-slate-700">

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">サークル名</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">文字サイズ
                <input id="circleInfoFontSize" type="number" min="12" max="300" value="120" class="form-control">
              </label>
              <label class="text-[10px] text-slate-400">文字色
                <input id="circleInfoTextColor" type="color" value="#fff1f2" class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="circleInfoBgEnabled" type="checkbox" class="accent-rose-500">
                <input id="circleInfoBgColor" type="color" value="#334155" class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>

          <hr class="border-slate-700">

          <div class="space-y-2">
            <p class="text-[11px] font-bold text-slate-300">スペース番号</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="text-[10px] text-slate-400">文字サイズ
                <input id="spaceInfoFontSize" type="number" min="12" max="200" value="75" class="form-control">
              </label>
              <label class="text-[10px] text-slate-400">文字色
                <input id="spaceInfoTextColor" type="color" value="#ffffff" class="mt-1 h-8 w-full rounded border border-slate-700 bg-slate-800 p-1">
              </label>
            </div>
            <label class="flex items-center justify-between text-[10px] text-slate-400">
              背景色を表示
              <span class="flex items-center gap-2">
                <input id="spaceInfoBgEnabled" type="checkbox" checked class="accent-rose-500">
                <input id="spaceInfoBgColor" type="color" value="#e11d48" class="h-8 w-10 rounded border border-slate-700 bg-slate-800 p-1">
              </span>
            </label>
          </div>
        </section>

        <!-- 画像と説明サイズ -->
        <section class="space-y-2.5 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
          <h3 class="text-xs font-bold text-rose-400">頒布物画像 一括アップロード</h3>
          <label class="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-rose-500/50 hover:border-rose-400 rounded-xl cursor-pointer bg-slate-800/40 p-2">
            <i data-lucide="upload-cloud" class="w-6 h-6 text-rose-400 mb-1"></i>
            <span class="text-xs text-slate-200 font-bold">画像をまとめて選択（複数可）</span>
            <span class="text-[10px] text-slate-400">選択順に頒布物へ割り当て</span>
            <input type="file" id="batchImageInput" accept="image/*" multiple class="hidden">
          </label>

          <label class="block text-[11px] text-slate-400 mt-3">
            説明文のフォントサイズ
            <input id="descriptionFontSize" type="number" min="12" max="100" value="38" class="form-control">
          </label>
        </section>

        <!-- 頒布物 -->
        <section>
          <div class="flex justify-between items-center mb-2">
            <h3 class="text-xs font-bold text-rose-400">頒布物一覧</h3>
            <button id="addItemBtn" type="button" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-600 text-slate-200">
              頒布物を追加
            </button>
          </div>
          <div id="itemsContainer" class="space-y-3"></div>
        </section>
      </div>
    </aside>

    <!-- プレビュー -->
    <main id="workspace" class="flex-1 min-w-0 bg-slate-950 flex items-center justify-center p-3 sm:p-5 overflow-hidden relative">
      <div class="absolute top-3 left-3 z-20 rounded-lg border border-slate-700 bg-slate-800/90 px-3 py-2 text-[11px] text-slate-300 shadow">
        <span id="zoomDisplay">表示: --%</span>
        <span class="mx-1 text-slate-600">|</span>
        <span id="dimensionDisplay" class="text-slate-400"></span>
      </div>

      <div id="previewToolbar" class="absolute z-20 flex flex-wrap items-center justify-end gap-2 rounded-lg border border-slate-700 bg-slate-800/95 px-3 py-2 shadow">
        <button id="previewToolbarDrag" type="button" aria-label="操作バーを移動" class="cursor-move rounded bg-slate-700 px-2 py-1 text-xs text-slate-200" title="ドラッグして移動">
          <i data-lucide="move" class="h-4 w-4"></i>
        </button>
        <button id="fitCanvasBtn" type="button" class="rounded bg-slate-700 px-2 py-1 text-xs text-slate-200 hover:bg-slate-600">全体表示</button>
        <label class="flex items-center gap-1.5 text-xs text-slate-200">
          倍率
          <input id="zoomSlider" type="range" min="1" max="200" value="100" class="w-20 accent-rose-500">
        </label>
        <label class="flex items-center gap-1.5 text-xs text-slate-200">
          <input id="toggleGrid" type="checkbox" class="accent-rose-500">
          方眼
        </label>
      </div>

      <div id="canvasContainer" class="shadow-2xl border border-slate-700/50 bg-white">
        <div id="canvasStage">
          <canvas id="oshinagakiCanvas"></canvas>
          <div id="gridOverlay" class="grid-overlay hidden" aria-hidden="true"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const PRESET_COLORS = [
      { name: "赤", hex: "#fca5a5", main: "#e11d48" },
      { name: "ピンク", hex: "#f472b6", main: "#db2777" },
      { name: "オレンジ", hex: "#fdba74", main: "#ea580c" },
      { name: "緑", hex: "#86efac", main: "#16a34a" },
      { name: "青", hex: "#93c5fd", main: "#2563eb" },
      { name: "紫", hex: "#d8b4fe", main: "#9333ea" },
      { name: "グレー", hex: "#cbd5e1", main: "#475569" }
    ];

    const HEADER_COLOR_SCHEMES = {
      "赤": { headerBg: "#3b0a1e", accent: "#fb7185", eventText: "#ffe4e6", circleText: "#fff1f2", spaceText: "#ffffff", spaceBg: "#e11d48" },
      "ピンク": { headerBg: "#3b1028", accent: "#f472b6", eventText: "#fce7f3", circleText: "#fff1f7", spaceText: "#ffffff", spaceBg: "#db2777" },
      "オレンジ": { headerBg: "#3b1b0b", accent: "#fb923c", eventText: "#ffedd5", circleText: "#fff7ed", spaceText: "#ffffff", spaceBg: "#ea580c" },
      "緑": { headerBg: "#092e24", accent: "#4ade80", eventText: "#dcfce7", circleText: "#f0fdf4", spaceText: "#ffffff", spaceBg: "#16a34a" },
      "青": { headerBg: "#0b2340", accent: "#60a5fa", eventText: "#dbeafe", circleText: "#eff6ff", spaceText: "#ffffff", spaceBg: "#2563eb" },
      "紫": { headerBg: "#26103b", accent: "#c084fc", eventText: "#f3e8ff", circleText: "#faf5ff", spaceText: "#ffffff", spaceBg: "#9333ea" },
      "グレー": { headerBg: "#1f2937", accent: "#cbd5e1", eventText: "#e2e8f0", circleText: "#f8fafc", spaceText: "#ffffff", spaceBg: "#475569" }
    };

    const CATEGORY_STYLES = {
      "新刊": { text: "#ffffff", background: "#dc2626" },
      "既刊": { text: "#ffffff", background: "#2563eb" },
      "無料配布": { text: "#ffffff", background: "#16a34a" }
    };

    const SPECS = {
      A2: { width: 4677, height: 3307 },
      A3: { width: 3307, height: 2339 },
      A4: { width: 2339, height: 1654 },
      WEB_PORTRAIT: { width: 960, height: 1280 },
      WEB_LANDSCAPE: { width: 1200, height: 675 },
      PICSQUARE: { width: 500, height: 1000 },
      PICREA: { width: 800, height: 1600 }
    };

    const PAPER_MM = {
      A2: { width: 420, height: 594 },
      A3: { width: 297, height: 420 },
      A4: { width: 210, height: 297 },
      WEB_PORTRAIT: { width: 960 * 25.4 / 200, height: 1280 * 25.4 / 200 },
      WEB_LANDSCAPE: { width: 1200 * 25.4 / 200, height: 675 * 25.4 / 200 },
      PICSQUARE: { width: 500 * 25.4 / 200, height: 1000 * 25.4 / 200 },
      PICREA: { width: 800 * 25.4 / 200, height: 1600 * 25.4 / 200 }
    };

    const SOCIAL_PRESETS = {
      WEB_PORTRAIT: { width: 960, height: 1280, orientation: "PORTRAIT", label: "X用縦書き" },
      WEB_LANDSCAPE: { width: 1200, height: 675, orientation: "LANDSCAPE", label: "X用横書き" },
      PICSQUARE: { width: 500, height: 1000, orientation: "PORTRAIT", label: "ピクスク用" },
      PICREA: { width: 800, height: 1600, orientation: "PORTRAIT", label: "ピクリエ用" }
    };

    const BLEED_MM = 3;

    const SOCIAL_LAYOUTS = {
      PICSQUARE: {
        headerHeight: 210,
        marginX: 18,
        marginY: 18,
        gapX: 12,
        gapY: 12,
        padding: 9,
        eventFont: 15,
        circleFont: 25,
        spaceFont: 15,
        cardFontScale: 0.38,
        categoryBand: 36,
        ageBand: 23
      },
      PICREA: {
        headerHeight: 280,
        marginX: 26,
        marginY: 24,
        gapX: 18,
        gapY: 18,
        padding: 13,
        eventFont: 19,
        circleFont: 36,
        spaceFont: 19,
        cardFontScale: 0.52,
        categoryBand: 48,
        ageBand: 30
      },
      WEB_PORTRAIT: {
        headerHeight: 260,
        marginX: 30,
        marginY: 24,
        gapX: 18,
        gapY: 18,
        padding: 13,
        eventFont: 20,
        circleFont: 39,
        spaceFont: 20,
        cardFontScale: 0.55,
        categoryBand: 48,
        ageBand: 30
      },
      WEB_LANDSCAPE: {
        headerHeight: 160,
        marginX: 30,
        marginY: 20,
        gapX: 18,
        gapY: 18,
        padding: 12,
        eventFont: 16,
        circleFont: 29,
        spaceFont: 16,
        cardFontScale: 0.5,
        categoryBand: 42,
        ageBand: 27
      }
    };

    let selectedPresetColor = PRESET_COLORS[0];
    let currentOrientation = "LANDSCAPE";
    let currentPaperSize = "A3";
    let CANVAS_WIDTH = SPECS.A3.width;
    let CANVAS_HEIGHT = SPECS.A3.height;
    let canvas;
    let customBgImageObj = null;
    let generationId = 0;
    let resizeCanvasToFit = null;
    let previewZoomMode = "fit";
    let imageLoadPromises = [];

    let items = [
      {
        category: "新刊",
        ageRating: "全年齢",
        title: "新刊サンプルタイトル",
        price: "¥ 1,000",

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({

        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);

      document.getElementById("eventInfoTextColor").value = scheme.eventText;

    function moveItem(index, direction) {
      const target = index + direction;

      renderFormItems();

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像を読み込めませんでした。"));
        image.src = url;
      });
    }

    async function handleSingleImageUpload(index, input) {
      const file = input.files?.[0];
      if (!file || !items[index]) return;

      try {
        const url = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("画像ファイルを読み込めませんでした。"));
          reader.readAsDataURL(file);
        });

        const image = await loadImage(url);
        Object.assign(items[index], {
          imageSrc: url,
          imageWidth: image.naturalWidth,
          imageHeight: image.naturalHeight,
          noImage: false
        });

        renderFormItems();
        generateOshinagaki();
      } catch (error) {
        alert(error.message);
      }
    }

    async function handleBatchImageUpload(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;

      try {
        const urls = await Promise.all(files.map((file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error(`画像を読み込めませんでした: ${file.name}`));
          reader.readAsDataURL(file);
        })));

        const images = await Promise.all(urls.map(loadImage));

        urls.forEach((url, index) => {
          const image = images[index];
          const imageData = {
            imageSrc: url,
            imageWidth: image.naturalWidth,
            imageHeight: image.naturalHeight,
            noImage: false
          };

          if (index < items.length) {
            Object.assign(items[index], imageData);
          } else {
            items.push({
              category: "新刊",
              ageRating: "全年齢",
              title: `新刊アイテム ${index + 1}`,
              price: "¥ 500",
              desc: "",
              ...imageData
            });
          }
        });

        renderFormItems();
        generateOshinagaki();
      } catch (error) {
        alert(error.message);
      }
    }

    function createPatternCanvas(style, color) {
      const size = 240;
      const patternCanvas = document.createElement("canvas");
      const context = patternCanvas.getContext("2d");
      patternCanvas.width = size;
      patternCanvas.height = size;
      context.fillStyle = "#fff8fb";
      context.fillRect(0, 0, size, size);

      if (style === "dots") {
        context.fillStyle = color;
        context.beginPath();
        context.arc(size / 4, size / 4, 17, 0, Math.PI * 2);
        context.arc(size * 3 / 4, size * 3 / 4, 17, 0, Math.PI * 2);
        context.fill();
      } else if (style === "stripes") {
        context.fillStyle = color;
        context.fillRect(0, 0, size / 2, size);
      } else if (style === "diagonal") {
        const period = size / Math.sqrt(2);
        context.save();
        context.translate(size / 2, size / 2);
        context.rotate(Math.PI / 4);
        context.fillStyle = color;
        for (let x = -size * 2; x <= size * 2; x += period) {
          context.fillRect(x, -size * 2, period / 3, size * 4);
        }
        context.restore();
      } else if (style === "border") {
        context.fillStyle = color;
        context.fillRect(0, 0, size, size / 2);
      } else if (style === "check") {
        const square = size / 2;
        context.fillStyle = color;
        context.fillRect(0, 0, square, square);
        context.fillRect(square, square, square, square);
      }

      return patternCanvas;
    }

    function applyBackground() {
      const type = document.getElementById("bgTypeSelect").value;
      canvas.setBackgroundImage(null);
      canvas.setBackgroundColor("#ffffff");

      if (type === "color") {
        canvas.setBackgroundColor(document.getElementById("bgColorPicker").value);
        return null;
      }

      if (type === "custom" && customBgImageObj) {
        canvas.setBackgroundImage(customBgImageObj, null, {
          originX: "left",
          originY: "top",
          left: 0,
          top: 0,
          scaleX: CANVAS_WIDTH / customBgImageObj.width,
          scaleY: CANVAS_HEIGHT / customBgImageObj.height
        });
        return null;
      }

      if (type === "custom") return null;

      return new fabric.Pattern({
        source: createPatternCanvas(
          document.getElementById("patternStyleSelect").value,
          selectedPresetColor.hex
        ),
        repeat: "repeat"
      });
    }

    function getInfoStyle(prefix, defaultSize, defaultColor, maxSize) {
      const rawSize = Number.parseInt(
        document.getElementById(`${prefix}FontSize`).value,
        10
      );
      const hasBackground = document.getElementById(`${prefix}BgEnabled`).checked;

      return {
        fontSize: Number.isFinite(rawSize)
          ? Math.max(12, Math.min(rawSize, maxSize))
          : defaultSize,
        fill: document.getElementById(`${prefix}TextColor`).value || defaultColor,
        backgroundColor: hasBackground
          ? document.getElementById(`${prefix}BgColor`).value
          : ""
      };
    }

    function getCategoryStyle(category) {
      return CATEGORY_STYLES[category] || CATEGORY_STYLES["新刊"];
    }

    function createItemTextBlock(item, width, fontScale) {
      const categoryStyle = getCategoryStyle(item.category);
      const descriptionSize = Math.max(
        12,
        Math.min(
          100,
          Number.parseInt(document.getElementById("descriptionFontSize").value, 10) || 38
        )
      );
      const scaled = (value) => Math.max(1, value * fontScale);
      const definitions = [{
        text: item.title || "",
        fontSize: scaled(78),
        fontFamily: "Noto Sans JP",
        fontWeight: "bold",
        fill: "#0f172a",
        gapAfter: Math.max(1, 9 * fontScale)
      }];

      if (item.category !== "無料配布" && item.price) {
        definitions.push({
          text: item.price,
          fontSize: scaled(100),
          fontFamily: "M PLUS Rounded 1c",
          fontWeight: "bold",
          fill: categoryStyle.background,
          gapAfter: Math.max(1, 8 * fontScale)
        });
      }

      if (item.desc) {
        definitions.push({
          text: item.desc,
          fontSize: scaled(descriptionSize),
          fontFamily: "Noto Sans JP",
          fontWeight: "normal",
          fill: "#475569",
          gapAfter: 0
        });
      }

      const entries = definitions.map((definition) => {
        const object = new fabric.Textbox(definition.text, {
          left: 0,
          top: 0,
          width,
          fontSize: definition.fontSize,
          fontFamily: definition.fontFamily,
          fontWeight: definition.fontWeight,
          fill: definition.fill,
          splitByGrapheme: true,
          lineHeight: 1.05,
          selectable: false,
          evented: false
        });
        return { object, gapAfter: definition.gapAfter };
      });

      return {
        entries,
        totalHeight: entries.reduce(
          (sum, entry) => sum + entry.object.getScaledHeight() + entry.gapAfter,
          0
        )
      };
    }

    function fitTextBlockToHeight(block, availableHeight) {
      if (block.totalHeight <= availableHeight) return block;

      let low = 0.001;
      let high = 1;
      let best = block;

      for (let i = 0; i < 24; i += 1) {
        const factor = (low + high) / 2;
        const entries = block.entries.map((entry) => {
          const object = new fabric.Textbox(entry.object.text, {
            left: entry.object.left,
            top: entry.object.top,
            width: entry.object.width,
            fontSize: Math.max(1, entry.object.fontSize * factor),
            fontFamily: entry.object.fontFamily,
            fontWeight: entry.object.fontWeight,
            fill: entry.object.fill,
            splitByGrapheme: true,
            lineHeight: 1.05,
            selectable: false,
            evented: false
          });

          return { object, gapAfter: entry.gapAfter * factor };
        });

        const totalHeight = entries.reduce(
          (sum, entry) => sum + entry.object.getScaledHeight() + entry.gapAfter,
          0
        );

        if (totalHeight <= availableHeight) {
          best = { entries, totalHeight };
          low = factor;
        } else {
          high = factor;
        }
      }

      return best;
    }

    function addImageToCanvas(item, imageBox, generation, textAnchor) {
      if (!item.imageSrc || item.noImage) return Promise.resolve();

      return new Promise((resolve) => {
        fabric.Image.fromURL(item.imageSrc, (image) => {
          if (!image || generation !== generationId) {
            resolve();
            return;
          }

          const scale = Math.min(
            imageBox.width / image.width,
            imageBox.height / image.height
          );

          image.set({
            left: imageBox.left + (imageBox.width - image.width * scale) / 2,
            top: imageBox.top + (imageBox.height - image.height * scale) / 2,
            scaleX: scale,
            scaleY: scale,
            shadow: new fabric.Shadow({
              color: "rgba(15, 23, 42, .35)",
              blur: 24,
              offsetX: 0,
              offsetY: 10
            }),
            selectable: false,
            evented: false
          });

          const anchorIndex = canvas.getObjects().indexOf(textAnchor);
          if (anchorIndex >= 0) canvas.insertAt(image, anchorIndex, false);
          else canvas.add(image);

          canvas.requestRenderAll();
          resolve();
        });
      });
    }

    function generateOshinagaki() {
      if (!canvas) return;

      const generation = ++generationId;
      imageLoadPromises = [];
      canvas.clear();

      const pattern = applyBackground();
      if (pattern) {
        canvas.add(new fabric.Rect({
          left: 0,
          top: 0,
          width: CANVAS_WIDTH,
          height: CANVAS_HEIGHT,
          fill: pattern,
          selectable: false,
          evented: false
        }));
      }

      const social = SOCIAL_LAYOUTS[currentPaperSize] || null;
      const compact = Boolean(social);
      const landscape = currentOrientation === "LANDSCAPE";
      const headerColor = document.getElementById("headerBgColor").value || "#0f172a";
      const accentColor = document.getElementById("headerAccentColor").value || selectedPresetColor.main;

      const headerHeight = social
        ? social.headerHeight
        : (landscape ? 360 : 420);
      const marginX = social ? social.marginX : 70;
      const marginY = social ? social.marginY : 40;
      const gapX = social ? social.gapX : 40;
      const gapY = social ? social.gapY : 40;
      const padding = social ? social.padding : 25;
      const headerMargin = social ? marginX : 80;

      const defaultEventSize = social
        ? social.eventFont
        : (landscape ? 48 : 46);
      const defaultCircleSize = social
        ? social.circleFont
        : (landscape ? 120 : 110);
      const defaultSpaceSize = social
        ? social.spaceFont
        : (landscape ? 75 : 65);

      const eventStyle = getInfoStyle(
        "eventInfo",
        defaultEventSize,
        "#cbd5e1",
        social ? social.eventFont : 200
      );
      const circleStyle = getInfoStyle(
        "circleInfo",
        defaultCircleSize,
        "#ffffff",
        social ? social.circleFont : 300
      );
      const spaceStyle = getInfoStyle(
        "spaceInfo",
        defaultSpaceSize,
        "#ffffff",
        social ? social.spaceFont : 200
      );

      canvas.add(new fabric.Rect({
        left: 0,
        top: 0,
        width: CANVAS_WIDTH,
        height: headerHeight,
        fill: headerColor,
        selectable: false,
        evented: false
      }));

      const accentHeight = compact ? Math.max(4, Math.round(headerHeight * .025)) : 12;
      canvas.add(new fabric.Rect({
        left: 0,
        top: headerHeight - accentHeight,
        width: CANVAS_WIDTH,
        height: accentHeight,
        fill: accentColor,
        selectable: false,
        evented: false
      }));

      /*
        Social layouts use three separate, constrained rows.
        This prevents large default print typography from overlapping.
      */
      if (social) {
        const padY = Math.max(8, Math.round(headerHeight * .045));
        const eventRowHeight = Math.round(headerHeight * .2);
        const circleRowHeight = Math.round(headerHeight * .32);
        const spaceRowHeight = Math.round(headerHeight * .2);

        const eventBox = {
          left: headerMargin,
          top: padY,
          width: CANVAS_WIDTH - headerMargin * 2,
          height: eventRowHeight
        };
        const circleBox = {
          left: headerMargin,
          top: padY + eventRowHeight + Math.round(headerHeight * .035),
          width: CANVAS_WIDTH - headerMargin * 2,
          height: circleRowHeight
        };
        const spaceBox = {
          left: headerMargin,
          top: padY + eventRowHeight + Math.round(headerHeight * .035) +
            circleRowHeight + Math.round(headerHeight * .025),
          width: CANVAS_WIDTH - headerMargin * 2,
          height: spaceRowHeight
        };

        canvas.add(makeFittedHeaderText(
          `${document.getElementById("eventDate").value}  |  ${document.getElementById("eventName").value}`,
          eventBox,
          eventStyle.fontSize,
          eventStyle.fill,
          eventStyle.backgroundColor,
          "Noto Sans JP",
          false
        ));

        canvas.add(makeFittedHeaderText(
          document.getElementById("circleName").value,
          circleBox,
          circleStyle.fontSize,
          circleStyle.fill,
          circleStyle.backgroundColor,
          "Noto Sans JP",
          true
        ));

        const spaceNo = document.getElementById("spaceNo").value;
        if (spaceNo) {
          canvas.add(makeFittedHeaderText(
            ` ${spaceNo} `,
            spaceBox,
            spaceStyle.fontSize,
            spaceStyle.fill,
            spaceStyle.backgroundColor || selectedPresetColor.main,
            "M PLUS Rounded 1c",
            true
          ));
        }
      } else {
        const eventDate = document.getElementById("eventDate").value;
        const eventName = document.getElementById("eventName").value;
        const circleName = document.getElementById("circleName").value;
        const spaceNo = document.getElementById("spaceNo").value;

        canvas.add(new fabric.Textbox(`${eventDate}  |  ${eventName}`, {
          left: 80,
          top: landscape ? 55 : 60,
          width: CANVAS_WIDTH - 160,
          fontSize: eventStyle.fontSize,
          fontFamily: "Noto Sans JP",
          fill: eventStyle.fill,
          backgroundColor: eventStyle.backgroundColor,
          splitByGrapheme: true,
          selectable: false,
          evented: false
        }));

        canvas.add(new fabric.Textbox(circleName, {
          left: 80,
          top: landscape ? 130 : 135,
          width: landscape ? CANVAS_WIDTH - 1000 : CANVAS_WIDTH - 160,
          fontSize: circleStyle.fontSize,
          fontWeight: "bold",
          fontFamily: "Noto Sans JP",
          fill: circleStyle.fill,
          backgroundColor: circleStyle.backgroundColor,
          splitByGrapheme: true,
          selectable: false,
          evented: false
        }));

        if (spaceNo) {
          canvas.add(new fabric.Textbox(` ${spaceNo} `, {
            left: landscape ? CANVAS_WIDTH - 850 : 80,
            top: landscape ? 120 : 270,
            width: landscape ? 760 : CANVAS_WIDTH - 160,
            fontSize: spaceStyle.fontSize,
            fontWeight: "bold",
            fontFamily: "M PLUS Rounded 1c",
            fill: spaceStyle.fill,
            backgroundColor: spaceStyle.backgroundColor,
            padding: 18,
            splitByGrapheme: true,
            selectable: false,
            evented: false
          }));
        }
      }

      let columns = 2;

      if (compact) {
        if (currentPaperSize === "WEB_LANDSCAPE") {
          columns = items.length <= 2 ? Math.max(1, items.length) : 2;
        } else {
          columns = items.length <= 3 ? 1 : 2;
        }
      } else if (landscape) {
        if (items.length <= 1) columns = 1;
        else if (items.length > 4) columns = 3;
      } else if (items.length <= 3) {
        columns = 1;
      }

      const rows = Math.ceil(items.length / columns);
      const startY = headerHeight + (compact ? 12 : 50);
      const slotWidth =
        (CANVAS_WIDTH - marginX * 2 - gapX * (columns - 1)) / columns;
      const slotHeight = rows > 0
        ? (CANVAS_HEIGHT - startY - marginY - gapY * (rows - 1)) / rows
        : 0;

      items.forEach((item, index) => {
        const row = Math.floor(index / columns);
        const column = index % columns;
        const x = marginX + column * (slotWidth + gapX);
        const y = startY + row * (slotHeight + gapY);
        const hasImage = Boolean(item.imageSrc) && !item.noImage;
        const cardRadius = compact ? 12 : 24;

        canvas.add(new fabric.Rect({
          left: x,
          top: y,
          width: slotWidth,
          height: slotHeight,
          fill: "#ffffff",
          stroke: "transparent",
          strokeWidth: 0,
          rx: cardRadius,
          ry: cardRadius,
          selectable: false,
          evented: false
        }));

        const categoryStyle = getCategoryStyle(item.category);
        const isR18 = item.ageRating === "R18";
        const categoryHeight = Math.min(
          social ? social.categoryBand : 100,
          slotHeight * .14
        );
        const ageHeight = Math.min(
          social ? social.ageBand : 64,
          slotHeight * .09
        );
        const radius = Math.min(cardRadius, slotWidth / 2);

        const bandPath = [
          `M 0 ${radius}`,
          `Q 0 0 ${radius} 0`,
          `L ${slotWidth - radius} 0`,
          `Q ${slotWidth} 0 ${slotWidth} ${radius}`,
          `L ${slotWidth} ${categoryHeight}`,
          `L 0 ${categoryHeight}`,
          "Z"
        ].join(" ");

        canvas.add(new fabric.Path(bandPath, {
          left: x,
          top: y,
          fill: categoryStyle.background,
          selectable: false,
          evented: false
        }));

        canvas.add(new fabric.Textbox(item.category || "新刊", {
          left: x + padding,
          top: y + 2,
          width: slotWidth - padding * 2,
          height: Math.max(1, categoryHeight - 4),
          fontSize: Math.min(social ? 25 : 64, categoryHeight * .64),
          fontWeight: "bold",
          fontFamily: "M PLUS Rounded 1c",
          fill: categoryStyle.text,
          valign: "middle",
          splitByGrapheme: true,
          selectable: false,
          evented: false
        }));

        const ageTop = y + categoryHeight;
        const ageBackground = isR18 ? "#991b1b" : "#dcfce7";
        const ageForeground = isR18 ? "#ffffff" : "#166534";

        canvas.add(new fabric.Rect({
          left: x,
          top: ageTop,
          width: slotWidth,
          height: ageHeight,
          fill: ageBackground,
          selectable: false,
          evented: false
        }));

        canvas.add(new fabric.Textbox(isR18 ? "R18" : "全年齢", {
          left: x + padding,
          top: ageTop + 1,
          width: slotWidth - padding * 2,
          height: Math.max(1, ageHeight - 2),
          fontSize: Math.min(social ? 16 : 34, ageHeight * .55),
          fontWeight: "bold",
          fontFamily: "M PLUS Rounded 1c",
          fill: ageForeground,
          valign: "middle",
          selectable: false,
          evented: false
        }));

        const bodyTop = y + categoryHeight + ageHeight + padding;
        const bodyHeight = Math.max(
          1,
          slotHeight - categoryHeight - ageHeight - padding * 2
        );

        let imageBox = null;
        let textX;
        let textWidth;

        if (hasImage) {
          const maxImageWidth = slotWidth * (landscape ? .38 : .36);
          const sourceWidth = item.imageWidth || 1;
          const sourceHeight = item.imageHeight || 1;
          const imageScale = Math.min(
            maxImageWidth / sourceWidth,
            bodyHeight / sourceHeight
          );
          const displayWidth = sourceWidth * imageScale;
          const displayHeight = sourceHeight * imageScale;
          const imageGap = compact ? 10 : 25;

          imageBox = {
            left: x + padding,
            top: bodyTop + (bodyHeight - displayHeight) / 2,
            width: displayWidth,
            height: displayHeight
          };

          textX = imageBox.left + displayWidth + imageGap;
          textWidth = Math.max(1, x + slotWidth - padding - textX);
        } else {
          textX = x + padding;
          textWidth = Math.max(1, slotWidth - padding * 2);
        }

        const textBlock = createItemTextBlock(
          item,
          textWidth,
          social ? social.cardFontScale : 1
        );
        const fitted = fitTextBlockToHeight(textBlock, bodyHeight);

        let textY = bodyTop;
        let titleAnchor = null;

        fitted.entries.forEach((entry, entryIndex) => {
          entry.object.set({ left: textX, top: textY });
          if (entryIndex === 0) titleAnchor = entry.object;
          canvas.add(entry.object);
          textY += entry.object.getScaledHeight() + entry.gapAfter;
        });

        if (hasImage && imageBox) {
          imageLoadPromises.push(
            addImageToCanvas(item, imageBox, generation, titleAnchor)
          );
        }

        canvas.add(new fabric.Rect({
          left: x,
          top: y,
          width: slotWidth,
          height: slotHeight,
          fill: "rgba(255,255,255,0)",
          stroke: "#cbd5e1",
          strokeWidth: compact ? 2 : 4,
          rx: cardRadius,
          ry: cardRadius,
          selectable: false,
          evented: false
        }));
      });

      canvas.renderAll();
    }

    function makeFittedHeaderText(text, box, requestedSize, fill, backgroundColor, fontFamily, bold) {
      const maxSize = Math.max(8, requestedSize);
      const minSize = Math.max(8, Math.min(12, maxSize));
      let low = minSize;
      let high = maxSize;
      let best = new fabric.Textbox(text, {
        left: box.left,
        top: box.top,
        width: box.width,
        height: box.height,
        fontSize: minSize,
        fontFamily,
        fontWeight: bold ? "bold" : "normal",
        fill,
        backgroundColor,
        splitByGrapheme: true,
        lineHeight: 1,
        textAlign: "left",
        valign: "middle",
        selectable: false,
        evented: false
      });

      for (let i = 0; i < 18; i += 1) {
        const size = (low + high) / 2;
        const candidate = new fabric.Textbox(text, {
          left: box.left,
          top: box.top,
          width: box.width,
          height: box.height,
          fontSize: size,
          fontFamily,
          fontWeight: bold ? "bold" : "normal",
          fill,
          backgroundColor,
          splitByGrapheme: true,
          lineHeight: 1,
          textAlign: "left",
          valign: "middle",
          selectable: false,
          evented: false
        });

        if (candidate.height <= box.height + 1) {
          best = candidate;
          low = size;
        } else {
          high = size;
        }
      }

      return best;
    }

    function applyPreviewScale(scale) {
      if (!canvas) return;

      const container = document.getElementById("canvasContainer");
      const stage = document.getElementById("canvasStage");
      const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;

      stage.style.width = `${CANVAS_WIDTH}px`;
      stage.style.height = `${CANVAS_HEIGHT}px`;
      stage.style.transform = `scale(${safeScale})`;
      container.style.width = `${CANVAS_WIDTH * safeScale}px`;
      container.style.height = `${CANVAS_HEIGHT * safeScale}px`;

      canvas.calcOffset();
      canvas.requestRenderAll();

      document.getElementById("zoomDisplay").textContent =
        `表示: ${Math.round(safeScale * 100)}%`;
      document.getElementById("zoomSlider").value =
        String(Math.max(1, Math.min(200, Math.round(safeScale * 100))));
    }

    function fitCanvasToWorkspace() {
      const workspace = document.getElementById("workspace");
      const availableWidth = Math.max(workspace.clientWidth - 56, 1);
      const availableHeight = Math.max(workspace.clientHeight - 56, 1);

      applyPreviewScale(Math.min(
        availableWidth / CANVAS_WIDTH,
        availableHeight / CANVAS_HEIGHT
      ));
    }

    function setupResponsiveScaler() {
      const workspace = document.getElementById("workspace");

      resizeCanvasToFit = () => {
        if (previewZoomMode === "fit") {
          fitCanvasToWorkspace();
        } else {
          applyPreviewScale(Number(document.getElementById("zoomSlider").value) / 100);
        }
      };

      if ("ResizeObserver" in window) {
        new ResizeObserver(() => {
          if (previewZoomMode === "fit") fitCanvasToWorkspace();
        }).observe(workspace);
      }

      window.addEventListener("resize", () => {
        if (previewZoomMode === "fit") fitCanvasToWorkspace();
      });

      requestAnimationFrame(fitCanvasToWorkspace);
    }

    async function createBleedExport() {
      while (true) {
        const startGeneration = generationId;
        await Promise.all(imageLoadPromises.slice());
        if (startGeneration === generationId) break;
      }

      canvas.renderAll();

      const social = SOCIAL_PRESETS[currentPaperSize];

      if (social) {
        return {
          dataUrl: canvas.toDataURL({ format: "png", multiplier: 1 }),
          widthPx: social.width,
          heightPx: social.height,
          widthMm: PAPER_MM[currentPaperSize].width,
          heightMm: PAPER_MM[currentPaperSize].height,
          hasBleed: false
        };
      }

      const source = await loadImage(canvas.toDataURL({ format: "png", multiplier: 1 }));
      const paper = PAPER_MM[currentPaperSize];
      const landscape = currentOrientation === "LANDSCAPE";
      const trimWidthMm = landscape ? paper.height : paper.width;
      const trimHeightMm = landscape ? paper.width : paper.height;
      const trimWidthPx = CANVAS_WIDTH;
      const trimHeightPx = CANVAS_HEIGHT;

      const outputWidthPx = Math.round((trimWidthMm + BLEED_MM * 2) * 200 / 25.4);
      const outputHeightPx = Math.round((trimHeightMm + BLEED_MM * 2) * 200 / 25.4);
      const bleedX = outputWidthPx - trimWidthPx;
      const bleedY = outputHeightPx - trimHeightPx;
      const left = Math.floor(bleedX / 2);
      const right = bleedX - left;
      const top = Math.floor(bleedY / 2);
      const bottom = bleedY - top;

      const output = document.createElement("canvas");
      output.width = outputWidthPx;
      output.height = outputHeightPx;
      const context = output.getContext("2d");
      if (!context) throw new Error("塗り足し用キャンバスを作成できませんでした。");

      const x = left;
      const y = top;
      const sw = source.naturalWidth;
      const sh = source.naturalHeight;

      if (top) context.drawImage(source, 0, 0, sw, 1, x, 0, trimWidthPx, top);
      if (bottom) context.drawImage(source, 0, sh - 1, sw, 1, x, y + trimHeightPx, trimWidthPx, bottom);
      if (left) context.drawImage(source, 0, 0, 1, sh, 0, y, left, trimHeightPx);
      if (right) context.drawImage(source, sw - 1, 0, 1, sh, x + trimWidthPx, y, right, trimHeightPx);

      if (left && top) context.drawImage(source, 0, 0, 1, 1, 0, 0, left, top);
      if (right && top) context.drawImage(source, sw - 1, 0, 1, 1, x + trimWidthPx, 0, right, top);
      if (left && bottom) context.drawImage(source, 0, sh - 1, 1, 1, 0, y + trimHeightPx, left, bottom);
      if (right && bottom) context.drawImage(source, sw - 1, sh - 1, 1, 1, x + trimWidthPx, y + trimHeightPx, right, bottom);

      context.drawImage(source, 0, 0, sw, sh, x, y, trimWidthPx, trimHeightPx);

      return {
        dataUrl: output.toDataURL("image/png"),
        widthPx: outputWidthPx,
        heightPx: outputHeightPx,
        widthMm: trimWidthMm + BLEED_MM * 2,
        heightMm: trimHeightMm + BLEED_MM * 2,
        hasBleed: true
      };
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像を読み込めませんでした。"));
        image.src = url;
      });
    }

    async function openPrintPreview() {
      const popup = window.open("", "_blank");
      if (!popup) {
        alert("プレビューを開けませんでした。ポップアップを許可してください。");
        return;
      }

      try {
        const exported = await createBleedExport();
        const label = exported.hasBleed ? "塗り足し各3mm" : "Webサイズ";
        const widthMm = exported.widthMm;
        const heightMm = exported.heightMm;

        popup.document.open();
        popup.document.write(`<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>印刷プレビュー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:sans-serif}
body{background:#1e293b;color:#f8fafc}
.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#0f172a}
.toolbar button{border:0;border-radius:6px;padding:8px 12px;color:#fff;background:#334155;cursor:pointer}
.toolbar .print{background:#e11d48}
.preview{height:calc(100vh - 60px);overflow:auto;padding:24px}
.sheet{width:${exported.widthPx}px;height:${exported.heightPx}px;margin:0 auto;background:#fff;box-shadow:0 8px 30px #0006}
.sheet img{display:block;width:100%;height:100%}
body.fit .sheet{width:auto;height:auto;max-width:100%}
body.fit .sheet img{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
@page{size:${widthMm}mm ${heightMm}mm;margin:0}
@media print{
html,body{width:${widthMm}mm;height:${heightMm}mm;margin:0;padding:0;overflow:hidden;background:#fff}
.toolbar{display:none!important}
.preview{width:${widthMm}mm;height:${heightMm}mm;overflow:hidden;padding:0}
.sheet{width:${widthMm}mm!important;height:${heightMm}mm!important;margin:0!important;box-shadow:none}
.sheet img{width:${widthMm}mm!important;height:${heightMm}mm!important}
}
</style>
</head>
<body>
<div class="toolbar">
<strong>プレビュー（${label}）</strong>
<button id="actual" type="button">100%表示</button>
<button id="fit" type="button">画面に合わせる</button>
<button id="print" class="print" type="button">印刷</button>
<span>${exported.widthPx} × ${exported.heightPx}px</span>
</div>
<main class="preview"><div class="sheet"><img src="${exported.dataUrl}" alt="出力プレビュー"></div></main>
<script>
document.getElementById("actual").onclick=()=>document.body.classList.remove("fit");
document.getElementById("fit").onclick=()=>document.body.classList.add("fit");
document.getElementById("print").onclick=()=>window.print();
<\/script>
</body>
</html>`);
        popup.document.close();
      } catch (error) {
        popup.close();
        alert(`プレビューを作成できませんでした: ${error.message}`);
      }
    }

    function setupDraggablePreviewToolbar() {
      const toolbar = document.getElementById("previewToolbar");
      const handle = document.getElementById("previewToolbarDrag");
      const workspace = document.getElementById("workspace");
      let drag = null;

      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();

        const toolbarRect = toolbar.getBoundingClientRect();
        const workspaceRect = workspace.getBoundingClientRect();

        toolbar.style.left = `${toolbarRect.left - workspaceRect.left}px`;
        toolbar.style.top = `${toolbarRect.top - workspaceRect.top}px`;
        toolbar.style.right = "auto";
        toolbar.style.bottom = "auto";

        drag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          left: toolbarRect.left - workspaceRect.left,
          top: toolbarRect.top - workspaceRect.top
        };

        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", (event) => {
        if (!drag || drag.pointerId !== event.pointerId) return;

        const rect = workspace.getBoundingClientRect();
        const left = Math.max(0, Math.min(
          rect.width - toolbar.offsetWidth,
          drag.left + event.clientX - drag.startX
        ));
        const top = Math.max(0, Math.min(
          rect.height - toolbar.offsetHeight,
          drag.top + event.clientY - drag.startY
        ));

        toolbar.style.left = `${left}px`;
        toolbar.style.top = `${top}px`;
      });

      const endDrag = (event) => {
        if (drag?.pointerId === event.pointerId) drag = null;
      };

      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);
    }

    function setupEventListeners() {
      ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
        document.getElementById(id).addEventListener("input", generateOshinagaki);
      });

      [
        "headerBgColor", "headerAccentColor",
        "eventInfoFontSize", "eventInfoTextColor", "eventInfoBgEnabled", "eventInfoBgColor",
        "circleInfoFontSize", "circleInfoTextColor", "circleInfoBgEnabled", "circleInfoBgColor",
        "spaceInfoFontSize", "spaceInfoTextColor", "spaceInfoBgEnabled", "spaceInfoBgColor",
        "descriptionFontSize"
      ].forEach((id) => {
        const input = document.getElementById(id);
        input.addEventListener("input", generateOshinagaki);
        input.addEventListener("change", generateOshinagaki);
      });

      document.getElementById("orientationSelect").addEventListener("change", updateCanvasDimensions);
      document.getElementById("paperSizeSelect").addEventListener("change", updateCanvasDimensions);

      document.getElementById("bgTypeSelect").addEventListener("change", (event) => {
        const type = event.target.value;
        document.getElementById("patternControls").classList.toggle("hidden", type !== "pattern");
        document.getElementById("customBgControls").classList.toggle("hidden", type !== "custom");
        document.getElementById("singleColorControls").classList.toggle("hidden", type !== "color");
        generateOshinagaki();
      });

      document.getElementById("patternStyleSelect").addEventListener("change", generateOshinagaki);
      document.getElementById("bgColorPicker").addEventListener("input", generateOshinagaki);

      document.getElementById("customBgInput").addEventListener("change", (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (loadEvent) => {
          fabric.Image.fromURL(loadEvent.target.result, (image) => {
            if (!image) return;
            customBgImageObj = image;
            generateOshinagaki();
          });
        };
        reader.readAsDataURL(file);
      });

      document.getElementById("batchImageInput").addEventListener("change", (event) => {
        handleBatchImageUpload(event.target.files);
        event.target.value = "";
      });

      document.getElementById("addItemBtn").addEventListener("click", addItem);

      document.getElementById("toggleGrid").addEventListener("change", (event) => {
        document.getElementById("gridOverlay").classList.toggle("hidden", !event.target.checked);
      });

      document.getElementById("fitCanvasBtn").addEventListener("click", () => {
        previewZoomMode = "fit";
        fitCanvasToWorkspace();
      });

      document.getElementById("zoomSlider").addEventListener("input", (event) => {
        previewZoomMode = "manual";
        applyPreviewScale(Number(event.target.value) / 100);
      });

      setupDraggablePreviewToolbar();
      document.getElementById("printPreviewBtn").addEventListener("click", openPrintPreview);

      document.getElementById("exportPng").addEventListener("click", async () => {
        try {
          const exported = await createBleedExport();
          const link = document.createElement("a");
          const suffix = exported.hasBleed ? "_bleed3mm" : "";
          link.download =
            `oshinagaki_${currentPaperSize}_${currentOrientation}${suffix}_${exported.widthPx}x${exported.heightPx}.png`;
          link.href = exported.dataUrl;
          link.click();
        } catch (error) {
          alert(`PNGを書き出せませんでした: ${error.message}`);
        }
      });

      document.getElementById("exportPdf").addEventListener("click", async () => {
        try {
          const exported = await createBleedExport();
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: exported.widthMm >= exported.heightMm ? "landscape" : "portrait",
            unit: "mm",
            format: [exported.widthMm, exported.heightMm]
          });

          pdf.addImage(exported.dataUrl, "PNG", 0, 0, exported.widthMm, exported.heightMm);

          const suffix = exported.hasBleed ? "_bleed3mm" : "";
          pdf.save(`oshinagaki_${currentPaperSize}_${currentOrientation}${suffix}.pdf`);
        } catch (error) {
          alert(`PDFを書き出せませんでした: ${error.message}`);
        }
      });
    }
  </script>
</body>
</html>
