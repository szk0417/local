<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>おしながきメーカー</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

.toolbar{
display:flex;
gap:8px;
padding:10px;
flex-wrap:wrap;
background:white;
position:sticky;
top:0;
z-index:100;
box-shadow:0 2px 4px rgba(0,0,0,.1);
}

button{
padding:8px 12px;
cursor:pointer;
}

#editor-wrap{
display:flex;
justify-content:center;
padding:20px;
}

#canvas{
position:relative;
width:800px;
height:1131px;
background:white;
background-size:cover;
background-position:center;
border:1px solid #ccc;
overflow:hidden;
}

.obj{
position:absolute;
resize:both;
overflow:hidden;
cursor:move;
}

.textbox{
min-width:150px;
min-height:50px;
padding:4px;
background:rgba(255,255,255,.85);
border:1px dashed #888;
}

.imagebox img{
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
}

.selected{
outline:2px solid #0066ff;
}

.delete-btn{
position:absolute;
top:0;
right:0;
background:red;
color:white;
border:none;
width:20px;
height:20px;
cursor:pointer;
}

@media(max-width:900px){
#canvas{
width:95vw;
height:134vw;
}
}

</style>
</head>

<body>

<div class="toolbar">

<button onclick="addText()">テキスト</button>

<label>
<button>画像</button>
<input type="file" accept="image/*" hidden onchange="addImage(event)">
</label>

<label>
<button>背景</button>
<input type="file" accept="image/*" hidden onchange="setBackground(event)">
</label>

<select id="fontChooser">
<option>Noto Sans JP</option>
<option>Zen Maru Gothic</option>
<option>M PLUS Rounded 1c</option>
</select>

<button onclick="applyFont()">フォント適用</button>

<button onclick="alignLeft()">左揃え</button>
<button onclick="alignCenter()">中央揃え</button>
<button onclick="distributeVertical()">縦均等</button>

<button onclick="exportPNG()">PNG</button>
<button onclick="exportPDF()">PDF</button>

</div>

<div id="editor-wrap">
<div id="canvas"></div>
</div>

<script>

const canvas=document.getElementById('canvas');

let selected=null;

function select(el){

document
.querySelectorAll('.obj')
.forEach(o=>o.classList.remove('selected'));

selected=el;

if(el)
el.classList.add('selected');
}

function makeDraggable(el){

el.addEventListener('mousedown',e=>{

select(el);

let startX=e.clientX;
let startY=e.clientY;

let left=el.offsetLeft;
let top=el.offsetTop;

function move(ev){

el.style.left=
left+(ev.clientX-startX)+'px';

el.style.top=
top+(ev.clientY-startY)+'px';

}

function up(){

window.removeEventListener('mousemove',move);
window.removeEventListener('mouseup',up);

}

window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);

});

}

function addDeleteButton(box){

const btn=document.createElement('button');

btn.textContent='×';
btn.className='delete-btn';

btn.onclick=e=>{
e.stopPropagation();
box.remove();
};

box.appendChild(btn);

}

function addText(){

const div=document.createElement('div');

div.className='obj textbox';

div.contentEditable=true;

div.innerHTML='新刊タイトル';

div.style.left='20px';
div.style.top='20px';

makeDraggable(div);
addDeleteButton(div);

div.onclick=()=>select(div);

canvas.appendChild(div);

}

function addImage(ev){

const file=ev.target.files[0];
if(!file)return;

const r=new FileReader();

r.onload=()=>{

const box=document.createElement('div');

box.className='obj imagebox';

box.style.left='30px';
box.style.top='30px';
box.style.width='200px';
box.style.height='280px';

const img=document.createElement('img');

img.src=r.result;

box.appendChild(img);

makeDraggable(box);
addDeleteButton(box);

box.onclick=()=>select(box);

canvas.appendChild(box);

};

r.readAsDataURL(file);

}

function setBackground(ev){

const file=ev.target.files[0];

if(!file)return;

const r=new FileReader();

r.onload=()=>{

canvas.style.backgroundImage=
`url(${r.result})`;

};

r.readAsDataURL(file);

}

function applyFont(){

if(!selected)return;

selected.style.fontFamily=
document.getElementById('fontChooser').value;

}

function alignLeft(){

const objs=[...document.querySelectorAll('.obj')];

objs.forEach(o=>{
o.style.left='20px';
});

}

function alignCenter(){

const objs=[...document.querySelectorAll('.obj')];

objs.forEach(o=>{

o.style.left=
(canvas.clientWidth-o.offsetWidth)/2+'px';

});

}

function distributeVertical(){

const objs=[...document.querySelectorAll('.obj')];

if(objs.length<2) return;

const gap=
(canvas.clientHeight-200)/(objs.length);

objs.forEach((o,i)=>{

o.style.top=
(50+i*gap)+'px';

});

}

async function exportPNG(){

const c=await html2canvas(canvas,{
scale:4
});

const link=document.createElement('a');

link.download='oshinagaki.png';

link.href=c.toDataURL();

link.click();

}

async function exportPDF(){

const c=await html2canvas(canvas,{
scale:4
});

const img=c.toDataURL("image/png");

const pdf=
new jspdf.jsPDF(
'portrait',
'mm',
'A3'
);

pdf.addImage(
img,
'PNG',
0,
0,
297,
420
);

pdf.save('oshinagaki.pdf');

}

</script>

</body>
</html>
