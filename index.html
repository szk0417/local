<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同人おしながきジェネレーター</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Noto Sans JP", sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
      background: #1e293b;
    }

    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(120deg, #f43f5e, #9333ea);
      color: #fff;
      font-size: 19px;
    }
    .brand h1 { margin: 0; font-size: 14px; line-height: 1.3; }
    .brand p {
      overflow: hidden;
      margin: 2px 0 0;
      color: #94a3b8;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions { display: flex; flex: 0 0 auto; gap: 6px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      padding: 8px 10px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    .button-print { background: #475569; }
    .button-png { background: #059669; }
    .button-pdf { background: #e11d48; }

    #mainLayout { display: flex; flex: 1 1 auto; min-height: 0; overflow: hidden; }

    #settingsPanel {
      display: flex;
      flex: 0 0 410px;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
      border-right: 1px solid #334155;
      background: #1e293b;
    }

    .panel-heading {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }
    .panel-heading small {
      border: 1px solid #166534;
      border-radius: 999px;
      padding: 3px 7px;
      background: #052e16;
      color: #4ade80;
      font-size: 9px;
    }

    #settingsContent { flex: 1 1 auto; overflow: auto; padding: 14px; }
    .section {
      margin-bottom: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      background: rgba(15, 23, 42, .65);
    }
    .section h2 { margin: 0 0 10px; color: #fb7185; font-size: 12px; }
    .field { display: block; margin-bottom: 9px; color: #94a3b8; font-size: 10px; }
    .field:last-child { margin-bottom: 0; }

    .control {
      display: block;
      width: 100%;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
    }
    .control:disabled { opacity: .5; }

    .color-control {
      width: 48px;
      height: 31px;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px;
      background: #1e293b;
    }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .palette { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 5px; }

    .palette button {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 9px;
    }
    .palette button.selected { outline: 2px solid #f43f5e; }
    .swatch {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      color: #94a3b8;
      font-size: 10px;
    }
    .check-row input[type="checkbox"] { accent-color: #f43f5e; }

    .upload-box {
      display: block;
      border: 2px dashed #9f1239;
      border-radius: 9px;
      padding: 13px;
      background: rgba(30, 41, 59, .5);
      color: #e2e8f0;
      text-align: center;
      cursor: pointer;
    }
    .upload-box span { display: block; margin-top: 4px; font-size: 11px; font-weight: 700; }
    .upload-box small { display: block; margin-top: 3px; color: #94a3b8; font-size: 9px; }

    .item-card {
      margin-bottom: 10px;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 10px;
      background: #0f172a;
    }
    .item-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
    }
    .item-card-head button {
      border: 0;
      border-radius: 5px;
      padding: 3px 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 10px;
    }
    .item-card-head button:disabled { opacity: .4; }
    .delete-item { margin-left: 4px; background: transparent !important; color: #fb7185 !important; }
    .add-item {
      width: 100%;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
    }

    #workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 48px 20px 20px;
      background: #020617;
    }

    #canvasContainer {
      position: relative;
      flex: none;
      overflow: hidden;
      border: 1px solid #475569;
      background: #fff;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .45);
      line-height: 0;
    }

    #canvasStage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }

    #previewCanvas { display: block; }

    /* 方眼ガイドは削除。印刷用の仕上がり・安全マージンガイドだけ表示する。 */
    .guide {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      border: 1px dashed rgba(15, 23, 42, .85);
    }
    #trimGuide { outline: 1px solid rgba(255,255,255,.85); }
    #safeGuide { border-color: rgba(225, 29, 72, .95); }
    .hidden { display: none !important; }

    #zoomInfo {
      position: absolute;
      z-index: 12;
      top: 10px;
      left: 10px;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      background: rgba(30, 41, 59, .95);
      color: #cbd5e1;
      font-size: 10px;
    }

    #previewToolbar {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px;
      background: rgba(30, 41, 59, .96);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
      font-size: 10px;
    }
    #previewToolbar button {
      border: 0;
      border-radius: 5px;
      padding: 5px 7px;
      background: #475569;
      color: #e2e8f0;
      font-size: 10px;
    }
    #previewToolbarDrag { cursor: grab; touch-action: none; }

    @media (max-width: 767px) {
      #mainLayout {
        display: block;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #settingsPanel {
        width: 100%;
        max-height: none;
        overflow: visible;
        border-right: 0;
      }
      #settingsContent { overflow: visible; }
      #workspace { width: 100%; height: 75vh; min-height: 480px; }
      #previewToolbar {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }

    @media (max-width: 420px) {
      .topbar { padding-right: 6px; padding-left: 6px; }
      .button { padding: 7px 6px; font-size: 10px; }
      #settingsContent { padding: 10px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">✦</div>
      <div style="min-width:0">
        <h1>同人おしながきジェネレーター</h1>
        <p id="paperSpecLabel">準備中…</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="printPreviewBtn" class="button button-print" type="button">プレビュー</button>
      <button id="exportPng" class="button button-png" type="button">PNG保存</button>
      <button id="exportPdf" class="button button-pdf" type="button">PDF保存</button>
    </div>
  </header>

  <div id="mainLayout">
    <aside id="settingsPanel">
      <div class="panel-heading">
        <span>デザイン・情報設定</span>
        <small>リアルタイム反映</small>
      </div>

      <div id="settingsContent">
        <section class="section">
          <h2>レイアウト・用紙設定</h2>
          <div class="two-col">
            <label class="field">用紙向き
              <select id="orientationSelect" class="control">
                <option value="PORTRAIT" selected>縦向き</option>
                <option value="LANDSCAPE">横向き</option>
              </select>
            </label>
            <label class="field">レイアウト
              <select id="paperSizeSelect" class="control">
                <option value="A2">A2 (200dpi)</option>
                <option value="A3" selected>A3 (200dpi)</option>
                <option value="A4">A4 (350dpi)</option>
                <option value="WEB_PORTRAIT">X用縦書き (960 × 1280px)</option>
                <option value="WEB_LANDSCAPE">X用横書き (1200 × 675px)</option>
                <option value="PICSQUARE">ピクスク用 (500 × 1,000px)</option>
                <option value="PICREA">ピクリエ用 (800 × 1,600px)</option>
              </select>
            </label>
          </div>
          <div id="layoutHelp" style="color:#64748b;font-size:9px"></div>
        </section>

        <section class="section">
          <h2>背景デザイン・推奨配色</h2>
          <label class="field">背景の種類
            <select id="bgTypeSelect" class="control">
              <option value="pattern" selected>パターン・無地</option>
              <option value="custom">背景画像</option>
              <option value="color">単色カラー</option>
            </select>
          </label>
          <div class="field">
            CUDO推奨配色セットの色
            <div id="presetColorPalette" class="palette"></div>
            <small style="display:block;margin-top:5px;color:#64748b">
              初期配色は赤色ドットです。色名ラベルも併用しています。
            </small>
          </div>
          <div id="patternControls">
            <label class="field">パターン
              <select id="patternStyleSelect" class="control">
                <option value="dots" selected>ドット</option>
                <option value="stripes">ストライプ</option>
                <option value="diagonal">斜めストライプ</option>
                <option value="border">ボーダー</option>
                <option value="check">チェック</option>
                <option value="solid">無地</option>
              </select>
            </label>
          </div>
          <div id="customBgControls" class="hidden">
            <label class="field">背景画像を選択
              <input id="customBgInput" type="file" accept="image/*" class="control">
            </label>
          </div>
          <div id="singleColorControls" class="hidden">
            <label class="field">背景色
              <input id="bgColorPicker" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>イベント・サークル情報</h2>
          <label class="field">イベント日時
            <input id="eventDate" type="text" value="2026年12月30日(水)" class="control">
          </label>
          <label class="field">イベント名
            <input id="eventName" type="text" value="コミックマーケット109" class="control">
          </label>
          <div class="two-col">
            <label class="field">サークル名
              <input id="circleName" type="text" value="暁の稜線" class="control">
            </label>
            <label class="field">スペース番号
              <input id="spaceNo" type="text" value="東7ホール あ-01a" class="control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>ヘッダー配色</h2>
          <div class="two-col">
            <label class="field">背景色
              <input id="headerBgColor" type="color" value="#333333" class="color-control">
            </label>
            <label class="field">アクセント色
              <input id="headerAccentColor" type="color" value="#FF4B00" class="color-control">
            </label>
          </div>
        </section>

        <section class="section">
          <h2>ヘッダー文字設定</h2>
          <div class="two-col">
            <label class="field">イベント情報サイズ
              <input id="eventInfoFontSize" type="number" min="8" max="300" value="60" class="control">
            </label>
            <label class="field">イベント文字色
              <input id="eventInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            イベント情報の背景色
            <input id="eventInfoBgEnabled" type="checkbox">
            <input id="eventInfoBgColor" type="color" value="#ffffff" class="color-control">
          </label>

          <hr style="border-color:#334155;margin:10px 0">

          <div class="two-col">
            <label class="field">サークル名サイズ
              <input id="circleInfoFontSize" type="number" min="8" max="400" value="150" class="control">
            </label>
            <label class="field">サークル文字色
              <input id="circleInfoTextColor" type="color" value="#ffffff" class="color-control">
            </label>
          </div>
          <label class="check-row">
            サークル名の背景色
            <input id="circleInfoBgEnabled" type="checkbox">
            <input id="circleInfoBgColor" type="color" value="#ffffff" class="color-control">
          </label>

          <hr style="border-color:#334155;margin:10px 0">

          <div class="two-col">
            <label class="field">スペース番号サイズ
              <input id="spaceInfoFontSize" type="number" min="8" max="300" value="90" class="control">
            </label>
            <label class="field">スペース文字色
              <input id="spaceInfoTextColor" type="color" value="#111111" class="color-control">
            </label>
          </div>
          <label class="check-row">
            スペース番号の背景色
            <input id="spaceInfoBgEnabled" type="checkbox" checked>
            <input id="spaceInfoBgColor" type="color" value="#FF4B00" class="color-control">
          </label>
        </section>

        <section class="section">
          <h2>頒布物画像を一括アップロード</h2>
          <label class="upload-box">
            ☁
            <span>複数画像を選択</span>
            <small>選択順に頒布物へ割り当て</small>
            <input id="batchImageInput" type="file" accept="image/*" multiple hidden>
          </label>
        </section>

        <section class="section">
          <h2>頒布物一覧</h2>
          <div id="itemsContainer"></div>
          <button id="addItemBtn" class="add-item" type="button">＋ 頒布物を追加</button>
        </section>
      </div>
    </aside>

    <main id="workspace">
      <div id="zoomInfo">
        <span id="zoomDisplay">表示 --%</span>
        <span style="color:#64748b"> | </span>
        <span id="dimensionDisplay"></span>
      </div>

      <div id="previewToolbar">
        <button id="previewToolbarDrag" type="button" aria-label="操作バーを移動">↕</button>
        <button id="fitCanvasBtn" type="button">全体表示</button>
        <label>倍率
          <input id="zoomSlider" type="range" min="1" max="200" value="100" style="width:70px;vertical-align:middle">
        </label>
      </div>

      <div id="canvasContainer">
        <div id="canvasStage">
          <canvas id="previewCanvas"></canvas>
          <div id="trimGuide" class="guide hidden"></div>
          <div id="safeGuide" class="guide hidden"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    "use strict";

    const PALETTES = [
      { name:"赤",       hex:"#FF4B00", background:"#FFFFFF", header:"#333333", accent:"#FF4B00", space:"#FF4B00" },
      { name:"オレンジ", hex:"#FFA500", background:"#FFFFCC", header:"#333333", accent:"#FFA500", space:"#FFA500" },
      { name:"黄",       hex:"#FFF100", background:"#FFFFCC", header:"#333333", accent:"#FFF100", space:"#FFF100" },
      { name:"緑",       hex:"#00AF55", background:"#CCFFCC", header:"#333333", accent:"#00AF55", space:"#00AF55" },
      { name:"青",       hex:"#005AFF", background:"#CCEEFF", header:"#333333", accent:"#005AFF", space:"#005AFF" },
      { name:"紫",       hex:"#AA00FF", background:"#F3E5F5", header:"#333333", accent:"#AA00FF", space:"#AA00FF" },
      { name:"ピンク",   hex:"#F20070", background:"#FFC0CB", header:"#333333", accent:"#F20070", space:"#F20070" },
      { name:"茶色",     hex:"#995A00", background:"#F5DEB3", header:"#333333", accent:"#995A00", space:"#995A00" },
      { name:"空色",     hex:"#00DCFF", background:"#CCEEFF", header:"#333333", accent:"#00DCFF", space:"#00DCFF" }
    ];

    const CATEGORY_STYLES = {
      "新刊":     { background:"#FF4B00", text:"#111111" },
      "既刊":     { background:"#005AFF", text:"#ffffff" },
      "無料配布": { background:"#00AF55", text:"#111111" },
      "Web展示":  { background:"#00DCFF", text:"#111111" }
    };

    const PRINT_SPECS = {
      A2: { widthMm:426, heightMm:600, widthPx:3354, heightPx:4724, trimWidthMm:420, trimHeightMm:594 },
      A3: { widthMm:303, heightMm:426, widthPx:2386, heightPx:3354, trimWidthMm:297, trimHeightMm:420 },
      A4: { widthMm:216, heightMm:303, widthPx:2976, heightPx:4175, trimWidthMm:210, trimHeightMm:297 }
    };

    const SOCIAL_PRESETS = {
      WEB_PORTRAIT: { width:960, height:1280, orientation:"PORTRAIT", label:"X用縦書き" },
      WEB_LANDSCAPE: { width:1200, height:675, orientation:"LANDSCAPE", label:"X用横書き" },
      PICSQUARE: { width:500, height:1000, orientation:"PORTRAIT", label:"ピクスク用" },
      PICREA: { width:800, height:1600, orientation:"PORTRAIT", label:"ピクリエ用" }
    };

    const SOCIAL_LAYOUTS = {
      WEB_PORTRAIT: { header:250, marginX:28, marginY:22, gapX:16, gapY:16, padding:12, eventFont:18, circleFont:32, spaceFont:16, cardScale:.55, categoryBand:46, ageBand:28 },
      WEB_LANDSCAPE: { header:160, marginX:28, marginY:18, gapX:16, gapY:16, padding:11, eventFont:14, circleFont:24, spaceFont:13, cardScale:.48, categoryBand:38, ageBand:24 },
      PICSQUARE: { header:143, marginX:16, marginY:16, gapX:12, gapY:12, padding:8, eventFont:10, circleFont:18, spaceFont:10, cardScale:.35, categoryBand:34, ageBand:21 },
      PICREA: { header:270, marginX:24, marginY:22, gapX:16, gapY:16, padding:12, eventFont:15, circleFont:28, spaceFont:15, cardScale:.50, categoryBand:44, ageBand:28 }
    };

    const BLEED_MM = 3;
    const canvas = document.getElementById("previewCanvas");

    // 初期設定: A3縦、赤色ドットパターン
    let selectedPalette = PALETTES[0];
    let paper = "A3";
    let orientation = "PORTRAIT";
    let outputWidth = 0;
    let outputHeight = 0;
    let trimWidth = 0;
    let trimHeight = 0;
    let bleedLeft = 0;
    let bleedTop = 0;
    let safeX = 0;
    let safeY = 0;
    let customBackground = null;
    let previewMode = "fit";
    let renderToken = 0;

    const items = [
      {
        category:"新刊",
        ageRating:"全年齢",
        title:"新刊サンプルタイトル",
        price:"¥ 1,000",
        desc:"文庫サイズ / 120P / 全年齢\n特製ノベルティステッカー付き",
        descriptionFontSize:38,
        image:null,
        imageWidth:0,
        imageHeight:0,
        noImage:false
      },
      {
        category:"既刊",
        ageRating:"全年齢",
        title:"既刊イラスト集",
        price:"¥ 500",
        desc:"B5 / 24P / フルカラー\n過去イラストまとめ冊子",
        descriptionFontSize:36,
        image:null,
        imageWidth:0,
        imageHeight:0,
        noImage:false
      }
    ];

    initialize();

    function initialize() {
      buildPalette();
      renderItems();
      bindEvents();
      updateLayout();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(renderCanvas).catch(() => {});
      }
    }

    function getEl(id) {
      const element = document.getElementById(id);
      if (!element) throw new Error(`必要なHTML要素がありません: #${id}`);
      return element;
    }

    function getReadableTextColor(hex) {
      const value = hex.replace("#", "");
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      const linear = (channel) => {
        const c = channel / 255;
        return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4;
      };
      const luminance = .2126 * linear(r) + .7152 * linear(g) + .0722 * linear(b);
      return luminance > .179 ? "#111111" : "#ffffff";
    }

    function buildPalette() {
      const root = getEl("presetColorPalette");
      root.innerHTML = "";

      PALETTES.forEach((preset) => {
        const button = document.createElement("button");
        button.type = "button";
        button.title = `${preset.name}（CUDO推奨配色セット）`;
        button.innerHTML = `<span class="swatch" style="background:${preset.hex}"></span><span>${preset.name}</span>`;
        if (preset.name === selectedPalette.name) button.classList.add("selected");

        button.addEventListener("click", () => {
          selectedPalette = preset;
          root.querySelectorAll("button").forEach((el) => el.classList.remove("selected"));
          button.classList.add("selected");

          if (getEl("bgTypeSelect").value === "color") {
            getEl("bgColorPicker").value = preset.background;
          }

          getEl("headerBgColor").value = preset.header;
          getEl("headerAccentColor").value = preset.accent;
          getEl("spaceInfoBgColor").value = preset.space;
          getEl("spaceInfoTextColor").value = getReadableTextColor(preset.space);

          renderCanvas();
        });

        root.appendChild(button);
      });
    }

    function applyHeaderDefaults(social) {
      const sizes = social
        ? { event:social.eventFont, circle:social.circleFont, space:social.spaceFont }
        : { event:60, circle:150, space:90 };

      getEl("eventInfoFontSize").value = sizes.event;
      getEl("circleInfoFontSize").value = sizes.circle;
      getEl("spaceInfoFontSize").value = sizes.space;
    }

    function updateLayout() {
      paper = getEl("paperSizeSelect").value;
      const orientationSelect = getEl("orientationSelect");
      const socialPreset = SOCIAL_PRESETS[paper];

      bleedLeft = 0;
      bleedTop = 0;
      safeX = 0;
      safeY = 0;

      if (socialPreset) {
        orientation = socialPreset.orientation;
        orientationSelect.value = orientation;
        orientationSelect.disabled = true;
        outputWidth = trimWidth = socialPreset.width;
        outputHeight = trimHeight = socialPreset.height;
      } else {
        orientationSelect.disabled = false;
        orientation = orientationSelect.value;

        const spec = PRINT_SPECS[paper];
        const landscape = orientation === "LANDSCAPE";

        outputWidth = landscape ? spec.heightPx : spec.widthPx;
        outputHeight = landscape ? spec.widthPx : spec.heightPx;

        const outWmm = landscape ? spec.heightMm : spec.widthMm;
        const outHmm = landscape ? spec.widthMm : spec.heightMm;
        const trimWmm = landscape ? spec.trimHeightMm : spec.trimWidthMm;
        const trimHmm = landscape ? spec.trimWidthMm : spec.trimHeightMm;

        trimWidth = Math.round(trimWmm * outputWidth / outWmm);
        trimHeight = Math.round(trimHmm * outputHeight / outHmm);
        bleedLeft = Math.floor((outputWidth - trimWidth) / 2);
        bleedTop = Math.floor((outputHeight - trimHeight) / 2);
        safeX = Math.ceil(BLEED_MM * trimWidth / trimWmm);
        safeY = Math.ceil(BLEED_MM * trimHeight / trimHmm);
      }

      canvas.width = outputWidth;
      canvas.height = outputHeight;
      getEl("canvasStage").style.width = `${outputWidth}px`;
      getEl("canvasStage").style.height = `${outputHeight}px`;

      applyHeaderDefaults(SOCIAL_LAYOUTS[paper]);
      updateGuides();

      const label = socialPreset
        ? `${socialPreset.label} (${outputWidth} × ${outputHeight}px)`
        : `${paper}${orientation === "LANDSCAPE" ? "横" : "縦"} 塗り足し込み ${outputWidth} × ${outputHeight}px`;

      getEl("paperSpecLabel").textContent = label;
      getEl("dimensionDisplay").textContent = label;
      getEl("layoutHelp").textContent = socialPreset
        ? "SNS向けサイズ。印刷用の塗り足し・安全ガイドはありません。"
        : "白線＝仕上がり範囲、赤点線＝3mm安全マージンです。";

      previewMode = "fit";
      fitPreview();
      renderCanvas();
    }

    function updateGuides() {
      const trimGuide = getEl("trimGuide");
      const safeGuide = getEl("safeGuide");
      const isPrint = Boolean(PRINT_SPECS[paper]);

      trimGuide.classList.toggle("hidden", !isPrint);
      safeGuide.classList.toggle("hidden", !isPrint);
      if (!isPrint) return;

      trimGuide.style.left = `${bleedLeft}px`;
      trimGuide.style.top = `${bleedTop}px`;
      trimGuide.style.width = `${trimWidth}px`;
      trimGuide.style.height = `${trimHeight}px`;

      safeGuide.style.left = `${bleedLeft + safeX}px`;
      safeGuide.style.top = `${bleedTop + safeY}px`;
      safeGuide.style.width = `${Math.max(1, trimWidth - safeX * 2)}px`;
      safeGuide.style.height = `${Math.max(1, trimHeight - safeY * 2)}px`;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      })[char]);
    }

    function renderItems() {
      const root = getEl("itemsContainer");
      root.innerHTML = "";

      items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-card-head">
            <span>頒布物 #${index + 1}</span>
            <div>
              <button type="button" data-move="${index}" data-dir="-1" ${index === 0 ? "disabled" : ""}>↑</button>
              <button type="button" data-move="${index}" data-dir="1" ${index === items.length - 1 ? "disabled" : ""}>↓</button>
              ${items.length > 1 ? `<button type="button" class="delete-item" data-remove="${index}">削除</button>` : ""}
            </div>
          </div>
          <div class="two-col">
            <label class="field">カテゴリ
              <select class="control" data-index="${index}" data-key="category">
                ${["新刊","既刊","無料配布","Web展示"].map((value) =>
                  `<option value="${value}" ${item.category === value ? "selected" : ""}>${value}</option>`

            <label class="field">年齢区分

                <option value="全年齢" ${item.ageRating === "全年齢" ? "selected" : ""}>全年齢</option>
                <option value="R18" ${item.ageRating === "R18" ? "selected" : ""}>R18</option>

          </label>
          <label class="field">値段（無料配布・Web展示は空欄）
            <input class="control" type="text" data-index="${index}" data-key="price"
              value="${escapeHTML(item.price || "")}" ${["無料配布","Web展示"].includes(item.category) ? "disabled" : ""}>
          </label>
          <label class="field">説明
            <textarea class="control" data-index="${index}" data-key="desc" rows="3">${escapeHTML(item.desc)}</textarea>
          </label>
          <label class="field">説明文フォントサイズ
            <input class="control" type="number" min="8" max="100" step="1"

          </label>
          <label class="check-row" style="justify-content:flex-start">
            <input type="checkbox" data-noimage="${index}" ${item.noImage ? "checked" : ""}>

          </label>
          <label class="field">個別画像
            <input class="control" type="file" accept="image/*" data-image="${index}" ${item.noImage ? "disabled" : ""}>
          </label>
        `;
        root.appendChild(card);
      });

      root.querySelectorAll("[data-index]").forEach((input) => {
        const update = () => {
          const index = Number(input.dataset.index);
          const key = input.dataset.key;
          if (!items[index]) return;

          if (key === "descriptionFontSize") {
            const size = Number.parseInt(input.value, 10);
            items[index][key] = Number.isFinite(size) ? Math.min(100, Math.max(8, size)) : 38;
          } else {
            items[index][key] = input.value;
          }

          if (key === "category") {
            const priceInput = root.querySelector(`[data-index="${index}"][data-key="price"]`);
            const noPrice = ["無料配布","Web展示"].includes(input.value);
            if (priceInput) {
              priceInput.disabled = noPrice;
              if (noPrice) {
                priceInput.value = "";
                items[index].price = "";
              }
            }
          }
          renderCanvas();
        };

        input.addEventListener("input", update);
        input.addEventListener("change", update);
      });

      root.querySelectorAll("[data-image]").forEach((input) => {
        input.addEventListener("change", () => {
          loadItemImage(Number(input.dataset.image), input.files && input.files[0]);
        });
      });

      root.querySelectorAll("[data-noimage]").forEach((input) => {
        input.addEventListener("change", () => {
          const index = Number(input.dataset.noimage);
          if (!items[index]) return;

          items[index].noImage = input.checked;
          const fileInput = root.querySelector(`[data-image="${index}"]`);
          if (fileInput) {
            fileInput.disabled = input.checked;
            if (input.checked) fileInput.value = "";
          }
          renderCanvas();
        });
      });

      root.querySelectorAll("[data-move]").forEach((button) => {
        button.addEventListener("click", () => {
          const from = Number(button.dataset.move);
          const to = from + Number(button.dataset.dir);
          if (to < 0 || to >= items.length) return;
          [items[from], items[to]] = [items[to], items[from]];
          renderItems();
          renderCanvas();
        });
      });

      root.querySelectorAll("[data-remove]").forEach((button) => {
        button.addEventListener("click", () => {
          items.splice(Number(button.dataset.remove), 1);
          renderItems();
          renderCanvas();
        });
      });
    }

    function addItem() {
      items.push({
        category:"新刊",
        ageRating:"全年齢",
        title:`頒布物 #${items.length + 1}`,
        price:"¥ 500",
        desc:"",
        descriptionFontSize:38,
        image:null,
        imageWidth:0,
        imageHeight:0,
        noImage:false
      });
      renderItems();
      renderCanvas();
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像の読み込みに失敗しました。"));
        image.src = src;
      });
    }

    async function readImageFile(file) {
      if (!file || !file.type || !file.type.startsWith("image/")) {
        throw new Error("画像ファイルを選択してください。");
      }

      const src = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`画像を読み込めませんでした: ${file.name}`));
        reader.readAsDataURL(file);
      });

      const image = await loadImage(src);
      return { src, image, width:image.naturalWidth, height:image.naturalHeight };
    }

    async function loadItemImage(index, file) {
      if (!file || !items[index]) return;
      try {
        const loaded = await readImageFile(file);
        Object.assign(items[index], {
          image:loaded.image,
          imageSrc:loaded.src,
          imageWidth:loaded.width,
          imageHeight:loaded.height,
          noImage:false
        });
        renderItems();
        renderCanvas();
      } catch (error) {
        alert(error.message);
      }
    }

    async function uploadBatch(files) {
      const selected = Array.from(files || []);
      if (!selected.length) return;

      try {
        const loaded = await Promise.all(selected.map(readImageFile));
        loaded.forEach((entry, index) => {
          const data = {
            image:entry.image,
            imageSrc:entry.src,
            imageWidth:entry.width,
            imageHeight:entry.height,
            noImage:false
          };

          if (index < items.length) {
            Object.assign(items[index], data);
          } else {
            items.push({
              category:"新刊",
              ageRating:"全年齢",
              title:`新刊アイテム ${index + 1}`,
              price:"¥ 500",
              desc:"",
              descriptionFontSize:38,
              ...data
            });
          }
        });
        renderItems();
        renderCanvas();
      } catch (error) {
        alert(error.message);
      }
    }

    function makePattern(style, foreground, background) {
      const tile = document.createElement("canvas");
      tile.width = tile.height = 240;
      const pctx = tile.getContext("2d");

      pctx.fillStyle = background;
      pctx.fillRect(0, 0, tile.width, tile.height);

      if (style === "solid") return tile;

      if (style === "dots") {
        pctx.fillStyle = foreground;
        pctx.beginPath();
        pctx.arc(60, 60, 16, 0, Math.PI * 2);
        pctx.arc(180, 180, 16, 0, Math.PI * 2);
        pctx.fill();
      } else if (style === "stripes") {
        pctx.fillStyle = foreground;
        pctx.fillRect(0, 0, 120, 240);
      } else if (style === "diagonal") {
        pctx.save();
        pctx.translate(120, 120);
        pctx.rotate(Math.PI / 4);
        pctx.fillStyle = foreground;
        for (let x = -360; x <= 360; x += 110) pctx.fillRect(x, -360, 36, 720);
        pctx.restore();
      } else if (style === "border") {
        pctx.fillStyle = foreground;
        pctx.fillRect(0, 0, 240, 24);
        pctx.fillRect(0, 216, 240, 24);
        pctx.fillRect(0, 0, 24, 240);
        pctx.fillRect(216, 0, 24, 240);
      } else if (style === "check") {
        pctx.fillStyle = foreground;
        pctx.fillRect(0, 0, 120, 120);
        pctx.fillRect(120, 120, 120, 120);
      }

      return tile;
    }

    function drawBackground(context) {
      const type = getEl("bgTypeSelect").value;

      if (type === "color") {
        context.fillStyle = getEl("bgColorPicker").value;
        context.fillRect(0, 0, outputWidth, outputHeight);
        return;
      }

      if (type === "custom" && customBackground) {
        context.drawImage(customBackground, 0, 0, outputWidth, outputHeight);
        return;
      }

      if (type === "pattern") {
        const style = getEl("patternStyleSelect").value;
        const base = selectedPalette.background;
        context.fillStyle = base;
        context.fillRect(0, 0, outputWidth, outputHeight);

        if (style !== "solid") {
          const pattern = context.createPattern(
            makePattern(style, selectedPalette.hex, base),
            "repeat"
          );
          if (pattern) {
            context.fillStyle = pattern;
            context.fillRect(0, 0, outputWidth, outputHeight);
          }
        }
        return;
      }

      context.fillStyle = "#FFFFFF";
      context.fillRect(0, 0, outputWidth, outputHeight);
    }

    function getHeaderStyle(prefix, defaultSize, defaultColor) {
      const rawSize = Number.parseInt(getEl(`${prefix}FontSize`).value, 10);
      const enabled = getEl(`${prefix}BgEnabled`).checked;

      return {
        size:Number.isFinite(rawSize) ? rawSize : defaultSize,
        color:getEl(`${prefix}TextColor`).value || defaultColor,
        background:enabled ? getEl(`${prefix}BgColor`).value : ""
      };
    }

    function wrapLines(context, text, maxWidth) {
      const lines = [];
      String(text || "").split("\n").forEach((paragraph) => {
        let line = "";
        for (const char of Array.from(paragraph)) {
          const next = line + char;
          if (line && context.measureText(next).width > maxWidth) {
            lines.push(line);
            line = char;
          } else {
            line = next;
          }
        }
        lines.push(line);
      });
      return lines.length ? lines : [""];
    }

    function fitText(context, text, box, options = {}) {
      const family = options.family || '"Noto Sans JP", sans-serif';
      const weight = options.weight || "400";
      const maxFont = Math.max(1, Number(options.maxFont) || 20);
      const minFont = Math.max(1, Number(options.minFont) || 1);
      const lineHeightRatio = options.lineHeight || 1.12;
      const width = Math.max(1, box.width);
      const height = Math.max(1, box.height);

      let fontSize = minFont;
      let lines = [];

      for (let size = maxFont; size >= minFont; size -= Math.max(.5, maxFont / 100)) {
        context.font = `${weight} ${size}px ${family}`;
        const candidate = wrapLines(context, text, width);
        if (candidate.length * size * lineHeightRatio <= height) {
          fontSize = size;
          lines = candidate;
          break;
        }
      }

      if (!lines.length) {
        context.font = `${weight} ${minFont}px ${family}`;
        lines = wrapLines(context, text, width);
        const maxLines = Math.max(1, Math.floor(height / (minFont * lineHeightRatio)));
        if (lines.length > maxLines) {
          lines = lines.slice(0, maxLines);
          const chars = Array.from(lines[maxLines - 1] || "");
          while (chars.length && context.measureText(`${chars.join("")}…`).width > width) chars.pop();
          lines[maxLines - 1] = `${chars.join("")}…`;
        }
      }

      const lineHeight = fontSize * lineHeightRatio;
      let y = box.y + Math.max(0, (height - lines.length * lineHeight) / 2);

      context.save();
      context.beginPath();
      context.rect(box.x, box.y, width, height);
      context.clip();

      if (options.background) {
        context.fillStyle = options.background;
        context.fillRect(box.x, box.y, width, height);
      }

      context.font = `${weight} ${fontSize}px ${family}`;
      context.fillStyle = options.color || "#111111";
      context.textBaseline = "top";
      context.textAlign = options.align || "left";

      const x = options.align === "center"
        ? box.x + width / 2
        : options.align === "right" ? box.x + width : box.x;

      lines.forEach((line) => {
        context.fillText(line, x, y, width);
        y += lineHeight;
      });
      context.restore();
    }

    function drawHeader(context, social, headerHeight, landscape, eventStyle, circleStyle, spaceStyle) {
      const margin = social ? social.marginX : safeX + 8;
      const width = Math.max(1, trimWidth - margin * 2);

      if (social) {
        const compact = paper === "PICSQUARE";
        const top = compact ? 5 : Math.max(6, headerHeight * .04);
        const usable = Math.max(1, headerHeight - top * 2);
        const gap = compact ? 2 : Math.max(3, usable * .025);
        const eventHeight = compact ? 29 : usable * .25;
        const circleHeight = compact ? 44 : usable * .34;
        const spaceHeight = Math.max(1, usable - eventHeight - circleHeight - gap * 2);
        let y = top;

        fitText(context,
          `${getEl("eventDate").value} | ${getEl("eventName").value}`,
          { x:bleedLeft + margin, y:bleedTop + y, width, height:eventHeight },
          { maxFont:eventStyle.size, minFont:7, color:eventStyle.color, background:eventStyle.background });

        y += eventHeight + gap;
        fitText(context, getEl("circleName").value,
          { x:bleedLeft + margin, y:bleedTop + y, width, height:circleHeight },
          { maxFont:circleStyle.size, minFont:8, weight:"700", color:circleStyle.color, background:circleStyle.background });

        y += circleHeight + gap;
        const space = getEl("spaceNo").value;
        if (space) {
          fitText(context, ` ${space} `,
            { x:bleedLeft + margin, y:bleedTop + y, width, height:spaceHeight },
            {
              maxFont:spaceStyle.size, minFont:7, weight:"700",
              family:'"M PLUS Rounded 1c", sans-serif',
              color:spaceStyle.color, background:spaceStyle.background, align:"center"
            });
        }
        return;
      }

      const scale = Math.min(trimWidth / 3307, trimHeight / 2339);
      const top = Math.max(safeY, headerHeight * .055);
      const bottom = Math.max(safeY, 10 * scale);
      const available = Math.max(1, headerHeight - top - bottom);
      const gap = Math.max(5 * scale, available * .055);
      const rowHeight = Math.max(1, available - gap * 2);
      const eventHeight = rowHeight * .24;
      const circleHeight = rowHeight * .43;
      const spaceHeight = rowHeight - eventHeight - circleHeight;
      let y = top;

      fitText(context,
        `${getEl("eventDate").value} | ${getEl("eventName").value}`,
        { x:bleedLeft + margin, y:bleedTop + y, width, height:eventHeight },
        { maxFont:eventStyle.size, minFont:10 * scale, color:eventStyle.color, background:eventStyle.background });

      y += eventHeight + gap;
      fitText(context, getEl("circleName").value,
        { x:bleedLeft + margin, y:bleedTop + y, width, height:circleHeight },
        { maxFont:circleStyle.size, minFont:12 * scale, weight:"700", color:circleStyle.color, background:circleStyle.background });

      y += circleHeight + gap;
      const space = getEl("spaceNo").value;
      if (space) {
        fitText(context, ` ${space} `,
          { x:bleedLeft + margin, y:bleedTop + y, width, height:spaceHeight },
          {
            maxFont:spaceStyle.size, minFont:10 * scale, weight:"700",
            family:'"M PLUS Rounded 1c", sans-serif',
            color:spaceStyle.color, background:spaceStyle.background, align:"center"
          });
      }
    }

    function roundedRect(context, x, y, width, height, radius, fill, stroke, lineWidth = 1) {
      const r = Math.max(0, Math.min(radius, width / 2, height / 2));
      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + width - r, y);
      context.quadraticCurveTo(x + width, y, x + width, y + r);
      context.lineTo(x + width, y + height - r);
      context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      context.lineTo(x + r, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();

      if (fill) {
        context.fillStyle = fill;
        context.fill();
      }
      if (stroke) {
        context.strokeStyle = stroke;
        context.lineWidth = lineWidth;
        context.stroke();
      }
    }

    function drawCard(context, item, x, y, width, height, config, landscape) {
      const padding = config.padding;
      const radius = config.radius;

      roundedRect(context, x, y, width, height, radius, "#ffffff", "#cbd5e1", config.borderWidth);

      context.save();
      context.beginPath();
      context.rect(x, y, width, height);
      context.clip();

      const style = CATEGORY_STYLES[item.category] || CATEGORY_STYLES["新刊"];
      const categoryHeight = Math.min(config.categoryBand, height * .16, Math.max(18, width * .09));
      const ageHeight = Math.min(config.ageBand, height * .11, Math.max(15, width * .055));

      context.fillStyle = style.background;
      context.fillRect(x, y, width, categoryHeight);
      fitText(context, item.category || "新刊",
        { x:x + padding, y:y + 1, width:Math.max(1, width - padding * 2), height:Math.max(1, categoryHeight - 2) },
        {
          maxFont:Math.min(categoryHeight * .78, width * .2),
          minFont:1,
          weight:"700",
          family:'"M PLUS Rounded 1c", sans-serif',
          color:style.text,
          align:"center",
          lineHeight:1
        });

      const ageY = y + categoryHeight;
      const isR18 = item.ageRating === "R18";
      context.fillStyle = isR18 ? "#991b1b" : "#e5f2e5";
      context.fillRect(x, ageY, width, ageHeight);
      fitText(context, isR18 ? "R18" : "全年齢",
        { x:x + padding, y:ageY + 1, width:Math.max(1, width - padding * 2), height:Math.max(1, ageHeight - 2) },
        {
          maxFont:Math.min(ageHeight * .75, width * .16),
          minFont:1,
          weight:"700",
          family:'"M PLUS Rounded 1c", sans-serif',
          color:isR18 ? "#ffffff" : "#174b26",
          align:"center",
          lineHeight:1
        });

      const bodyY = ageY + ageHeight + padding;
      const bodyHeight = Math.max(1, height - categoryHeight - ageHeight - padding * 2);

      let textX = x + padding;
      let textWidth = Math.max(1, width - padding * 2);
      let imageBox = null;

      if (item.image && !item.noImage) {
        const imageScale = Math.min(
          width * (landscape ? .38 : .36) / Math.max(1, item.imageWidth),
          bodyHeight / Math.max(1, item.imageHeight)
        );
        const imageWidth = item.imageWidth * imageScale;
        const imageHeight = item.imageHeight * imageScale;
        imageBox = {
          x:x + padding,
          y:bodyY + (bodyHeight - imageHeight) / 2,
          width:imageWidth,
          height:imageHeight
        };
        textX = imageBox.x + imageWidth + (config.social ? 10 : config.padding);
        textWidth = Math.max(1, x + width - padding - textX);
      }

      const parts = [];
      if (item.title) {
        parts.push({
          text:item.title, ratio:.42, max:78 * config.textScale,
          min:Math.max(5, 8 * config.textScale),
          family:'"Noto Sans JP", sans-serif', weight:"700", color:"#0f172a"
        });
      }
      if (!["無料配布","Web展示"].includes(item.category) && item.price) {
        parts.push({
          text:item.price, ratio:.28, max:100 * config.textScale,
          min:Math.max(5, 8 * config.textScale),
          family:'"M PLUS Rounded 1c", sans-serif', weight:"700",
          color:style.background
        });
      }
      if (item.desc) {
        parts.push({
          text:item.desc,
          ratio:.30,
          max:Math.max(8, Math.min(100, Number(item.descriptionFontSize) || 38)) * config.textScale,
          min:Math.max(4, 7 * config.textScale),
          family:'"Noto Sans JP", sans-serif', weight:"400", color:"#475569"
        });
      }

      const ratioSum = parts.reduce((sum, part) => sum + part.ratio, 0);
      let cursorY = bodyY;

      for (const part of parts) {
        const partHeight = Math.max(1, bodyHeight * part.ratio / Math.max(.01, ratioSum));
        fitText(context, part.text,
          { x:textX, y:cursorY, width:textWidth, height:partHeight },
          {
            maxFont:part.max, minFont:part.min,
            family:part.family, weight:part.weight, color:part.color
          });
        cursorY += partHeight;
      }

      if (imageBox && item.image) {
        context.save();
        context.shadowColor = "rgba(15,23,42,.22)";
        context.shadowBlur = config.social ? 4 : 12;
        context.shadowOffsetY = config.social ? 2 : 5;
        context.drawImage(item.image, imageBox.x, imageBox.y, imageBox.width, imageBox.height);
        context.restore();
      }

      context.restore();
      roundedRect(context, x, y, width, height, radius, null, "#cbd5e1", config.borderWidth);
    }

    function renderCanvas() {
      try {
        if (!canvas || !outputWidth || !outputHeight) return;

        const token = ++renderToken;
        const context = canvas.getContext("2d", { alpha:false });
        if (!context) throw new Error("プレビュー用Canvasを取得できません。");

        context.setTransform(1, 0, 0, 1, 0, 0);
        context.clearRect(0, 0, outputWidth, outputHeight);
        drawBackground(context);

        const social = SOCIAL_LAYOUTS[paper] || null;
        const landscape = orientation === "LANDSCAPE";
        const headerHeight = social
          ? social.header
          : Math.round(trimHeight * (landscape ? .17 : .15));

        context.fillStyle = getEl("headerBgColor").value || "#333333";
        context.fillRect(0, 0, outputWidth, Math.min(outputHeight, bleedTop + headerHeight));

        const accentHeight = social
          ? Math.max(3, Math.round(headerHeight * .025))
          : Math.max(8, Math.round(12 * trimWidth / 3307));

        context.fillStyle = getEl("headerAccentColor").value || selectedPalette.accent;
        context.fillRect(bleedLeft, bleedTop + headerHeight - accentHeight, trimWidth, accentHeight);

        const eventStyle = getHeaderStyle("eventInfo", social ? social.eventFont : 60, "#ffffff");
        const circleStyle = getHeaderStyle("circleInfo", social ? social.circleFont : 150, "#ffffff");
        const spaceStyle = getHeaderStyle("spaceInfo", social ? social.spaceFont : 90, "#ffffff");

        drawHeader(context, social, headerHeight, landscape, eventStyle, circleStyle, spaceStyle);

        let columns = 2;
        if (paper === "WEB_LANDSCAPE") columns = items.length <= 1 ? 1 : 2;
        else if (social) columns = items.length <= 3 ? 1 : 2;
        else if (landscape) columns = items.length <= 1 ? 1 : (items.length > 4 ? 3 : 2);
        else if (items.length <= 3) columns = 1;

        const marginX = social ? social.marginX : safeX;
        const marginY = social ? social.marginY : safeY;
        const scale = trimWidth / 3307;
        const gapX = social ? social.gapX : Math.round(40 * scale);
        const gapY = social ? social.gapY : Math.round(40 * scale);
        const padding = social ? social.padding : Math.round(25 * scale);
        const startY = headerHeight + (social ? 10 : Math.max(24 * scale, safeY));
        const rows = Math.max(1, Math.ceil(items.length / columns));

        const cardWidth = Math.max(1,
          (trimWidth - marginX * 2 - gapX * (columns - 1)) / columns);
        const cardHeight = Math.max(1,
          (trimHeight - startY - marginY - gapY * (rows - 1)) / rows);

        const config = {
          social:Boolean(social),
          padding,
          radius:social ? 12 : Math.max(12, 24 * scale),
          categoryBand:social ? social.categoryBand : cardHeight * .14,
          ageBand:social ? social.ageBand : cardHeight * .09,
          borderWidth:social ? 2 : Math.max(2, 4 * scale),
          textScale:social ? social.cardScale : scale
        };

        items.forEach((item, index) => {
          if (token !== renderToken) return;
          const row = Math.floor(index / columns);
          const column = index % columns;
          const x = bleedLeft + marginX + column * (cardWidth + gapX);
          const y = bleedTop + startY + row * (cardHeight + gapY);
          drawCard(context, item, x, y, cardWidth, cardHeight, config, landscape);
        });
      } catch (error) {
        console.error("プレビュー描画エラー:", error);
      }
    }

    function applyPreviewScale(scale) {
      const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      const container = getEl("canvasContainer");
      const stage = getEl("canvasStage");

      stage.style.width = `${outputWidth}px`;
      stage.style.height = `${outputHeight}px`;
      stage.style.transform = `scale(${safeScale})`;
      container.style.width = `${outputWidth * safeScale}px`;
      container.style.height = `${outputHeight * safeScale}px`;

      getEl("zoomDisplay").textContent = `表示 ${Math.round(safeScale * 100)}%`;
      getEl("zoomSlider").value = String(Math.max(1, Math.min(200, Math.round(safeScale * 100))));
    }

    function fitPreview() {
      const workspace = getEl("workspace");
      const availableWidth = Math.max(1, workspace.clientWidth - 50);
      const availableHeight = Math.max(1, workspace.clientHeight - 75);
      applyPreviewScale(Math.min(availableWidth / outputWidth, availableHeight / outputHeight));
    }

    function setupScaler() {
      const workspace = getEl("workspace");
      if ("ResizeObserver" in window) {
        new ResizeObserver(() => {
          if (previewMode === "fit") fitPreview();
        }).observe(workspace);
      }
      window.addEventListener("resize", () => {
        if (previewMode === "fit") fitPreview();
      });
    }

    async function getExportData() {
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch {}
      }

      renderCanvas();
      await new Promise((resolve) => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
      });

      const social = SOCIAL_PRESETS[paper];
      if (social) {
        return {
          dataUrl:canvas.toDataURL("image/png"),
          widthPx:outputWidth,
          heightPx:outputHeight,
          widthMm:outputWidth * 25.4 / 200,
          heightMm:outputHeight * 25.4 / 200,
          hasBleed:false
        };
      }

      const spec = PRINT_SPECS[paper];
      const landscape = orientation === "LANDSCAPE";

      return {
        dataUrl:canvas.toDataURL("image/png"),
        widthPx:outputWidth,
        heightPx:outputHeight,
        widthMm:landscape ? spec.heightMm : spec.widthMm,
        heightMm:landscape ? spec.widthMm : spec.heightMm,
        hasBleed:true
      };
    }

    function setupToolbarDrag() {
      const toolbar = getEl("previewToolbar");
      const handle = getEl("previewToolbarDrag");
      const workspace = getEl("workspace");
      let drag = null;

      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const toolbarRect = toolbar.getBoundingClientRect();
        const workspaceRect = workspace.getBoundingClientRect();

        toolbar.style.left = `${toolbarRect.left - workspaceRect.left}px`;
        toolbar.style.top = `${toolbarRect.top - workspaceRect.top}px`;
        toolbar.style.right = "auto";
        toolbar.style.bottom = "auto";

        drag = {
          id:event.pointerId,
          startX:event.clientX,
          startY:event.clientY,
          left:toolbarRect.left - workspaceRect.left,
          top:toolbarRect.top - workspaceRect.top
        };
        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        const rect = workspace.getBoundingClientRect();

        toolbar.style.left = `${Math.max(0, Math.min(
          rect.width - toolbar.offsetWidth,
          drag.left + event.clientX - drag.startX
        ))}px`;
        toolbar.style.top = `${Math.max(0, Math.min(
          rect.height - toolbar.offsetHeight,
          drag.top + event.clientY - drag.startY
        ))}px`;
      });

      const finish = (event) => {
        if (drag && drag.id === event.pointerId) drag = null;
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    }

    async function openPreview() {
      const popup = window.open("", "_blank");
      if (!popup) {
        alert("プレビューを開けません。ポップアップを許可してください。");
        return;
      }

      try {
        const output = await getExportData();
        popup.document.open();
        popup.document.write(`<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出力プレビュー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:sans-serif}
body{background:#1e293b;color:#f8fafc}
.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#0f172a}
.toolbar button{border:0;border-radius:6px;padding:8px 12px;color:#fff;background:#334155;cursor:pointer}
.toolbar .print{background:#e11d48}
.preview{height:calc(100vh - 60px);overflow:auto;padding:24px}
.sheet{width:${output.widthPx}px;height:${output.heightPx}px;margin:0 auto;background:#fff;box-shadow:0 8px 30px #0006}
.sheet img{display:block;width:100%;height:100%}
body.fit .sheet{width:auto;height:auto;max-width:100%}
body.fit .sheet img{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
@page{size:${output.widthMm}mm ${output.heightMm}mm;margin:0}
@media print{
html,body{width:${output.widthMm}mm;height:${output.heightMm}mm;margin:0;padding:0;overflow:hidden;background:#fff}
.toolbar{display:none!important}
.preview{width:${output.widthMm}mm;height:${output.heightMm}mm;overflow:hidden;padding:0}
.sheet{width:${output.widthMm}mm!important;height:${output.heightMm}mm!important;margin:0!important;box-shadow:none}
.sheet img{width:${output.widthMm}mm!important;height:${output.heightMm}mm!important}
}
</style>
</head>
<body>
<div class="toolbar">
<strong>${output.hasBleed ? "塗り足し込み" : "Webサイズ"} プレビュー</strong>
<button id="actual">100%表示</button>
<button id="fit">画面に合わせる</button>
<button id="print" class="print">印刷</button>
<span>${output.widthPx} × ${output.heightPx}px</span>
</div>
<main class="preview"><div class="sheet"><img src="${output.dataUrl}" alt="出力プレビュー"></div></main>
<script>
document.getElementById("actual").onclick=()=>document.body.classList.remove("fit");
document.getElementById("fit").onclick=()=>document.body.classList.add("fit");
document.getElementById("print").onclick=()=>window.print();
<\/script>
</body>
</html>`);
        popup.document.close();
      } catch (error) {
        popup.close();
        alert(`プレビューを作成できませんでした: ${error.message}`);
      }
    }

    function bindEvents() {
      getEl("paperSizeSelect").addEventListener("change", updateLayout);
      getEl("orientationSelect").addEventListener("change", updateLayout);

      ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
        getEl(id).addEventListener("input", renderCanvas);
      });

      [
        "headerBgColor", "headerAccentColor",
        "eventInfoFontSize", "eventInfoTextColor", "eventInfoBgEnabled", "eventInfoBgColor",
        "circleInfoFontSize", "circleInfoTextColor", "circleInfoBgEnabled", "circleInfoBgColor",
        "spaceInfoFontSize", "spaceInfoTextColor", "spaceInfoBgEnabled", "spaceInfoBgColor"
      ].forEach((id) => {
        const element = getEl(id);
        element.addEventListener("input", renderCanvas);
        element.addEventListener("change", renderCanvas);
      });

      getEl("bgTypeSelect").addEventListener("change", (event) => {
        const type = event.target.value;
        getEl("patternControls").classList.toggle("hidden", type !== "pattern");
        getEl("customBgControls").classList.toggle("hidden", type !== "custom");
        getEl("singleColorControls").classList.toggle("hidden", type !== "color");
        renderCanvas();
      });

      getEl("patternStyleSelect").addEventListener("change", renderCanvas);
      getEl("bgColorPicker").addEventListener("input", renderCanvas);

      getEl("customBgInput").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
          const loaded = await readImageFile(file);
          customBackground = loaded.image;
          renderCanvas();
        } catch (error) {
          alert(error.message);
        }
      });

      getEl("batchImageInput").addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        event.target.value = "";
        await uploadBatch(files);
      });

      getEl("addItemBtn").addEventListener("click", addItem);

      getEl("fitCanvasBtn").addEventListener("click", () => {
        previewMode = "fit";
        fitPreview();
      });

      getEl("zoomSlider").addEventListener("input", (event) => {
        previewMode = "manual";
        applyPreviewScale(Number(event.target.value) / 100);
      });

      setupToolbarDrag();
      getEl("printPreviewBtn").addEventListener("click", openPreview);

      getEl("exportPng").addEventListener("click", async () => {
        try {
          const output = await getExportData();
          const link = document.createElement("a");
          link.download = `oshinagaki_${paper}_${orientation}_${output.widthPx}x${output.heightPx}.png`;
          link.href = output.dataUrl;
          link.click();
        } catch (error) {
          alert(`PNGを書き出せませんでした: ${error.message}`);
        }
      });

      getEl("exportPdf").addEventListener("click", async () => {
        try {
          const output = await getExportData();
          if (!window.jspdf || !window.jspdf.jsPDF) {
            throw new Error("PDFライブラリを読み込めませんでした。");
          }
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation:output.widthMm >= output.heightMm ? "landscape" : "portrait",
            unit:"mm",
            format:[output.widthMm, output.heightMm]
          });
          pdf.addImage(output.dataUrl, "PNG", 0, 0, output.widthMm, output.heightMm);
          pdf.save(`oshinagaki_${paper}_${orientation}.pdf`);
        } catch (error) {
          alert(`PDFを書き出せませんでした: ${error.message}`);
        }
      });
    }
  </script>
</body>
</html>
